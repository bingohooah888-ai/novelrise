<h1>プロフィール編集</h1>
<p class="lead">読者・作者共通のプロフィール設定です。創作室を使わなくても、表示名やアイコンなどを変更できます。</p>
<p class="profile-back"><a href="favorites.html">← 本棚へ戻る</a></p>
<section class="panel" aria-labelledby="basicTitle">
<h2 id="basicTitle">基本プロフィール</h2>
<div class="avatar-row">
<div id="avatarPreview" class="avatar-preview" aria-label="現在のアイコン">読</div>
<label class="avatar-upload">アイコンを変更
<input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" disabled>
<span class="hint">JPEG・PNG・WebP／2MB以下</span></label>
</div>
<form id="profileForm">
<div class="field"><label for="displayName">表示名</label><input id="displayName" maxlength="40" required autocomplete="nickname"></div>
<div class="field"><label for="bio">自己紹介</label><textarea id="bio" maxlength="500"></textarea></div>
<button id="saveProfile" type="submit" disabled>プロフィールを保存</button>
<div id="profileStatus" class="status" role="status" aria-live="polite">読み込み中...</div>
</form>
<div class="profile-links">
<a id="publicProfileLink" href="author.html" hidden>公開プロフィールを見る →</a>
<a href="account-settings.html">アカウント設定 →</a>
<a href="mypage.html">創作室へ →</a>
</div>
</section>
<section class="panel" aria-labelledby="genresTitle">
<h2 id="genresTitle">好きな小説ジャンル（最大3つ）</h2>
<p class="hint">プロフィールへの公開は任意です。</p>
<div id="favoriteGenreChoices" class="favorite-genre-choices"></div>
<div id="favoriteGenreCount" class="hint">読み込み中...</div>
<label class="favorite-genre-public"><input id="favoriteGenresPublic" type="checkbox" disabled> 公開プロフィールに表示する</label>
<button id="saveFavoriteGenres" type="button" disabled>ジャンル設定を保存</button>
<div id="favoriteGenreStatus" class="status" role="status" aria-live="polite"></div>
</section>
<section class="panel" aria-labelledby="badgeTitle">
<h2 id="badgeTitle">公開称号</h2>
<div class="field"><label for="equippedBadge">プロフィールに表示する称号</label><select id="equippedBadge" disabled><option>読み込み中...</option></select></div>
<div id="badgeCondition" class="hint">獲得済みの称号のみ選べます。</div>
<div id="badgeStatus" class="status" role="status" aria-live="polite"></div>
<a href="scout-record.html">SCOUT RECORDで称号を確認 →</a>
</section>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>マイページ | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      height: 72px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #6d4aff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      color: #666;
      font-size: 14px;
    }

    .logout-button {
      background: white;
      color: #6d4aff;
      border: 1px solid #6d4aff;

      padding: 10px 18px;
      border-radius: 8px;

      font-weight: 700;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 50px 24px;
    }

    .welcome {
      background:
        linear-gradient(
          135deg,
          #6d4aff,
          #8b72ff
        );

      color: white;

      border-radius: 18px;
      padding: 35px;

      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: rgba(255,255,255,0.85);
    }

    .user-email {
      margin-top: 14px;
      font-size: 14px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 20px;
    }

    .card {
      background: white;

      border-radius: 14px;
      padding: 25px;

      border: 1px solid #e7e7ed;

      min-height: 170px;
    }

    .card-icon {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card p {
      color: #777;
      font-size: 14px;

      margin-bottom: 18px;
    }

    .card-button {
      display: inline-block;

      background: #6d4aff;
      color: white;

      padding: 10px 16px;
      border-radius: 8px;

      font-size: 14px;
      font-weight: 700;
    }

    .stats {
      margin-top: 30px;

      background: white;

      border-radius: 14px;
      padding: 28px;

      border: 1px solid #e7e7ed;
    }

    .stats h2 {
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 15px;
    }

    .stat-box {
      background: #f6f4ff;

      border-radius: 10px;
      padding: 20px;

      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 900;

      color: #6d4aff;
    }

    .stat-label {
      color: #777;
      font-size: 13px;

      margin-top: 4px;
    }

    @media (max-width: 800px) {

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <a href="index.html" class="logo">
      NovelRise
    </a>

    <div class="header-right">

      <a
        href="index.html"
        class="back-button"
      >
        トップページ
      </a>

      <button
        id="logoutButton"
        class="logout-button"
      >
        ログアウト
      </button>

    </div>

  </div>

</header>


<main>

  <section class="welcome">

    <h1 id="welcomeName">
      マイページ
    </h1>

    <p>
      あなたの作品を管理しましょう。
    </p>

    <div
      class="user-email"
      id="userEmail"
    >
    </div>

  </section>


  <section class="dashboard-grid">

    <div class="card">

      <div class="card-icon">
        ✍️
      </div>

      <h2>
        小説を投稿
      </h2>

      <p>
        新しい作品をNovelRiseに投稿します。
      </p>

      <a
        href="post.html"
        class="card-button"
      >
        投稿する
      </a>

    </div>


    <div class="card">

      <div class="card-icon">
        📚
      </div>

      <h2>
        自分の作品
      </h2>

      <p>
        投稿した小説の編集・管理を行います。
      </p>

      <a
        href="my-novels.html"
        class="card-button"
      >
        作品を見る
      </a>

    </div>


    <div class="card">

      <div class="card-icon">
        💎
      </div>

      <h2>
        契約プラン
      </h2>

      <p>
        現在のプランやアップグレードを確認します。
      </p>

      <a
        href="#"
        class="card-button"
      >
        プランを見る
      </a>

    </div>

  </section>


  <section class="stats">

    <h2>
      アクセス状況
    </h2>

    <div class="stats-grid">

      <div class="stat-box">
        <div
  id="novelStatCount"
  class="stat-number"
>
          0
        </div>

        <div class="stat-label">
          投稿作品
        </div>
      </div>

      <div class="stat-box">
        <div
  id="totalPvCount"
  class="stat-number"
>
          0
        </div>

        <div class="stat-label">
          総PV
        </div>
      </div>

      <div class="stat-box">
        <div
  id="favoriteStatCount"
  class="stat-number"
>
          0
        </div>

        <div class="stat-label">
          お気に入り
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-number">
          Free
        </div>

        <div class="stat-label">
          現在のプラン
        </div>
      </div>

    </div>

  </section>
<section
  style="
    margin-top:30px;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:28px;
  "
>

  <h2
    style="
      font-size:22px;
      margin-bottom:18px;
    "
  >
    お気に入り作品
  </h2>

  <div id="favoriteNovelsList">
    読み込み中...
  </div>
<div style="margin-top: 16px;">
  <a
    href="favorites.html"
    style="
      color: #6d4aff;
      font-weight: bold;
      text-decoration: none;
    "
  >
    お気に入りをすべて見る →
  </a>
</div>

  <div style="margin-top:16px;">
  <a
    href="analytics.html"
    style="
      display:inline-block;
      padding:10px 18px;
      background:#6d4aff;
      color:white;
      font-weight:bold;
      text-decoration:none;
      border-radius:8px;
    "
  >
    アクセス解析を見る
  </a>
</div>
</section>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function checkLogin() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        'login.html';

      return;
    }


    const user =
      session.user;


    document.getElementById(
      'userEmail'
    ).textContent =
      user.email;


    const displayName =
      user.user_metadata.display_name;


    if (displayName) {

      document.getElementById(
        'welcomeName'
      ).textContent =
        displayName +
        ' さんのマイページ';

    }

  }


  document.getElementById(
    'logoutButton'
  ).addEventListener(
    'click',
    async () => {

      await supabaseClient.auth.signOut();

      window.location.href =
        'index.html';

    }
  );

async function loadFavoriteNovels() {

  const favoriteNovelsList =
    document.getElementById(
      'favoriteNovelsList'
    );


  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    favoriteNovelsList.innerHTML =
      'ログインが必要です。';

    return;
  }


  const {
    data: favoriteRows,
    error
  } =
    await supabaseClient
      .from('favorites')
      .select(
        `
        novel_id,
        novels (
          id,
          title,
          genre,
          description,
          created_at,
          status
        )
        `
      )
      .eq(
        'user_id',
        session.user.id
      );


  if (error) {

    console.error(error);

    favoriteNovelsList.innerHTML =
      'お気に入り作品を読み込めませんでした。';

    return;
  }


  const novels =
    (favoriteRows ?? [])
      .map(
        row => row.novels
      )
.filter(
  novel =>
    novel &&
    novel.status ===
      'published'
)
.slice(
  0,
  3
);


  if (novels.length === 0) {

    favoriteNovelsList.innerHTML =
      '<div style="color:#777;">' +
      'お気に入り作品はまだありません。' +
      '</div>';

    return;
  }


  favoriteNovelsList.innerHTML =
    '';


  novels.forEach(
    novel => {

      const card =
        document.createElement(
          'a'
        );


      card.href =
        'novel.html?id=' +
        novel.id;


      card.style.display =
        'block';

      card.style.padding =
        '16px 0';

      card.style.borderBottom =
        '1px solid #eee';


      card.innerHTML = `

        <div
          style="
            font-size:12px;
            color:#6d4aff;
            font-weight:700;
            margin-bottom:6px;
          "
        >
          ${novel.genre ?? ''}
        </div>

        <div
          style="
            font-size:17px;
            font-weight:800;
            margin-bottom:6px;
          "
        >
          ${novel.title ?? ''}
        </div>

        <div
          style="
            color:#777;
            font-size:14px;
            line-height:1.6;
          "
        >
          ${novel.description ?? ''}
        </div>

      `;


      favoriteNovelsList.appendChild(
        card
      );

    }
  );

}
  async function loadFavoriteStat() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {
    return;
  }


  const {
    count,
    error
  } =
    await supabaseClient
      .from('favorites')
      .select(
        '*',
        {
          count: 'exact',
          head: true
        }
      )
      .eq(
        'user_id',
        session.user.id
      );


  if (error) {

    console.error(error);

    return;
  }


  document.getElementById(
    'favoriteStatCount'
  ).textContent =
    count ?? 0;

}
  async function loadAuthorStats() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {
    return;
  }


  const {
    data: novels,
    error
  } =
    await supabaseClient
      .from('novels')
      .select('pv')
      .eq(
        'user_id',
        session.user.id
      );


  if (error) {

    console.error(error);

    return;
  }


  const novelCount =
    novels?.length ?? 0;


  const totalPv =
    (novels ?? []).reduce(
      (total, novel) =>
        total + (novel.pv ?? 0),
      0
    );


  document.getElementById(
    'novelStatCount'
  ).textContent =
    novelCount;


  document.getElementById(
    'totalPvCount'
  ).textContent =
    totalPv;

}
checkLogin();
loadFavoriteNovels();
loadFavoriteStat();
loadAuthorStats();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品を探す | NOVELIGHT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary:#6d4aff; --line:#e5e7eb; --soft:#f7f8fb; --muted:#6b7280; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--soft); color:#222; line-height:1.6;
    }
    a { color:inherit; text-decoration:none; }
    header { background:white; border-bottom:1px solid var(--line); }
    .header-inner {
      max-width:1100px; height:70px; margin:auto; padding:0 22px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .logo { font-size:24px; font-weight:900; color:var(--primary); letter-spacing:.04em; }
    .back { font-size:14px; color:#666; font-weight:700; }
    main { max-width:1100px; margin:auto; padding:46px 22px 78px; }
    h1 { font-size:32px; margin-bottom:7px; }
    .subtitle { color:var(--muted); margin-bottom:24px; }
    .search-area {
      display:grid; grid-template-columns:1fr 220px 220px; gap:12px;
      padding:18px; margin-bottom:18px; background:white;
      border:1px solid var(--line); border-radius:14px;
    }
    input, select {
      width:100%; padding:12px 13px; border:1px solid #d7d9df;
      border-radius:9px; background:white; font-size:15px;
    }
    .policy-note {
      padding:10px 13px; margin-bottom:20px; border-radius:9px;
      background:#f0edff; color:#5c45be; font-size:12px; font-weight:700;
    }
    .result-count { color:var(--muted); font-size:14px; margin-bottom:13px; }
    .novel-list { display:grid; gap:14px; }
    .novel-card {
      display:block; padding:20px; background:white; border:1px solid var(--line);
      border-radius:13px; transition:.18s;
    }
    .novel-card:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.06); }
    .genre {
      display:inline-block; margin-bottom:8px; padding:4px 8px; border-radius:6px;
      background:#eeeaff; color:var(--primary); font-size:12px; font-weight:800;
    }
    .title { font-size:19px; font-weight:900; margin-bottom:7px; }
    .description { color:#626773; font-size:14px; margin-bottom:11px; }
    .meta { color:#90949d; font-size:12px; }
    .empty {
      text-align:center; padding:42px 20px; color:var(--muted);
      background:white; border:1px dashed #d8dbe2; border-radius:13px;
    }
    @media (max-width:760px) {
      .search-area { grid-template-columns:1fr; }
      main { padding-top:30px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="index.html">NOVELIGHT</a>
    <a class="back" href="index.html">← トップへ戻る</a>
  </div>
</header>

<main>
  <h1>作品を探す</h1>
  <p class="subtitle">タイトル・あらすじ・ジャンルから、次に読む物語を探せます。</p>

  <div class="search-area">
    <input id="keywordInput" type="search" placeholder="タイトル・あらすじを検索">
    <select id="genreSelect">
      <option value="">すべてのジャンル</option>
      <option value="異世界ファンタジー">異世界ファンタジー</option>
      <option value="現代ファンタジー">現代ファンタジー</option>
      <option value="恋愛">恋愛</option>
      <option value="ラブコメ">ラブコメ</option>
      <option value="SF">SF</option>
      <option value="ミステリー">ミステリー</option>
      <option value="ホラー">ホラー</option>
      <option value="歴史">歴史</option>
      <option value="現代ドラマ">現代ドラマ</option>
      <option value="その他">その他</option>
    </select>
    <select id="sortSelect">
      <option value="recommended">おすすめ</option>
      <option value="new">新着順</option>
      <option value="pv">PV順</option>
      <option value="favorites">お気に入り順</option>
    </select>
  </div>

  <div id="sortPolicy" class="policy-note">
    おすすめ順は露出の偏りを抑えながら発見機会を配分します。新着・PV・お気に入り順は課金プランで並び替えません。
  </div>

  <div id="resultCount" class="result-count">読み込み中...</div>
  <div id="novelList" class="novel-list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fiepaguycecrredwrcwx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let requestId = 0;
  let debounceTimer = null;

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value ?? '';
    return div.innerHTML;
  }

  function getVisitorToken() {
    const storageKey = 'novelight_visitor_token';
    let token = localStorage.getItem(storageKey);
    if (token && token.length >= 8) return token;

    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      token = window.crypto.randomUUID();
    } else {
      token = 'visitor-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }

    localStorage.setItem(storageKey, token);
    return token;
  }

  function cardHtml(novel) {
    const createdAt = novel.created_at
      ? new Date(novel.created_at).toLocaleDateString('ja-JP')
      : '';
    const id = novel.novel_id ?? novel.id;

    return `
      <a class="novel-card" href="novel.html?id=${encodeURIComponent(id)}">
        <div class="genre">${escapeHtml(novel.genre || '未設定')}</div>
        <div class="title">${escapeHtml(novel.title)}</div>
        <div class="description">${escapeHtml(novel.description || '')}</div>
        <div class="meta">
          投稿日 ${createdAt}
          ・ 👁 ${Number(novel.pv || 0).toLocaleString()} PV
          ・ ★ ${Number(novel.favorite_count || 0).toLocaleString()}
        </div>
      </a>
    `;
  }

  function renderRows(rows) {
    const novelList = document.getElementById('novelList');
    document.getElementById('resultCount').textContent = rows.length + '作品';

    if (!rows.length) {
      novelList.innerHTML = '<div class="empty">条件に合う作品がありません。</div>';
      return;
    }

    novelList.innerHTML = rows.map(cardHtml).join('');
  }

  async function recordRecommendedImpressions(rows, visitorToken) {
    const ids = rows.map((row) => String(row.novel_id));
    if (!ids.length) return;

    const { error } = await supabaseClient.rpc('record_novel_impressions', {
      p_surface: 'search_recommended',
      p_novel_ids: ids.slice(0, 24),
      p_visitor_token: visitorToken
    });

    if (error) console.error('impression record failed', error);
  }

  async function loadRecommended(keyword, genre, currentRequest) {
    const visitorToken = getVisitorToken();
    const { data, error } = await supabaseClient.rpc('novelight_discovery_feed', {
      p_surface: 'search_recommended',
      p_limit: 24,
      p_keyword: keyword || null,
      p_genre: genre || null,
      p_visitor_token: visitorToken
    });

    if (currentRequest !== requestId) return;
    if (error) throw error;

    const rows = (data || []).filter((row) => !row.is_premium_slot);
    renderRows(rows);
    await recordRecommendedImpressions(rows, visitorToken);
  }

  async function fetchFavoriteCounts(rows) {
    await Promise.all(rows.map(async (novel) => {
      const { count, error } = await supabaseClient
        .from('favorites')
        .select('*', { count: 'exact', head: true })
        .eq('novel_id', novel.id);

      novel.favorite_count = error ? 0 : (count ?? 0);
    }));
  }

  async function loadNeutral(keyword, genre, sort, currentRequest) {
    const { data, error } = await supabaseClient
      .from('novels')
      .select('id,title,genre,description,created_at,pv')
      .eq('status', 'published');

    if (currentRequest !== requestId) return;
    if (error) throw error;

    const lowered = keyword.toLowerCase();
    let rows = (data || []).filter((novel) => {
      const keywordMatch =
        !lowered ||
        (novel.title || '').toLowerCase().includes(lowered) ||
        (novel.description || '').toLowerCase().includes(lowered);
      const genreMatch = !genre || novel.genre === genre;
      return keywordMatch && genreMatch;
    });

    await fetchFavoriteCounts(rows);
    if (currentRequest !== requestId) return;

    if (sort === 'pv') {
      rows.sort((a, b) => Number(b.pv || 0) - Number(a.pv || 0));
    } else if (sort === 'favorites') {
      rows.sort((a, b) => Number(b.favorite_count || 0) - Number(a.favorite_count || 0));
    } else {
      rows.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }

    renderRows(rows);
  }

  async function renderSearch() {
    const currentRequest = ++requestId;
    const keyword = document.getElementById('keywordInput').value.trim();
    const genre = document.getElementById('genreSelect').value;
    const sort = document.getElementById('sortSelect').value;

    document.getElementById('resultCount').textContent = '読み込み中...';
    document.getElementById('novelList').innerHTML = '';

    try {
      if (sort === 'recommended') {
        await loadRecommended(keyword, genre, currentRequest);
      } else {
        await loadNeutral(keyword, genre, sort, currentRequest);
      }
    } catch (error) {
      if (currentRequest !== requestId) return;
      console.error(error);
      document.getElementById('resultCount').textContent = '読み込みエラー';
      document.getElementById('novelList').innerHTML =
        '<div class="empty">作品を読み込めませんでした。少し時間をおいて再読み込みしてください。</div>';
    }
  }

  function queueSearch() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderSearch, 250);
  }

  document.getElementById('keywordInput').addEventListener('input', queueSearch);
  document.getElementById('genreSelect').addEventListener('change', renderSearch);
  document.getElementById('sortSelect').addEventListener('change', renderSearch);

  renderSearch();
</script>
</body>
</html>

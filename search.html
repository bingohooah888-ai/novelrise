<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>作品を探す | NOVELIGHT</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--primary:#6d4aff;--line:#e5e7eb;--soft:#f7f8fb;--muted:#6b7280}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--soft);color:#222;line-height:1.6}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1100px;min-height:70px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900;color:var(--primary)}.back{font-size:14px;color:#666;font-weight:700}main{max-width:1100px;margin:auto;padding:46px 22px 78px}h1{font-size:32px;margin-bottom:7px}.subtitle{color:var(--muted);margin-bottom:24px}.search-area{display:grid;grid-template-columns:1fr 220px 220px;gap:12px;padding:18px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px}input,select{width:100%;padding:12px 13px;border:1px solid #d7d9df;border-radius:9px;background:#fff;font-size:15px}.policy-note{padding:10px 13px;margin-bottom:20px;border-radius:9px;background:#f0edff;color:#5c45be;font-size:12px;font-weight:700}.result-count{color:var(--muted);font-size:14px;margin-bottom:13px}.novel-list{display:grid;gap:14px}.novel-card{display:block;padding:20px;background:#fff;border:1px solid var(--line);border-radius:13px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.genre,.ai,.mature{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800}.genre{background:#eeeaff;color:var(--primary)}.ai{background:#eef6ff;color:#245fa9}.mature{background:#fff1db;color:#8b5b00}.title{font-size:19px;font-weight:900;margin-bottom:7px}.description{color:#626773;font-size:14px;margin-bottom:11px}.meta{color:#90949d;font-size:12px}.empty{text-align:center;padding:42px 20px;color:var(--muted);background:#fff;border:1px dashed #d8dbe2;border-radius:13px}.more-wrap{text-align:center;margin-top:18px}.more{padding:10px 18px;border:1px solid #d7d9df;border-radius:9px;background:#fff;color:#5c45be;font-weight:800;cursor:pointer}.more:disabled{opacity:.55}footer{padding:26px 22px;background:#111118;color:#999;font-size:12px}.footer-inner{max-width:1100px;margin:auto;display:flex;gap:15px;flex-wrap:wrap;justify-content:center}@media(max-width:760px){.search-area{grid-template-columns:1fr}main{padding:30px 16px 60px}.header-inner{padding:12px 16px}.more{width:100%}}</style></head><body><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a class="back" href="index.html">← トップへ戻る</a></div></header><main><h1>作品を探す</h1><p class="subtitle">タイトル・あらすじ・ジャンルから、次に読む物語を探せます。</p><div class="search-area"><input id="keywordInput" type="search" placeholder="タイトル・あらすじを検索"><select id="genreSelect"><option value="">すべてのジャンル</option><option>異世界ファンタジー</option><option>現代ファンタジー</option><option>恋愛</option><option>ラブコメ</option><option>SF</option><option>ミステリー</option><option>ホラー</option><option>歴史</option><option>現代ドラマ</option><option>その他</option></select><select id="sortSelect"><option value="recommended">おすすめ</option><option value="new">新着順</option><option value="pv">PV順</option><option value="favorites">お気に入り順</option></select></div><div class="policy-note">おすすめ順は初期露出と露出偏りを考慮します。新着・PV・お気に入り順は課金プランで並び替えません。どの並び順でも実際の表示はインプレッションとして記録します。</div><div id="resultCount" class="result-count">読み込み中...</div><div id="novelList" class="novel-list"></div><div id="moreWrap" class="more-wrap" hidden><button id="moreButton" class="more" type="button">もっと見る</button></div></main><footer><div class="footer-inner"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');let requestId=0,timer=null,neutralRows=[],neutralTotal=0;const pageSize=24;const aiLabels={unspecified:'AI未申告',human:'人間主体',ai_assisted:'AI支援',ai_generated:'AI生成主体'};function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function visitor(){return NovelightClient.getVisitorToken()}
async function enrich(rows){const ids=[...new Set(rows.map(r=>String(r.novel_id??r.id)))];if(!ids.length)return rows;const {data,error}=await client.from('novels').select('id,ai_usage,content_rating').in('id',ids);if(error)throw error;const map=new Map((data||[]).map(x=>[String(x.id),x]));return rows.map(r=>Object.assign(r,map.get(String(r.novel_id??r.id))||{}))}
function card(n){const id=n.novel_id??n.id,created=n.created_at?new Date(n.created_at).toLocaleDateString('ja-JP'):'';return `<a class="novel-card" href="novel.html?id=${encodeURIComponent(id)}"><div class="badges"><span class="genre">${esc(n.genre||'未設定')}</span><span class="ai">${esc(aiLabels[n.ai_usage]||'AI未申告')}</span>${n.content_rating==='mature'?'<span class="mature">内容注意</span>':''}</div><div class="title">${esc(n.title)}</div><div class="description">${esc(n.description||'')}</div><div class="meta">投稿日 ${created} ・ 👁 ${Number(n.pv||0).toLocaleString()} PV ・ ★ ${Number(n.favorite_count||0).toLocaleString()}</div></a>`}
function render(rows,total=rows.length){document.getElementById('resultCount').textContent=Number(total||0).toLocaleString()+'作品';document.getElementById('novelList').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">条件に合う作品がありません。</div>';const more=document.getElementById('moreWrap');more.hidden=rows.length>=Number(total||0)||document.getElementById('sortSelect').value==='recommended'}
async function recommended(keyword,genre,current){document.getElementById('moreWrap').hidden=true;const r=await client.rpc('novelight_discovery_feed_v2',{p_surface:'search_recommended',p_limit:24,p_keyword:keyword||null,p_genre:genre||null,p_visitor_token:visitor()});if(current!==requestId)return;if(r.error)throw r.error;let rows=(r.data||[]).filter(x=>!x.is_premium_slot);rows=await enrich(rows);if(current!==requestId)return;render(rows);if(rows.length){const rec=await client.rpc('record_novel_impressions_v2',{p_surface:'search_recommended',p_novel_ids:rows.map(x=>String(x.novel_id)),p_visitor_token:visitor()});if(rec.error)console.error(rec.error)}}
async function neutral(keyword,genre,sort,current,append=false){const offset=append?neutralRows.length:0;const r=await client.rpc('novelight_neutral_search',{p_keyword:keyword||null,p_genre:genre||null,p_sort:sort,p_limit:pageSize,p_offset:offset});if(current!==requestId)return;if(r.error)throw r.error;let batch=await enrich(r.data||[]);if(current!==requestId)return;neutralTotal=Number(batch[0]?.total_count??(append?neutralTotal:0));neutralRows=append?neutralRows.concat(batch):batch;render(neutralRows,neutralTotal);if(batch.length){const rec=await client.rpc('record_neutral_search_impressions',{p_novel_ids:batch.map(x=>String(x.novel_id)),p_visitor_token:visitor()});if(rec.error)console.error(rec.error)}}
async function run(){const current=++requestId,k=document.getElementById('keywordInput').value.trim(),g=document.getElementById('genreSelect').value,s=document.getElementById('sortSelect').value;neutralRows=[];neutralTotal=0;document.getElementById('resultCount').textContent='読み込み中...';document.getElementById('novelList').innerHTML='';document.getElementById('moreWrap').hidden=true;try{s==='recommended'?await recommended(k,g,current):await neutral(k,g,s,current,false)}catch(e){if(current!==requestId)return;console.error(e);document.getElementById('resultCount').textContent='読み込みエラー';document.getElementById('novelList').innerHTML='<div class="empty">作品を読み込めませんでした。時間をおいて再度お試しください。</div>'}}
document.getElementById('moreButton').onclick=async()=>{const b=document.getElementById('moreButton'),current=requestId,k=document.getElementById('keywordInput').value.trim(),g=document.getElementById('genreSelect').value,s=document.getElementById('sortSelect').value;if(s==='recommended')return;b.disabled=true;try{await neutral(k,g,s,current,true)}catch(e){console.error(e)}finally{b.disabled=false}};document.getElementById('keywordInput').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,250)});document.getElementById('genreSelect').addEventListener('change',run);document.getElementById('sortSelect').addEventListener('change',run);(async()=>{await NovelightClient.captureAcquisition(client);await NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);await run()})();
</script></body></html>

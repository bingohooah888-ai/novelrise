<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>作品を探す | NOVELIGHT</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--primary:#6d4aff;--line:#e5e7eb;--soft:#f7f8fb;--muted:#6b7280}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--soft);color:#222;line-height:1.6}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1100px;min-height:70px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900;color:var(--primary)}.back{font-size:14px;color:#666;font-weight:700}main{max-width:1100px;margin:auto;padding:46px 22px 78px}h1{font-size:32px;margin-bottom:7px}.subtitle{color:var(--muted);margin-bottom:24px}.search-area{display:grid;grid-template-columns:1fr 220px 220px;gap:12px;padding:18px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px}input,select{width:100%;padding:12px 13px;border:1px solid #d7d9df;border-radius:9px;background:#fff;font-size:15px}.policy-note{padding:10px 13px;margin-bottom:20px;border-radius:9px;background:#f0edff;color:#5c45be;font-size:12px;font-weight:700}.result-count{color:var(--muted);font-size:14px;margin-bottom:13px}.novel-list{display:grid;gap:14px}.novel-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start;padding:20px;background:#fff;border:1px solid var(--line);border-radius:13px}.novel-cover-image,.novel-cover-placeholder{display:block;width:100%;aspect-ratio:3/4;border-radius:7px;object-fit:cover;background:#1f1711}.novel-cover-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#c8a96a;background:linear-gradient(145deg,#2b211a,#6f4a2b)}.cover-mark{font-size:20px}.cover-genre{padding:0 4px;font-size:9px;font-weight:800;text-align:center}.search-card-copy{min-width:0}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.genre,.ai,.mature{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800}.genre{background:#eeeaff;color:var(--primary)}.ai{background:#eef6ff;color:#245fa9}.mature{background:#fff1db;color:#8b5b00}.title{font-size:19px;font-weight:900;margin-bottom:7px}.description{color:#626773;font-size:14px;margin-bottom:11px}.meta{color:#90949d;font-size:12px}.empty{text-align:center;padding:42px 20px;color:var(--muted);background:#fff;border:1px dashed #d8dbe2;border-radius:13px}.more-wrap{text-align:center;margin-top:18px}.more{padding:10px 18px;border:1px solid #d7d9df;border-radius:9px;background:#fff;color:#5c45be;font-weight:800;cursor:pointer}.more:disabled{opacity:.55}footer{padding:26px 22px;background:#111118;color:#999;font-size:12px}.footer-inner{max-width:1100px;margin:auto;display:flex;gap:15px;flex-wrap:wrap;justify-content:center}@media(max-width:760px){.search-area{grid-template-columns:1fr}main{padding:30px 16px 60px}.header-inner{padding:12px 16px}.novel-card{grid-template-columns:76px minmax(0,1fr);gap:13px}.more{width:100%}}</style><link rel="stylesheet" href="novelight-discovery-list.css"><link rel="stylesheet" href="novelight-natural-search.css"><link rel="stylesheet" href="novelight-accessibility.css"></head><body class="novelight-page-search"><a class="skip-link" href="#main-content">本文へスキップ</a><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a class="back" href="index.html">← トップへ戻る</a></div></header><main id="main-content" tabindex="-1"><h1>作品を探す</h1><p class="subtitle">タイトル・あらすじ・ジャンルから、次に読む物語を探せます。</p><div class="natural-search-modes" role="group" aria-label="検索方法"><button id="keywordModeButton" class="natural-search-mode" type="button" aria-pressed="true">キーワード</button><button id="naturalModeButton" class="natural-search-mode" type="button" aria-pressed="false">自然文で探す <span class="natural-search-beta">β</span></button></div><div id="naturalSearchNote" class="natural-search-note" hidden>「こんな話が読みたい」を文章で入力できます。β版では公開中作品のタイトル・あらすじ・ジャンルから条件を読み取り、一致理由を表示します。作品Rankや課金プランは関連度に加点しません。</div><div id="searchArea" class="search-area"><input id="keywordInput" type="search" maxlength="160" placeholder="タイトル・あらすじを検索"><select id="genreSelect"><option value="">すべてのジャンル</option><option>異世界ファンタジー</option><option>現代ファンタジー</option><option>恋愛</option><option>ラブコメ</option><option>SF</option><option>ミステリー</option><option>ホラー</option><option>歴史</option><option>現代ドラマ</option><option>その他</option></select><select id="sortSelect"><option value="recommended">おすすめ</option><option value="new">新着順</option><option value="favorites">お気に入り順</option><option id="naturalSortOption" value="natural" hidden>自然文の関連度順</option></select></div><div class="policy-note">おすすめ順は初期露出と露出偏りを考慮します。新着・お気に入り順は課金プランで並び替えません。計測基盤が有効な環境では、実際の表示をインプレッションとして記録します。</div><div id="naturalSearchIntent" class="natural-search-intent" hidden></div><div id="resultCount" class="result-count">読み込み中...</div><div id="novelList" class="novel-list"></div><div id="moreWrap" class="more-wrap" hidden><button id="moreButton" class="more" type="button">もっと見る</button></div></main><footer><div class="footer-inner"><a href="operator.html">運営者情報</a><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="commerce-disclosure.html">特商法表記</a><a href="contact.html">お問い合わせ</a></div></footer><script src="/assets/vendor/supabase-js-2.112.3.js"></script><script src="novelight-client.js"></script><script src="novelight-user-safety.js"></script><script src="novelight-natural-search.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');let requestId=0,timer=null,neutralRows=[],neutralTotal=0,neutralOffset=0,trustedExposureAvailable=null,searchMode='keyword';const pageSize=24,allowedSorts=new Set(['recommended','new','favorites']);const aiLabels={unspecified:'AI未申告',human:'人間主体',ai_assisted:'AI支援',ai_generated:'AI生成主体'};function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function visitor(){return NovelightClient.getVisitorToken()}
function missingTrustedRpc(error,name){const text=[error?.message,error?.details,error?.hint].filter(Boolean).join(' ').toLowerCase();return error?.code==='PGRST202'||(text.includes(name.toLowerCase())&&(text.includes('schema cache')||text.includes('could not find')))}
async function enrich(rows){const ids=[...new Set(rows.map(r=>String(r.novel_id??r.id)))];if(!ids.length)return rows;const [metadata,thumbnails]=await Promise.all([client.from('novels').select('id,ai_usage,content_rating').in('id',ids),client.rpc('novelight_public_thumbnail_urls',{p_novel_ids:ids})]);if(metadata.error)throw metadata.error;if(thumbnails.error&&!missingTrustedRpc(thumbnails.error,'novelight_public_thumbnail_urls'))throw thumbnails.error;if(thumbnails.error)console.warn('public thumbnail lookup unavailable; using placeholders');const metadataMap=new Map((metadata.data||[]).map(x=>[String(x.id),x])),thumbnailMap=new Map((thumbnails.error?[]:(thumbnails.data||[])).map(x=>[String(x.novel_id),x.thumbnail_url||null]));return rows.map(r=>Object.assign(r,metadataMap.get(String(r.novel_id??r.id))||{},{thumbnail_url:thumbnailMap.get(String(r.novel_id??r.id))||r.thumbnail_url||null}))}
function coverMarkup(n){const url=String(n.thumbnail_url||'').trim();if(url)return `<img class="novel-cover-image" src="${esc(url)}" alt="" loading="lazy" decoding="async">`;return `<div class="novel-cover-placeholder" aria-hidden="true"><span class="cover-mark">✦</span><span class="cover-genre">${esc(n.genre||'NOVELIGHT')}</span></div>`}
function card(n){const id=n.novel_id??n.id,created=n.created_at?new Date(n.created_at).toLocaleDateString('ja-JP'):'';const reasons=Array.isArray(n.natural_match_reasons)?n.natural_match_reasons:[];const naturalMarkup=reasons.length?`<div class="natural-match-reason">一致理由：${reasons.map(esc).join(' ／ ')}</div>`:'';return `<a class="novel-card" href="novel.html?id=${encodeURIComponent(id)}">${coverMarkup(n)}<div class="search-card-copy"><div class="badges"><span class="genre">${esc(n.genre||'未設定')}</span><span class="ai">${esc(aiLabels[n.ai_usage]||'AI未申告')}</span>${n.content_rating==='mature'?'<span class="mature">内容注意</span>':''}</div><div class="title">${esc(n.title)}</div><div class="description">${esc(n.description||'')}</div>${naturalMarkup}<div class="meta">投稿日 ${created} ・ 👁 ${Number(n.pv||0).toLocaleString()} PV ・ ★ ${Number(n.favorite_count||0).toLocaleString()}</div></div></a>`}
function render(rows,total=rows.length){document.getElementById('resultCount').textContent=searchMode==='natural'?'自然文検索の候補 '+rows.length.toLocaleString()+'作品':Number(total||0).toLocaleString()+'作品';document.getElementById('novelList').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">条件に合う作品がありません。</div>';const more=document.getElementById('moreWrap');more.hidden=searchMode==='natural'||rows.length>=Number(total||0)||document.getElementById('sortSelect').value==='recommended'}
function renderNaturalIntent(plan){const mount=document.getElementById('naturalSearchIntent'),labels=[];if(plan?.genre)labels.push('ジャンル: '+plan.genre);for(const spec of plan?.terms||[])labels.push(spec.kind==='related'?spec.label:spec.term);const unique=[...new Set(labels)].slice(0,7);mount.hidden=!unique.length;mount.innerHTML=unique.map(label=>`<span class="natural-search-chip">${esc(label)}</span>`).join('')}
async function recommended(keyword,genre,current){document.getElementById('moreWrap').hidden=true;const args={p_surface:'search_recommended',p_limit:24,p_keyword:keyword||null,p_genre:genre||null,p_visitor_token:visitor()};let r=await client.rpc('novelight_trusted_discovery_feed',args);if(r.error&&missingTrustedRpc(r.error,'novelight_trusted_discovery_feed')){trustedExposureAvailable=false;console.warn('trusted discovery unavailable; using read-only legacy feed');r=await client.rpc('novelight_discovery_feed_v2',args)}else if(!r.error){trustedExposureAvailable=true}if(current!==requestId)return;if(r.error)throw r.error;let rows=(r.data||[]).filter(x=>!x.is_premium_slot);rows=await enrich(rows);if(current!==requestId)return;rows=await NovelightUserSafety.filterNovelRows(client,rows);if(current!==requestId)return;render(rows);if(trustedExposureAvailable===true&&rows.length){const receipts=rows.map(x=>x.allocation_receipt).filter(Boolean);if(receipts.length){const rec=await client.rpc('record_trusted_allocation_receipts',{p_receipts:receipts});if(rec.error)console.error(rec.error)}}}
async function neutral(keyword,genre,sort,current,append=false){const offset=append?neutralOffset:0;const r=await client.rpc('novelight_neutral_search',{p_keyword:keyword||null,p_genre:genre||null,p_sort:sort,p_limit:pageSize,p_offset:offset});if(current!==requestId)return;if(r.error)throw r.error;let batch=await enrich(r.data||[]);if(current!==requestId)return;const rawBatchLength=batch.length,rawTotal=Number(batch[0]?.total_count??(append?neutralTotal:0));batch=await NovelightUserSafety.filterNovelRows(client,batch);if(current!==requestId)return;neutralOffset=offset+rawBatchLength;neutralTotal=rawTotal;neutralRows=append?neutralRows.concat(batch):batch;render(neutralRows,neutralTotal);document.getElementById('moreWrap').hidden=neutralOffset>=neutralTotal;if(trustedExposureAvailable===true&&batch.length){const rec=await client.rpc('record_neutral_search_impressions',{p_novel_ids:batch.map(x=>String(x.novel_id)),p_visitor_token:visitor()});if(rec.error)console.error(rec.error)}}
async function natural(keyword,genre,current){document.getElementById('moreWrap').hidden=true;if(!keyword){renderNaturalIntent(null);document.getElementById('resultCount').textContent='自然文で読みたい話を入力してください';document.getElementById('novelList').innerHTML='<div class="empty">例：「仲間と成長しながら冒険する異世界ファンタジー」のように入力できます。</div>';return}const result=await NovelightNaturalSearch.search(client,keyword,{genre,limit:pageSize});if(current!==requestId)return;let rows=await enrich(result.rows);if(current!==requestId)return;rows=await NovelightUserSafety.filterNovelRows(client,rows);if(current!==requestId)return;renderNaturalIntent(result.plan);render(rows);if(trustedExposureAvailable===true&&rows.length){const rec=await client.rpc('record_neutral_search_impressions',{p_novel_ids:rows.map(x=>String(x.novel_id??x.id)),p_visitor_token:visitor()});if(rec.error)console.error(rec.error)}}
async function run(){const current=++requestId,k=document.getElementById('keywordInput').value.trim(),g=document.getElementById('genreSelect').value,s=document.getElementById('sortSelect').value;neutralRows=[];neutralTotal=0;neutralOffset=0;document.getElementById('resultCount').textContent='読み込み中...';document.getElementById('novelList').innerHTML='';document.getElementById('moreWrap').hidden=true;try{searchMode==='natural'?await natural(k,g,current):s==='recommended'?await recommended(k,g,current):await neutral(k,g,s,current,false)}catch(e){if(current!==requestId)return;console.error(e);document.getElementById('resultCount').textContent='読み込みエラー';document.getElementById('novelList').innerHTML='<div class="empty">作品を読み込めませんでした。時間をおいて再度お試しください。</div>'}}
function setSearchMode(mode){const next=mode==='natural'?'natural':'keyword';if(searchMode===next)return;const naturalMode=next==='natural',sort=document.getElementById('sortSelect'),input=document.getElementById('keywordInput'),naturalSort=document.getElementById('naturalSortOption');searchMode=next;naturalSort.hidden=!naturalMode;document.getElementById('keywordModeButton').setAttribute('aria-pressed',String(!naturalMode));document.getElementById('naturalModeButton').setAttribute('aria-pressed',String(naturalMode));document.getElementById('naturalSearchNote').hidden=!naturalMode;document.getElementById('searchArea').classList.toggle('is-natural',naturalMode);if(naturalMode){sort.dataset.keywordSort=allowedSorts.has(sort.value)?sort.value:'recommended';sort.value='natural'}else{sort.value=allowedSorts.has(sort.dataset.keywordSort)?sort.dataset.keywordSort:'recommended';document.getElementById('naturalSearchIntent').hidden=true;document.getElementById('naturalSearchIntent').innerHTML=''}sort.disabled=naturalMode;input.placeholder=naturalMode?'例：仲間と成長しながら冒険する異世界ファンタジー':'タイトル・あらすじを検索';void run()}
document.getElementById('moreButton').onclick=async()=>{const b=document.getElementById('moreButton'),current=requestId,k=document.getElementById('keywordInput').value.trim(),g=document.getElementById('genreSelect').value,s=document.getElementById('sortSelect').value;if(searchMode==='natural'||s==='recommended')return;b.disabled=true;try{await neutral(k,g,s,current,true)}catch(e){console.error(e)}finally{b.disabled=false}};document.getElementById('keywordModeButton').addEventListener('click',()=>setSearchMode('keyword'));document.getElementById('naturalModeButton').addEventListener('click',()=>setSearchMode('natural'));document.getElementById('keywordInput').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,250)});document.getElementById('genreSelect').addEventListener('change',run);document.getElementById('sortSelect').addEventListener('change',run);const requestedSort=new URLSearchParams(window.location.search).get('sort');if(allowedSorts.has(requestedSort))document.getElementById('sortSelect').value=requestedSort;(async()=>{await NovelightClient.captureAcquisition(client);await NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);await run()})();
</script></body></html>

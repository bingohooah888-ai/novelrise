<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SCOUT RECORD | NOVELIGHT</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:980px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:980px;margin:auto;padding:42px 22px 78px}.hero{padding:27px;border-radius:18px;background:linear-gradient(135deg,#6d4aff,#8b72ff);color:#fff}.hero h1{font-size:33px;margin-top:6px}.hero p{margin-top:9px;color:rgba(255,255,255,.9);line-height:1.7}.section{margin-top:27px}.section h2{font-size:21px;margin-bottom:6px}.note{color:#6b7280;font-size:12px;line-height:1.7;margin-bottom:13px}.list{display:grid;gap:11px}.card,.state{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:19px}.title{font-size:16px;font-weight:900}.meta{color:#6b7280;font-size:12px;margin-top:6px}.status{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#f0edff;color:#5d45c4;font-size:10px;font-weight:900}.status.off{background:#f3f4f6;color:#666}.status.error{background:#fff2f0;color:#b42318}.link{display:inline-flex;padding:9px 11px;border-radius:8px;background:#6d4aff;color:#fff;font-size:12px;font-weight:900}.state{padding:30px;text-align:center;color:#6b7280}footer{padding:26px;background:#111118;color:#999}.footer-links{max-width:980px;margin:auto;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:12px}@media(max-width:640px){main{padding:28px 16px 60px}.hero{padding:22px 18px}.hero h1{font-size:28px}.card{grid-template-columns:1fr}.link{width:100%;justify-content:center}}</style></head><body><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a class="back" href="mypage.html">← 作者ホーム</a></div></header><main><section class="hero"><div style="font-size:11px;font-weight:900">SCOUT</div><h1>SCOUT RECORD</h1><p>あなたがLIGHT SEEDを贈って発掘した作品の履歴です。β版では履歴の保存・確認を優先し、SCOUTランクやポイントはまだ計算しません。</p></section><section class="section"><h2>LIGHT SEEDの履歴</h2><p class="note">履歴は作品が後から非公開・削除されても保持されます。表示できる作品情報は現在の公開状態に基づきます。</p><div id="list" class="list"><div class="state">読み込み中...</div></div></section></main><footer><div class="footer-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function date(v){return v?new Date(v).toLocaleString('ja-JP'):'日時不明'}function render(seeds,map,metadataUnavailable=false){const list=document.getElementById('list');list.innerHTML=seeds.map(x=>{const id=String(x.novel_id_snapshot),work=map.get(id);if(metadataUnavailable)return `<article class="card"><div><div class="title">作品情報を取得できません</div><div class="meta">LIGHT SEEDを贈った日時：${esc(date(x.seeded_at))}</div><span class="status error">作品情報の取得エラー</span></div><span class="status error">再読み込みしてください</span></article>`;const ok=work?.status==='published';return `<article class="card"><div><div class="title">${esc(ok?work.title:'現在表示できない作品')}</div><div class="meta">LIGHT SEEDを贈った日時：${esc(date(x.seeded_at))}</div><span class="status ${ok?'':'off'}">${ok?'公開中':'現在非公開または削除済み'}</span></div>${ok?`<a class="link" href="novel.html?id=${encodeURIComponent(id)}">作品ページを確認</a>`:'<span class="status off">現在表示不可</span>'}</article>`}).join('')}(async()=>{void NovelightClient.recordVisit(client);const list=document.getElementById('list');let session;try{const a=await client.auth.getSession();session=a.data.session}catch(e){console.error(e);list.innerHTML='<div class="state">ログイン状態を確認できませんでした。時間をおいて再度お試しください。</div>';return}if(!session){location.href='login.html?redirect=scout-record.html';return}void NovelightClient.claimAcquisition(client);let seeds;try{const r=await client.from('light_seeds').select('novel_id_snapshot,seeded_at').order('seeded_at',{ascending:false});if(r.error)throw r.error;seeds=r.data||[]}catch(e){console.error(e);list.innerHTML='<div class="state">SCOUT RECORDを読み込めませんでした。時間をおいて再度お試しください。</div>';return}if(!seeds.length){list.innerHTML='<div class="state">まだLIGHT SEEDを贈った作品はありません。</div>';return}const ids=[...new Set(seeds.map(x=>String(x.novel_id_snapshot)))];try{const n=await client.from('novels').select('id,title,status').in('id',ids);if(n.error)throw n.error;render(seeds,new Map((n.data||[]).map(x=>[String(x.id),x])))}catch(e){console.error(e);render(seeds,new Map(),true)}})();</script></body></html>

ton{width:100%;padding:14px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font:inherit;font-weight:900}button:disabled{opacity:.6}.safety-note{margin:18px 0 0;text-align:center;color:#666;font-size:12px;line-height:1.7}.legal-links{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-size:11px}@media(max-width:560px){.card{padding:26px 20px}.logo img{height:36px}}</style>

<body><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><a href="index.html" class="logo" aria-label="NOVELIGHT トップへ"><img src="assets/novelight-header-logo.webp" alt="NOVELIGHT"></a><a href="index.html" class="back">← トップページ</a></div></header>
<main id="main-content" tabindex="-1"><section class="card"><h1>招待画面プレビュー</h1><p class="lead">先行作者プレオープン時の表示確認</p><div class="preview-notice"><strong>本番送信前の安全なプレビューです。</strong><br>この画面から会員登録、Auth作成、招待消費、データ更新はできません。</div><div class="author-box">✍️ 作品が評価される前の「読者に届く機会」を増やす小説投稿プラットフォームです。<br>β期間中はStandardを無料・カード登録不要で利用できます。</div><div id="previewStatus" class="launch-gate" role="status" aria-live="polite"><strong id="previewTitle">招待画面を確認しています</strong><p id="previewMessage">安全なプレビューURLか確認しています。</p></div><div id="previewForm" hidden aria-disabled="true"><div class="form-group"><label for="previewName">ユーザー名</label><input id="previewName" type="text" value="入力欄のプレビュー" disabled></div><div class="form-group"><label for="previewEmail">メールアドレス</label><input id="previewEmail" type="email" value="founding-author@example.com" disabled></div><div class="form-group"><label for="previewPassword">パスワード</label><input id="previewPassword" type="password" value="preview-only" disabled></div><div class="form-group"><label for="previewPasswordConfirm">パスワード確認</label><input id="previewPasswordConfirm" type="password" value="preview-only" disabled></div><label class="consent"><input type="checkbox" disabled><span><a href="terms.html" target="_blank" rel="noopener">利用規約</a>、<a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>、<a href="content-guidelines.html" target="_blank" rel="noopener">投稿ガイドライン</a>への同意欄</span></label><button type="button" disabled>無料で会員登録</button><p class="safety-note">プレビューのため、入力・送信は無効です。</p></div><nav class="legal-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="commerce-disclosure.html">特商法表記</a><a href="contact.html">お問い合わせ</a></nav></section></main>
<script>
const previewStatus=document.getElementById('previewStatus'),previewTitle=document.getElementById('previewTitle'),previewMessage=document.getElementById('previewMessage'),previewForm=document.getElementById('previewForm');
const inviteParams=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):'');
const rawInviteToken=(inviteParams.get('invite')||'').trim();
const inviteToken=/^[A-Za-z0-9_-]{43}$/.test(rawInviteToken)?rawInviteToken:'';
if(rawInviteToken)history.replaceState(null,'',location.pathname+location.search);
function showUnavailable(){previewTitle.textContent='招待画面を確認できません';previewMessage.textContent='プレビューURLが無効または期限切れです。最新の管理者テストメールから開いてください。';previewForm.hidden=true}
async function loadPreview(){if(!inviteToken){showUnavailable();return}try{const response=await fetch('/api/beta-author-invite-preview',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({token:inviteToken})});if(!response.ok)throw new Error('preview unavailable');const payload=await response.json();if(payload?.valid!==true||payload?.authCreationEnabled!==false||payload?.dataMutationEnabled!==false){showUnavailable();return}previewStatus.hidden=false;previewTitle.textContent='先行作者プレオープン中です';previewMessage.textContent='招待URLを確認しました。先行登録時のメールアドレスで会員登録してください。一般会員登録は9月30日から開始します。';previewForm.hidden=false}catch(error){console.error('invite preview validation failed',{name:error?.name||'Error'});showUnavailable()}}
void loadPreview();
</script></body></html>

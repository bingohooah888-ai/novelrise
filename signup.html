<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>会員登録 | NOVELIGHT</title>
  <style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:#6d4aff}header{height:72px;background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1100px;height:100%;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;color:#6d4aff;font-size:25px;font-weight:900}.back{text-decoration:none;color:#666;font-size:14px}main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:42px 18px 70px}.card{width:100%;max-width:480px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:34px;box-shadow:0 12px 40px rgba(0,0,0,.06)}h1{margin:0 0 8px;text-align:center;font-size:29px}.lead{margin:0 0 26px;text-align:center;color:#777;font-size:14px}.author-box{margin-bottom:22px;padding:14px;border-radius:10px;background:#f5f3ff;color:#555;font-size:13px;line-height:1.7}.launch-gate{margin-bottom:22px;padding:18px;border:1px solid #ddd6fe;border-radius:12px;background:#faf9ff;color:#555;font-size:13px;line-height:1.7;text-align:center}.launch-gate strong{display:block;margin-bottom:6px;color:#333;font-size:15px}.launch-gate p{margin:0}.launch-gate a{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:8px;background:#6d4aff;color:#fff;text-decoration:none;font-weight:800}.form-group{margin-bottom:18px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:800}input[type=text],input[type=email],input[type=password]{width:100%;padding:12px 13px;border:1px solid #d9d9df;border-radius:9px;font:inherit;outline:none}.consent{display:flex;gap:10px;align-items:flex-start;margin:22px 0 18px;padding:14px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa;color:#555;font-size:12px;line-height:1.7}.consent input{margin-top:3px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.6}.login{margin-top:22px;text-align:center;color:#666;font-size:14px}.legal-links{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-size:11px}.status{min-height:20px;margin-top:12px;color:#666;font-size:13px;line-height:1.6}@media(max-width:560px){.card{padding:26px 20px}}</style>
</head>
<body>
<header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="index.html" class="back">← トップページ</a></div></header>
<main><section class="card"><h1>NOVELIGHTを始める</h1><p class="lead">無料アカウントを作成</p><div class="author-box">✍️ 作品が評価される前の「読者に届く機会」を増やす小説投稿プラットフォームです。<br>β期間中はStandardを無料・カード登録不要で利用できます。会員登録後、料金プランから有効化してください。</div><div id="launchGate" class="launch-gate" role="status" aria-live="polite"><strong id="launchGateTitle">登録受付状態を確認しています</strong><p id="launchGateMessage">安全に会員登録を開始できるか確認しています。</p><a id="preregistrationLink" href="beta-authors" hidden>先行作者登録へ</a></div><form id="signupForm" hidden><div class="form-group"><label for="name">ユーザー名</label><input id="name" type="text" maxlength="40" autocomplete="nickname" required></div><div class="form-group"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">パスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-group"><label for="passwordConfirm">パスワード確認</label><input id="passwordConfirm" type="password" minlength="8" autocomplete="new-password" required></div><label class="consent"><input id="termsConsent" type="checkbox" required><span><a href="terms.html" target="_blank" rel="noopener">利用規約</a>、<a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>、<a href="content-guidelines.html" target="_blank" rel="noopener">投稿ガイドライン</a>を確認し、同意します。</span></label><button id="signupButton" type="submit" disabled>無料で会員登録</button><div id="signupStatus" class="status" aria-live="polite"></div></form><div class="login">すでにアカウントをお持ちですか？ <a href="login.html">ログイン</a></div><nav class="legal-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="commerce-disclosure.html">特商法表記</a><a href="contact.html">お問い合わせ</a></nav></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const form=document.getElementById('signupForm'),button=document.getElementById('signupButton'),status=document.getElementById('signupStatus'),launchGate=document.getElementById('launchGate'),launchGateTitle=document.getElementById('launchGateTitle'),launchGateMessage=document.getElementById('launchGateMessage'),preregistrationLink=document.getElementById('preregistrationLink');
let signupEnabled=false;
async function runOptionalTelemetry(label,task){try{await task()}catch(error){console.error(label,error)}}
function showSignupForm(){signupEnabled=true;launchGate.hidden=true;preregistrationLink.hidden=true;form.hidden=false;button.disabled=false}
function showPreregistrationGate(){signupEnabled=false;form.hidden=true;button.disabled=true;launchGate.hidden=false;launchGateTitle.textContent='現在は先行作者登録期間です';launchGateMessage.textContent='β版の一般会員登録はまだ開始していません。先行作者登録から参加希望を受け付けています。';preregistrationLink.hidden=false}
function showUnavailableGate(){signupEnabled=false;form.hidden=true;button.disabled=true;launchGate.hidden=false;launchGateTitle.textContent='会員登録受付を確認できません';launchGateMessage.textContent='安全のため、現在は新規会員登録を停止しています。時間をおいて再度お試しください。';preregistrationLink.hidden=true}
async function loadSignupGate(){try{const response=await fetch('/api/beta-author-preregistration',{method:'GET',cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('campaign unavailable');const payload=await response.json();const state=payload?.campaign?.state;if(state==='PRE_REGISTRATION'){showPreregistrationGate();return}if(state==='BETA_OPEN'||state==='CLOSED'){showSignupForm();return}throw new Error('unexpected campaign state')}catch(error){console.error('signup campaign lookup failed',error);showUnavailableGate()}}
void loadSignupGate();
void (async()=>{await runOptionalTelemetry('signup acquisition telemetry failed',()=>NovelightClient.captureAcquisition(client));await runOptionalTelemetry('signup visit telemetry failed',()=>NovelightClient.recordVisit(client))})();
form.addEventListener('submit',async(e)=>{e.preventDefault();if(!signupEnabled){status.textContent='現在は新規会員登録を受け付けていません。';return}if(button.disabled)return;const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('passwordConfirm').value;if(!document.getElementById('termsConsent').checked){status.textContent='規約への同意が必要です。';return}if(password!==confirm){status.textContent='パスワードが一致していません。';return}button.disabled=true;status.textContent='登録処理中...';try{const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:window.location.origin+'/index.html'}});if(error){console.error(error);status.textContent='会員登録に失敗しました。入力内容を確認してください。';return}if(data?.session){await runOptionalTelemetry('post-signup acquisition telemetry failed',()=>NovelightClient.claimAcquisition(client));await runOptionalTelemetry('post-signup visit telemetry failed',()=>NovelightClient.recordVisit(client))}status.textContent='登録確認メールを送信しました。メール内のリンクから登録を完了してください。確認後は「創作室」から投稿を始められます。β期間中のStandard無料利用は料金プランから有効化できます（カード登録不要）。'}catch(error){console.error('signup request failed',error);status.textContent='会員登録に失敗しました。通信状態を確認し、時間をおいて再度お試しください。'}finally{button.disabled=false}});
</script></body></html>

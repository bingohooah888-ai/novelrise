<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>章・並び順管理 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button,input,select{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1050px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:25px;font-weight:900}.back{font-size:14px;color:#666}main{max-width:980px;margin:auto;padding:38px 22px 80px}.intro{margin:8px 0 24px;color:#6b7280;line-height:1.8}.panel{margin-bottom:18px;padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:16px}.panel h2{margin:0 0 14px;font-size:21px}.chapter-create{display:flex;gap:10px}.chapter-create input{flex:1;min-width:0}.chapter-list,.episode-list{display:grid;gap:10px;margin-top:16px}.chapter-row,.episode-row{display:grid;gap:10px;padding:14px;border:1px solid #e5e7eb;border-radius:12px;background:#fffdf9}.chapter-row{grid-template-columns:minmax(0,1fr) auto}.chapter-edit{display:flex;gap:8px}.chapter-edit input{flex:1;min-width:0}.chapter-actions,.episode-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.episode-row{grid-template-columns:auto minmax(0,1fr) minmax(170px,.65fr) auto;align-items:center}.episode-number{min-width:54px;font-size:13px;font-weight:900;color:#6b7280}.episode-title{font-weight:900;line-height:1.5}.episode-meta{display:block;margin-top:4px;font-size:11px;font-weight:700;color:#8a8176}.control{width:100%;padding:10px 11px;border:1px solid #d3d6dc;border-radius:9px;background:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 13px;border:1px solid #d3d6dc;border-radius:9px;background:#fff;font-weight:900;cursor:pointer}.btn.primary{border-color:#3b2a1d;background:#3b2a1d;color:#fff}.btn.danger{border-color:#d9a8a2;color:#b42318}.btn:disabled{opacity:.5;cursor:not-allowed}.save-bar{position:sticky;bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border:1px solid #d9ccb6;border-radius:14px;background:rgba(255,252,245,.96);box-shadow:0 12px 36px rgba(45,34,22,.12);backdrop-filter:blur(10px)}.status{min-height:22px;color:#655b50;font-size:13px;line-height:1.6}.empty{padding:18px;border:1px dashed #d8d8df;border-radius:10px;color:#777;text-align:center}.notice{margin:12px 0 0;padding:11px 13px;border-radius:9px;background:#f8f3e9;color:#665740;font-size:12px;line-height:1.7}@media(max-width:760px){main{padding:28px 16px 70px}.panel{padding:20px 16px}.chapter-create,.chapter-edit{flex-direction:column}.episode-row{grid-template-columns:1fr}.episode-number{min-width:0}.episode-actions .btn{flex:1}.save-bar{align-items:stretch;flex-direction:column}.save-bar .btn{width:100%}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
</head>
<body class="novelight-theme novelight-page-episode-structure">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main>
  <h1>章・並び順管理</h1>
  <p id="novelTitle" class="intro">作品情報を読み込み中...</p>

  <section class="panel">
    <h2>章</h2>
    <div class="chapter-create"><input id="newChapterTitle" class="control" maxlength="120" placeholder="例：第一章　旅立ち"><button id="createChapter" class="btn primary" type="button" disabled>章を追加</button></div>
    <p class="notice">章は目次を読みやすくする整理情報です。作品Rank・LIGHT SEED・PV・露出評価には加点されません。章を削除してもエピソード本文は削除されません。</p>
    <div id="chapterList" class="chapter-list"><div class="empty">読み込み中...</div></div>
  </section>

  <section class="panel">
    <h2>エピソード順</h2>
    <p class="notice">上下ボタンで途中挿入や並び替えができます。章を変更すると同じ章の話をまとめて配置します。「保存」時に全話を1回のDBトランザクションで再採番します。</p>
    <div id="episodeList" class="episode-list"><div class="empty">読み込み中...</div></div>
  </section>

  <div class="save-bar">
    <div id="status" class="status" aria-live="polite">準備しています...</div>
    <button id="saveStructure" class="btn primary" type="button" disabled>章と並び順を保存</button>
  </div>
</main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const novelId=new URLSearchParams(location.search).get('novel_id');
const chapterList=document.getElementById('chapterList'),episodeList=document.getElementById('episodeList'),status=document.getElementById('status'),createChapter=document.getElementById('createChapter'),saveStructure=document.getElementById('saveStructure');
let session=null,novel=null,chapters=[],episodes=[],busy=false,ready=false;
function setBusy(value){busy=value;createChapter.disabled=value||!ready;saveStructure.disabled=value||!ready}
function text(value){return String(value??'')}
function chapterId(value){return value===null||value===undefined||value===''?null:Number(value)}
function chapterOptions(selected){return ['<option value="">章なし</option>',...chapters.map(ch=>`<option value="${ch.id}"${String(selected)===String(ch.id)?' selected':''}>${escapeHtml(ch.title)}</option>`)].join('')}
function escapeHtml(value){const div=document.createElement('div');div.textContent=text(value);return div.innerHTML}
function normalizeChapterBlocks(){const unassigned=episodes.filter(row=>!chapterId(row.chapter_id));const grouped=[];for(const chapter of chapters){grouped.push(...episodes.filter(row=>String(row.chapter_id)===String(chapter.id)))}episodes=[...unassigned,...grouped]}
function render(){chapterList.replaceChildren();if(!chapters.length){chapterList.innerHTML='<div class="empty">章はまだありません。章なしのままエピソードだけ並べることもできます。</div>'}else{chapters.forEach((chapter,index)=>{const row=document.createElement('div');row.className='chapter-row';row.dataset.chapterId=chapter.id;const edit=document.createElement('div');edit.className='chapter-edit';const input=document.createElement('input');input.className='control';input.maxLength=120;input.value=chapter.title;input.setAttribute('aria-label','章タイトル');const rename=document.createElement('button');rename.className='btn';rename.type='button';rename.textContent='名前を保存';rename.onclick=()=>void renameChapter(chapter,input.value);edit.append(input,rename);const actions=document.createElement('div');actions.className='chapter-actions';const up=document.createElement('button');up.className='btn';up.type='button';up.textContent='↑';up.title='章を上へ';up.disabled=index===0;up.onclick=()=>moveChapter(index,-1);const down=document.createElement('button');down.className='btn';down.type='button';down.textContent='↓';down.title='章を下へ';down.disabled=index===chapters.length-1;down.onclick=()=>moveChapter(index,1);const remove=document.createElement('button');remove.className='btn danger';remove.type='button';remove.textContent='削除';remove.onclick=()=>void deleteChapter(chapter);actions.append(up,down,remove);row.append(edit,actions);chapterList.appendChild(row)})}
  episodeList.replaceChildren();if(!episodes.length){episodeList.innerHTML='<div class="empty">まだエピソードがありません。先にエピソードを追加してください。</div>';return}episodes.forEach((episode,index)=>{const row=document.createElement('div');row.className='episode-row';row.dataset.episodeId=episode.id;const number=document.createElement('div');number.className='episode-number';number.textContent=`第${index+1}話`;const title=document.createElement('div');title.className='episode-title';title.textContent=episode.title||'（タイトル未設定）';const meta=document.createElement('span');meta.className='episode-meta';const scheduled=episode.scheduled_publish_at?`・予約 ${new Date(episode.scheduled_publish_at).toLocaleString('ja-JP')}`:'';meta.textContent=(episode.status==='draft'?'下書き':'公開中')+scheduled;title.appendChild(meta);const select=document.createElement('select');select.className='control';select.innerHTML=chapterOptions(episode.chapter_id);select.setAttribute('aria-label',`${episode.title||'エピソード'}の章`);select.onchange=()=>{episode.chapter_id=chapterId(select.value);normalizeChapterBlocks();render();markDirty()};const actions=document.createElement('div');actions.className='episode-actions';const up=document.createElement('button');up.className='btn';up.type='button';up.textContent='↑';up.title='1つ上へ';up.disabled=index===0;up.onclick=()=>moveEpisode(index,-1);const down=document.createElement('button');down.className='btn';down.type='button';down.textContent='↓';down.title='1つ下へ';down.disabled=index===episodes.length-1;down.onclick=()=>moveEpisode(index,1);actions.append(up,down);row.append(number,title,select,actions);episodeList.appendChild(row)})}
function markDirty(message='未保存の変更があります。'){status.textContent=message}
function moveEpisode(index,delta){const target=index+delta;if(target<0||target>=episodes.length)return;[episodes[index],episodes[target]]=[episodes[target],episodes[index]];render();markDirty()}
function moveChapter(index,delta){const target=index+delta;if(target<0||target>=chapters.length)return;[chapters[index],chapters[target]]=[chapters[target],chapters[index]];normalizeChapterBlocks();render();markDirty('章順と所属エピソードの並びを変更しました。保存すると反映されます。')}
async function renameChapter(chapter,value){const title=text(value).trim();if(!title||title.length>120){status.textContent='章タイトルは1〜120文字で入力してください。';return}setBusy(true);status.textContent='章タイトルを保存しています...';try{const result=await client.rpc('novelight_rename_novel_chapter',{p_chapter_id:chapter.id,p_title:title});if(result.error)throw result.error;chapter.title=title;render();status.textContent='章タイトルを保存しました。'}catch(error){console.error(error);status.textContent='章タイトルを保存できませんでした。'}finally{setBusy(false)}}
async function deleteChapter(chapter){if(!confirm(`「${chapter.title}」を削除しますか？\n所属エピソードは「章なし」に戻り、本文は削除されません。`))return;setBusy(true);status.textContent='章を削除しています...';try{const result=await client.rpc('novelight_delete_novel_chapter',{p_chapter_id:chapter.id});if(result.error)throw result.error;chapters=chapters.filter(item=>String(item.id)!==String(chapter.id));episodes.forEach(item=>{if(String(item.chapter_id)===String(chapter.id))item.chapter_id=null});render();status.textContent='章を削除しました。'}catch(error){console.error(error);status.textContent='章を削除できませんでした。'}finally{setBusy(false)}}
createChapter.onclick=async()=>{if(!ready||busy)return;const input=document.getElementById('newChapterTitle'),title=input.value.trim();if(!title||title.length>120){status.textContent='章タイトルは1〜120文字で入力してください。';return}setBusy(true);status.textContent='章を追加しています...';try{const result=await client.rpc('novelight_create_novel_chapter',{p_novel_id:novelId,p_title:title});if(result.error)throw result.error;chapters.push({id:Number(result.data),novel_id:Number(novelId),title,position:chapters.length+1});input.value='';render();status.textContent='章を追加しました。'}catch(error){console.error(error);status.textContent='章を追加できませんでした。'}finally{setBusy(false)}};
saveStructure.onclick=async()=>{if(!ready||busy)return;setBusy(true);status.textContent='章と並び順を保存しています...';const episodeItems=episodes.map(row=>({episode_id:Number(row.id),chapter_id:chapterId(row.chapter_id)}));const chapterOrder=chapters.map(row=>Number(row.id));try{const result=await client.rpc('novelight_reorder_novel_structure',{p_novel_id:novelId,p_episode_items:episodeItems,p_chapter_order:chapterOrder});if(result.error)throw result.error;episodes.forEach((row,index)=>{row.episode_number=index+1});chapters.forEach((row,index)=>{row.position=index+1});render();status.textContent='章と並び順を保存しました。'}catch(error){console.error(error);status.textContent='保存できませんでした。再読み込みして状態を確認してください。'}finally{setBusy(false)}};
(async()=>{void NovelightClient.recordVisit(client);if(!novelId){status.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-structure.html?novel_id='+novelId);return}const novelResult=await client.from('novels').select('id,user_id,title').eq('id',novelId).single();novel=novelResult.data;if(novelResult.error||!novel||novel.user_id!==session.user.id)throw novelResult.error||new Error('not authorized');document.getElementById('novelTitle').textContent=`「${novel.title}」の章とエピソード順を管理します。`;document.getElementById('back').href='novel.html?id='+encodeURIComponent(novelId);const [chapterResult,episodeResult]=await Promise.all([client.from('novel_chapters').select('id,novel_id,title,position').eq('novel_id',novelId).order('position',{ascending:true}),client.from('episodes').select('id,title,episode_number,status,chapter_id,scheduled_publish_at').eq('novel_id',novelId).order('episode_number',{ascending:true})]);if(chapterResult.error)throw chapterResult.error;if(episodeResult.error)throw episodeResult.error;chapters=chapterResult.data||[];episodes=episodeResult.data||[];ready=true;setBusy(false);render();status.textContent='変更後は「章と並び順を保存」を押してください。'}catch(error){console.error(error);ready=false;setBusy(false);chapterList.innerHTML='<div class="empty">章管理を読み込めませんでした。</div>';episodeList.innerHTML='<div class="empty">エピソード順を読み込めませんでした。</div>';status.textContent=String(error?.message||'章・並び順管理を利用できません。')}})();
</script>
</body>
</html>

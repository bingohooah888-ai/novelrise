<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261022">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>通報管理 | NOVELIGHT ADMIN</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#0f1020;color:#f4f4f8}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.hidden{display:none!important}header{border-bottom:1px solid #292b47;background:#121326}.header-inner{max-width:1000px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:21px;font-weight:950}.badge{margin-left:8px;color:#c7c1ff;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost{border:1px solid #393c61;background:#17182c;color:#ddd;border-radius:9px;padding:10px 13px;font-weight:900}main{max-width:1000px;margin:auto;padding:30px 20px 70px}.hero h1{margin:0;font-size:30px}.hero p{color:#999db9;line-height:1.65}.status{margin:16px 0;padding:12px 14px;border:1px solid #303253;border-radius:10px;background:#17182c;color:#b7bad0}.status.error{border-color:#7c3039;color:#ffb8c0}.panel{border:1px solid #2d2f4d;background:#17182c;border-radius:14px;padding:18px}.list{display:grid;gap:9px}.item{border:1px solid #303253;border-radius:11px;background:#121326;padding:14px}.title{font-weight:900}.meta{margin-top:7px;color:#8f93b0;font-size:11px;line-height:1.65}.chip{display:inline-block;margin-right:7px;padding:3px 6px;border-radius:999px;background:#252744;color:#c9c5ff;font-size:10px;font-weight:900}.privacy{margin-top:14px;color:#8589a8;font-size:11px;line-height:1.65}.empty{padding:20px;text-align:center;color:#8589a8;border:1px dashed #343755;border-radius:10px}.gate{max-width:640px;margin:60px auto;padding:24px;border:1px solid #393c61;border-radius:14px;background:#17182c}@media(max-width:650px){.header-inner{align-items:flex-start;flex-direction:column}}
  </style>
<link rel="stylesheet" href="novelight-accessibility.css"><link rel="stylesheet" href="/shared/header/brand-variants.css" data-novelight-brand-variants="true">
</head>
<body><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><div class="brand"><a class="nl-admin-brand-link" href="index.html" aria-label="NOVELIGHT ホーム"><img src="assets/novelight-header-logo.webp" alt="NOVELIGHT" width="154" height="40"></a> <span class="badge">ADMIN</span></div><div class="actions"><a class="ghost" href="admin.html">ADMINトップ</a><a class="ghost" href="admin-inquiries.html">お問い合わせ管理</a><a class="ghost" href="admin-announcements.html">お知らせ管理</a><button id="logout" class="ghost" type="button">ログアウト</button></div></div></header>
<main id="main-content" tabindex="-1">
  <section id="gate" class="gate hidden"><h1 id="gateTitle">アクセスを確認しています</h1><p id="gateMessage">管理者権限を確認しています。</p></section>
  <div id="app" class="hidden">
    <section class="hero"><h1>通報管理</h1><p>未処理・確認中の通報を安全な概要だけで確認します。通報本文や通報者情報はこの一覧APIへ含めません。</p></section>
    <div id="status" class="status">読み込み中...</div>
    <section class="panel"><div id="reportTools" hidden><p id="reportBreakdown" aria-live="polite"></p><div class="actions"><label>カテゴリ <select id="reportCategory"><option value="">すべて</option></select></label><label>状態 <select id="reportStatus"><option value="">すべて</option><option value="new">未処理</option><option value="reviewing">確認中</option></select></label><label><input type="checkbox" id="reportOldest"> 古い順</label></div><p id="reportVisible" aria-live="polite"></p></div><div id="reportList" class="list"><div class="empty">読み込み中...</div></div><p class="privacy">この画面は運営トリアージ用の概要です。通報本文（details）・reporter_id・visitor_key_hash・author_id_snapshotは取得しません。</p></section>
  </div>
<section data-novelight-ai-review-host hidden aria-label="AI支援（利用不可）"></section></main>
<script src="novelight-ai-review-result.js"></script>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="novelight-client.js"></script>
<script>
  const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
  const statusEl=document.getElementById('status');
  const dt=(value)=>value?new Date(value).toLocaleString('ja-JP'):'—';
  const label=(value)=>value==='reviewing'?'確認中':'未処理';
  function showGate(title,message){clearReportTools();document.getElementById('app').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');document.getElementById('gateTitle').textContent=title;document.getElementById('gateMessage').textContent=message}
  function showApp(){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
  async function session(){const {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){location.href='login.html?redirect=admin-reports.html';return null}return session}
  let reportRows=[];
  function clearReportTools(){reportRows=[];document.getElementById('reportTools').hidden=true;document.getElementById('reportList').replaceChildren();document.getElementById('reportBreakdown').textContent='';document.getElementById('reportVisible').textContent='';document.getElementById('reportCategory').replaceChildren(new Option('すべて',''))}
  function reportCounts(rows){const counts=new Map();for(const row of rows){if(typeof row?.category!=='string'||!row.category)continue;counts.set(row.category,(counts.get(row.category)||0)+1)}return [...counts.entries()]}
  function selectReports(rows,category,status,oldest){const result=rows.filter(row=>row&&(!category||row.category===category)&&(!status||row.status===status));return oldest?result.sort((a,b)=>(Date.parse(a.created_at)||Infinity)-(Date.parse(b.created_at)||Infinity)):result}
  function renderReports(){const rows=selectReports(reportRows,document.getElementById('reportCategory').value,document.getElementById('reportStatus').value,document.getElementById('reportOldest').checked);document.getElementById('reportVisible').textContent='取得済み '+reportRows.length+'件中 '+rows.length+'件';const list=document.getElementById('reportList');list.replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='条件に一致する通報はありません。';list.appendChild(empty)}else{rows.forEach(row=>{const item=document.createElement('article');item.className='item';const title=document.createElement('div');title.className='title';title.textContent=`${row.category} / 作品 ${row.novel_id_snapshot}`;const meta=document.createElement('div');meta.className='meta';const chip=document.createElement('span');chip.className='chip';chip.textContent=label(row.status);meta.append(chip,document.createTextNode(`${dt(row.created_at)}${row.episode_id_snapshot?` / 話 ${row.episode_id_snapshot}`:''}`));item.append(title,meta);list.appendChild(item)})}}
  function renderReportTools(){const categories=reportCounts(reportRows);const picker=document.getElementById('reportCategory');picker.replaceChildren(new Option('すべて',''));for(const [name] of categories)picker.append(new Option(name,name));document.getElementById('reportStatus').value='';document.getElementById('reportOldest').checked=false;document.getElementById('reportBreakdown').textContent='取得範囲のカテゴリ別件数：'+(categories.map(([name,count])=>name+' '+count+'件').join(' / ')||'なし')+'（違反の確定・重要度判定ではありません）';document.getElementById('reportTools').hidden=false;renderReports()}
  for(const id of ['reportCategory','reportStatus','reportOldest'])document.getElementById(id).addEventListener('change',renderReports);
  async function load(){clearReportTools();try{const current=await session();if(!current)return;const response=await fetch('/api/admin-reports',{headers:{Authorization:`Bearer ${current.access_token}`,Accept:'application/json'},cache:'no-store',credentials:'same-origin'});if(response.status===401){location.href='login.html?redirect=admin-reports.html';return}if(response.status===403){showGate('アクセスできません','このアカウントにはNOVELIGHT ADMINの管理者権限がありません。');return}if(!response.ok)throw new Error(`ADMIN API ${response.status}`);const data=await response.json();showApp();window.NovelightAiReviewResult?.mountDormantPage({document,client,page:'admin-reports.html'});reportRows=Array.isArray(data.reports)?data.reports:[];renderReportTools();statusEl.textContent=`未処理・確認中 ${reportRows.length}件`; }catch(error){clearReportTools();console.error(error);showApp();statusEl.className='status error';statusEl.textContent='通報一覧を取得できませんでした。'}}
  document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();location.href='index.html'});
  void load();
</script>
</body>
</html>

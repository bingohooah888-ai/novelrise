<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>作品詳細 | NOVELIGHT</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button,select,textarea{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1000px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:900px;margin:auto;padding:42px 22px 76px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px}.novel-header{padding:30px;margin-bottom:18px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0edff;color:#5b43bf;font-size:11px;font-weight:900}.tag.ai{background:#eef6ff;color:#245fa9}.tag.founding{background:#fff4cf;color:#795600}.title{font-size:32px;line-height:1.4;margin-bottom:10px}.author{color:#666;font-size:14px;margin-bottom:18px}.author a{color:#6d4aff;font-weight:800}.description{color:#555;line-height:1.9;white-space:pre-wrap;margin-bottom:20px}.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#888;font-size:13px}.favorite{padding:7px 10px;border:1px solid #d8d8df;border-radius:8px;background:#fff;cursor:pointer}.warning-gate{display:none;margin-bottom:18px;padding:24px;border:1px solid #f0c36a;border-radius:16px;background:#fffaf0}.warning-gate.visible{display:block}.warning-gate h2{font-size:20px;margin-bottom:8px}.warning-list{margin:12px 0 16px;padding-left:20px;color:#6b4b16}.continue{padding:11px 16px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font-weight:900;cursor:pointer}.light-seed{display:none;margin-bottom:18px;padding:24px;border:1px solid #ddd7ff;border-radius:16px;background:#f7f5ff}.light-seed.visible{display:block}.seed-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.seed-button{padding:11px 16px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font-weight:900;cursor:pointer}.seed-button:disabled{opacity:.55}.seed-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#655d79;font-size:12px;font-weight:800}.episodes{padding:26px}.episodes h2{font-size:22px;margin-bottom:16px}.episode{padding:15px 0;border-bottom:1px solid #eee}.episode-number{font-size:12px;color:#888;margin-bottom:4px}.episode-title{font-size:18px;font-weight:900}.owner-actions{display:none;gap:10px;flex-wrap:wrap;margin-top:20px}.action{display:inline-block;padding:10px 15px;border-radius:8px;background:#6d4aff;color:#fff;font-weight:900;font-size:13px;border:0;cursor:pointer}.delete{background:#fff;color:#d92d20;border:1px solid #d92d20}.report{margin-left:auto;background:#fff;color:#666;border:1px solid #d8d8df}.empty,.error{padding:28px;text-align:center;color:#6b7280}.error{color:#b42318}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.46);display:none;align-items:center;justify-content:center;padding:18px}.modal.visible{display:flex}.modal-card{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:24px}.modal-card h2{margin-bottom:8px}.modal-card p{color:#666;font-size:13px;line-height:1.6;margin-bottom:16px}.modal-card select,.modal-card textarea{width:100%;padding:11px;border:1px solid #d6d8df;border-radius:9px;margin-bottom:12px}.modal-card textarea{min-height:140px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{padding:10px 14px;border-radius:8px;border:1px solid #d6d8df;background:#fff;font-weight:800}.modal-actions .send{background:#6d4aff;color:#fff;border-color:#6d4aff}.report-status{min-height:20px;color:#666;font-size:12px;margin-top:8px}.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}@media(max-width:640px){main{padding:28px 16px 60px}.novel-header,.episodes,.light-seed,.warning-gate{padding:21px 18px}.title{font-size:27px}.seed-button{width:100%}.report{margin-left:0}.modal-actions{flex-direction:column}.modal-actions button{width:100%}}</style></head>
<body><header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="search.html" class="back">← 作品を探す</a></div></header><main><section id="warningGate" class="warning-gate"><h2>内容に関する注意</h2><p>この作品には成熟したテーマまたは強い表現が含まれます。</p><ul id="warningList" class="warning-list"></ul><button id="continueButton" class="continue" type="button">内容を確認して表示</button></section><section id="novelHeader" class="panel novel-header">読み込み中...</section><section id="lightSeedArea" class="light-seed"><div class="seed-top"><div><h2>🌱 LIGHT SEED</h2><p id="seedMessage" style="margin-top:6px;color:#666;line-height:1.7;font-size:14px">状態を確認しています...</p></div><button id="seedButton" class="seed-button" type="button">🌱 LIGHT SEEDを贈る</button></div><div class="seed-stats"><span id="seedRemaining"></span><span id="seedTotal"></span></div></section><section id="episodesPanel" class="panel episodes"><h2>エピソード</h2><div id="episodeList"><div class="empty">読み込み中...</div></div><div id="ownerActions" class="owner-actions"><a id="editNovel" class="action" href="#">作品を編集</a><a id="newEpisode" class="action" href="#">＋ エピソード追加</a><button id="deleteNovel" class="action delete" type="button">作品を削除</button><button id="reportOpen" class="action report" type="button">この作品を通報</button></div><div id="readerReportAction" style="margin-top:18px"><button id="readerReportOpen" class="action report" type="button">この作品を通報</button></div></section></main>
<div id="reportModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reportTitle"><section class="modal-card"><h2 id="reportTitle">作品を通報</h2><p>著作権侵害、規約違反、不正、AI区分の虚偽申告などを運営へ報告できます。正当な低評価・作品への好みは通報理由ではありません。</p><select id="reportCategory"><option value="">理由を選択</option><option value="copyright">著作権・無断転載</option><option value="prohibited_content">禁止コンテンツ・規約違反</option><option value="harassment">嫌がらせ・権利侵害</option><option value="spam">スパム・不正操作</option><option value="ai_misclassification">AI利用区分の虚偽申告</option><option value="other">その他</option></select><textarea id="reportDetails" maxlength="4000" placeholder="具体的な内容を入力してください"></textarea><div class="honeypot"><input id="reportWebsite" tabindex="-1" autocomplete="off"></div><div class="modal-actions"><button id="reportCancel" type="button">キャンセル</button><button id="reportSend" class="send" type="button">通報を送信</button></div><div id="reportStatus" class="report-status"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const novelId=new URLSearchParams(location.search).get('id');let session=null,novel=null,contentUnlocked=false;
const warningLabels={violence:'暴力・戦闘',gore:'残酷・流血描写',sexual_theme:'性的テーマへの言及',abuse:'虐待・ハラスメント',discrimination:'差別・偏見',self_harm:'自傷・自殺テーマ',crime:'犯罪・薬物',other:'その他の強い表現'};const aiLabels={unspecified:'AI利用区分 未申告',human:'人間主体',ai_assisted:'AI支援',ai_generated:'AI生成主体'};
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function visitor(){return NovelightClient.getVisitorToken()}
function showError(m){document.getElementById('novelHeader').style.display='block';document.getElementById('novelHeader').innerHTML='<div class="error">'+esc(m)+'</div>';document.getElementById('episodeList').innerHTML='<div class="error">作品を表示できないため、エピソードも読み込めません。</div>';document.getElementById('lightSeedArea').classList.remove('visible');document.getElementById('ownerActions').style.display='none';document.getElementById('readerReportAction').style.display='none'}
function renderNovel(){const created=new Date(novel.created_at).toLocaleDateString('ja-JP');document.getElementById('novelHeader').innerHTML=`<div class="tags"><span class="tag">${esc(novel.genre||'未設定')}</span><span class="tag ai">${esc(aiLabels[novel.ai_usage]||'AI利用区分 未申告')}</span><span id="foundingBadge"></span></div><h1 class="title">${esc(novel.title)}</h1><div class="author">作者：<a href="author.html?id=${encodeURIComponent(novel.user_id)}"><span id="authorName">作者情報を確認中...</span></a></div><div class="description">${esc(novel.description||'')}</div><div class="meta"><span>👁 ${Number(novel.pv||0).toLocaleString()} PV</span><button id="favoriteButton" class="favorite" type="button" disabled>☆ お気に入り</button><span id="favoriteCount">—</span><span>投稿日 ${created}</span></div>`;setupOwner();void loadAuthorMeta();void loadEpisodes();void setupFavorite();void setupSeed();void recordOpen()}
async function load(){void NovelightClient.captureAcquisition(client);void NovelightClient.recordVisit(client);if(!novelId){showError('作品IDが指定されていません。');return}try{const auth=await client.auth.getSession();session=auth.data.session}catch(e){console.error('auth session unavailable',e);session=null}try{const result=await client.from('novels').select('*').eq('id',novelId).single();if(result.error)throw result.error;novel=result.data;if(!novel)throw new Error('novel not found')}catch(e){console.error(e);showError('作品を読み込めませんでした。時間をおいて再度お試しください。');return}const warnings=novel.content_warnings||[],needsGate=novel.content_rating==='mature'||warnings.length>0;if(needsGate){document.getElementById('warningGate').classList.add('visible');document.getElementById('warningList').innerHTML=(warnings.length?warnings:['other']).map(w=>'<li>'+esc(warningLabels[w]||w)+'</li>').join('');document.getElementById('novelHeader').style.display='none';document.getElementById('episodesPanel').style.display='none'}else contentUnlocked=true;renderNovel()}
async function loadAuthorMeta(){const name=document.getElementById('authorName'),badge=document.getElementById('foundingBadge');try{const [p,f]=await Promise.all([client.from('profiles').select('display_name').eq('id',novel.user_id).maybeSingle(),client.from('founding_authors').select('founding_number').eq('author_id',novel.user_id).maybeSingle()]);name.textContent=p.error?'作者情報を取得できません':(p.data?.display_name||'名前未設定');if(f.error)console.error(f.error);else if(f.data)badge.innerHTML=`<span class="tag founding">Founding Author #${String(f.data.founding_number).padStart(3,'0')}</span>`}catch(e){console.error(e);name.textContent='作者情報を取得できません'}}
async function loadEpisodes(){const list=document.getElementById('episodeList');try{const r=await client.from('episodes').select('id,title,episode_number,status').eq('novel_id',novel.id).order('episode_number',{ascending:true});if(r.error)throw r.error;const rows=r.data||[];if(!rows.length){list.innerHTML='<div class="empty">まだエピソードがありません。</div>';return}list.innerHTML=rows.map(e=>`<div class="episode"><div class="episode-number">第${e.episode_number}話${e.status==='draft'?'・下書き':''}</div><a class="episode-title" href="episode.html?id=${encodeURIComponent(e.id)}">${esc(e.title)}</a></div>`).join('')}catch(e){console.error(e);list.innerHTML='<div class="error">エピソードを読み込めませんでした。時間をおいて再度お試しください。</div>'}}
function setupOwner(){const owner=session&&novel.user_id===session.user.id;document.getElementById('ownerActions').style.display=owner?'flex':'none';document.getElementById('readerReportAction').style.display=owner?'none':'block';if(!owner)return;document.getElementById('editNovel').href='novel-edit.html?id='+encodeURIComponent(novel.id);document.getElementById('newEpisode').href='episode-post.html?novel_id='+encodeURIComponent(novel.id);document.getElementById('deleteNovel').onclick=deleteNovel}
async function deleteNovel(){if(!confirm('この作品とエピソードを削除しますか？この操作は元に戻せません。'))return;try{const e1=await client.from('episodes').delete().eq('novel_id',novel.id);if(e1.error)throw e1.error;const e2=await client.from('novels').delete().eq('id',novel.id);if(e2.error)throw e2.error;location.href='my-novels.html'}catch(e){console.error(e);alert('作品を削除できませんでした。時間をおいて再度お試しください。')}}
async function recordOpen(){if(novel.status!=='published')return;try{await Promise.all([client.rpc('record_novel_exposure_conversion',{p_event_type:'detail_open',p_novel_id:String(novel.id),p_episode_id:null,p_visitor_token:visitor()}),NovelightClient.recordJourney(client,'detail_open',novel.id)])}catch(e){console.error('detail telemetry failed',e)}}
async function setupFavorite(){const b=document.getElementById('favoriteButton'),count=document.getElementById('favoriteCount');if(!b)return;let favoriteId=null;async function refresh(){try{const total=await client.from('favorites').select('*',{count:'exact',head:true}).eq('novel_id',novel.id);if(total.error)throw total.error;count.textContent=total.count??0;favoriteId=null;if(!session){b.textContent='☆ お気に入り';return}const r=await client.from('favorites').select('id').eq('novel_id',novel.id).eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(r.data){favoriteId=r.data.id;b.textContent='★ お気に入り済み'}else b.textContent='☆ お気に入り'}catch(e){console.error(e);count.textContent='—';b.textContent='お気に入りを確認できません';throw e}}b.onclick=async()=>{if(!session){location.href='login.html?redirect='+encodeURIComponent('novel.html?id='+novel.id);return}b.disabled=true;try{const adding=!favoriteId,r=adding?await client.from('favorites').insert({user_id:session.user.id,novel_id:novel.id}):await client.from('favorites').delete().eq('id',favoriteId);if(r.error)throw r.error;if(adding){void Promise.resolve(client.rpc('record_novel_exposure_conversion',{p_event_type:'favorite_added',p_novel_id:String(novel.id),p_episode_id:null,p_visitor_token:visitor()})).then(({error})=>{if(error)console.error('favorite exposure telemetry failed',error)}).catch(e=>console.error('favorite exposure telemetry failed',e));void NovelightClient.recordJourney(client,'favorite_added',novel.id)}await refresh()}catch(e){console.error(e);alert('お気に入りを更新できませんでした。時間をおいて再度お試しください。')}finally{b.disabled=false}};try{await refresh();b.disabled=false}catch(e){b.disabled=true}}
function renderSeed(s){const area=document.getElementById('lightSeedArea'),b=document.getElementById('seedButton'),m=document.getElementById('seedMessage');area.classList.add('visible');document.getElementById('seedRemaining').textContent=s.monthly_limit?`今月あと ${s.remaining_this_month}/${s.monthly_limit}`:'';document.getElementById('seedTotal').textContent=`この作品のLIGHT SEED ${s.total_seed_count??0}`;b.disabled=false;b.textContent='🌱 LIGHT SEEDを贈る';const map={eligible:'まだ知られていないこの作品をSCOUTとして発掘・応援できます。',login_required:'LIGHT SEEDを贈るにはログインが必要です。',own_novel:'自分の作品には贈れません。',already_seeded:'この作品にはすでに贈っています。',monthly_limit_reached:'今月のLIGHT SEEDを使い切りました。',no_longer_unknown:'この作品は現在LIGHT SEED対象外です。'};m.textContent=map[s.reason]||'現在利用できません。';if(s.reason!=='eligible'&&s.reason!=='login_required')b.disabled=true}
async function setupSeed(){if(novel.status!=='published')return;const area=document.getElementById('lightSeedArea'),m=document.getElementById('seedMessage');try{const r=await client.rpc('light_seed_status',{p_novel_id:String(novel.id)});if(r.error)throw r.error;renderSeed(r.data)}catch(e){console.error(e);area.classList.add('visible');m.textContent='LIGHT SEEDの状態を確認できませんでした。時間をおいて再度お試しください。';document.getElementById('seedButton').disabled=true;return}document.getElementById('seedButton').onclick=async()=>{if(!session){location.href='login.html?redirect='+encodeURIComponent('novel.html?id='+novel.id);return}if(!confirm('この作品にLIGHT SEEDを贈りますか？'))return;const b=document.getElementById('seedButton');b.disabled=true;try{const p=await client.rpc('plant_light_seed',{p_novel_id:String(novel.id)});if(p.error)throw p.error;void NovelightClient.recordJourney(client,'light_seed',novel.id);const again=await client.rpc('light_seed_status',{p_novel_id:String(novel.id)});if(again.error)throw again.error;renderSeed(again.data)}catch(e){console.error(e);alert('LIGHT SEEDを贈れませんでした。時間をおいて再度お試しください。');b.disabled=false}}}
document.getElementById('continueButton').onclick=()=>{contentUnlocked=true;document.getElementById('warningGate').classList.remove('visible');document.getElementById('novelHeader').style.display='block';document.getElementById('episodesPanel').style.display='block'};
const modal=document.getElementById('reportModal');function openReport(){if(!novel)return;modal.classList.add('visible')}document.getElementById('reportOpen').onclick=openReport;document.getElementById('readerReportOpen').onclick=openReport;document.getElementById('reportCancel').onclick=()=>modal.classList.remove('visible');document.getElementById('reportSend').onclick=async()=>{const category=document.getElementById('reportCategory').value,details=document.getElementById('reportDetails').value.trim(),s=document.getElementById('reportStatus'),b=document.getElementById('reportSend');if(!novel){s.textContent='作品情報を読み込んでからお試しください。';return}if(!category||details.length<5){s.textContent='理由と具体的な内容を入力してください。';return}b.disabled=true;s.textContent='送信中...';try{const r=await client.rpc('submit_content_report',{p_novel_id:String(novel.id),p_episode_id:null,p_category:category,p_details:details,p_visitor_token:visitor(),p_website:document.getElementById('reportWebsite').value});if(r.error)throw r.error;s.textContent='通報を受け付けました。運営が確認します。';setTimeout(()=>modal.classList.remove('visible'),700)}catch(e){console.error(e);s.textContent='通報を送信できませんでした。時間をおいてお試しください。'}finally{b.disabled=false}};
load();
</script></body></html>

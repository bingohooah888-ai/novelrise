<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>作品詳細 | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      height: 72px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #6d4aff;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 50px 24px;
    }

    .novel-header {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 25px;
    }

    .genre {
      display: inline-block;

      background: #f0edff;
      color: #6d4aff;

      padding: 5px 10px;
      border-radius: 6px;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 14px;
    }

    .title {
      font-size: 32px;
      margin-bottom: 14px;
    }

    .description {
      color: #666;
      line-height: 1.9;
      margin-bottom: 20px;
    }

    .meta {
      display: flex;
      gap: 20px;
      color: #888;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .episodes {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
    }

    .episodes h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 35px 15px;
    }

    .new-episode-button {
      display: inline-block;

      margin-top: 20px;

      background: #6d4aff;
      color: white;

      padding: 11px 18px;
      border-radius: 8px;

      font-weight: 800;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 16px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      NovelRise
    </a>

    <a href="my-novels.html" class="back">
      ← 自分の作品へ戻る
    </a>

  </div>
</header>


<main>

  <section
    id="novelHeader"
    class="novel-header"
  >
    読み込み中...
  </section>


  <section class="episodes">

    <h2>
      エピソード
    </h2>

    <div id="episodeList">

      <div class="empty">
        まだエピソードがありません。
      </div>

    </div>

<a
  id="editNovelButton"
  href="#"
  class="new-episode-button"
  style="display:none; margin-right:10px;"
>
  作品を編集
</a>
    <button
  id="deleteNovelButton"
  type="button"
  style="
    display:none;
    margin-right:10px;
    padding:11px 18px;
    background:white;
    color:#d92d20;
    border:1px solid #d92d20;
    border-radius:8px;
    font-weight:800;
    cursor:pointer;
  "
>
  作品を削除
</button>
    <a
      id="newEpisodeButton"
      href="episode-post.html"
      class="new-episode-button"
    >
      ＋ 第1話を追加
    </a>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function escapeHtml(value) {

    const div =
      document.createElement('div');

    div.textContent =
      value ?? '';

    return div.innerHTML;
  }


  async function loadNovel() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const novelId =
      params.get('id');


    if (!novelId) {

      document.getElementById(
        'novelHeader'
      ).innerHTML =
        '<div class="error">' +
        '作品IDが指定されていません。' +
        '</div>';

      return;
    }


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();





    const {
      data,
      error
    } =
      await supabaseClient
        .from('novels')
        .select('*')
        .eq(
          'id',
          novelId
        )
        .single();


    if (error || !data) {

      console.error(error);

      document.getElementById(
        'novelHeader'
      ).innerHTML =
        '<div class="error">' +
        '作品を読み込めませんでした。' +
        '</div>';

      return;
    }





    const createdAt =
      new Date(
        data.created_at
      ).toLocaleDateString(
        'ja-JP'
      );


    document.getElementById(
      'novelHeader'
    ).innerHTML = `
      <div class="genre">
        ${escapeHtml(data.genre)}
      </div>

      <h1 class="title">
        ${escapeHtml(data.title)}
      </h1>

      <div class="description">
        ${escapeHtml(data.description)}
      </div>

      <div class="meta">

        <span>
          👁 ${data.pv ?? 0} PV
        </span>

<button
  id="favoriteButton"
  type="button"
>
  ☆ お気に入り
</button>

<span id="favoriteCount">
  ${data.favorites ?? 0}
</span>

        <span>
          投稿日 ${createdAt}
        </span>

        <span>
          ${
            data.status ===
            'published'
              ? '公開中'
              : '下書き'
          }
        </span>

      </div>
    `;

const {
  data: episodes,
  error: episodesError
} =
  await supabaseClient
    .from('episodes')
    .select('*')
    .eq(
      'novel_id',
      data.id
    )
    .order(
      'episode_number',
      {
        ascending: true
      }
    );


const episodeList =
  document.getElementById(
    'episodeList'
  );


if (episodesError) {

  console.error(
    episodesError
  );

  episodeList.innerHTML =
    '<div class="empty">' +
    'エピソードを読み込めませんでした。' +
    '</div>';

} else if (
  !episodes ||
  episodes.length === 0
) {

  episodeList.innerHTML =
    '<div class="empty">' +
    'まだエピソードがありません。' +
    '</div>';

} else {

  episodeList.innerHTML = '';


  episodes.forEach(
    (episode) => {

      const episodeItem =
        document.createElement(
          'div'
        );


      episodeItem.style.padding =
        '18px 0';

      episodeItem.style.borderBottom =
        '1px solid #e5e7eb';


      episodeItem.innerHTML = `
        <div
          style="
            font-size:13px;
            color:#888;
            margin-bottom:6px;
          "
        >
          第${episode.episode_number}話
        </div>

<a
  href="episode.html?id=${episode.id}"
  style="
    display:block;
    font-size:18px;
    font-weight:800;
  "
>
  ${escapeHtml(episode.title)}
</a>
      `;


      episodeList.appendChild(
        episodeItem
      );

    }
  );

}
const editNovelButton =
  document.getElementById(
    'editNovelButton'
  );

if (
  session &&
  data.user_id === session.user.id
) {

  editNovelButton.style.display =
    'inline-block';

  editNovelButton.href =
    'novel-edit.html?id=' +
    data.id;
const deleteNovelButton =
  document.getElementById(
    'deleteNovelButton'
  );

deleteNovelButton.style.display =
  'inline-block';


deleteNovelButton.addEventListener(
  'click',
  async () => {

    const confirmed =
      confirm(
        'この作品を本当に削除しますか？\n' +
        '作品内のエピソードも削除する必要があります。\n' +
        'この操作は元に戻せません。'
      );

    if (!confirmed) {
      return;
    }


    deleteNovelButton.disabled =
      true;

    deleteNovelButton.textContent =
      '削除中...';


    const {
      error: episodeDeleteError
    } =
      await supabaseClient
        .from('episodes')
        .delete()
        .eq(
          'novel_id',
          data.id
        );


    if (episodeDeleteError) {

      console.error(
        episodeDeleteError
      );

      alert(
        'エピソードの削除に失敗しました。\n' +
        episodeDeleteError.message
      );

      deleteNovelButton.disabled =
        false;

      deleteNovelButton.textContent =
        '作品を削除';

      return;
    }


    const {
      error: novelDeleteError
    } =
      await supabaseClient
        .from('novels')
        .delete()
        .eq(
          'id',
          data.id
        );


    if (novelDeleteError) {

      console.error(
        novelDeleteError
      );

      alert(
        '作品の削除に失敗しました。\n' +
        novelDeleteError.message
      );

      deleteNovelButton.disabled =
        false;

      deleteNovelButton.textContent =
        '作品を削除';

      return;
    }


    alert(
      '作品を削除しました。'
    );


    window.location.href =
      'my-novels.html';

  }
);
}  

const newEpisodeButton =
  document.getElementById(
    'newEpisodeButton'
  );
if (
  !session ||
  data.user_id !== session.user.id
) {
  newEpisodeButton.style.display = 'none';
} else {
  newEpisodeButton.style.display = 'inline-block';
}
newEpisodeButton.href =
  'episode-post.html?novel_id=' +
  data.id;


let nextEpisodeNumber = 1;

if (
  episodes &&
  episodes.length > 0
) {

  const maxEpisodeNumber =
    Math.max(
      ...episodes.map(
        episode =>
          episode.episode_number
      )
    );

  nextEpisodeNumber =
    maxEpisodeNumber + 1;

}

newEpisodeButton.textContent =
  '＋ 第' +
  nextEpisodeNumber +
  '話を追加';

  }

async function setupFavorite() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const novelId =
    params.get('id');


  const favoriteButton =
    document.getElementById(
      'favoriteButton'
    );

  const favoriteCount =
    document.getElementById(
      'favoriteCount'
    );


  if (
    !favoriteButton ||
    !favoriteCount ||
    !novelId
  ) {
    return;
  }


  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  let favoriteId = null;


  async function refreshFavorite() {

    const {
      count,
      error: countError
    } =
      await supabaseClient
        .from('favorites')
        .select(
          '*',
          {
            count: 'exact',
            head: true
          }
        )
        .eq(
          'novel_id',
          novelId
        );


    if (!countError) {

      favoriteCount.textContent =
        count ?? 0;

    }


    favoriteId = null;


    if (!session) {

      favoriteButton.textContent =
        '☆ お気に入り';

      return;
    }


    const {
      data: favorite,
      error
    } =
      await supabaseClient
        .from('favorites')
        .select('id')
        .eq(
          'novel_id',
          novelId
        )
        .eq(
          'user_id',
          session.user.id
        )
        .maybeSingle();


    if (error) {

      console.error(error);

      return;
    }


    if (favorite) {

      favoriteId =
        favorite.id;

      favoriteButton.textContent =
        '★ お気に入り済み';

    } else {

      favoriteButton.textContent =
        '☆ お気に入り';

    }

  }


  favoriteButton.addEventListener(
    'click',
    async () => {

      if (!session) {

        alert(
          'お気に入りするにはログインが必要です。'
        );

        window.location.href =
          'login.html';

        return;
      }


      favoriteButton.disabled =
        true;


      if (favoriteId) {

        const {
          error
        } =
          await supabaseClient
            .from('favorites')
            .delete()
            .eq(
              'id',
              favoriteId
            );


        if (error) {

          console.error(error);

          alert(
            'お気に入り解除に失敗しました。'
          );

          favoriteButton.disabled =
            false;

          return;
        }

      } else {

        const {
          error
        } =
          await supabaseClient
            .from('favorites')
            .insert({
              user_id:
                session.user.id,

              novel_id:
                Number(novelId)
            });


        if (error) {

          console.error(error);

          alert(
            'お気に入り登録に失敗しました。\n' +
            error.message
          );

          favoriteButton.disabled =
            false;

          return;
        }

      }


      await refreshFavorite();


      favoriteButton.disabled =
        false;

    }
  );


  await refreshFavorite();

}
  (async () => {

  await loadNovel();

  await setupFavorite();

})();

</script>

</body>
</html>

<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="novelight-client.js"></script>
<script>
  const SUPPORT_SUPABASE_URL = 'https://fiepaguycecrredwrcwx.supabase.co';
  const SUPPORT_SUPABASE_KEY = 'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';
  const announcementAuthClient = supabase.createClient(
    SUPPORT_SUPABASE_URL,
    SUPPORT_SUPABASE_KEY
  );
  void NovelightClient.syncAuthHeader(announcementAuthClient);

  function renderAnnouncements(rows) {
    const container = document.getElementById('announcementList');
    container.replaceChildren();

    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'announcement-state';
      empty.textContent = '現在公開中のお知らせはありません。';
      container.appendChild(empty);
      return;
    }

    rows.forEach((row) => {
      const article = document.createElement('article');
      article.className = 'announcement-item';

      const meta = document.createElement('div');
      meta.className = 'announcement-meta';

      const date = document.createElement('time');
      date.className = 'announcement-date';
      if (row.published_at) {
        const publishedAt = new Date(row.published_at);
        date.dateTime = publishedAt.toISOString();
        date.textContent = publishedAt.toLocaleDateString('ja-JP', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });
      }

      const category = document.createElement('span');
      category.className = 'announcement-category';
      category.textContent = row.category || '';

      const title = document.createElement('h3');
      title.className = 'announcement-title';

      const link = document.createElement('a');
      link.href = `news-detail.html?id=${encodeURIComponent(row.id)}`;
      link.textContent = row.title || 'お知らせ';
      title.appendChild(link);

      meta.append(date, category);
      article.append(meta, title);
      container.appendChild(article);
    });
  }

  async function loadAnnouncements() {
    try {
      const response = await fetch('/api/announcements', {
        method: 'GET',
        headers: { Accept: 'application/json' },
        cache: 'no-store',
        credentials: 'same-origin'
      });
      if (!response.ok) throw new Error(`announcements ${response.status}`);
      const data = await response.json();
      renderAnnouncements(data.announcements || []);
    } catch (error) {
      console.error('announcements load failed', error);
      const container = document.getElementById('announcementList');
      container.replaceChildren();
      const state = document.createElement('div');
      state.className = 'announcement-state';
      state.textContent =
        'お知らせを読み込めませんでした。時間をおいて再度お試しください。';
      container.appendChild(state);
    }
  }

  void loadAnnouncements();
</script>
</body>
</html>

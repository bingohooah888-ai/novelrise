<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ランキング | NOVELIGHT</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1000px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:900px;margin:auto;padding:42px 22px 76px}h1{font-size:31px}.lead{color:#6b7280;margin:7px 0 22px}.note{padding:10px 13px;border-radius:9px;background:#f0edff;color:#5c45be;font-size:12px;font-weight:800;margin-bottom:17px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{padding:9px 15px;border:1px solid #d8d8df;border-radius:8px;background:#fff;font-weight:800;cursor:pointer}.tab.active{background:#6d4aff;color:#fff;border-color:#6d4aff}.list{display:grid;gap:13px}.card{display:grid;grid-template-columns:58px 1fr;gap:15px;padding:20px;background:#fff;border:1px solid #e5e7eb;border-radius:14px}.rank{display:flex;align-items:center;justify-content:center;color:#6d4aff;font-size:20px;font-weight:900}.genre{display:inline-block;padding:4px 8px;border-radius:6px;background:#f0edff;color:#6d4aff;font-size:11px;font-weight:900}.title{font-size:19px;font-weight:900;margin:7px 0}.desc{color:#666;font-size:13px;line-height:1.6}.meta{color:#888;font-size:12px;margin-top:8px}.empty{padding:38px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:14px;color:#6b7280}footer{padding:26px;background:#111118;color:#999}.footer-links{max-width:900px;margin:auto;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:12px}@media(max-width:600px){main{padding:28px 16px 60px}.card{grid-template-columns:46px 1fr}.tabs{display:grid;grid-template-columns:repeat(2,1fr)}}</style><link rel="stylesheet" href="novelight-discovery-list.css"></head><body class="novelight-page-ranking"><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a class="back" href="index.html">← トップへ戻る</a></div></header><main><h1>作品ランキング</h1><p class="lead">読者から注目されている作品を紹介します。</p><div class="note">ランキングはPV・お気に入り等の読者行動で決まり、契約プランの露出重みをランキング点へ加算しません。</div><div class="tabs"><button class="tab active" data-type="total">総合</button><button class="tab" data-type="pv">PV</button><button class="tab" data-type="favorites">お気に入り</button><button class="tab" data-type="new">新着</button></div><div id="list" class="list">読み込み中...</div></main><footer><div class="footer-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');let type='total',requestId=0;function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function render(rows){const list=document.getElementById('list');list.innerHTML=rows.length?rows.map((n,i)=>`<a class="card" href="novel.html?id=${encodeURIComponent(n.novel_id)}"><div class="rank">${i+1}位</div><div><span class="genre">${esc(n.genre||'未設定')}</span><div class="title">${esc(n.title)}</div><div class="desc">${esc(n.description||'')}</div><div class="meta">👁 ${Number(n.pv||0).toLocaleString()} PV ・ ★ ${Number(n.favorite_count||0).toLocaleString()}</div></div></a>`).join(''):'<div class="empty">まだランキング対象の作品がありません。</div>'}async function load(){const current=++requestId,list=document.getElementById('list');list.innerHTML='<div class="empty">ランキングを読み込み中...</div>';try{const r=await client.rpc('novelight_ranking_feed',{p_sort:type,p_limit:100});if(current!==requestId)return;if(r.error)throw r.error;render(r.data||[])}catch(e){if(current!==requestId)return;console.error(e);list.innerHTML='<div class="empty">ランキングを正しく計算できませんでした。時間をおいて再度お試しください。</div>'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));void load()});(async()=>{void NovelightClient.captureAcquisition(client);void NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);await load()})();</script></body></html>

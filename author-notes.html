<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>近況ノート管理 | NOVELIGHT</title>
  <link rel="stylesheet" href="novelight-author-studio-shell.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07121e;color:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,textarea,select{font:inherit}.workspace{max-width:1100px}.page-head{margin-bottom:22px}.kicker{color:#d7b65b;font-size:11px;font-weight:900;letter-spacing:.16em}.page-head h1{margin:7px 0 8px;font-family:Georgia,"Yu Mincho",serif;font-size:32px}.page-head p{margin:0;color:#aab8c4;line-height:1.8}.notes-layout{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:20px;align-items:start}.panel{border:1px solid rgba(216,180,90,.25);border-radius:18px;background:rgba(13,29,43,.92);box-shadow:0 18px 50px rgba(0,0,0,.17)}.editor{padding:22px;position:sticky;top:22px}.editor h2,.list-head h2{margin:0;font-size:19px}.field{display:grid;gap:7px;margin-top:17px}.field label{color:#d9cda9;font-size:12px;font-weight:900}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(213,224,232,.24);border-radius:10px;background:#091824;color:#f5f7f8;padding:11px 12px}.field textarea{min-height:160px;resize:vertical;line-height:1.7}.count{color:#8797a5;text-align:right;font-size:11px}.actions{display:flex;gap:10px;margin-top:18px}.btn{min-height:42px;border:1px solid rgba(216,180,90,.38);border-radius:10px;background:transparent;color:#e9d697;padding:9px 14px;font-weight:900;cursor:pointer}.btn.primary{background:#d5af4e;color:#15212b;border-color:#d5af4e}.btn.danger{color:#e9b4aa;border-color:rgba(224,129,110,.4)}.btn:disabled{opacity:.48;cursor:not-allowed}.status{min-height:24px;margin-top:13px;color:#aebbc5;font-size:12px;line-height:1.7}.status.error{color:#f0aa9e}.list-panel{padding:22px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.note-list{display:grid;gap:12px}.note{padding:18px;border:1px solid rgba(213,224,232,.14);border-radius:13px;background:rgba(6,19,30,.64)}.note.archived{opacity:.66}.note-top{display:flex;justify-content:space-between;gap:12px}.note h3{margin:0;font-size:17px}.tag{flex:none;border-radius:999px;background:rgba(216,180,90,.14);color:#e8d08c;padding:4px 8px;font-size:10px;font-weight:900}.note.archived .tag{background:rgba(174,187,197,.13);color:#b7c2ca}.note-body{margin:10px 0;color:#c9d2d9;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:13px}.note-meta{color:#8293a0;font-size:11px}.note-link{margin-top:7px;color:#d9c580;font-size:12px}.note-actions{display:flex;gap:8px;margin-top:13px}.empty{padding:32px 16px;text-align:center;color:#93a3af}.notice{margin-bottom:18px;padding:13px 15px;border:1px solid rgba(216,180,90,.27);border-radius:12px;background:rgba(91,70,26,.19);color:#d9cda9;font-size:12px;line-height:1.7}@media(max-width:820px){.notes-layout{grid-template-columns:1fr}.editor{position:static}}@media(max-width:520px){.page-head h1{font-size:27px}.editor,.list-panel{padding:18px}.actions,.note-actions{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="workspace">
    <header class="page-head">
      <div class="kicker">AUTHOR PROFILE NOTE</div>
      <h1>近況ノート</h1>
      <p>読者プロフィールへ載せる短いお知らせを管理します。交流タイムラインや通知ではなく、作者プロフィールの小さな補足欄です。</p>
    </header>
    <div id="pendingNotice" class="notice" hidden>近況ノートはデータベース反映待ちです。反映後に作成・編集できます。</div>
    <div class="notes-layout">
      <form id="noteForm" class="panel editor">
        <h2 id="formTitle">新しいノート</h2>
        <input id="noteId" type="hidden">
        <div class="field"><label for="title">短いタイトル</label><input id="title" maxlength="80" required><div id="titleCount" class="count">0 / 80</div></div>
        <div class="field"><label for="body">本文</label><textarea id="body" maxlength="1000" required></textarea><div id="bodyCount" class="count">0 / 1000</div></div>
        <div class="field"><label for="novel">公開作品へのリンク（任意）</label><select id="novel"><option value="">リンクしない</option></select></div>
        <div class="actions"><button id="save" class="btn primary" type="submit" disabled>公開する</button><button id="cancel" class="btn" type="button" hidden>編集をやめる</button></div>
        <div id="status" class="status" aria-live="polite">ログイン状態を確認しています...</div>
      </form>
      <section class="panel list-panel" aria-labelledby="listTitle">
        <div class="list-head"><h2 id="listTitle">投稿済みノート</h2><span id="summary" class="note-meta">読み込み中...</span></div>
        <div id="noteList" class="note-list"><div class="empty">読み込み中...</div></div>
      </section>
    </div>
  </main>
  <script src="/assets/vendor/supabase-js-2.112.3.js"></script>
  <script src="novelight-client.js"></script>
  <script src="novelight-author-studio-shell.js"></script>
  <script>
  const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
  const form=document.getElementById('noteForm'),list=document.getElementById('noteList'),statusEl=document.getElementById('status'),save=document.getElementById('save');let notes=[],ready=false,busy=false;
  function unavailable(error){const message=String(error?.message||'');return ['42883','PGRST202'].includes(String(error?.code||''))||message.includes('novelight_manage_my_author_notes')||message.includes('novelight_save_my_author_note')||message.includes('does not exist')||message.includes('Could not find the function')}
  function setStatus(message,error=false){statusEl.textContent=message;statusEl.classList.toggle('error',error)}
  function formatDate(value){const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('ja-JP'):'日時不明'}
  function updateCounts(){document.getElementById('titleCount').textContent=`${document.getElementById('title').value.length} / 80`;document.getElementById('bodyCount').textContent=`${document.getElementById('body').value.length} / 1000`}
  function resetForm(){form.reset();document.getElementById('noteId').value='';document.getElementById('formTitle').textContent='新しいノート';save.textContent='公開する';document.getElementById('cancel').hidden=true;updateCounts()}
  function editNote(note){document.getElementById('noteId').value=note.id;document.getElementById('title').value=note.title;document.getElementById('body').value=note.body;document.getElementById('novel').value=note.linked_novel_id==null?'':String(note.linked_novel_id);document.getElementById('formTitle').textContent='ノートを編集';save.textContent='変更を保存';document.getElementById('cancel').hidden=false;updateCounts();window.scrollTo({top:0,behavior:'smooth'})}
  function render(){list.replaceChildren();const published=notes.filter(note=>note.status==='published').length;document.getElementById('summary').textContent=`公開中 ${published}件 / アーカイブ ${notes.length-published}件`;if(!notes.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='近況ノートはまだありません。';list.appendChild(empty);return}notes.forEach(note=>{const card=document.createElement('article');card.className='note'+(note.status==='archived'?' archived':'');const top=document.createElement('div');top.className='note-top';const title=document.createElement('h3');title.textContent=note.title;const tag=document.createElement('span');tag.className='tag';tag.textContent=note.status==='archived'?'アーカイブ':'公開中';top.append(title,tag);const body=document.createElement('div');body.className='note-body';body.textContent=note.body;const meta=document.createElement('div');meta.className='note-meta';meta.textContent=`更新 ${formatDate(note.updated_at)}`;card.append(top,body,meta);if(note.linked_novel_title){const link=document.createElement('div');link.className='note-link';link.textContent=`作品リンク：${note.linked_novel_title}`;card.appendChild(link)}if(note.status==='published'){const actions=document.createElement('div');actions.className='note-actions';const edit=document.createElement('button');edit.type='button';edit.className='btn';edit.textContent='編集';edit.onclick=()=>editNote(note);const archive=document.createElement('button');archive.type='button';archive.className='btn danger';archive.textContent='アーカイブ';archive.onclick=()=>archiveNote(note.id);actions.append(edit,archive);card.appendChild(actions)}list.appendChild(card)})}
  async function loadNotes(){const result=await client.rpc('novelight_manage_my_author_notes',{p_limit:100});if(result.error)throw result.error;notes=Array.isArray(result.data)?result.data:[];render()}
  async function archiveNote(id){if(busy||!ready||!confirm('このノートを公開プロフィールから外してアーカイブしますか？'))return;busy=true;save.disabled=true;setStatus('アーカイブしています...');try{const result=await client.rpc('novelight_archive_my_author_note',{p_note_id:Number(id)});if(result.error)throw result.error;resetForm();await loadNotes();setStatus('アーカイブしました。')}catch(error){console.error(error);setStatus(unavailable(error)?'近況ノートはデータベース反映待ちです。':'アーカイブできませんでした。時間をおいて再度お試しください。',true)}finally{busy=false;save.disabled=!ready}}
  form.addEventListener('submit',async event=>{event.preventDefault();if(!ready||busy)return;const title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim(),novelValue=document.getElementById('novel').value;if(!title||!body){setStatus('タイトルと本文を入力してください。',true);return}busy=true;save.disabled=true;setStatus('保存しています...');try{const result=await client.rpc('novelight_save_my_author_note',{p_note_id:document.getElementById('noteId').value?Number(document.getElementById('noteId').value):null,p_title:title,p_body:body,p_linked_novel_id:novelValue?Number(novelValue):null});if(result.error)throw result.error;resetForm();await loadNotes();setStatus('近況ノートを公開しました。')}catch(error){console.error(error);setStatus(unavailable(error)?'近況ノートはデータベース反映待ちです。':'保存できませんでした。入力内容を確認してください。',true)}finally{busy=false;save.disabled=!ready}});
  document.getElementById('cancel').onclick=()=>{resetForm();setStatus('編集を取り消しました。')};document.getElementById('title').addEventListener('input',updateCounts);document.getElementById('body').addEventListener('input',updateCounts);
  (async()=>{void NovelightClient.recordVisit(client);try{const auth=await client.auth.getSession(),session=auth.data.session;if(!session){location.href='login.html?redirect=author-notes.html';return}void NovelightClient.claimAcquisition(client);const novelsResult=await client.from('novels').select('id,title').eq('user_id',session.user.id).eq('status','published').order('created_at',{ascending:false});if(novelsResult.error)throw novelsResult.error;const select=document.getElementById('novel');(novelsResult.data||[]).forEach(novel=>{const option=document.createElement('option');option.value=novel.id;option.textContent=novel.title;select.appendChild(option)});await loadNotes();ready=true;save.disabled=false;setStatus('')}catch(error){console.error(error);ready=false;save.disabled=true;if(unavailable(error)){document.getElementById('pendingNotice').hidden=false;list.innerHTML='<div class="empty">近況ノートはデータベース反映後に表示されます。</div>';setStatus('近況ノートはデータベース反映待ちです。',true)}else{list.innerHTML='<div class="empty">近況ノートを読み込めませんでした。</div>';setStatus('読み込めませんでした。時間をおいて再度お試しください。',true)}}})();
  </script>
</body>
</html>

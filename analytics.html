<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>アクセス解析 | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1050px;
      height: 72px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #6d4aff;
      font-size: 25px;
      font-weight: 800;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 50px 24px 80px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
    }

    .summary-number {
      color: #6d4aff;
      font-size: 30px;
      font-weight: 900;
    }

    .summary-label {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .novel-list {
      display: grid;
      gap: 18px;
    }

    .novel-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px;
    }

    .genre {
      display: inline-block;

      background: #eeeaff;
      color: #6d4aff;

      border-radius: 6px;

      padding: 5px 9px;
      margin-bottom: 10px;

      font-size: 12px;
      font-weight: 700;
    }

    .title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .stat {
      background: #f8f7ff;
      border-radius: 10px;
      padding: 16px;
    }

    .stat-number {
      color: #6d4aff;
      font-size: 22px;
      font-weight: 900;
    }

    .stat-label {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .empty {
      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 14px;

      padding: 50px 20px;

      text-align: center;
      color: #777;
    }

    @media (max-width: 700px) {

      .summary-grid,
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      NovelRise
    </a>

    <a
      href="mypage.html"
      class="back"
    >
      ← マイページへ戻る
    </a>

  </div>
</header>


<main>

  <h1>
    アクセス解析
  </h1>

  <p class="subtitle">
    あなたの作品がどれくらい読まれているか確認できます。
  </p>


  <div class="summary-grid">

    <div class="summary-card">
      <div
        id="totalNovels"
        class="summary-number"
      >
        0
      </div>

      <div class="summary-label">
        投稿作品
      </div>
    </div>


    <div class="summary-card">
      <div
        id="totalPv"
        class="summary-number"
      >
        0
      </div>

      <div class="summary-label">
        総PV
      </div>
    </div>


    <div class="summary-card">
      <div
        id="totalFavorites"
        class="summary-number"
      >
        0
      </div>

      <div class="summary-label">
        総お気に入り
      </div>
    </div>

  </div>


  <div
    id="novelList"
    class="novel-list"
  >
    読み込み中...
  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function escapeHtml(value) {

    const div =
      document.createElement('div');

    div.textContent =
      value ?? '';

    return div.innerHTML;
  }


  async function loadAnalytics() {

    const novelList =
      document.getElementById(
        'novelList'
      );


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        'login.html';

      return;
    }


    const {
      data: novels,
      error
    } =
      await supabaseClient
        .from('novels')
        .select('*')
        .eq(
          'user_id',
          session.user.id
        )
        .order(
          'created_at',
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      novelList.innerHTML =
        '<div class="empty">' +
        'アクセス解析を読み込めませんでした。' +
        '</div>';

      return;
    }


    if (
      !novels ||
      novels.length === 0
    ) {

      novelList.innerHTML =
        '<div class="empty">' +
        'まだ投稿作品がありません。' +
        '</div>';

      return;
    }

novelList.innerHTML = '';
    let totalPv = 0;
    let totalFavorites = 0;


    for (const novel of novels) {

      totalPv +=
        novel.pv ?? 0;


      const {
        count: favoriteCount,
        error: favoriteError
      } =
        await supabaseClient
          .from('favorites')
          .select(
            '*',
            {
              count: 'exact',
              head: true
            }
          )
          .eq(
            'novel_id',
            novel.id
          );


      if (favoriteError) {
        console.error(
          favoriteError
        );
      }


const {
  data: episodeRows,
  error: episodeError
} =
  await supabaseClient
    .from('episodes')
    .select(
      'id, title, pv, created_at'
    )
    .eq(
      'novel_id',
      novel.id
    )
    .order(
      'created_at',
      {
        ascending: true
      }
    );

      if (episodeError) {
        console.error(
          episodeError
        );
      }


      const favorites =
        favoriteCount ?? 0;

      const episodes =
  episodeRows ?? [];

const episodeCount =
  episodes.length;


      totalFavorites +=
        favorites;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'novel-card';

const episodeHtml =
  episodes.length > 0
    ? episodes.map(
        (episode, index) => `
          <div
            style="
              display:flex;
              justify-content:space-between;
              padding:10px 0;
              border-bottom:1px solid #eee;
            "
          >
            <span>
              第${index + 1}話
              ${escapeHtml(episode.title)}
            </span>

            <span>
              👁 ${episode.pv ?? 0} PV
            </span>
          </div>
        `
      ).join('')
    : '<div style="color:#888;">エピソードはありません。</div>';

      card.innerHTML = `

        <div class="genre">
          ${escapeHtml(
            novel.genre
          )}
        </div>

        <div class="title">
          ${escapeHtml(
            novel.title
          )}
        </div>

        <div class="stats">

          <div class="stat">
            <div class="stat-number">
              ${novel.pv ?? 0}
            </div>

            <div class="stat-label">
              PV
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${favorites}
            </div>

            <div class="stat-label">
              お気に入り
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
             ${episodeCount}
            </div>

            <div class="stat-label">
              エピソード数
            </div>
          </div>

        </div>
<div style="margin-top:22px;">
  <div
    style="
      font-weight:700;
      margin-bottom:8px;
    "
  >
    エピソード別PV
  </div>

  ${episodeHtml}
</div>
      `;


      novelList.appendChild(
        card
      );

    }


    document.getElementById(
      'totalNovels'
    ).textContent =
      novels.length;


    document.getElementById(
      'totalPv'
    ).textContent =
      totalPv;


    document.getElementById(
      'totalFavorites'
    ).textContent =
      totalFavorites;

  }


  loadAnalytics();

</script>

</body>
</html>

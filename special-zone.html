color:#aeb7c4}.zone-more-wrap{text-align:center;margin-top:24px}.zone-more{padding:11px 22px;border:1px solid rgba(214,164,71,.45);border-radius:10px;background:transparent;color:#d6a447;font:inherit;font-weight:900;cursor:pointer}.zone-more:disabled{opacity:.5}.zone-back{display:inline-block;margin-bottom:20px;color:#d6a447;font-weight:800}@media(max-width:820px){.zone-head{align-items:flex-start;flex-direction:column}.zone-list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.zone-main{padding:34px 16px 70px}.zone-list{grid-template-columns:1fr}.zone-filter{align-items:stretch;flex-direction:column}.zone-filter select{min-width:0;width:100%}.zone-modes{width:100%}.zone-mode{flex:1}}

<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const params=new URLSearchParams(location.search),allowedZones=new Set(['ai','r15','r18']);
const zone=allowedZones.has(params.get('zone'))?params.get('zone'):'ai';let mode=params.get('mode')==='ranking'?'ranking':'recommended',offset=0,busy=false;const pageSize=24;
const zoneCopy={ai:{title:'AI作品',subtitle:'AI生成主体として公開された全年齢作品。作品本来のジャンルから、次の一冊を探せます。'},r15:{title:'R15',subtitle:'センシティブ15+として区分された作品。内容警告を確認しながら作品を探せます。'},r18:{title:'R18',subtitle:'18+（非性的な強表現）として区分された作品。強い残虐・流血等の内容警告を確認して閲覧してください。'}};
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
function rotationKey(){return NovelightClient.getVisitorToken()+':special:'+zone+':'+Math.floor(Date.now()/3600000)}
function renderMode(){document.getElementById('recommendedMode').setAttribute('aria-pressed',String(mode==='recommended'));document.getElementById('rankingMode').setAttribute('aria-pressed',String(mode==='ranking'));const u=new URL(location.href);u.searchParams.set('zone',zone);u.searchParams.set('mode',mode);history.replaceState(null,'',u)}
function cover(row){const url=String(row.thumbnail_url||'').trim();return url?`<img class="zone-cover" src="${esc(url)}" alt="" loading="lazy" decoding="async">`:`<div class="zone-cover zone-cover-placeholder" aria-hidden="true">NOVELIGHT</div>`}
function card(row){const rating=row.average_rating==null?'—':Number(row.average_rating).toFixed(2);return `<a class="zone-card" href="novel.html?id=${encodeURIComponent(row.novel_id)}">${cover(row)}<div class="zone-copy"><div class="zone-genre">${esc(row.genre||'未設定')}</div><div class="zone-title">${esc(row.title)}</div><div class="zone-author">${esc(row.author_name||'')}</div><div class="zone-meta">★ ${rating} (${Number(row.rating_count||0).toLocaleString()}) ・ お気に入り ${Number(row.favorite_count||0).toLocaleString()}</div></div></a>`}
async function load(reset=true){if(busy)return;busy=true;const list=document.getElementById('zoneList'),button=document.getElementById('moreButton');if(reset){offset=0;list.innerHTML='<div class="zone-empty">作品を読み込んでいます...</div>'}button.disabled=true;try{const result=await client.rpc('novelight_special_zone_feed_v1',{p_zone:zone,p_mode:mode,p_genre:document.getElementById('genreSelect').value||null,p_limit:pageSize,p_offset:offset,p_rotation_key:rotationKey()});if(result.error)throw result.error;let rows=Array.isArray(result.data)?result.data:[];rows=await NovelightUserSafety.filterNovelRows(client,rows);if(reset)list.innerHTML=rows.length?rows.map(card).join(''):'<div class="zone-empty">この条件の公開作品はまだありません。</div>';else if(rows.length)list.insertAdjacentHTML('beforeend',rows.map(card).join(''));offset+=rows.length;button.hidden=rows.length<pageSize}catch(error){console.error(error);if(reset)list.innerHTML='<div class="zone-empty">作品を読み込めませんでした。時間をおいて再度お試しください。</div>';button.hidden=true}finally{busy=false;button.disabled=false}}
function setMode(next){if(mode===next)return;mode=next;renderMode();load(true)}
document.getElementById('zoneTitle').textContent=zoneCopy[zone].title;document.getElementById('zoneSubtitle').textContent=zoneCopy[zone].subtitle;document.title=zoneCopy[zone].title+' | もうひとつの光 | NOVELIGHT';renderMode();
document.getElementById('recommendedMode').addEventListener('click',()=>setMode('recommended'));document.getElementById('rankingMode').addEventListener('click',()=>setMode('ranking'));document.getElementById('genreSelect').addEventListener('change',()=>load(true));document.getElementById('moreButton').addEventListener('click',()=>load(false));load(true);
</script>

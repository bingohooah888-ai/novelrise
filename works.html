<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>作品を探す | NOVELIGHT</title>
  <meta http-equiv="refresh" content="0;url=search.html">
</head>
<body>
  <p>作品検索ページへ移動します。<a id="searchRedirect" href="search.html">移動しない場合はこちら</a></p>
  <script>
    (() => {
      const target = new URL('search.html', location.href);
      target.search = location.search;
      target.hash = location.hash;
      document.getElementById('searchRedirect').href = target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>

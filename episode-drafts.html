9px;border:1px solid #d6d8df;border-radius:8px;background:#fff}.number-toggle{display:flex;align-items:center;gap:8px;min-height:38px;color:#54493d;font-size:12px;font-weight:800}.number-toggle input{width:18px;height:18px;accent-color:#6d4aff}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.action{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border:1px solid #d6d8df;border-radius:8px;background:#fff;font-size:12px;font-weight:900;cursor:pointer}.action.publish{background:#3d2d20;color:#fff;border-color:#3d2d20}.action.reorder{min-width:42px}.action:disabled,.chapter-select:disabled,.number-toggle input:disabled{opacity:.55;cursor:not-allowed}.empty{padding:36px;text-align:center;color:#6b7280}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px}@media(max-width:700px){main{padding:28px 16px 60px}.head{align-items:stretch;flex-direction:column}.head-actions{display:grid;grid-template-columns:1fr 1fr}.nav-action{width:100%}.top{flex-direction:column}.settings{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.action{width:100%}}

<body class="novelight-theme novelight-page-episode-drafts"><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品管理へ</a></div></header>
<main id="main-content" tabindex="-1">
  <div class="head"><div><h1>エピソード下書き</h1><p id="novelTitle">作品情報を読み込み中...</p></div><div class="head-actions"><a id="structureLink" class="nav-action secondary" href="#">章・並び順の詳細</a><a id="scheduleLink" class="nav-action" href="#">予約公開管理</a><a id="importLink" class="nav-action" href="#">＋ 一括移行</a></div></div>
  <div class="notice">通常の執筆中に保存した下書きと、一括移行で取り込んだ下書きをここで管理できます。下書き一覧だけで、章の変更・下書き同士の並び替え・「第○話」表示のオン/オフ・即時公開まで行えます。公開済みエピソードの位置は、ここで下書きを並び替えても動かしません。より大きな構成変更は「章・並び順の詳細」から行えます。</div>
  <div id="list" class="list"><div class="empty">読み込み中...</div></div>
  <div id="status" class="status" aria-live="polite"></div>
</main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const novelId=new URLSearchParams(location.search).get('novel_id'),list=document.getElementById('list'),status=document.getElementById('status');let session=null,novel=null,chapters=[],allEpisodes=[],busy=false,numberVisibilitySupported=true;
function esc(value){const node=document.createElement('div');node.textContent=value??'';return node.innerHTML}
function missingNumberColumn(error){const m=String(error?.message||'');return error?.code==='42703'||error?.code==='PGRST204'||m.includes('show_episode_number')||m.includes('does not exist')}
function drafts(){return allEpisodes.filter(row=>row.status==='draft')}
function chapterOptions(row){return '<option value="">章なし</option>'+chapters.map(chapter=>`<option value="${Number(chapter.id)}" ${Number(row.chapter_id)===Number(chapter.id)?'selected':''}>${esc(chapter.title)}</option>`).join('')}
function render(){const rows=drafts();if(!rows.length){list.innerHTML='<div class="empty">サーバーに保存された下書きはありません。新しいエピソード画面から執筆を始めるか、一括移行を利用できます。</div>';return}list.innerHTML=rows.map((row,index)=>`<article class="card" data-episode-id="${Number(row.id)}"><div class="top"><div><div class="number">${row.show_episode_number===false?'自動話数表示なし':`第${Number(row.episode_number)}話`}</div><div class="title">${esc(row.title||'（タイトル未入力）')}</div><div class="meta">本文 ${String(row.content||'').length.toLocaleString()}文字${row.scheduled_publish_at?` ・ 予約 ${esc(new Date(row.scheduled_publish_at).toLocaleString('ja-JP'))}`:''}</div></div><span class="badge">非公開下書き</span></div><div class="settings"><label class="field"><span>章</span><select class="chapter-select" data-chapter-id="${Number(row.id)}">${chapterOptions(row)}</select></label>${numberVisibilitySupported?`<label class="field"><span>自動話数</span><span class="number-toggle"><input type="checkbox" data-number-id="${Number(row.id)}" ${row.show_episode_number===false?'':'checked'}>このエピソードに「第○話」を表示する</span></label>`:'<div class="field"><span>自動話数</span><span class="meta">データベース反映待ちです。</span></div>'}</div><div class="actions"><button class="action reorder" type="button" data-move-id="${Number(row.id)}" data-direction="up" ${index===0?'disabled':''}>↑ 上へ</button><button class="action reorder" type="button" data-move-id="${Number(row.id)}" data-direction="down" ${index===rows.length-1?'disabled':''}>↓ 下へ</button><a class="action" href="episode-edit.html?id=${encodeURIComponent(row.id)}">編集・プレビュー</a><button class="action publish" type="button" data-publish-id="${Number(row.id)}">今すぐ公開</button></div></article>`).join('');list.querySelectorAll('[data-publish-id]').forEach(button=>button.addEventListener('click',()=>void publishDraft(button.dataset.publishId,button)));list.querySelectorAll('[data-chapter-id]').forEach(select=>select.addEventListener('change',()=>void changeChapter(select.dataset.chapterId,select.value,select)));list.querySelectorAll('[data-number-id]').forEach(input=>input.addEventListener('change',()=>void changeNumberVisibility(input.dataset.numberId,input.checked,input)));list.querySelectorAll('[data-move-id]').forEach(button=>button.addEventListener('click',()=>void moveDraft(button.dataset.moveId,button.dataset.direction,button)))}
async function loadData(){const chapterPromise=client.from('novel_chapters').select('id,title,position').eq('novel_id',novel.id).order('position',{ascending:true});let episodeResult=await client.from('episodes').select('id,episode_number,title,content,status,chapter_id,scheduled_publish_at,show_episode_number').eq('novel_id',novel.id).order('episode_number',{ascending:true});if(episodeResult.error&&missingNumberColumn(episodeResult.error)){numberVisibilitySupported=false;episodeResult=await client.from('episodes').select('id,episode_number,title,content,status,chapter_id,scheduled_publish_at').eq('novel_id',novel.id).order('episode_number',{ascending:true})}if(episodeResult.error)throw episodeResult.error;const chapterResult=await chapterPromise;if(chapterResult.error)throw chapterResult.error;chapters=chapterResult.data||[];allEpisodes=(episodeResult.data||[]).map(row=>({...row,show_episode_number:numberVisibilitySupported?row.show_episode_number:true}));render()}
function setCardBusy(episodeId,value){const card=list.querySelector(`[data-episode-id="${CSS.escape(String(episodeId))}"]`);if(!card)return;card.querySelectorAll('button,select,input').forEach(control=>control.disabled=value||control.hasAttribute('data-fixed-disabled'))}
async function changeChapter(episodeId,value,select){if(busy)return;busy=true;select.disabled=true;status.textContent='章を保存しています...';try{const chapterId=value?Number(value):null;const result=await client.from('episodes').update({chapter_id:chapterId}).eq('id',Number(episodeId)).eq('novel_id',novel.id);if(result.error)throw result.error;const row=allEpisodes.find(item=>Number(item.id)===Number(episodeId));if(row)row.chapter_id=chapterId;status.textContent='章を変更しました。'}catch(error){console.error(error);status.textContent='章を変更できませんでした。';await loadData()}finally{busy=false;select.disabled=false}}
async function changeNumberVisibility(episodeId,checked,input){if(busy)return;busy=true;input.disabled=true;status.textContent='話数表示を保存しています...';try{const result=await client.from('episodes').update({show_episode_number:Boolean(checked)}).eq('id',Number(episodeId)).eq('novel_id',novel.id);if(result.error)throw result.error;const row=allEpisodes.find(item=>Number(item.id)===Number(episodeId));if(row)row.show_episode_number=Boolean(checked);status.textContent=checked?'「第○話」を表示します。':'このエピソードでは「第○話」を表示しません。';render()}catch(error){console.error(error);if(missingNumberColumn(error)){numberVisibilitySupported=false;status.textContent='話数表示設定はデータベース反映待ちです。'}else status.textContent='話数表示を変更できませんでした。';await loadData()}finally{busy=false}}
async function moveDraft(episodeId,direction,button){if(busy)return;const slots=[];allEpisodes.forEach((row,index)=>{if(row.status==='draft')slots.push(index)});const draftRows=slots.map(index=>allEpisodes[index]);const current=draftRows.findIndex(row=>Number(row.id)===Number(episodeId)),target=direction==='up'?current-1:current+1;if(current<0||target<0||target>=draftRows.length)return;[draftRows[current],draftRows[target]]=[draftRows[target],draftRows[current]];const next=allEpisodes.slice();slots.forEach((slot,index)=>{next[slot]=draftRows[index]});const episodeItems=next.map(row=>({episode_id:Number(row.id),chapter_id:row.chapter_id==null?null:Number(row.chapter_id)})),chapterOrder=chapters.map(chapter=>Number(chapter.id));busy=true;button.disabled=true;status.textContent='下書きの並び順を保存しています...';try{const result=await client.rpc('novelight_reorder_novel_structure',{p_novel_id:Number(novel.id),p_episode_items:episodeItems,p_chapter_order:chapterOrder});if(result.error)throw result.error;status.textContent='下書きの並び順を変更しました。';await loadData()}catch(error){console.error(error);status.textContent=String(error?.message||'並び順を変更できませんでした。')}finally{busy=false;button.disabled=false}}
async function publishDraft(episodeId,button){if(busy)return;if(!confirm('このエピソードを今すぐ公開しますか？予約日時が設定されている場合も、公開後は読者が閲覧できるようになります。'))return;busy=true;button.disabled=true;status.textContent='公開しています...';try{const result=await client.rpc('novelight_publish_episode_draft_atomic',{p_episode_id:String(episodeId)});if(result.error)throw result.error;status.textContent='公開しました。';await loadData()}catch(error){console.error(error);status.textContent=String(error?.message||'公開できませんでした。タイトル・本文・第1話条件を確認してください。')}finally{busy=false;button.disabled=false}}
(async()=>{void NovelightClient.recordVisit(client);if(!novelId){list.innerHTML='<div class="empty">作品IDがありません。</div>';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-drafts.html?novel_id='+novelId);return}void NovelightClient.claimAcquisition(client);const result=await client.from('novels').select('id,user_id,title,status').eq('id',novelId).single();if(result.error)throw result.error;novel=result.data;if(!novel||novel.user_id!==session.user.id)throw new Error('この作品を管理する権限がありません。');document.getElementById('novelTitle').textContent=`「${novel.title}」の非公開エピソード`;document.getElementById('back').href='novel.html?id='+encodeURIComponent(novel.id);document.getElementById('structureLink').href='episode-structure.html?novel_id='+encodeURIComponent(novel.id);document.getElementById('scheduleLink').href='episode-schedule.html?novel_id='+encodeURIComponent(novel.id);document.getElementById('importLink').href='episode-import.html?novel_id='+encodeURIComponent(novel.id);await loadData()}catch(error){console.error(error);list.innerHTML='<div class="empty">下書きを読み込めませんでした。</div>';status.textContent=String(error?.message||'時間をおいて再度お試しください。')}})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>エピソード下書き | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1050px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:920px;margin:auto;padding:42px 22px 76px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.head h1{font-size:30px;margin:0}.head p{margin:7px 0 0;color:#6b7280}.import{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border-radius:9px;background:#3d2d20;color:#fff;font-size:13px;font-weight:900}.notice{margin-bottom:16px;padding:13px 15px;border:1px solid #dfd1b7;border-radius:10px;background:#fffaf0;color:#6c5531;font-size:12px;line-height:1.7}.list{display:grid;gap:12px}.card,.empty{border:1px solid #e5e7eb;border-radius:14px;background:#fff}.card{padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.number{font-size:11px;font-weight:900;color:#8c765d}.title{margin-top:5px;font-size:18px;font-weight:900}.meta{margin-top:8px;color:#858993;font-size:12px}.badge{align-self:flex-start;padding:5px 8px;border-radius:999px;background:#f2eee7;color:#725f49;font-size:10px;font-weight:900}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.action{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border:1px solid #d6d8df;border-radius:8px;background:#fff;font-size:12px;font-weight:900;cursor:pointer}.action.publish{background:#3d2d20;color:#fff;border-color:#3d2d20}.action:disabled{opacity:.55;cursor:not-allowed}.empty{padding:36px;text-align:center;color:#6b7280}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px}@media(max-width:640px){main{padding:28px 16px 60px}.head{align-items:stretch;flex-direction:column}.import{width:100%}.top{flex-direction:column}.actions{flex-direction:column}.action{width:100%}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
</head>
<body class="novelight-theme novelight-page-episode-drafts">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品管理へ</a></div></header>
<main>
  <div class="head"><div><h1>エピソード下書き</h1><p id="novelTitle">作品情報を読み込み中...</p></div><a id="importLink" class="import" href="#">＋ 一括移行</a></div>
  <div class="notice">ここにあるエピソードは読者には公開されません。内容を確認・編集してから1話ずつ公開できます。作品自体が未公開の場合、最初に公開できるのは第1話です。</div>
  <div id="list" class="list"><div class="empty">読み込み中...</div></div>
  <div id="status" class="status" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const novelId=new URLSearchParams(location.search).get('novel_id');const list=document.getElementById('list'),status=document.getElementById('status');let session=null,novel=null,busy=false;
function esc(value){const node=document.createElement('div');node.textContent=value??'';return node.innerHTML}
async function loadDrafts(){const result=await client.from('episodes').select('id,episode_number,title,content,status').eq('novel_id',novel.id).eq('status','draft').order('episode_number',{ascending:true});if(result.error)throw result.error;const rows=result.data||[];list.innerHTML=rows.length?rows.map(row=>`<article class="card" data-episode-id="${encodeURIComponent(row.id)}"><div class="top"><div><div class="number">第${Number(row.episode_number)}話</div><div class="title">${esc(row.title||'（タイトル未入力）')}</div><div class="meta">本文 ${String(row.content||'').length.toLocaleString()}文字</div></div><span class="badge">非公開下書き</span></div><div class="actions"><a class="action" href="episode-edit.html?id=${encodeURIComponent(row.id)}">編集・プレビュー</a><button class="action publish" type="button" data-publish-id="${encodeURIComponent(row.id)}">この話を公開</button></div></article>`).join(''):'<div class="empty">サーバーに保存された下書きはありません。既存作品を移す場合は「一括移行」を利用できます。</div>';list.querySelectorAll('[data-publish-id]').forEach(button=>button.addEventListener('click',()=>void publishDraft(button.dataset.publishId,button)))}
async function publishDraft(episodeId,button){if(busy)return;if(!confirm('このエピソードを公開しますか？公開後は読者が閲覧できるようになります。'))return;busy=true;button.disabled=true;status.textContent='公開しています...';try{const result=await client.rpc('novelight_publish_episode_draft_atomic',{p_episode_id:String(episodeId)});if(result.error)throw result.error;status.textContent='公開しました。';await loadDrafts()}catch(error){console.error(error);status.textContent=String(error?.message||'公開できませんでした。タイトル・本文・第1話条件を確認してください。')}finally{busy=false;button.disabled=false}}
(async()=>{void NovelightClient.recordVisit(client);if(!novelId){list.innerHTML='<div class="empty">作品IDがありません。</div>';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-drafts.html?novel_id='+novelId);return}void NovelightClient.claimAcquisition(client);const result=await client.from('novels').select('id,user_id,title,status').eq('id',novelId).single();if(result.error)throw result.error;novel=result.data;if(!novel||novel.user_id!==session.user.id)throw new Error('この作品を管理する権限がありません。');document.getElementById('novelTitle').textContent=`「${novel.title}」の非公開エピソード`;document.getElementById('back').href='novel.html?id='+encodeURIComponent(novel.id);document.getElementById('importLink').href='episode-import.html?novel_id='+encodeURIComponent(novel.id);await loadDrafts()}catch(error){console.error(error);list.innerHTML='<div class="empty">下書きを読み込めませんでした。</div>';status.textContent=String(error?.message||'時間をおいて再度お試しください。')}})();
</script>
</body></html>

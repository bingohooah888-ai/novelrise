<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>エピソード編集 | NOVELIGHT</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.field{margin-bottom:22px}label{display:block;font-size:14px;font-weight:900;margin-bottom:8px}input,textarea{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px;font:inherit}textarea{min-height:500px;line-height:1.9;resize:vertical}.buttons{display:flex;justify-content:flex-end;gap:10px}.btn{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.save{border:0;background:#6d4aff;color:#fff}.save:disabled{opacity:.6}.status{margin-top:14px;color:#666;font-size:13px;min-height:22px}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}textarea{min-height:360px}.buttons{flex-direction:column}.btn{width:100%;text-align:center}}</style></head><body><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header><main><h1>エピソード編集</h1><section class="card"><form id="form"><div class="field"><label for="episodeNumber">話数</label><input id="episodeNumber" type="number" min="1" required></div><div class="field"><label for="title">タイトル</label><input id="title" maxlength="150" required></div><div class="field"><label for="content">本文</label><textarea id="content" required></textarea></div><div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="save" class="btn save" type="submit" disabled>保存</button></div><div id="status" class="status"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const id=new URLSearchParams(location.search).get('id');let session=null,episode=null,ready=false,busy=false;const status=document.getElementById('status'),save=document.getElementById('save');
(async()=>{void NovelightClient.recordVisit(client);if(!id){status.textContent='エピソードIDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-edit.html?id='+id);return}const r=await client.from('episodes').select('*').eq('id',id).single();episode=r.data;if(r.error||!episode||episode.user_id!==session.user.id)throw r.error||new Error('not editable');document.getElementById('episodeNumber').value=episode.episode_number;document.getElementById('title').value=episode.title||'';document.getElementById('content').value=episode.content||'';document.getElementById('back').href='novel.html?id='+episode.novel_id;document.getElementById('cancel').href='novel.html?id='+episode.novel_id;ready=true;save.disabled=false}catch(e){console.error(e);status.textContent='エピソード情報を読み込めませんでした。再読み込みしてお試しください。';save.disabled=true}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='エピソード情報の読み込みが完了していません。';return}busy=true;save.disabled=true;status.textContent='保存しています...';try{const r=await client.from('episodes').update({episode_number:Number(document.getElementById('episodeNumber').value),title:document.getElementById('title').value.trim(),content:document.getElementById('content').value}).eq('id',id).eq('user_id',session.user.id);if(r.error)throw r.error;location.href='episode.html?id='+encodeURIComponent(id)}catch(e){console.error(e);status.textContent='保存できませんでした。時間をおいて再度お試しください。'}finally{busy=false;save.disabled=!ready}});
</script></body></html>

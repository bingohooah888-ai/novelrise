<body class="novelight-theme novelight-page-episode-edit"><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main id="main-content" tabindex="-1">
  <div class="editor-head"><p id="novelTitle" class="novel-title">エピソード情報を読み込み中...</p><span id="episodeState" class="episode-state" hidden></span></div>
  <form id="form">
    <div class="editor-toolbar" aria-label="執筆ツール">
      <div class="save-cluster"><span id="saveState" class="save-state" aria-live="polite">読み込み中</span></div>
      <div class="editor-tools">
        <button id="openChapterSettings" class="tool-button" type="button" disabled>章</button>
        <button id="openIllustrationEditor" class="tool-button" type="button" disabled>挿絵を追加</button>
        <button id="openScheduleSettings" class="tool-button" type="button" disabled>予約</button>
        <button id="save" class="primary-action" type="submit" disabled>保存</button>
      </div>
    </div>

    <section class="writing-surface">
      <div id="episodeHeading" class="episode-label">第—話</div>
      <input id="episodeNumber" type="number" min="1" required readonly aria-hidden="true">
      <div class="title-field"><label class="skip-link" for="title">エピソードタイトル</label><input id="title" maxlength="150" placeholder="エピソードタイトル"></div>
      <div class="body-field"><label class="body-label" for="content">本文</label><textarea id="content" maxlength="100000" placeholder="本文を入力"></textarea></div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>
    <div class="buttons" hidden></div>
  </form>
  <div id="historyHost" class="card history-host"></div>
</main>

<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="settingsDrawer" class="settings-drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-head"><h2 id="drawerTitle">設定</h2><button id="closeDrawer" class="drawer-close" type="button" aria-label="設定を閉じる">×</button></div>
  <div class="drawer-body">
    <section id="chapterPane" class="drawer-pane" hidden>
      <label for="chapterId">この話の章</label>
      <select id="chapterId"><option value="">章なし</option></select>
      <p class="drawer-note">既存の章を選択できます。章の追加や話の並び替えは管理画面で行えます。</p>
      <a id="manageStructureLink" class="drawer-action" href="#">章・並び順管理を開く</a>
    </section>
    <section id="illustrationPane" class="drawer-pane" hidden>
      <p class="drawer-note">本文で挿入したい位置にカーソルを置いたまま、ここから画像を追加してください。本文への反映は保存時に行われます。</p>
      <div id="episodeIllustrationsMount"></div>
    </section>
    <section id="schedulePane" class="drawer-pane" hidden>
      <div id="scheduleCurrent" class="drawer-current">予約状態を確認中...</div>
      <label for="scheduleAt">予約公開日時</label>
      <input id="scheduleAt" type="datetime-local" step="60">
      <p class="drawer-note">非公開下書きを指定日時に自動公開します。予約後も編集できます。</p>
      <div class="drawer-actions">
        <button id="scheduleSave" class="drawer-action primary" type="button" disabled>この日時に予約</button>
        <button id="scheduleCancel" class="drawer-action" type="button" hidden disabled>予約を解除</button>
      </div>
    </section>
  </div>
</aside>

openScheduleSettings.addEventListener('click',()=>{if(!ready||busy||collaborationEditor||!isDraft())return;renderSchedule();openDrawer('schedule')});
openIllustrationEditor.addEventListener('click',async()=>{if(!ready||busy)return;await waitForAutoSave();openDrawer('illustration');setBusy(true);status.textContent=illustrationEditorMounted?'':'挿絵を準備しています...';try{await mountIllustrationEditor();status.textContent=''}catch(error){console.error(error);status.textContent=String(error?.message||'挿絵機能を開けませんでした。時間をおいて再度お試しください。')}finally{setBusy(false)}});
scheduleSave.addEventListener('click',async()=>{if(!ready||busy||collaborationEditor||!isDraft())return;await waitForAutoSave();const value=values(),validation=validate(value,true);if(validation){status.textContent=validation;return}const requested=new Date(scheduleAt.value);if(!scheduleAt.value||!Number.isFinite(requested.getTime())){status.textContent='予約する公開日時を入力してください。';return}if(requested.getTime()<Date.now()+2*60*1000){status.textContent='予約日時は現在より2分以上先に設定してください。';return}if(requested.getTime()>Date.now()+365*24*60*60*1000){status.textContent='予約日時は1年以内に設定してください。';return}setBusy(true);status.textContent='最新の下書きを保存して予約しています...';try{await saveServerDraft();const result=await client.rpc('novelight_schedule_episode_draft',{p_episode_id:id,p_publish_at:requested.toISOString()});if(result.error)throw result.error;episode.scheduled_publish_at=result.data||requested.toISOString();dirty=false;setSaveState('保存済み');window.NovelightAuthorDraft?.clearCurrentDraft?.();renderSchedule();status.textContent=`${formatLocal(episode.scheduled_publish_at)} に予約しました。`}catch(error){console.error(error);status.textContent='予約できませんでした。日時と公開条件を確認して、もう一度お試しください。'}finally{setBusy(false)}});
scheduleCancel.addEventListener('click',async()=>{if(!ready||busy||collaborationEditor||!isDraft()||!episode?.scheduled_publish_at)return;setBusy(true);status.textContent='予約を解除しています...';try{const result=await client.rpc('novelight_cancel_episode_schedule',{p_episode_id:id});if(result.error)throw result.error;episode.scheduled_publish_at=null;scheduleAt.value='';renderSchedule();status.textContent='予約投稿を解除しました。下書きはそのまま保存されています。'}catch(error){console.error(error);status.textContent='予約を解除できませんでした。時間をおいて再度お試しください。'}finally{setBusy(false)}});
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();if(!ready||busy){if(!ready)status.textContent='エピソード情報の読み込みが完了していません。';return}await waitForAutoSave();const value=values();if(collaborationEditor){const validation=validate(value,!isDraft());if(validation){status.textContent=validation;return}setBusy(true);status.textContent='保存しています...';try{if(isDraft())await saveServerDraft();else await savePublishedEpisode();dirty=false;setSaveState('保存済み');window.NovelightAuthorDraft?.clearCurrentDraft?.();status.textContent='共同編集を保存しました。';if(!isDraft())location.href='episode.html?id='+encodeURIComponent(id)}catch(error){console.error(error);status.textContent='保存できませんでした。時間をおいて再度お試しください。'}finally{setBusy(false)}return}if(isDraft()){const validation=validate(value,true);if(validation){status.textContent=validation;return}if(!confirm('このエピソードを公開しますか？公開後は読者が閲覧できるようになります。'))return;setBusy(true);status.textContent='最新の下書きを保存して公開しています...';try{await saveServerDraft();const result=await client.rpc('novelight_publish_episode_draft_atomic',{p_episode_id:id});if(result.error)throw result.error;dirty=false;clearLocalDraftBeforeNavigation();location.href='episode.html?id='+encodeURIComponent(id)}catch(error){console.error(error);status.textContent='公開できませんでした。タイトル・本文・第1話条件を確認してください。';setBusy(false)}return}const validation=validate(value,true);if(validation){status.textContent=validation;return}setBusy(true);status.textContent='保存しています...';try{await savePublishedEpisode();dirty=false;setSaveState('保存済み');clearLocalDraftBeforeNavigation();location.href='episode.html?id='+encodeURIComponent(id)}catch(error){console.error(error);status.textContent='保存できませんでした。時間をおいて再度お試しください。';setBusy(false)}});
</script>
<script src="novelight-author-draft.js"></script>
<script src="novelight-episode-history.js"></script>
</body>
</html>

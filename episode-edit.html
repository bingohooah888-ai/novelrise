<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>エピソード編集 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.draft-state{margin:0 0 20px;padding:12px 14px;border:1px solid #d8c6a8;border-radius:10px;background:#fff8e9;color:#674f2f;font-size:13px;line-height:1.7}.field{margin-bottom:22px}label{display:block;font-size:14px;font-weight:900;margin-bottom:8px}input,textarea{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px;font:inherit}textarea{min-height:500px;line-height:1.9;resize:vertical}.schedule-box{margin:0 0 22px;padding:16px;border:1px solid #ddd3c1;border-radius:12px;background:#fffdf8}.schedule-copy{margin:7px 0 12px;color:#6f665c;font-size:12px;line-height:1.7}.schedule-state{min-height:20px;margin-top:9px;color:#76572d;font-size:12px;font-weight:800;line-height:1.6}.schedule-state.error{color:#b42318}.schedule-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.schedule-action{min-height:38px;padding:8px 12px;border:1px solid #cdbd9f;border-radius:8px;background:#fff;color:#58432a;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.schedule-action.primary{background:#72502c;color:#fff;border-color:#72502c}.schedule-action:disabled{opacity:.55;cursor:not-allowed}.buttons{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.btn{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.save{border:0;background:#6d4aff;color:#fff;cursor:pointer}.publish{border:1px solid #3d2d20;background:#3d2d20;color:#fff;cursor:pointer}.save:disabled,.publish:disabled{opacity:.6;cursor:not-allowed}.status{margin-top:14px;color:#666;font-size:13px;min-height:22px}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}textarea{min-height:360px}.buttons,.schedule-actions{flex-direction:column}.btn,.schedule-action{width:100%;text-align:center}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
</head>
<body class="novelight-theme novelight-page-episode-edit">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main>
  <h1>エピソード編集</h1>
  <section class="card">
    <form id="form">
      <div id="draftState" class="draft-state" hidden><strong>非公開下書き</strong> ・ この内容はまだ読者には公開されていません。サーバーへ保存すると別端末からも続きを編集できます。</div>
      <div class="field"><label for="episodeNumber">話数</label><input id="episodeNumber" type="number" min="1" required></div>
      <div class="field"><label for="title">タイトル</label><input id="title" maxlength="150" required></div>
      <div class="field"><label for="content">本文</label><textarea id="content" maxlength="100000" required></textarea></div>
      <section id="scheduleBox" class="schedule-box" hidden>
        <label for="scheduleAt">予約公開</label>
        <input id="scheduleAt" type="datetime-local">
        <p class="schedule-copy">1作品につき同時に1話だけ予約できます。通常は指定時刻から約1分以内に公開されます。予約後も公開前なら本文を編集できます。</p>
        <div class="schedule-actions"><button id="scheduleDraft" class="schedule-action primary" type="button" disabled>この日時に予約</button><button id="cancelSchedule" class="schedule-action" type="button" hidden disabled>予約を取り消す</button></div>
        <div id="scheduleState" class="schedule-state" aria-live="polite"></div>
      </section>
      <div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="publishDraft" class="btn publish" type="button" hidden disabled>この話を公開</button><button id="save" class="btn save" type="submit" disabled>保存</button></div>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const id=new URLSearchParams(location.search).get('id');let session=null,episode=null,ready=false,busy=false,scheduleAvailable=false;
const status=document.getElementById('status'),save=document.getElementById('save'),publishDraft=document.getElementById('publishDraft'),draftState=document.getElementById('draftState'),scheduleBox=document.getElementById('scheduleBox'),scheduleAt=document.getElementById('scheduleAt'),scheduleDraft=document.getElementById('scheduleDraft'),cancelSchedule=document.getElementById('cancelSchedule'),scheduleState=document.getElementById('scheduleState');
function isDraft(){return episode?.status==='draft'}
function setBusy(value){busy=value;save.disabled=value||!ready;publishDraft.disabled=value||!ready||!isDraft();scheduleDraft.disabled=value||!ready||!isDraft()||!scheduleAvailable;cancelSchedule.disabled=value||!ready||!isDraft()||!scheduleAvailable}
function clearLocalDraftBeforeNavigation(){window.NovelightAuthorDraft?.clearCurrentDraft?.();window.addEventListener('pagehide',()=>window.NovelightAuthorDraft?.clearCurrentDraft?.(),{once:true})}
function values(){return{episodeNumber:Number(document.getElementById('episodeNumber').value),title:document.getElementById('title').value.trim(),content:document.getElementById('content').value}}
function validate(value,requireComplete){if(!Number.isFinite(value.episodeNumber)||value.episodeNumber<1)return'話数は1以上で入力してください。';if(value.title.length>150)return'タイトルは150文字以内で入力してください。';if(requireComplete&&value.title.length<1)return'タイトルを入力してください。';if(requireComplete&&value.content.trim().length<1)return'本文を入力してください。';if(value.content.length>100000)return'本文は100,000文字以内で入力してください。';return''}
function toLocalInput(iso){if(!iso)return'';const date=new Date(iso);if(!Number.isFinite(date.getTime()))return'';const offset=date.getTimezoneOffset()*60000;return new Date(date.getTime()-offset).toISOString().slice(0,16)}
function selectedScheduleIso(){const date=new Date(scheduleAt.value);return Number.isFinite(date.getTime())?date.toISOString():null}
function renderSchedule(){if(!isDraft()||!scheduleAvailable){scheduleBox.hidden=true;return}scheduleBox.hidden=false;const scheduled=episode?.scheduled_publish_at||null;cancelSchedule.hidden=!scheduled;if(scheduled&&!scheduleAt.value)scheduleAt.value=toLocalInput(scheduled);scheduleState.classList.toggle('error',Boolean(episode?.scheduled_publish_error));if(episode?.scheduled_publish_error){scheduleState.textContent=episode.scheduled_publish_error;return}scheduleState.textContent=scheduled?`予約中：${new Date(scheduled).toLocaleString('ja-JP')}ごろに公開します。`:'予約は設定されていません。'}
async function saveServerDraft(){const value=values(),validation=validate(value,false);if(validation)throw new Error(validation);const result=await client.rpc('novelight_save_episode_draft',{p_novel_id:episode.novel_id,p_episode_id:id,p_episode_number:value.episodeNumber,p_title:value.title,p_content:value.content});if(result.error)throw result.error;return result.data}
(async()=>{void NovelightClient.recordVisit(client);if(!id){status.textContent='エピソードIDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-edit.html?id='+id);return}const r=await client.from('episodes').select('*').eq('id',id).single();episode=r.data;if(r.error||!episode||episode.user_id!==session.user.id)throw r.error||new Error('not editable');scheduleAvailable=Object.prototype.hasOwnProperty.call(episode,'scheduled_publish_at');document.getElementById('episodeNumber').value=episode.episode_number;document.getElementById('title').value=episode.title||'';document.getElementById('content').value=episode.content||'';document.getElementById('back').href='novel.html?id='+episode.novel_id;document.getElementById('cancel').href=isDraft()?'episode-drafts.html?novel_id='+encodeURIComponent(episode.novel_id):'novel.html?id='+episode.novel_id;if(isDraft()){draftState.hidden=false;publishDraft.hidden=false;save.textContent='下書きを保存';document.getElementById('title').required=false;document.getElementById('content').required=false;renderSchedule()}ready=true;setBusy(false);if(scheduleAvailable&&new URLSearchParams(location.search).get('schedule_error')==='1')status.textContent='下書きは保存されています。予約日時を確認して、もう一度予約してください。'}catch(e){console.error(e);status.textContent='エピソード情報を読み込めませんでした。再読み込みしてお試しください。';ready=false;setBusy(false)}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='エピソード情報の読み込みが完了していません。';return}const value=values(),validation=validate(value,!isDraft());if(validation){status.textContent=validation;return}setBusy(true);status.textContent=isDraft()?'サーバーに下書き保存しています...':'保存しています...';try{if(isDraft()){await saveServerDraft();window.NovelightAuthorDraft?.clearCurrentDraft?.();status.textContent='サーバーに下書きを保存しました。別端末からも続けられます。'}else{const r=await client.from('episodes').update({episode_number:value.episodeNumber,title:value.title,content:value.content}).eq('id',id).eq('user_id',session.user.id);if(r.error)throw r.error;clearLocalDraftBeforeNavigation();location.href='episode.html?id='+encodeURIComponent(id)}}catch(e){console.error(e);status.textContent='保存できませんでした。時間をおいて再度お試しください。'}finally{setBusy(false)}});
publishDraft.addEventListener('click',async()=>{if(!ready||busy||!isDraft())return;const value=values(),validation=validate(value,true);if(validation){status.textContent=validation;return}if(!confirm('このエピソードを公開しますか？公開後は読者が閲覧できるようになります。'))return;setBusy(true);status.textContent='最新の下書きを保存して公開しています...';try{await saveServerDraft();const result=await client.rpc('novelight_publish_episode_draft_atomic',{p_episode_id:id});if(result.error)throw result.error;clearLocalDraftBeforeNavigation();location.href='episode.html?id='+encodeURIComponent(id)}catch(e){console.error(e);status.textContent='公開できませんでした。タイトル・本文・第1話条件を確認してください。';setBusy(false)}});
scheduleDraft.addEventListener('click',async()=>{if(!ready||busy||!isDraft()||!scheduleAvailable)return;const value=values(),validation=validate(value,true),publishAt=selectedScheduleIso();if(validation){status.textContent=validation;return}if(!publishAt||new Date(publishAt).getTime()<=Date.now()){status.textContent='現在より後の予約日時を指定してください。';return}setBusy(true);status.textContent='最新の下書きを保存して予約しています...';try{await saveServerDraft();const result=await client.rpc('novelight_schedule_episode_publication',{p_episode_id:id,p_publish_at:publishAt});if(result.error)throw result.error;episode.scheduled_publish_at=publishAt;episode.scheduled_publish_error=null;renderSchedule();window.NovelightAuthorDraft?.clearCurrentDraft?.();status.textContent='予約公開を設定しました。'}catch(e){console.error(e);status.textContent='予約を設定できませんでした。日時・第1話条件・他の予約を確認してください。'}finally{setBusy(false)}});
cancelSchedule.addEventListener('click',async()=>{if(!ready||busy||!isDraft()||!scheduleAvailable||!episode?.scheduled_publish_at)return;if(!confirm('予約公開を取り消しますか？下書きは削除されません。'))return;setBusy(true);status.textContent='予約を取り消しています...';try{const result=await client.rpc('novelight_cancel_episode_schedule',{p_episode_id:id});if(result.error)throw result.error;episode.scheduled_publish_at=null;episode.scheduled_publish_error=null;scheduleAt.value='';renderSchedule();status.textContent='予約を取り消しました。下書きはそのまま残っています。'}catch(e){console.error(e);status.textContent='予約を取り消せませんでした。時間をおいて再度お試しください。'}finally{setBusy(false)}});
</script>
<script src="novelight-author-draft.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>エピソード編集 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.draft-state{margin:0 0 20px;padding:12px 14px;border:1px solid #d8c6a8;border-radius:10px;background:#fff8e9;color:#674f2f;font-size:13px;line-height:1.7}.field{margin-bottom:22px}label{display:block;font-size:14px;font-weight:900;margin-bottom:8px}input,textarea{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px;font:inherit}input[readonly]{background:#f7f4ee;color:#665c50}textarea{min-height:500px;line-height:1.9;resize:vertical}.field-note{margin:7px 0 0;color:#756b5f;font-size:12px;line-height:1.7}.field-note a{font-weight:900;text-decoration:underline}.buttons{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.btn{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.save{border:0;background:#6d4aff;color:#fff;cursor:pointer}.publish{border:1px solid #3d2d20;background:#3d2d20;color:#fff;cursor:pointer}.save:disabled,.publish:disabled{opacity:.6;cursor:not-allowed}.status{margin-top:14px;color:#666;font-size:13px;min-height:22px}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}textarea{min-height:360px}.buttons{flex-direction:column}.btn{width:100%;text-align:center}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">\n  <link rel="stylesheet" href="novelight-characters.css">
  <link rel="stylesheet" href="novelight-episode-illustrations.css">
<link rel="stylesheet" href="novelight-accessibility.css"></head>
<body class="novelight-theme novelight-page-episode-edit"><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main id="main-content" tabindex="-1">
  <h1>エピソード編集</h1>
  <section class="card">
    <form id="form">
      <div id="draftState" class="draft-state" hidden><strong>非公開下書き</strong> ・ この内容はまだ読者には公開されていません。サーバーへ保存すると別端末からも続きを編集できます。</div>
      <div class="field"><label for="episodeNumber">話数</label><input id="episodeNumber" type="number" min="1" required readonly><p class="field-note">話数は本文編集と分離して安全に管理します。途中挿入・章分け・並び替えは <a id="structureLink" href="#">章・並び順管理</a> から変更してください。</p></div>
      <div class="field"><label for="title">タイトル</label><input id="title" maxlength="150" required></div>
      <div class="field"><label for="content">本文</label><textarea id="content" maxlength="100000" required></textarea></div>
      <div id="episodeIllustrationsMount" hidden></div>
      <div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="publishDraft" class="btn publish" type="button" hidden disabled>この話を公開</button><button id="save" class="btn save" type="submit" disabled>保存</button></div>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script><script src="novelight-client.js"></script><script src="novelight-characters.js"></script><script src="novelight-episode-illustrations.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const id=new URLSearchParams(location.search).get('id');let session=null,episode=null,ready=false,busy=false,collaborationEditor=false;
const status=document.getElementById('status'),save=document.getElementById('save'),publishDraft=document.getElementById('publishDraft'),draftState=document.getElementById('draftState');
function isDraft(){return episode?.status==='draft'}
function setBusy(value){busy=value;save.disabled=value||!ready;publishDraft.disabled=value||!ready||!isDraft()||collaborationEditor}
function clearLocalDraftBeforeNavigation(){window.NovelightAuthorDraft?.clearCurrentDraft?.();window.addEventListener('pagehide',()=>window.NovelightAuthorDraft?.clearCurrentDraft?.(),{once:true})}
function values(){return{episodeNumber:Number(document.getElementById('episodeNumber').value),title:document.getElementById('title').value.trim(),content:document.getElementById('content').value}}
function validate(value,requireComplete){if(!Number.isFinite(value.episodeNumber)||value.episodeNumber<1)return'話数は1以上で入力してください。';if(value.title.length>150)return'タイトルは150文字以内で入力してください。';if(requireComplete&&value.title.length<1)return'タイトルを入力してください。';if(requireComplete&&value.content.trim().length<1)return'本文を入力してください。';if(value.content.length>100000)return'本文は100,000文字以内で入力してください。';return''}
function collaborationUnavailable(error){const code=String(error?.code||''),message=String(error?.message||'');return ['42883','PGRST202','PGRST204'].includes(code)||/novelight_get_collaboration_episode|Could not find the function|does not exist/iu.test(message)}
async function loadEditableEpisode(){const owned=await client.from('episodes').select('*').eq('id',id).single();if(!owned.error&&owned.data?.user_id===session.user.id)return owned.data;const collaborative=await client.rpc('novelight_get_collaboration_episode',{p_episode_id:Number(id)});if(!collaborative.error&&collaborative.data){const data=collaborative.data;collaborationEditor=String(data.owner_user_id)!==session.user.id;if(!collaborationEditor)throw new Error('owner episode row unavailable');return{id:data.id,novel_id:data.novel_id,user_id:data.owner_user_id,episode_number:data.episode_number,title:data.title,content:data.content,status:data.status}}if(collaborative.error&&!collaborationUnavailable(collaborative.error))throw collaborative.error;if(owned.error)throw owned.error;throw new Error('not editable')}
async function saveServerDraft(){const value=values(),validation=validate(value,false);if(validation)throw new Error(validation);const result=collaborationEditor?await client.rpc('novelight_update_collaboration_episode',{p_episode_id:Number(id),p_title:value.title,p_content:value.content}):await client.rpc('novelight_save_episode_draft',{p_novel_id:episode.novel_id,p_episode_id:id,p_episode_number:value.episodeNumber,p_title:value.title,p_content:value.content});if(result.error)throw result.error;return result.data}
(async()=>{void NovelightClient.recordVisit(client);if(!id){status.textContent='エピソードIDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-edit.html?id='+id);return}episode=await loadEditableEpisode();document.getElementById('episodeNumber').value=episode.episode_number;document.getElementById('title').value=episode.title||'';document.getElementById('content').value=episode.content||'';const collaborationUrl='collaboration.html?novel_id='+encodeURIComponent(episode.novel_id);document.getElementById('back').href=collaborationEditor?collaborationUrl:'novel.html?id='+episode.novel_id;document.getElementById('structureLink').href='episode-structure.html?novel_id='+encodeURIComponent(episode.novel_id);document.getElementById('cancel').href=collaborationEditor?collaborationUrl:(isDraft()?'episode-drafts.html?novel_id='+encodeURIComponent(episode.novel_id):'novel.html?id='+episode.novel_id);if(collaborationEditor){document.body.dataset.collaborationEditor='true';const note=document.getElementById('structureLink').parentElement;note.textContent='共同執筆者は話数・章・並び順を変更できません。公開・削除も作品所有者のみが行えます。';publishDraft.hidden=true;save.textContent=isDraft()?'共同下書きを保存':'共同編集を保存'}else if(isDraft()){draftState.hidden=false;publishDraft.hidden=false;save.textContent='下書きを保存';document.getElementById('title').required=false;document.getElementById('content').required=false}ready=true;setBusy(false);if(!collaborationEditor)void NovelightCharacters.mountEpisodeEditor({client,episodeId:id,novelId:episode.novel_id});void NovelightEpisodeIllustrations.mountEditor({client,root:document.getElementById('episodeIllustrationsMount'),episode,session,textarea:document.getElementById('content'),isOwner:!collaborationEditor})}catch(e){console.error(e);status.textContent='エピソード情報を読み込めませんでした。再読み込みしてお試しください。';ready=false;setBusy(false)}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='エピソード情報の読み込みが完了していません。';return}const value=values(),validation=validate(value,!isDraft());if(validation){status.textContent=validation;return}setBusy(true);status.textContent=isDraft()?'サーバーに下書き保存しています...':'保存しています...';try{if(isDraft()||collaborationEditor){await saveServerDraft();window.NovelightAuthorDraft?.clearCurrentDraft?.();status.textContent=collaborationEditor?'共同編集を保存しました。':'サーバーに下書きを保存しました。別端末からも続けられます。';if(collaborationEditor&&!isDraft())location.href='episode.html?id='+encodeURIComponent(id)}else{const r=await client.from('episodes').update({title:value.title,content:value.content}).eq('id',id).eq('user_id',session.user.id);if(r.error)throw r.error;clearLocalDraftBeforeNavigation();location.href='episode.html?id='+encodeURIComponent(id)}}catch(e){console.error(e);status.textContent='保存できませんでした。時間をおいて再度お試しください。'}finally{setBusy(false)}});
publishDraft.addEventListener('click',async()=>{if(!ready||busy||!isDraft()||collaborationEditor)return;const value=values(),validation=validate(value,true);if(validation){status.textContent=validation;return}if(!confirm('このエピソードを公開しますか？公開後は読者が閲覧できるようになります。'))return;setBusy(true);status.textContent='最新の下書きを保存して公開しています...';try{await saveServerDraft();const result=await client.rpc('novelight_publish_episode_draft_atomic',{p_episode_id:id});if(result.error)throw result.error;clearLocalDraftBeforeNavigation();location.href='episode.html?id='+encodeURIComponent(id)}catch(e){console.error(e);status.textContent='公開できませんでした。タイトル・本文・第1話条件を確認してください。';setBusy(false)}});
</script>
<script src="novelight-author-draft.js"></script>
<script src="novelight-episode-schedule.js"></script>
<script src="novelight-episode-history.js"></script>
</body>
</html>

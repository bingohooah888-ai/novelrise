<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お気に入り作品 | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1000px;
      height: 72px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #6d4aff;
      font-size: 25px;
      font-weight: 800;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 50px 24px 80px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .favorite-list {
      display: grid;
      gap: 18px;
    }

    .favorite-card {
      display: block;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px;
      transition: 0.2s;
    }

    .favorite-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.06);
    }

    .genre {
      display: inline-block;
      padding: 5px 9px;
      margin-bottom: 10px;

      background: #eeeaff;
      color: #6d4aff;

      border-radius: 6px;

      font-size: 12px;
      font-weight: 700;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .meta {
      color: #999;
      font-size: 13px;
    }

    .empty {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;

      padding: 50px 20px;

      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      NovelRise
    </a>

    <a
      href="mypage.html"
      class="back"
    >
      ← マイページへ戻る
    </a>

  </div>
</header>


<main>

  <h1>
    お気に入り作品
  </h1>

  <p class="subtitle">
    あなたがお気に入り登録した作品です。
  </p>

  <div
    id="favoriteList"
    class="favorite-list"
  >
    読み込み中...
  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function escapeHtml(value) {

    const div =
      document.createElement('div');

    div.textContent =
      value ?? '';

    return div.innerHTML;
  }


  async function loadFavorites() {

    const favoriteList =
      document.getElementById(
        'favoriteList'
      );


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        'login.html';

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from('favorites')
        .select(`
          novel_id,
          created_at,
          novels (
            id,
            title,
            genre,
            description,
            pv,
            status
          )
        `)
        .eq(
          'user_id',
          session.user.id
        )
        .order(
          'created_at',
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      favoriteList.innerHTML =
        '<div class="empty">' +
        'お気に入り作品を読み込めませんでした。' +
        '</div>';

      return;
    }


    const favorites =
      (data ?? [])
        .filter(
          row =>
            row.novels &&
            row.novels.status ===
              'published'
        );


    if (
      favorites.length === 0
    ) {

      favoriteList.innerHTML =
        '<div class="empty">' +
        'お気に入り作品はまだありません。' +
        '</div>';

      return;
    }


    favoriteList.innerHTML =
      '';


    favorites.forEach(
      row => {

        const novel =
          row.novels;


        const card =
          document.createElement(
            'a'
          );


        card.href =
          'novel.html?id=' +
          novel.id;


        card.className =
          'favorite-card';


        card.innerHTML = `

          <div class="genre">
            ${escapeHtml(
              novel.genre
            )}
          </div>

          <div class="title">
            ${escapeHtml(
              novel.title
            )}
          </div>

          <div class="description">
            ${escapeHtml(
              novel.description
            )}
          </div>

          <div class="meta">
            👁 ${novel.pv ?? 0} PV
          </div>

        `;


        favoriteList.appendChild(
          card
        );

      }
    );

  }


  loadFavorites();

</script>

</body>
</html>

t.js"></script><script>const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function showLoadFailure(){document.getElementById('list').innerHTML='<div class="empty">お気に入り作品を表示できませんでした。通信状況を確認して、もう一度お試しください。</div>'}(async()=>{await NovelightClient.recordVisit(client);try{const a=await client.auth.getSession();if(a.error)throw a.error;const s=a.data?.session;if(!s){location.href='login.html?redirect=favorites.html';return}await NovelightClient.claimAcquisition(client);const r=await client.from('favorites').select('novel_id,created_at,novels(id,title,genre,description,pv,status)').eq('user_id',s.user.id).order('created_at',{ascending:false});if(r.error)throw r.error;const rows=(r.data||[]).filter(x=>x.novels?.status==='published'),list=document.getElementById('list');list.innerHTML=rows.length?rows.map(x=>`<a class="card" href="novel.html?id=${encodeURIComponent(x.novels.id)}"><span class="genre">${esc(x.novels.genre||'未設定')}</span><div class="title">${esc(x.novels.title)}</div><div class="desc">${esc(x.novels.description||'')}</div><div class="meta">👁 ${Number(x.novels.pv||0).toLocaleString()} PV</div></a>`).join(''):'<div class="empty">お気に入り作品はまだありません。</div>'}catch(error){console.error('favorites load failed',error);showLoadFailure()}})();</script></body></html>

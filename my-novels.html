<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>自分の作品 | NOVELIGHT</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1050px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:1000px;margin:auto;padding:42px 22px 76px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:24px}.head h1{font-size:30px}.head p{color:#6b7280;margin-top:6px}.new{padding:10px 15px;border-radius:8px;background:#6d4aff;color:#fff;font-weight:900;font-size:13px}.list{display:grid;gap:14px}.card,.empty{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.card{padding:21px}.top{display:flex;justify-content:space-between;gap:15px}.title{font-size:20px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{padding:4px 8px;border-radius:6px;background:#f0edff;color:#6d4aff;font-size:10px;font-weight:900}.ai{background:#eef6ff;color:#245fa9}.mature{background:#fff1db;color:#8b5b00}.desc{color:#666;font-size:13px;line-height:1.6}.meta{display:flex;gap:14px;flex-wrap:wrap;color:#888;font-size:12px;margin-top:12px}.state{padding:5px 9px;border-radius:999px;background:#ecfdf3;color:#16803d;font-size:11px;font-weight:900;white-space:nowrap}.draft{background:#f3f4f6;color:#666}.empty{padding:38px;text-align:center;color:#6b7280}footer{padding:26px;background:#111118;color:#999}.footer-links{max-width:1000px;margin:auto;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:12px}@media(max-width:640px){main{padding:28px 16px 60px}.head{align-items:flex-start;flex-direction:column}.new{width:100%;text-align:center}.top{flex-direction:column}.state{align-self:flex-start}}</style></head><body><header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="mypage.html" class="back">← 作者ホーム</a></div></header><main><div class="head"><div><h1>自分の作品</h1><p>投稿した作品と公開状態を確認します。</p></div><a href="post.html" class="new">＋ 新しい作品を投稿</a></div><div id="list" class="list">読み込み中...</div></main><footer><div class="footer-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const ai={unspecified:'AI未申告',human:'人間主体',ai_assisted:'AI支援',ai_generated:'AI生成主体'};function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}(async()=>{await NovelightClient.recordVisit(client);const a=await client.auth.getSession();const s=a.data.session;if(!s){location.href='login.html?redirect=my-novels.html';return}await NovelightClient.claimAcquisition(client);const r=await client.from('novels').select('*').eq('user_id',s.user.id).order('created_at',{ascending:false});const rows=r.data||[],list=document.getElementById('list');if(r.error){list.innerHTML='<div class="empty">作品を読み込めませんでした。</div>';return}if(!rows.length){list.innerHTML='<div class="empty">まだ投稿した作品がありません。</div>';return}list.innerHTML=(await Promise.all(rows.map(async n=>{const f=await client.from('favorites').select('*',{count:'exact',head:true}).eq('novel_id',n.id);return `<article class="card"><div class="top"><div><a href="novel.html?id=${encodeURIComponent(n.id)}" class="title">${esc(n.title)}</a><div class="badges"><span class="badge">${esc(n.genre||'未設定')}</span><span class="badge ai">${esc(ai[n.ai_usage]||'AI未申告')}</span>${n.content_rating==='mature'?'<span class="badge mature">内容注意</span>':''}</div><div class="desc">${esc(n.description||'')}</div><div class="meta"><span>👁 ${Number(n.pv||0).toLocaleString()} PV</span><span>★ ${Number(f.count||0)}</span><span>投稿日 ${new Date(n.created_at).toLocaleDateString('ja-JP')}</span></div></div><span class="state ${n.status==='published'?'':'draft'}">${n.status==='published'?'公開中':'下書き'}</span></div></article>`}))).join('')})();</script></body></html>

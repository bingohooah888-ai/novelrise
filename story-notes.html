<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>創作ノート | NOVELIGHT</title>
  <link rel="stylesheet" href="novelight-author-studio-shell.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07121e;color:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,textarea,select{font:inherit}.workspace{max-width:1160px}.page-head{margin-bottom:22px}.kicker{color:#d7b65b;font-size:11px;font-weight:900;letter-spacing:.16em}.page-head h1{margin:7px 0 8px;font-family:Georgia,"Yu Mincho",serif;font-size:32px}.page-head p{margin:0;color:#aab8c4;line-height:1.8}.privacy{margin:18px 0;padding:13px 15px;border:1px solid rgba(216,180,90,.28);border-radius:12px;background:rgba(91,70,26,.18);color:#e4d7ad;font-size:12px;line-height:1.8}.layout{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:20px;align-items:start}.panel{border:1px solid rgba(216,180,90,.25);border-radius:18px;background:rgba(13,29,43,.92);box-shadow:0 18px 50px rgba(0,0,0,.17)}.editor{padding:22px;position:sticky;top:22px}.editor h2,.list-head h2{margin:0;font-size:19px}.field{display:grid;gap:7px;margin-top:17px}.field label{color:#d9cda9;font-size:12px;font-weight:900}.field input,.field textarea,.field select,.filter{width:100%;border:1px solid rgba(213,224,232,.24);border-radius:10px;background:#091824;color:#f5f7f8;padding:11px 12px}.field textarea{min-height:280px;resize:vertical;line-height:1.75}.count{color:#8797a5;text-align:right;font-size:11px}.help{color:#8797a5;font-size:11px;line-height:1.7}.help a{color:#dfc66f}.actions{display:flex;gap:10px;margin-top:18px}.btn{min-height:42px;border:1px solid rgba(216,180,90,.38);border-radius:10px;background:transparent;color:#e9d697;padding:9px 14px;font-weight:900;cursor:pointer}.btn.primary{background:#d5af4e;color:#15212b;border-color:#d5af4e}.btn.danger{color:#e9b4aa;border-color:rgba(224,129,110,.4)}.btn:disabled{opacity:.48;cursor:not-allowed}.status{min-height:24px;margin-top:13px;color:#aebbc5;font-size:12px;line-height:1.7}.status.error{color:#f0aa9e}.list-panel{padding:22px}.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:15px}.list-controls{width:min(230px,45%)}.note-list{display:grid;gap:12px}.note{padding:18px;border:1px solid rgba(213,224,232,.14);border-radius:13px;background:rgba(6,19,30,.64)}.note-top{display:flex;justify-content:space-between;gap:12px}.note h3{margin:0;font-size:17px}.tag{flex:none;border-radius:999px;background:rgba(216,180,90,.14);color:#e8d08c;padding:4px 8px;font-size:10px;font-weight:900}.note-character{margin-top:7px;color:#dfc66f;font-size:12px}.note-body{margin:10px 0;color:#c9d2d9;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:13px;max-height:260px;overflow:auto}.note-meta{color:#8293a0;font-size:11px}.note-actions{display:flex;gap:8px;margin-top:13px}.empty{padding:34px 16px;text-align:center;color:#93a3af}.pending{margin-bottom:18px;padding:13px 15px;border:1px solid rgba(224,129,110,.35);border-radius:12px;background:rgba(92,36,30,.22);color:#efb9ae;font-size:12px;line-height:1.7}@media(max-width:850px){.layout{grid-template-columns:1fr}.editor{position:static}}@media(max-width:540px){.page-head h1{font-size:27px}.editor,.list-panel{padding:18px}.list-head{align-items:stretch;flex-direction:column}.list-controls{width:100%}.actions,.note-actions{flex-direction:column}.btn{width:100%}}
  </style>
<link rel="stylesheet" href="novelight-accessibility.css"></head>
<body><a class="skip-link" href="#main-content">本文へスキップ</a>
  <main id="main-content" tabindex="-1" class="workspace">
    <header class="page-head">
      <div class="kicker">PRIVATE STORY WORKSPACE</div>
      <h1>創作ノート</h1>
      <p id="workTitle">作品情報を読み込み中...</p>
    </header>
    <div class="privacy">ここは作者本人だけの非公開メモです。読者・共同執筆者・公開プロフィールには表示されず、作品Rank・LIGHT SEED・SCOUT・検索・露出・LIGHT ANALYTICSにも使用しません。</div>
    <div id="pendingNotice" class="pending" hidden>創作ノートはデータベース反映待ちです。反映されるまで閲覧・保存・削除はできません。</div>
    <div class="layout">
      <form id="noteForm" class="panel editor">
        <h2 id="formTitle">新しい創作ノート</h2>
        <input id="noteId" type="hidden">
        <div class="field">
          <label for="noteType">種類</label>
          <select id="noteType"><option value="plot">プロット</option><option value="world">世界観</option><option value="character">キャラクター</option></select>
        </div>
        <div id="characterField" class="field" hidden>
          <label for="character">登場人物</label>
          <select id="character"><option value="">登場人物を選択</option></select>
          <div class="help">人物の正本は既存の登場人物管理です。<a id="characterManageLink" href="#">登場人物を管理 →</a></div>
        </div>
        <div class="field"><label for="title">タイトル</label><input id="title" maxlength="120" required><div id="titleCount" class="count">0 / 120</div></div>
        <div class="field"><label for="body">メモ</label><textarea id="body" maxlength="20000" placeholder="伏線、展開、設定、人物の背景など、読者に見せない情報を自由に整理できます。"></textarea><div id="bodyCount" class="count">0 / 20000</div></div>
        <div class="actions"><button id="save" class="btn primary" type="submit" disabled>保存</button><button id="cancel" class="btn" type="button" hidden>編集をやめる</button></div>
        <div id="status" class="status" aria-live="polite">ログイン状態を確認しています...</div>
      </form>
      <section class="panel list-panel" aria-labelledby="listTitle">
        <div class="list-head">
          <div><h2 id="listTitle">保存済みノート</h2><div id="summary" class="note-meta">読み込み中...</div></div>
          <div class="list-controls"><select id="filter" class="filter" aria-label="ノート種類で絞り込み"><option value="all">すべて</option><option value="plot">プロット</option><option value="world">世界観</option><option value="character">キャラクター</option></select></div>
        </div>
        <div id="noteList" class="note-list"><div class="empty">読み込み中...</div></div>
      </section>
    </div>
  </main>
  <script src="/assets/vendor/supabase-js-2.112.3.js"></script>
  <script src="novelight-client.js"></script>
  <script src="novelight-author-studio-shell.js"></script>
  <script src="novelight-characters.js"></script>
  <script>
  const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
  const novelId=new URLSearchParams(location.search).get('novel_id');
  const form=document.getElementById('noteForm'),list=document.getElementById('noteList'),statusEl=document.getElementById('status'),save=document.getElementById('save');
  const typeLabels={plot:'プロット',world:'世界観',character:'キャラクター'};let notes=[],characters=[],ready=false,busy=false;
  function unavailable(error){const message=String(error?.message||'');return ['42883','PGRST202'].includes(String(error?.code||''))||message.includes('novelight_private_story_notes')||message.includes('novelight_save_private_story_note')||message.includes('does not exist')||message.includes('Could not find the function')}
  function setStatus(message,error=false){statusEl.textContent=message;statusEl.classList.toggle('error',error)}
  function updateCounts(){document.getElementById('titleCount').textContent=document.getElementById('title').value.length+' / 120';document.getElementById('bodyCount').textContent=document.getElementById('body').value.length+' / 20000'}
  function syncCharacterField(){document.getElementById('characterField').hidden=document.getElementById('noteType').value!=='character'}
  function formatDate(value){const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('ja-JP'):'日時不明'}
  function resetForm(){form.reset();document.getElementById('noteId').value='';document.getElementById('formTitle').textContent='新しい創作ノート';save.textContent='保存';document.getElementById('cancel').hidden=true;syncCharacterField();updateCounts()}
  function editNote(note){document.getElementById('noteId').value=note.id;document.getElementById('noteType').value=note.note_type;document.getElementById('character').value=note.character_id==null?'':String(note.character_id);document.getElementById('title').value=note.title;document.getElementById('body').value=note.body||'';document.getElementById('formTitle').textContent='創作ノートを編集';save.textContent='変更を保存';document.getElementById('cancel').hidden=false;syncCharacterField();updateCounts();window.scrollTo({top:0,behavior:'smooth'})}
  function render(){const filter=document.getElementById('filter').value,visible=filter==='all'?notes:notes.filter(note=>note.note_type===filter);list.replaceChildren();document.getElementById('summary').textContent='全 '+notes.length+'件 / 表示 '+visible.length+'件';if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=notes.length?'この種類のノートはありません。':'創作ノートはまだありません。';list.appendChild(empty);return}visible.forEach(note=>{const card=document.createElement('article');card.className='note';const top=document.createElement('div');top.className='note-top';const title=document.createElement('h3');title.textContent=note.title;const tag=document.createElement('span');tag.className='tag';tag.textContent=typeLabels[note.note_type]||note.note_type;top.append(title,tag);card.appendChild(top);if(note.note_type==='character'){const character=document.createElement('div');character.className='note-character';character.textContent=note.character_name?'人物：'+note.character_name:'人物：登録解除済み（メモは保持中）';card.appendChild(character)}const body=document.createElement('div');body.className='note-body';body.textContent=note.body||'（本文なし）';const meta=document.createElement('div');meta.className='note-meta';meta.textContent='更新 '+formatDate(note.updated_at);const actions=document.createElement('div');actions.className='note-actions';const edit=document.createElement('button');edit.type='button';edit.className='btn';edit.textContent='編集';edit.onclick=()=>editNote(note);const remove=document.createElement('button');remove.type='button';remove.className='btn danger';remove.textContent='削除';remove.onclick=()=>deleteNote(note.id);actions.append(edit,remove);card.append(body,meta,actions);list.appendChild(card)})}
  async function loadCharacters(){const result=await client.rpc('novelight_author_character_list',{p_novel_id:Number(novelId)});if(result.error)throw result.error;characters=Array.isArray(result.data)?result.data:[];const select=document.getElementById('character');select.replaceChildren(new Option('登場人物を選択',''));characters.forEach(character=>select.appendChild(new Option(character.name,String(character.id))))}
  async function loadNotes(){const result=await client.rpc('novelight_private_story_notes',{p_novel_id:Number(novelId)});if(result.error)throw result.error;notes=Array.isArray(result.data)?result.data:[];render()}
  async function deleteNote(id){if(!ready||busy||!confirm('この非公開創作ノートを削除しますか？'))return;busy=true;save.disabled=true;setStatus('削除しています...');try{const result=await client.rpc('novelight_delete_private_story_note',{p_note_id:Number(id)});if(result.error)throw result.error;if(String(document.getElementById('noteId').value)===String(id))resetForm();await loadNotes();setStatus('削除しました。')}catch(error){console.error(error);setStatus(unavailable(error)?'創作ノートはデータベース反映待ちです。':'削除できませんでした。',true)}finally{busy=false;save.disabled=!ready}}
  form.addEventListener('submit',async event=>{event.preventDefault();if(!ready||busy)return;const noteType=document.getElementById('noteType').value,title=document.getElementById('title').value.trim(),body=document.getElementById('body').value,characterValue=document.getElementById('character').value;if(!title){setStatus('タイトルを入力してください。',true);return}if(noteType==='character'&&!characterValue){setStatus('キャラクターノートは登場人物を選択してください。',true);return}busy=true;save.disabled=true;setStatus('保存しています...');try{const result=await client.rpc('novelight_save_private_story_note',{p_novel_id:Number(novelId),p_note_id:document.getElementById('noteId').value?Number(document.getElementById('noteId').value):null,p_note_type:noteType,p_character_id:noteType==='character'?Number(characterValue):null,p_title:title,p_body:body});if(result.error)throw result.error;resetForm();await loadNotes();setStatus('非公開の創作ノートとして保存しました。')}catch(error){console.error(error);setStatus(unavailable(error)?'創作ノートはデータベース反映待ちです。':String(error?.message||'保存できませんでした。'),true)}finally{busy=false;save.disabled=!ready}});
  document.getElementById('cancel').onclick=()=>{resetForm();setStatus('編集を取り消しました。')};document.getElementById('title').addEventListener('input',updateCounts);document.getElementById('body').addEventListener('input',updateCounts);document.getElementById('noteType').addEventListener('change',syncCharacterField);document.getElementById('filter').addEventListener('change',render);
  (async()=>{void NovelightClient.recordVisit(client);if(!novelId){setStatus('作品IDがありません。',true);return}document.getElementById('characterManageLink').href='characters.html?novel_id='+encodeURIComponent(novelId);try{const auth=await client.auth.getSession(),session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('story-notes.html?novel_id='+novelId);return}void NovelightClient.claimAcquisition(client);const result=await client.from('novels').select('id,user_id,title').eq('id',novelId).single();if(result.error||!result.data||result.data.user_id!==session.user.id)throw result.error||new Error('not authorized');document.getElementById('workTitle').textContent='「'+result.data.title+'」のプロット・人物設定・世界観を整理します。';await loadCharacters();await loadNotes();ready=true;save.disabled=false;setStatus('');syncCharacterField()}catch(error){console.error(error);ready=false;save.disabled=true;if(unavailable(error)){document.getElementById('pendingNotice').hidden=false;list.innerHTML='<div class="empty">創作ノートはデータベース反映後に表示されます。</div>';setStatus('創作ノートはデータベース反映待ちです。',true)}else{list.innerHTML='<div class="empty">創作ノートを読み込めませんでした。</div>';setStatus('創作ノートを準備できませんでした。',true)}}})();
  </script>
</body>
</html>

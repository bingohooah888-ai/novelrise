<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>作者プロフィール | NOVELIGHT</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1000px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:1000px;margin:auto;padding:42px 22px 78px}.profile,.card,.empty{background:#fff;border:1px solid #e5e7eb;border-radius:15px}.profile{padding:28px;margin-bottom:27px}.name{font-size:30px;font-weight:900}.bio{color:#555;line-height:1.8;white-space:pre-wrap;margin-top:12px}.founding{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#fff4cf;color:#705000;font-size:11px;font-weight:900}h2{font-size:22px;margin-bottom:14px}.list{display:grid;gap:14px}.card{padding:20px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:900;background:#f0edff;color:#6d4aff}.ai{background:#eef6ff;color:#245fa9}.mature{background:#fff1db;color:#8b5b00}.title{font-size:19px;font-weight:900}.desc{color:#666;font-size:13px;line-height:1.65;margin:8px 0}.meta{color:#888;font-size:12px}.empty{padding:34px;text-align:center;color:#6b7280}footer{padding:26px;background:#111118;color:#999}.footer-links{max-width:1000px;margin:auto;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:12px}@media(max-width:640px){main{padding:28px 16px 60px}.profile{padding:22px 18px}.name{font-size:26px}}</style></head><body><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a class="back" href="search.html">← 作品を探す</a></div></header><main><section id="profile" class="profile">読み込み中...</section><h2>投稿作品</h2><div id="list" class="list">読み込み中...</div></main><footer><div class="footer-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const id=new URLSearchParams(location.search).get('id'),profile=document.getElementById('profile'),list=document.getElementById('list');const ai={unspecified:'AI未申告',human:'人間主体',ai_assisted:'AI支援',ai_generated:'AI生成主体'};function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}(async()=>{void NovelightClient.captureAcquisition(client);void NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);if(!id){profile.textContent='作者情報が指定されていません。';list.innerHTML='';return}try{const [p,f,n]=await Promise.all([client.from('profiles').select('display_name,bio').eq('id',id).maybeSingle(),client.from('founding_authors').select('founding_number').eq('author_id',id).maybeSingle(),client.from('novels').select('id,title,genre,description,pv,ai_usage,content_rating,status').eq('user_id',id).eq('status','published').order('created_at',{ascending:false})]);if(p.error)profile.innerHTML='<div class="empty">作者プロフィールを読み込めませんでした。時間をおいて再度お試しください。</div>';else profile.innerHTML=`<div class="name">${esc(p.data?.display_name||'名前未設定')}</div>${!f.error&&f.data?`<span class="founding">Founding Author #${String(f.data.founding_number).padStart(3,'0')}</span>`:''}<div class="bio">${esc(p.data?.bio||'')}</div>`;if(f.error)console.error(f.error);if(n.error){console.error(n.error);list.innerHTML='<div class="empty">公開作品を読み込めませんでした。時間をおいて再度お試しください。</div>';return}const rows=n.data||[];list.innerHTML=rows.length?rows.map(x=>`<a class="card" href="novel.html?id=${encodeURIComponent(x.id)}"><div class="badges"><span class="badge">${esc(x.genre||'未設定')}</span><span class="badge ai">${esc(ai[x.ai_usage]||'AI未申告')}</span>${x.content_rating==='mature'?'<span class="badge mature">内容注意</span>':''}</div><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.description||'')}</div><div class="meta">👁 ${Number(x.pv||0).toLocaleString()} PV</div></a>`).join(''):'<div class="empty">公開作品はまだありません。</div>'}catch(e){console.error(e);profile.innerHTML='<div class="empty">作者プロフィールを読み込めませんでした。時間をおいて再度お試しください。</div>';list.innerHTML='<div class="empty">公開作品を読み込めませんでした。時間をおいて再度お試しください。</div>'}})();</script></body></html>

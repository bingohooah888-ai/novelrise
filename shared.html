  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:900px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.mode{color:#7b5b00;font-size:12px;font-weight:900}
  </style>
<link rel="stylesheet" href="novelight-accessibility.css"></head>
<body class="novelight-theme novelight-page-shared"><a class="skip-link" href="#main-content">本文へスキップ</a>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">NOVELIGHT</a>
      <span class="mode">限定共有</span>
    </div>
  </header>
  <main id="main-content" tabindex="-1" class="limited-share-shell" data-limited-share-reader></main>

  <script src="/assets/vendor/supabase-js-2.112.3.js"></script>
  <script src="novelight-client.js"></script>
  <script src="novelight-prose.js"></script>
  <script src="novelight-limited-share.js"></script>
  <script>
    (() => {
      const client = supabase.createClient(
        'https://fiepaguycecrredwrcwx.supabase.co',
        'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE'
      );
      const mount = document.querySelector('[data-limited-share-reader]');

      async function render() {
        const params = new URLSearchParams(location.hash.slice(1));
        const token = params.get('token') || '';
        const rawEpisode = params.get('episode');
        const episodeNumber =
          rawEpisode && /^\d+$/u.test(rawEpisode) ? Number(rawEpisode) : null;

        await NovelightLimitedShare.mountReader({
          client,
          token,
          episodeNumber,
          mount
        });
      }

      addEventListener('hashchange', () => {
        void render();
      });
      void render();
    })();
  </script>
</body>

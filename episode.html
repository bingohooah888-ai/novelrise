<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>エピソード | NOVELIGHT</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button,select,textarea{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:900px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:820px;margin:auto;padding:42px 22px 100px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:38px 42px}.novel-title{color:#6d4aff;font-size:14px;font-weight:800;margin-bottom:20px}.number{color:#777;font-size:14px;margin-bottom:8px}h1{font-size:30px;line-height:1.5;margin-bottom:32px}.content{font-size:17px;line-height:2.1;white-space:pre-wrap;word-break:break-word}.meta{margin-top:42px;padding-top:18px;border-top:1px solid #eee;color:#888;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.action{padding:9px 13px;border-radius:8px;border:0;background:#6d4aff;color:#fff;font-weight:900;cursor:pointer}.action:disabled{opacity:.6;cursor:wait}.report{background:#fff;color:#666;border:1px solid #d8d8df}.delete{background:#fff;color:#d92d20;border:1px solid #d92d20}.warning{display:none;padding:24px;border:1px solid #f0c36a;border-radius:16px;background:#fffaf0}.warning.visible{display:block}.warning ul{margin:12px 0 16px;padding-left:20px}.error{padding:18px;background:#fff0f0;color:#b42318;border-radius:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.visible{display:flex}.modal-card{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:24px}.modal-card select,.modal-card textarea{width:100%;padding:11px;border:1px solid #d6d8df;border-radius:9px;margin-top:10px}.modal-card textarea{min-height:140px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.modal-actions button{padding:9px 13px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:800}.modal-actions .send{background:#6d4aff;color:#fff}.status{font-size:12px;color:#666;min-height:20px;margin-top:8px}@media(max-width:600px){main{padding:28px 16px 70px}.card{padding:26px 20px}h1{font-size:25px}.content{font-size:16px}.modal-actions{flex-direction:column}.modal-actions button{width:100%}}</style><link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide"></head><body class="novelight-theme novelight-page-episode"><header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a id="backLink" href="search.html" class="back">← 作品へ戻る</a></div></header><main><section id="warning" class="warning"><h2>内容に関する注意</h2><p style="margin-top:7px;color:#666">この作品には成熟したテーマまたは強い表現が含まれます。</p><ul id="warningList"></ul><button id="continue" class="action" type="button">内容を確認して読む</button></section><article id="card" class="card">読み込み中...</article></main><div id="modal" class="modal"><section class="modal-card"><h2>エピソードを通報</h2><p style="color:#666;font-size:13px;margin-top:7px">著作権侵害、禁止コンテンツ、不正等を運営へ報告します。</p><select id="category"><option value="">理由を選択</option><option value="copyright">著作権・無断転載</option><option value="prohibited_content">禁止コンテンツ・規約違反</option><option value="harassment">嫌がらせ・権利侵害</option><option value="spam">スパム・不正操作</option><option value="ai_misclassification">AI利用区分の虚偽申告</option><option value="other">その他</option></select><textarea id="details" maxlength="4000"></textarea><div class="modal-actions"><button id="cancel" type="button">キャンセル</button><button id="send" class="send" type="button">送信</button></div><div id="reportStatus" class="status"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const episodeId=new URLSearchParams(location.search).get('id');const labels={violence:'暴力・戦闘',gore:'残酷・流血描写',sexual_theme:'性的テーマへの言及',abuse:'虐待・ハラスメント',discrimination:'差別・偏見',self_harm:'自傷・自殺テーマ',crime:'犯罪・薬物',other:'その他の強い表現'};let episode,novel,session,isAuthor=false,unlocked=false,trackingStarted=false,validReadTrackingStarted=false;
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function visitor(){return NovelightClient.getVisitorToken()}function gateKey(){return'novelight:warning-ok:novel:'+String(novel?.id||'')}function newSessionId(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function warningAccepted(){try{return sessionStorage.getItem(gateKey())==='1'}catch(e){return false}}function rememberWarningAccepted(){try{sessionStorage.setItem(gateKey(),'1')}catch(e){console.error('warning gate persistence failed',e)}}
function novelNeedsGate(){return novel&&(novel.content_rating==='mature'||(novel.content_warnings||[]).length>0)}function warningItems(){const warnings=novel?.content_warnings||[];return warnings.length?warnings:['other']}
async function load(){await NovelightClient.captureAcquisition(client);await NovelightClient.recordVisit(client);try{const auth=await client.auth.getSession();session=auth.data.session;if(!episodeId){fail('エピソードIDが指定されていません。');return}const er=await client.from('episodes').select('id,novel_id,user_id,status,episode_number,title,pv').eq('id',episodeId).single();episode=er.data;if(er.error||!episode){fail('エピソードを読み込めませんでした。');return}const nr=await client.from('novels').select('id,title,user_id,status,content_rating,content_warnings').eq('id',episode.novel_id).single();novel=nr.data;if(nr.error||!novel){fail('作品情報を読み込めませんでした。');return}isAuthor=Boolean(session&&episode.user_id===session.user.id);const backLink=document.getElementById('backLink');if(backLink)backLink.href='novel.html?id='+encodeURIComponent(novel.id);if(!isAuthor&&novelNeedsGate()&&!warningAccepted()){showGate();return}await loadEpisodeContentAndRender()}catch(e){console.error(e);fail('エピソードを読み込めませんでした。時間をおいて再度お試しください。')}}
function fail(m){document.getElementById('warning').classList.remove('visible');document.getElementById('card').style.display='block';document.getElementById('card').innerHTML='<div class="error">'+esc(m)+'</div>'}
function showGate(){document.getElementById('warning').classList.add('visible');document.getElementById('warningList').innerHTML=warningItems().map(w=>'<li>'+esc(labels[w]||w)+'</li>').join('');document.getElementById('card').style.display='none'}
async function loadEpisodeContentAndRender(){const er=await client.from('episodes').select('id,novel_id,user_id,episode_number,title,content,status,pv').eq('id',episodeId).single();if(er.error||!er.data)throw er.error||new Error('episode content not found');if(String(er.data.novel_id)!==String(novel.id))throw new Error('episode novel mismatch');episode=er.data;unlocked=true;document.getElementById('warning').classList.remove('visible');document.getElementById('card').style.display='block';render();startTracking()}
function render(){document.getElementById('card').innerHTML=`<div class="novel-title"><a href="novel.html?id=${encodeURIComponent(novel.id)}">${esc(novel.title)}</a></div><div class="number">第${episode.episode_number}話</div><h1>${esc(episode.title)}</h1><div class="content">${esc(episode.content)}</div><div class="meta"><span id="episodePv">👁 ${Number(episode.pv||0).toLocaleString()} PV</span>${isAuthor?`<a class="action" href="episode-edit.html?id=${encodeURIComponent(episode.id)}">編集する</a><button id="delete" class="action delete" type="button">削除する</button>`:''}<button id="report" class="action report" type="button">通報</button></div>`;document.getElementById('report').onclick=()=>document.getElementById('modal').classList.add('visible');if(isAuthor)document.getElementById('delete').onclick=deleteEpisode;void updatePv()}
async function updatePv(){if(isAuthor||!unlocked)return;try{const r=await client.rpc('record_episode_pv',{p_episode_id:String(episode.id),p_visitor_token:visitor()});if(r.error){console.error('pv increment failed',r.error);return}if(r.data!==true)return;episode.pv=(episode.pv||0)+1;const pv=document.getElementById('episodePv');if(pv)pv.textContent='👁 '+Number(episode.pv||0).toLocaleString()+' PV'}catch(e){console.error('pv increment failed',e)}}
async function deleteEpisode(){if(!confirm('このエピソードを削除しますか？'))return;const button=document.getElementById('delete');button.disabled=true;try{const r=await client.from('episodes').delete().eq('id',episode.id).eq('user_id',session.user.id);if(r.error)throw r.error;location.href='novel.html?id='+encodeURIComponent(episode.novel_id)}catch(e){console.error(e);alert('削除できませんでした。時間をおいて再度お試しください。')}finally{button.disabled=false}}
function visibleReadingProgress(){const body=document.querySelector('.content');if(!body)return 0;const rect=body.getBoundingClientRect(),height=Math.max(body.scrollHeight,rect.height,1),visibleBottom=Math.min(height,Math.max(0,window.innerHeight-rect.top));return Math.max(0,Math.min(1,visibleBottom/height))}
function startValidReadTracking(){if(validReadTrackingStarted||isAuthor||!session||!unlocked)return;validReadTrackingStarted=true;const readSessionId=newSessionId();let clientSeq=0,interactionCount=0,maxProgress=0,lastInteractionAt=0,inFlight=false,stopped=false,timer=null;const interactionEvents=['scroll','wheel','pointerdown','touchstart','keydown'];function noteInteraction(){if(stopped||document.visibilityState!=='visible')return;const now=Date.now();if(now-lastInteractionAt<650)return;lastInteractionAt=now;interactionCount=Math.min(10000,interactionCount+1);maxProgress=Math.max(maxProgress,visibleReadingProgress())}function stop(){if(stopped)return;stopped=true;if(timer){clearInterval(timer);timer=null}interactionEvents.forEach(name=>window.removeEventListener(name,noteInteraction,{passive:true}));document.removeEventListener('visibilitychange',visibilityChanged);window.removeEventListener('pagehide',stop)}async function heartbeat(){if(stopped||inFlight||document.visibilityState!=='visible')return;inFlight=true;clientSeq+=1;maxProgress=Math.max(maxProgress,visibleReadingProgress());try{const r=await client.rpc('record_valid_read_progress',{p_episode_id:String(episode.id),p_session_id:readSessionId,p_progress_ratio:maxProgress,p_interaction_count:interactionCount,p_client_seq:clientSeq});if(r.error){if(r.error.code==='42883'||String(r.error.message||'').includes('record_valid_read_progress')){stop();return}console.error('valid read progress failed',r.error);return}if(r.data?.qualified===true)stop()}catch(e){console.error('valid read progress failed',e)}finally{inFlight=false}}function visibilityChanged(){if(document.visibilityState==='visible'){maxProgress=Math.max(maxProgress,visibleReadingProgress());void heartbeat()}}interactionEvents.forEach(name=>window.addEventListener(name,noteInteraction,{passive:true}));document.addEventListener('visibilitychange',visibilityChanged);window.addEventListener('pagehide',stop,{once:true});maxProgress=visibleReadingProgress();void heartbeat();timer=setInterval(()=>void heartbeat(),12000)}
function startTracking(){if(isAuthor||trackingStarted||!unlocked)return;trackingStarted=true;startValidReadTracking();let remaining=10000,started=null,timer=null,done=false;async function record(){if(done)return;done=true;pause();await Promise.all([client.rpc('record_novel_exposure_conversion',{p_event_type:'episode_read_10s',p_novel_id:String(episode.novel_id),p_episode_id:String(episode.id),p_visitor_token:visitor()}),NovelightClient.recordJourney(client,'episode_read_10s',episode.novel_id,episode.id)])}function pause(){if(started!==null){remaining=Math.max(0,remaining-(Date.now()-started));started=null}if(timer){clearTimeout(timer);timer=null}}function resume(){if(done||timer||document.visibilityState!=='visible')return;if(remaining<=0){record();return}started=Date.now();timer=setTimeout(()=>{timer=null;started=null;record()},remaining)}document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'?resume():pause());resume()}
document.getElementById('continue').onclick=async()=>{const b=document.getElementById('continue');b.disabled=true;try{rememberWarningAccepted();await loadEpisodeContentAndRender()}catch(e){console.error(e);fail('エピソードを読み込めませんでした。時間をおいて再度お試しください。')}finally{b.disabled=false}};document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('visible');document.getElementById('send').onclick=async()=>{const category=document.getElementById('category').value,details=document.getElementById('details').value.trim(),s=document.getElementById('reportStatus'),button=document.getElementById('send');if(!category||details.length<5){s.textContent='理由と具体的な内容を入力してください。';return}button.disabled=true;s.textContent='送信中...';try{const r=await client.rpc('submit_content_report',{p_novel_id:String(novel.id),p_episode_id:String(episode.id),p_category:category,p_details:details,p_visitor_token:visitor(),p_website:''});if(r.error){console.error(r.error);s.textContent='送信できませんでした。時間をおいて再度お試しください。';return}s.textContent='通報を受け付けました。';setTimeout(()=>document.getElementById('modal').classList.remove('visible'),700)}catch(e){console.error(e);s.textContent='送信できませんでした。時間をおいて再度お試しください。'}finally{button.disabled=false}};load();
</script></body></html>

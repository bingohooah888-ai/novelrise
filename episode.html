<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>エピソード | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 900px;
      height: 72px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #6d4aff;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 820px;
      margin: auto;
      padding: 50px 24px 100px;
    }

    .episode-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px 45px;
    }

    .novel-title {
      color: #6d4aff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .episode-number {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .content {
      font-size: 17px;
      line-height: 2.1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meta {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid #eee;

      color: #888;
      font-size: 13px;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 18px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {

      .episode-card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 25px;
      }

      .content {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      NovelRise
    </a>

    <a
      id="backLink"
      href="index.html"
      class="back"
    >
      ← 作品へ戻る
    </a>

  </div>
</header>


<main>

  <article
    id="episodeCard"
    class="episode-card"
  >
    読み込み中...
  </article>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function escapeHtml(value) {

    const div =
      document.createElement('div');

    div.textContent =
      value ?? '';

    return div.innerHTML;

  }


  function getVisitorToken() {

    const storageKey =
      'novelight_visitor_token';

    let token =
      localStorage.getItem(
        storageKey
      );

    if (
      token &&
      token.length >= 8
    ) {
      return token;
    }


    if (
      window.crypto &&
      typeof window.crypto.randomUUID ===
        'function'
    ) {

      token =
        window.crypto.randomUUID();

    } else {

      token =
        'visitor-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .slice(2);

    }


    localStorage.setItem(
      storageKey,
      token
    );

    return token;

  }


  function startVisibleReadTimer(
    novelId,
    episodeId
  ) {

    let remainingMs =
      10 * 1000;

    let visibleStartedAt =
      null;

    let timerId =
      null;

    let completed =
      false;


    function pauseTimer() {

      if (
        visibleStartedAt !== null
      ) {

        remainingMs =
          Math.max(
            0,
            remainingMs -
              (Date.now() -
                visibleStartedAt)
          );

        visibleStartedAt =
          null;

      }


      if (timerId !== null) {

        clearTimeout(timerId);
        timerId = null;

      }

    }


    async function recordRead() {

      if (completed) {
        return;
      }

      completed = true;
      pauseTimer();

      document.removeEventListener(
        'visibilitychange',
        handleVisibilityChange
      );


      const {
        error
      } =
        await supabaseClient.rpc(
          'record_novel_exposure_conversion',
          {
            p_event_type:
              'episode_read_10s',
            p_novel_id:
              String(novelId),
            p_episode_id:
              String(episodeId),
            p_visitor_token:
              getVisitorToken()
          }
        );


      if (error) {

        console.error(
          'episode exposure conversion failed',
          error
        );

      }

    }


    function resumeTimer() {

      if (
        completed ||
        timerId !== null ||
        document.visibilityState !==
          'visible'
      ) {
        return;
      }


      if (remainingMs <= 0) {

        void recordRead();
        return;

      }


      visibleStartedAt =
        Date.now();

      timerId =
        setTimeout(
          () => {

            timerId = null;
            visibleStartedAt = null;
            void recordRead();

          },
          remainingMs
        );

    }


    function handleVisibilityChange() {

      if (
        document.visibilityState ===
        'visible'
      ) {

        resumeTimer();

      } else {

        pauseTimer();

      }

    }


    document.addEventListener(
      'visibilitychange',
      handleVisibilityChange
    );

    resumeTimer();

  }


  async function loadEpisode() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const episodeId =
      params.get('id');


    const episodeCard =
      document.getElementById(
        'episodeCard'
      );


    if (!episodeId) {

      episodeCard.innerHTML =
        '<div class="error">' +
        'エピソードIDが指定されていません。' +
        '</div>';

      return;

    }


    const {
      data: episode,
      error
    } =
      await supabaseClient
        .from('episodes')
        .select('*')
        .eq(
          'id',
          episodeId
        )
        .single();


    if (
      error ||
      !episode
    ) {

      console.error(error);

      episodeCard.innerHTML =
        '<div class="error">' +
        'エピソードを読み込めませんでした。' +
        '</div>';

      return;

    }

    // ログイン中のユーザーを取得
const {
  data: { session: pvSession }
} = await supabaseClient.auth.getSession();

// 作者本人かどうか
const isAuthor =
  pvSession &&
  episode.user_id === pvSession.user.id;
// 同じエピソードは6時間に1回だけPVを増やす
const pvKey =
  'novelrise_pv_episode_' +
  episode.id;

const lastViewedAt =
  Number(
    localStorage.getItem(
      pvKey
    )
  ) || 0;

const now =
  Date.now();

const sixHours =
  6 * 60 * 60 * 1000;


if (
  !isAuthor &&
  now - lastViewedAt >=
  sixHours
) {

  const {
    error: pvError
  } =
    await supabaseClient.rpc(
      'increment_novel_pv',
      {
        target_novel_id:
          episode.novel_id
      }
    );
const {
  error: episodePvError
} =
  await supabaseClient.rpc(
    'increment_episode_pv',
    {
      target_episode_id:
        episode.id
    }
  );

if (episodePvError) {
  console.error(
    'エピソードPVの更新に失敗しました:',
    episodePvError
  );
} else {
  episode.pv =
    (episode.pv ?? 0) + 1;
}

  if (pvError) {

    console.error(
      'PVの更新に失敗しました:',
      pvError
    );

  } else {

    localStorage.setItem(
      pvKey,
      String(now)
    );

  }

}

    const {
      data: novel,
      error: novelError
    } =
      await supabaseClient
        .from('novels')
        .select(
          'id, title'
        )
        .eq(
          'id',
          episode.novel_id
        )
        .single();


    if (
      novelError ||
      !novel
    ) {

      console.error(novelError);

      episodeCard.innerHTML =
        '<div class="error">' +
        '作品情報を読み込めませんでした。' +
        '</div>';

      return;

    }


    document.getElementById(
      'backLink'
    ).href =
      'novel.html?id=' +
      novel.id;


    episodeCard.innerHTML = `

      <div class="novel-title">

        <a href="novel.html?id=${novel.id}">
          ${escapeHtml(novel.title)}
        </a>

      </div>


      <div class="episode-number">
        第${episode.episode_number}話
      </div>


      <h1>
        ${escapeHtml(episode.title)}
      </h1>


      <div class="content">${escapeHtml(episode.content)}</div>


      <div class="meta">
        👁 ${episode.pv ?? 0} PV
      </div>
<div id="authorActions" style="margin-top:20px; display:none;">
  <a
    id="editEpisodeButton"
    href="#"
    style="
      display:inline-block;
      padding:10px 18px;
      background:#6d4aff;
      color:white;
      border-radius:8px;
      font-weight:700;
    "
  >
    編集する
  </a>

  <button
    id="deleteEpisodeButton"
    type="button"
    style="
      display:inline-block;
      margin-left:10px;
      padding:10px 18px;
      background:white;
      color:#d92d20;
      border:1px solid #d92d20;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
    "
  >
    削除する
  </button>
</div>
    `;
    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (
      session &&
      episode.user_id === session.user.id
    ) {

      const authorActions =
        document.getElementById(
          'authorActions'
        );

      const editEpisodeButton =
        document.getElementById(
          'editEpisodeButton'
        );


      authorActions.style.display =
        'block';


      editEpisodeButton.href =
        'episode-edit.html?id=' +
        episode.id;
const deleteEpisodeButton =
  document.getElementById(
    'deleteEpisodeButton'
  );


deleteEpisodeButton.addEventListener(
  'click',
  async () => {

    const confirmed =
      confirm(
        'このエピソードを本当に削除しますか？\nこの操作は元に戻せません。'
      );


    if (!confirmed) {
      return;
    }


    deleteEpisodeButton.disabled =
      true;

    deleteEpisodeButton.textContent =
      '削除中...';


    const {
      error: deleteError
    } =
      await supabaseClient
        .from('episodes')
        .delete()
        .eq(
          'id',
          episode.id
        );


    if (deleteError) {

      console.error(
        deleteError
      );

      alert(
        '削除に失敗しました。\n' +
        deleteError.message
      );

      deleteEpisodeButton.disabled =
        false;

      deleteEpisodeButton.textContent =
        '削除する';

      return;
    }


    alert(
      'エピソードを削除しました。'
    );


    window.location.href =
      'novel.html?id=' +
      episode.novel_id;

  }
);
    }


    if (!isAuthor) {

      startVisibleReadTimer(
        episode.novel_id,
        episode.id
      );

    }

  }


  loadEpisode();

</script>

</body>
</html>

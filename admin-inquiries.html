<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>お問い合わせ管理 | NOVELIGHT ADMIN</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#0d0f1d;color:#f5f6fb}a{color:inherit;text-decoration:none}button,select,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2e46;background:rgba(13,15,29,.96);backdrop-filter:blur(12px)}.header-inner{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:20px;font-weight:950}.badge{margin-left:7px;color:#c8c3ff;font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost,.primary{border-radius:9px;padding:9px 12px;font-weight:850}.ghost{border:1px solid #373c59;background:#161927;color:#e8e9f1}.primary{border:0;background:#7658ff;color:#fff}.primary:disabled{opacity:.55;cursor:not-allowed}main{max-width:1240px;margin:auto;padding:28px 20px 70px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.hero h1{margin:0;font-size:29px}.hero p{max-width:680px;margin:7px 0 0;color:#979db7;line-height:1.6}.status{margin:12px 0;padding:11px 13px;border:1px solid #303650;border-radius:10px;background:#161927;color:#bfc4d6;font-size:13px}.status.error{border-color:#7b3440;color:#ffc0c7}.filters{display:grid;grid-template-columns:1.2fr repeat(5,minmax(120px,.65fr));gap:8px;margin:0 0 14px;padding:14px;border:1px solid #292e47;border-radius:13px;background:#141724}.filters label{display:grid;gap:5px;color:#8f96af;font-size:10px;font-weight:850}.filters input,.filters select{min-width:0;width:100%;padding:9px 10px;border:1px solid #343a56;border-radius:8px;background:#0e1120;color:#fff}.filter-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}.grid{display:grid;grid-template-columns:minmax(330px,.86fr) minmax(0,1.14fr);gap:16px}.panel{border:1px solid #292e47;background:#141724;border-radius:14px;padding:16px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:17px}.count{font-size:11px;color:#8f96af}.list{display:grid;gap:8px}.item{width:100%;text-align:left;border:1px solid #303650;border-radius:10px;background:#0f1220;color:#fff;padding:12px}.item:hover,.item.active{border-color:#806cff;background:#15182a}.subject{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:6px;color:#8f96af;font-size:10px;line-height:1.55;display:flex;gap:5px;align-items:center;flex-wrap:wrap}.chip{display:inline-block;padding:3px 6px;border-radius:999px;background:#242945;color:#d3d0ff;font-size:9px;font-weight:900}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.pager-info{font-size:11px;color:#8f96af}.detail{display:grid;gap:11px}.kv{padding:10px 11px;border-radius:9px;background:#0e1120}.kv span{display:block;color:#858ca8;font-size:10px;font-weight:900}.kv strong,.kv p{display:block;margin:5px 0 0;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65}.status-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status-form select{padding:9px;border:1px solid #373d5a;border-radius:9px;background:#0e1120;color:#fff}.reply-box{display:grid;gap:9px;margin-top:3px;padding:13px;border:1px solid #383e5b;border-radius:11px;background:#101321}.reply-box h3{margin:0;font-size:15px}.reply-box label{display:grid;gap:5px;color:#aeb4c8;font-size:10px;font-weight:900}.reply-box input,.reply-box textarea{width:100%;border:1px solid #39405d;border-radius:8px;background:#0b0e1a;color:#fff;padding:9px 10px;line-height:1.55}.reply-box textarea{min-height:180px;resize:vertical}.reply-hint,.privacy{margin:0;color:#858ca8;font-size:10px;line-height:1.6}.empty{padding:20px;text-align:center;color:#858ca8;border:1px dashed #343a54;border-radius:10px}.gate{max-width:640px;margin:60px auto;padding:24px;border:1px solid #393f5d;border-radius:14px;background:#151826}@media(max-width:980px){.filters{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:620px){.header-inner,.hero{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.actions{width:100%}.ghost{flex:1;text-align:center}.filter-actions{justify-content:stretch}.filter-actions button{flex:1}}
  </style>
  <link rel="stylesheet" href="novelight-accessibility.css">
</head>
<body><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><div class="brand">NOVELIGHT <span class="badge">ADMIN</span></div><div class="actions"><a class="ghost" href="admin.html">ダッシュボード</a><a class="ghost" href="admin-announcements.html">お知らせ</a><button id="logout" class="ghost" type="button">ログアウト</button></div></div></header>
<main id="main-content" tabindex="-1">
  <section id="gate" class="gate hidden"><h1 id="gateTitle">アクセスを確認しています</h1><p id="gateMessage">管理者権限を確認しています。</p></section>
  <div id="app" class="hidden">
    <section class="hero"><div><h1>お問い合わせ</h1><p>全件取得せず、サーバー側で20/50件ずつ取得します。ステータス・日付・ユーザー・カテゴリ・本文等から絞り込めます。</p></div></section>
    <form id="filters" class="filters">
      <label>検索<input id="q" type="search" placeholder="本文・件名・メール"></label>
      <label>ステータス<select id="filterStatus"><option value="">すべて</option><option value="new">未対応</option><option value="reviewing">対応中</option><option value="resolved">完了</option></select></label>
      <label>ユーザー<input id="filterUser" type="search" placeholder="名前・ID・メール"></label>
      <label>カテゴリ<input id="filterCategory" type="search" placeholder="general"></label>
      <label>開始日<input id="filterFrom" type="date"></label>
      <label>終了日<input id="filterTo" type="date"></label>
      <div class="filter-actions"><select id="pageSize" aria-label="1ページの件数"><option value="20">20件/ページ</option><option value="50">50件/ページ</option></select><button class="ghost" id="resetFilters" type="button">リセット</button><button class="primary" type="submit">絞り込む</button></div>
    </form>
    <div id="status" class="status">読み込み中...</div>
    <div class="grid">
      <section class="panel"><div class="panel-head"><h2>受信一覧</h2><span id="totalCount" class="count">—</span></div><div id="inquiryList" class="list"><div class="empty">読み込み中...</div></div><div class="pager"><button id="prevPage" class="ghost" type="button">← 前へ</button><span id="pageInfo" class="pager-info">—</span><button id="nextPage" class="ghost" type="button">次へ →</button></div></section>
      <section class="panel"><div class="panel-head"><h2>詳細</h2></div><div id="inquiryDetail" class="empty">問い合わせを選択してください。</div></section>
    </div>
  </div>
</main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="novelight-client.js"></script>
<script>
  const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
  let selectedId=null,currentPage=1,pageCount=1,total=0;
  const statusEl=document.getElementById('status');
  const dt=(value)=>value?new Date(value).toLocaleString('ja-JP'):'—';
  const statusLabel=(value)=>value==='resolved'?'完了':value==='reviewing'?'対応中':'未対応';
  function showGate(title,message){document.getElementById('app').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');document.getElementById('gateTitle').textContent=title;document.getElementById('gateMessage').textContent=message}
  function showApp(){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
  async function session(){const {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){location.href='login.html?redirect=admin-inquiries.html';return null}return session}
  async function adminFetch(url,options={}){const current=await session();if(!current)return null;const response=await fetch(url,{...options,headers:{Authorization:`Bearer ${current.access_token}`,Accept:'application/json','Content-Type':'application/json',...(options.headers||{})},cache:'no-store',credentials:'same-origin'});if(response.status===401){location.href='login.html?redirect=admin-inquiries.html';return null}if(response.status===403){showGate('アクセスできません','このアカウントにはNOVELIGHT ADMINの管理者権限がありません。');return null}if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.error||`ADMIN API ${response.status}`)}return response.json()}
  function queryString(){const p=new URLSearchParams({page:String(currentPage),pageSize:document.getElementById('pageSize').value});const values={q:'q',status:'filterStatus',user:'filterUser',category:'filterCategory',from:'filterFrom',to:'filterTo'};Object.entries(values).forEach(([key,id])=>{const value=document.getElementById(id).value.trim();if(value)p.set(key,value)});return p.toString()}
  function renderList(rows){const list=document.getElementById('inquiryList');list.replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='条件に一致する問い合わせはありません。';list.appendChild(empty);return}rows.forEach(row=>{const button=document.createElement('button');button.type='button';button.className='item'+(row.id===selectedId?' active':'');const subject=document.createElement('div');subject.className='subject';subject.textContent=row.subject;const meta=document.createElement('div');meta.className='meta';const chip=document.createElement('span');chip.className='chip';chip.textContent=statusLabel(row.status);const category=document.createElement('span');category.className='chip';category.textContent=row.category||'general';meta.append(chip,category,document.createTextNode(`#${row.id} / ${dt(row.created_at)} / ${row.email||'emailなし'}`));button.append(subject,meta);button.addEventListener('click',()=>void openDetail(row.id));list.appendChild(button)})}
  function renderPager(){document.getElementById('totalCount').textContent=`全 ${total.toLocaleString()} 件`;document.getElementById('pageInfo').textContent=`${currentPage} / ${pageCount} ページ`;document.getElementById('prevPage').disabled=currentPage<=1;document.getElementById('nextPage').disabled=currentPage>=pageCount}
  function kv(label,value,isBody=false){const box=document.createElement('div');box.className='kv';const l=document.createElement('span');l.textContent=label;const v=document.createElement(isBody?'p':'strong');v.textContent=value??'—';box.append(l,v);return box}
  function replyEditor(row){const box=document.createElement('section');box.className='reply-box';const heading=document.createElement('h3');heading.textContent='この問い合わせに返信';const recipient=document.createElement('p');recipient.className='reply-hint';recipient.textContent=`返信先：${row.email}`;const subjectLabel=document.createElement('label');subjectLabel.textContent='件名';const subject=document.createElement('input');subject.type='text';subject.maxLength=160;subject.value=`【NOVELIGHT】${row.subject}について`;subjectLabel.appendChild(subject);const bodyLabel=document.createElement('label');bodyLabel.textContent='返信本文';const body=document.createElement('textarea');body.maxLength=10000;body.placeholder='返信内容を入力してください。';bodyLabel.appendChild(body);const hint=document.createElement('p');hint.className='reply-hint';hint.textContent='送信成功後はステータスを「完了」へ変更します。';const send=document.createElement('button');send.type='button';send.className='primary';send.textContent='返信して完了にする';send.addEventListener('click',()=>void sendReply(row.id,subject,body,send));box.append(heading,recipient,subjectLabel,bodyLabel,hint,send);return box}
  function renderDetail(row){selectedId=row.id;const detail=document.getElementById('inquiryDetail');detail.className='detail';detail.replaceChildren();detail.append(kv('返信先メールアドレス',row.email),kv('件名',row.subject),kv('カテゴリ',row.category||'general'),kv('本文',row.message,true),kv('受信日時',dt(row.created_at)),kv('user_id',row.user_id||'—'));const form=document.createElement('div');form.className='status-form';const select=document.createElement('select');[['new','未対応'],['reviewing','対応中'],['resolved','完了']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;option.selected=row.status===value;select.appendChild(option)});const save=document.createElement('button');save.type='button';save.className='primary';save.textContent='ステータス変更';save.addEventListener('click',()=>void changeStatus(select.value));form.append(select,save);detail.append(form,replyEditor(row));const note=document.createElement('p');note.className='privacy';note.textContent='詳細情報は認証済み＋管理者allowlist確認済みのserver-side endpointからのみ取得します。';detail.appendChild(note)}
  async function openDetail(id){try{statusEl.className='status';statusEl.textContent='詳細を取得中...';const data=await adminFetch(`/api/admin-inquiries?id=${encodeURIComponent(id)}`);if(!data)return;renderDetail(data.inquiry);await loadList(false);statusEl.textContent=`問い合わせ #${id} を表示しています。`}catch(error){console.error(error);statusEl.className='status error';statusEl.textContent='詳細を取得できませんでした。'}}
  async function loadList(resetDetail=true){try{statusEl.className='status';statusEl.textContent='問い合わせを取得中...';const data=await adminFetch(`/api/admin-inquiries?${queryString()}`);if(!data)return;showApp();const p=data.pagination||{total:(data.inquiries||[]).length,page:1,pageSize:20,pageCount:1};total=p.total;currentPage=p.page;pageCount=p.pageCount||1;renderList(data.inquiries||[]);renderPager();if(resetDetail){selectedId=null;document.getElementById('inquiryDetail').className='empty';document.getElementById('inquiryDetail').textContent='問い合わせを選択してください。'}statusEl.textContent=`全${total.toLocaleString()}件のうち、このページに ${(data.inquiries||[]).length} 件を表示しています。`}catch(error){console.error(error);showApp();statusEl.className='status error';statusEl.textContent='問い合わせ一覧を取得できませんでした。'}}
  async function changeStatus(next){if(!selectedId)return;try{statusEl.className='status';statusEl.textContent='ステータスを更新中...';await adminFetch('/api/admin-inquiries',{method:'PATCH',body:JSON.stringify({id:selectedId,status:next})});await loadList(false);await openDetail(selectedId);statusEl.textContent=`${statusLabel(next)}へ変更しました。`}catch(error){console.error(error);statusEl.className='status error';statusEl.textContent='ステータスを変更できませんでした。'}}
  async function sendReply(id,subjectInput,bodyInput,button){const subject=subjectInput.value.trim();const message=bodyInput.value.trim();if(!subject||!message){statusEl.className='status error';statusEl.textContent='件名と返信本文を入力してください。';return}if(!window.confirm('この返信先へ実メールを1通送信し、成功後に「完了」へ変更します。送信しますか？'))return;button.disabled=true;try{statusEl.className='status';statusEl.textContent='返信メールを送信しています...';const data=await adminFetch('/api/admin-inquiry-reply',{method:'POST',body:JSON.stringify({id,subject,message})});if(!data)return;await loadList(false);await openDetail(id);statusEl.className='status';statusEl.textContent='返信メールを送信し、完了へ変更しました。'}catch(error){console.error(error);statusEl.className='status error';statusEl.textContent=error?.message||'返信メールを送信できませんでした。'}finally{button.disabled=false}}
  document.getElementById('filters').addEventListener('submit',event=>{event.preventDefault();currentPage=1;void loadList()});
  document.getElementById('resetFilters').addEventListener('click',()=>{document.getElementById('filters').reset();currentPage=1;void loadList()});
  document.getElementById('pageSize').addEventListener('change',()=>{currentPage=1;void loadList()});
  document.getElementById('prevPage').addEventListener('click',()=>{if(currentPage>1){currentPage-=1;void loadList()}});
  document.getElementById('nextPage').addEventListener('click',()=>{if(currentPage<pageCount){currentPage+=1;void loadList()}});
  document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();location.href='index.html'});
  void loadList();
</script>
</body>
</html>

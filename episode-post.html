<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>エピソード投稿 | NOVELIGHT</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px 76px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.field{margin-bottom:22px}label{display:block;font-weight:900;font-size:14px;margin-bottom:8px}input,textarea{width:100%;padding:12px 13px;border:1px solid #d6d8df;border-radius:9px;font:inherit}textarea{min-height:500px;resize:vertical;line-height:1.9}.buttons{display:flex;justify-content:flex-end;gap:10px}.btn{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.publish{border:0;background:#6d4aff;color:white}.publish:disabled{opacity:.6;cursor:not-allowed}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}textarea{min-height:360px}.buttons{flex-direction:column}.btn{width:100%;text-align:center}}</style></head><body><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header><main><h1>新しいエピソードを追加</h1><p id="novelTitle" style="color:#6b7280;margin:8px 0 24px">作品情報を読み込み中...</p><section class="card"><form id="form"><div class="field"><label for="episodeNumber">話数</label><input id="episodeNumber" type="number" min="1" required></div><div class="field"><label for="title">エピソードタイトル</label><input id="title" maxlength="150" required></div><div class="field"><label for="content">本文</label><textarea id="content" required></textarea></div><div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="publish" class="btn publish" type="submit" disabled>公開する</button></div><div id="status" class="status"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const novelId=new URLSearchParams(location.search).get('novel_id');const status=document.getElementById('status'),publish=document.getElementById('publish');let session=null,novel=null,ready=false,busy=false;
(async()=>{status.textContent='投稿画面を準備しています...';void NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);if(!novelId){status.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-post.html?novel_id='+novelId);return}const result=await client.from('novels').select('*').eq('id',novelId).single();novel=result.data;if(result.error||!novel||novel.user_id!==session.user.id)throw result.error||new Error('not authorized');document.getElementById('novelTitle').textContent=novel.title;document.getElementById('back').href='novel.html?id='+novelId;document.getElementById('cancel').href='novel.html?id='+novelId;const episodeResult=await client.from('episodes').select('episode_number').eq('novel_id',novelId).order('episode_number',{ascending:false}).limit(1);if(episodeResult.error)throw episodeResult.error;document.getElementById('episodeNumber').value=episodeResult.data?.length?Number(episodeResult.data[0].episode_number)+1:1;status.textContent='';ready=true;publish.disabled=false}catch(error){console.error(error);status.textContent='投稿画面の準備に失敗しました。再読み込みしてお試しください。';publish.disabled=true}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='投稿画面の準備が完了していません。';return}busy=true;publish.disabled=true;status.textContent='公開しています...';const args={p_novel_id:novelId,p_episode_number:Number(document.getElementById('episodeNumber').value),p_title:document.getElementById('title').value.trim(),p_content:document.getElementById('content').value};try{const result=await client.rpc('novelight_publish_episode_atomic',args);if(result.error)throw result.error;location.href='novel.html?id='+encodeURIComponent(novelId)}catch(error){console.error(error);status.textContent='エピソードを公開できませんでした。時間をおいて再度お試しください。'}finally{busy=false;publish.disabled=!ready}});
</script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>エピソード投稿 | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1000px;
      height: 72px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #6d4aff;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 50px 24px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #777;
    }

    .form-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 35px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .required {
      color: #e14c4c;
      font-size: 12px;
      margin-left: 4px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d8d8df;
      border-radius: 9px;
      padding: 13px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #6d4aff;
      box-shadow: 0 0 0 3px rgba(109, 74, 255, 0.1);
    }

    textarea {
      min-height: 500px;
      resize: vertical;
      line-height: 1.9;
    }

    .help {
      margin-top: 7px;
      color: #888;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 30px;
    }

    .cancel-button {
      padding: 13px 22px;
      border-radius: 9px;
      border: 1px solid #d6d6dc;
      background: white;
      color: #555;
      font-weight: 700;
    }

    .submit-button {
      padding: 13px 28px;
      border: none;
      border-radius: 9px;
      background: #6d4aff;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      NovelRise
    </a>

    <a
      id="backLink"
      href="my-novels.html"
      class="back"
    >
      ← 作品へ戻る
    </a>

  </div>
</header>


<main>

  <div class="page-title">
    <h1>新しいエピソードを追加</h1>

    <p id="novelTitle">
      作品情報を読み込み中...
    </p>
  </div>


  <div class="form-card">

    <form id="episodeForm">

      <div class="form-group">

        <label for="episodeNumber">
          話数
          <span class="required">必須</span>
        </label>

        <input
          id="episodeNumber"
          type="number"
          min="1"
          required
        >

      </div>


      <div class="form-group">

        <label for="title">
          エピソードタイトル
          <span class="required">必須</span>
        </label>

        <input
          id="title"
          type="text"
          maxlength="150"
          placeholder="例：第1話　始まりの日"
          required
        >

      </div>


      <div class="form-group">

        <label for="content">
          本文
          <span class="required">必須</span>
        </label>

        <textarea
          id="content"
          placeholder="小説本文を入力してください。"
          required
        ></textarea>

        <div class="help">
          改行もそのまま保存されます。
        </div>

      </div>


      <div class="buttons">

        <a
          id="cancelButton"
          href="my-novels.html"
          class="cancel-button"
        >
          キャンセル
        </a>

        <button
          id="submitButton"
          type="submit"
          class="submit-button"
        >
          公開する
        </button>

      </div>

    </form>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const params =
    new URLSearchParams(
      window.location.search
    );

  const novelId =
    params.get('novel_id');


  const form =
    document.getElementById(
      'episodeForm'
    );

  const submitButton =
    document.getElementById(
      'submitButton'
    );


  async function initializePage() {

    if (!novelId) {

      alert(
        '作品IDが指定されていません。'
      );

      window.location.href =
        'my-novels.html';

      return;
    }


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        'login.html';

      return;
    }


    const {
      data: novel,
      error
    } =
      await supabaseClient
        .from('novels')
        .select('*')
        .eq(
          'id',
          novelId
        )
        .single();


    if (
      error ||
      !novel
    ) {

      alert(
        '作品を読み込めませんでした。'
      );

      return;
    }


    if (
      novel.user_id !==
      session.user.id
    ) {

      alert(
        'この作品にエピソードを追加する権限がありません。'
      );

      window.location.href =
        'my-novels.html';

      return;
    }


    document.getElementById(
      'novelTitle'
    ).textContent =
      novel.title;


    document.getElementById(
      'backLink'
    ).href =
      'novel.html?id=' +
      novelId;


    document.getElementById(
      'cancelButton'
    ).href =
      'novel.html?id=' +
      novelId;


    const {
      data: episodes
    } =
      await supabaseClient
        .from('episodes')
        .select('episode_number')
        .eq(
          'novel_id',
          novelId
        )
        .order(
          'episode_number',
          {
            ascending: false
          }
        )
        .limit(1);


    let nextNumber = 1;


    if (
      episodes &&
      episodes.length > 0
    ) {

      nextNumber =
        episodes[0].episode_number + 1;

    }


    document.getElementById(
      'episodeNumber'
    ).value =
      nextNumber;

  }


  form.addEventListener(
    'submit',
    async (event) => {

      event.preventDefault();


      submitButton.disabled = true;
      submitButton.textContent =
        '投稿中...';


      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href =
          'login.html';

        return;
      }


      const episodeNumber =
        Number(
          document.getElementById(
            'episodeNumber'
          ).value
        );


      const title =
        document.getElementById(
          'title'
        ).value.trim();


      const content =
        document.getElementById(
          'content'
        ).value.trim();


      if (
        !episodeNumber ||
        !title ||
        !content
      ) {

        alert(
          'すべての必須項目を入力してください。'
        );

        submitButton.disabled = false;
        submitButton.textContent =
          '公開する';

        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from('episodes')
          .insert({
            novel_id:
              Number(novelId),

            user_id:
              session.user.id,

            episode_number:
              episodeNumber,

            title:
              title,

            content:
              content,

            status:
              'published',

            pv:
              0
          });


      if (error) {

        console.error(error);

        alert(
          'エピソードの投稿に失敗しました。\n' +
          error.message
        );

        submitButton.disabled = false;
        submitButton.textContent =
          '公開する';

        return;
      }


      alert(
        'エピソードを公開しました！'
      );


      window.location.href =
        'novel.html?id=' +
        novelId;

    }
  );


  initializePage();

</script>

</body>
</html>

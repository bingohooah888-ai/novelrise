<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>エピソード投稿 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px 76px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.field{margin-bottom:22px}label{display:block;font-weight:900;font-size:14px;margin-bottom:8px}input,textarea{width:100%;padding:12px 13px;border:1px solid #d6d8df;border-radius:9px;font:inherit}textarea{min-height:500px;resize:vertical;line-height:1.9}.buttons{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.btn{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.draft{border:1px solid #c9baa0;background:#fffaf0;color:#5f4930;cursor:pointer}.publish{border:0;background:#6d4aff;color:white;cursor:pointer}.draft:disabled,.publish:disabled{opacity:.6;cursor:not-allowed}.server-draft-copy{margin:0 0 18px;padding:11px 13px;border-radius:9px;background:#f7f3ea;color:#66553f;font-size:12px;line-height:1.7}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px}.light-ready{margin:0 0 24px;padding:18px;border:1px solid #ddd7f8;border-radius:12px;background:#faf9ff}.light-ready-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.light-ready-title{font-size:15px;font-weight:900;letter-spacing:.03em}.light-ready-badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#fff3e6;color:#8a4b08;font-size:11px;font-weight:900;white-space:nowrap}.light-ready-badge.ready{background:#ecfdf3;color:#16803d}.light-ready-copy{margin:9px 0 13px;color:#5f6270;font-size:12px;line-height:1.7}.light-ready-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.light-ready-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #e5e2f2;border-radius:9px;background:#fff}.light-ready-label{font-size:13px;font-weight:800;line-height:1.5}.light-ready-state{flex:0 0 auto;font-size:11px;font-weight:900;color:#a15c11}.light-ready-state.ok{color:#16803d}.light-ready-edit{display:inline-block;margin-top:12px;color:#5d42c8;font-size:12px;font-weight:900}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}textarea{min-height:360px}.buttons{flex-direction:column}.btn{width:100%;text-align:center}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
</head>
<body class="novelight-theme novelight-page-episode-post">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main>
  <h1>新しいエピソードを追加</h1>
  <p id="novelTitle" style="color:#6b7280;margin:8px 0 24px">作品情報を読み込み中...</p>
  <section class="card">
    <form id="form">
      <section id="lightReady" class="light-ready" hidden aria-live="polite"><div class="light-ready-head"><div class="light-ready-title">LIGHT READY｜公開前チェック</div><span id="lightReadySummary" class="light-ready-badge">確認中</span></div><p class="light-ready-copy">作品の良し悪しは判定しません。初回公開前に、作品情報・内容区分・第1話の準備だけを確認します。</p><ul id="lightReadyList" class="light-ready-list"></ul><a id="lightReadyEdit" class="light-ready-edit" href="#">作品情報を見直す →</a></section>
      <p class="server-draft-copy">「サーバーに下書き保存」するとアカウントに保存され、別の端末からも続きを編集できます。端末自動保存は予備のバックアップとして併用されます。</p>
      <div class="field"><label for="episodeNumber">話数</label><input id="episodeNumber" type="number" min="1" required></div>
      <div class="field"><label for="title">エピソードタイトル</label><input id="title" maxlength="150" required></div>
      <div class="field"><label for="content">本文</label><textarea id="content" maxlength="100000" required></textarea></div>
      <div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="saveDraft" class="btn draft" type="button" disabled>サーバーに下書き保存</button><button id="publish" class="btn publish" type="submit" disabled>公開する</button></div>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const novelId=new URLSearchParams(location.search).get('novel_id');
const status=document.getElementById('status'),publish=document.getElementById('publish'),saveDraft=document.getElementById('saveDraft'),lightReady=document.getElementById('lightReady'),lightReadySummary=document.getElementById('lightReadySummary'),lightReadyList=document.getElementById('lightReadyList'),lightReadyEdit=document.getElementById('lightReadyEdit');
let session=null,novel=null,ready=false,busy=false;
function setBusy(value){busy=value;publish.disabled=value||!ready;saveDraft.disabled=value||!ready}
function clearLocalDraftBeforeNavigation(){window.NovelightAuthorDraft?.clearCurrentDraft?.();window.addEventListener('pagehide',()=>window.NovelightAuthorDraft?.clearCurrentDraft?.(),{once:true})}
function authorValues(){return{episodeNumber:Number(document.getElementById('episodeNumber').value),title:document.getElementById('title').value.trim(),content:document.getElementById('content').value}}
function validateCommon({episodeNumber,title,content},requireBody){if(!Number.isFinite(episodeNumber)||episodeNumber<1)return'話数は1以上で入力してください。';if(title.length>150)return'エピソードタイトルは150文字以内で入力してください。';if(requireBody&&title.length<1)return'エピソードタイトルを入力してください。';if(requireBody&&content.trim().length<1)return'本文を入力してください。';if(content.length>100000)return'本文は100,000文字以内で入力してください。';return''}
function lightReadyChecks(){const values=authorValues();const workInfoReady=Boolean(novel?.title?.trim()&&novel?.genre?.trim()&&novel?.description?.trim());const rating=String(novel?.content_rating||'').trim(),warnings=Array.isArray(novel?.content_warnings)?novel.content_warnings:[];const contentPolicyReady=rating==='general'||(rating==='mature'&&warnings.length>0);return[{label:'作品タイトル・ジャンル・あらすじ',ok:workInfoReady},{label:'内容区分・内容警告',ok:contentPolicyReady},{label:'第1話として公開',ok:values.episodeNumber===1},{label:'第1話タイトル',ok:values.title.length>=1&&values.title.length<=150},{label:'第1話本文',ok:values.content.trim().length>=1&&values.content.length<=100000}]}
function renderLightReady(){if(!novel||novel.status!=='draft'){lightReady.hidden=true;return}lightReady.hidden=false;lightReadyEdit.href='novel-edit.html?id='+encodeURIComponent(novelId);const checks=lightReadyChecks(),remaining=checks.filter(item=>!item.ok).length;lightReadySummary.textContent=remaining===0?'公開準備OK':`あと${remaining}項目を確認`;lightReadySummary.classList.toggle('ready',remaining===0);lightReadyList.replaceChildren();checks.forEach(item=>{const row=document.createElement('li');row.className='light-ready-item';const label=document.createElement('span');label.className='light-ready-label';label.textContent=item.label;const state=document.createElement('span');state.className='light-ready-state'+(item.ok?' ok':'');state.textContent=item.ok?'OK':'要確認';row.append(label,state);lightReadyList.appendChild(row)})}
['episodeNumber','title','content'].forEach(id=>document.getElementById(id).addEventListener('input',renderLightReady));
(async()=>{status.textContent='投稿画面を準備しています...';void NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);if(!novelId){status.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-post.html?novel_id='+novelId);return}const result=await client.from('novels').select('*').eq('id',novelId).single();novel=result.data;if(result.error||!novel||novel.user_id!==session.user.id)throw result.error||new Error('not authorized');document.getElementById('novelTitle').textContent=novel.title;document.getElementById('back').href='novel.html?id='+novelId;document.getElementById('cancel').href='novel.html?id='+novelId;const episodeResult=await client.from('episodes').select('episode_number').eq('novel_id',novelId).order('episode_number',{ascending:false}).limit(1);if(episodeResult.error)throw episodeResult.error;document.getElementById('episodeNumber').value=episodeResult.data?.length?Number(episodeResult.data[0].episode_number)+1:1;renderLightReady();status.textContent='';ready=true;setBusy(false)}catch(error){console.error(error);status.textContent='投稿画面の準備に失敗しました。再読み込みしてお試しください。';ready=false;setBusy(false)}})();
saveDraft.addEventListener('click',async()=>{if(!ready||busy)return;const values=authorValues(),validation=validateCommon(values,false);if(validation){status.textContent=validation;return}setBusy(true);status.textContent='サーバーに下書き保存しています...';try{const result=await client.rpc('novelight_save_episode_draft',{p_novel_id:novelId,p_episode_id:null,p_episode_number:values.episodeNumber,p_title:values.title,p_content:values.content});if(result.error)throw result.error;const draftId=Number(result.data);if(!Number.isFinite(draftId)||draftId<1)throw new Error('下書きIDを確認できませんでした。');clearLocalDraftBeforeNavigation();location.href='episode-edit.html?id='+encodeURIComponent(draftId)}catch(error){console.error(error);status.textContent=String(error?.message||'下書きを保存できませんでした。時間をおいて再度お試しください。');setBusy(false)}});
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='投稿画面の準備が完了していません。';return}const values=authorValues(),validation=validateCommon(values,true);if(validation){status.textContent=validation;return}if(novel?.status==='draft'&&values.episodeNumber!==1){status.textContent='初回公開は第1話として登録してください。';return}setBusy(true);status.textContent='公開しています...';const args={p_novel_id:novelId,p_episode_number:values.episodeNumber,p_title:values.title,p_content:values.content};try{const result=await client.rpc('novelight_publish_episode_atomic',args);if(result.error)throw result.error;clearLocalDraftBeforeNavigation();location.href='novel.html?id='+encodeURIComponent(novelId)}catch(error){console.error(error);status.textContent='エピソードを公開できませんでした。時間をおいて再度お試しください。';setBusy(false)}});
</script>
<script src="novelight-author-draft.js"></script>
</body>
</html>

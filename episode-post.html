<!DOCTYPE html>
<html lang="ja">

  <title>エピソード投稿 | NOVELIGHT</title>
  <style>

    .light-ready-badge.ready{background:#ecfdf3;color:#16803d}
    .light-ready-edit{display:inline-block;margin-top:10px;color:#5d42c8;font-size:12px;font-weight:900}
    .visually-hidden-actions{display:none!important}

    .settings-drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid #ececf0}
    .drawer-head h2{margin:0;font-size:18px}
    .drawer-close{width:38px;height:38px;border:1px solid #dddde3;border-radius:9px;background:#fff;color:#555;font-size:20px;cursor:pointer}

    .drawer-pane label{display:block;margin-bottom:8px;font-size:13px;font-weight:900}
    .drawer-pane select,.drawer-pane input{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px;background:#fff}
    .drawer-note{margin:9px 0 16px;color:#736c63;font-size:12px;line-height:1.7}

      .writing-surface{padding:24px 18px 30px;border-radius:12px}
      html body.novelight-theme.novelight-page-episode-post .writing-surface #title{font-size:23px!important}
      html body.novelight-theme.novelight-page-episode-post .writing-surface #content{height:64vh!important;min-height:480px!important;font-size:16px!important;padding-top:16px!important}
      .settings-drawer{top:auto;bottom:0;width:100%;height:min(78vh,720px);transform:translateY(105%);border-radius:18px 18px 0 0}
      .settings-drawer.open{transform:translateY(0)}

    @media(max-width:470px){
      .editor-toolbar{align-items:flex-start;flex-direction:column}

      .editor-tools{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
      .tool-button,.publish{width:100%;padding:8px 5px}
    }

<body class="novelight-theme novelight-page-episode-post"><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main id="main-content" tabindex="-1">
  <div class="editor-head"><p id="novelTitle" class="novel-title">作品情報を読み込み中...</p></div>
  <form id="form">
    <div class="editor-toolbar" aria-label="執筆ツール">
      <div class="save-cluster"><span id="saveState" class="save-state" aria-live="polite">自動保存</span></div>
      <div class="editor-tools">
        <button id="openChapterSettings" class="tool-button" type="button" disabled>章</button>
        <button id="openIllustrationEditor" class="tool-button" type="button" disabled>挿絵</button>
        <button id="openScheduleSettings" class="tool-button" type="button" disabled>予約</button>
        <button id="publish" class="publish" type="submit" disabled>公開</button>
      </div>
    </div>

    <section class="writing-surface">
      <div id="episodeHeading" class="episode-label">第—話</div>
      <input id="episodeNumber" type="number" min="1" required readonly aria-hidden="true">
      <div class="title-field"><label class="skip-link" for="title">エピソードタイトル</label><input id="title" maxlength="150" required placeholder="エピソードタイトル"></div>
      <div class="body-field"><label class="body-label" for="content">本文</label><textarea id="content" maxlength="100000" required placeholder="本文を入力"></textarea></div>
      <div id="status" class="status" aria-live="polite"></div>
      <details id="lightReady" class="light-ready" hidden><summary>公開チェック <span id="lightReadySummary" class="light-ready-badge">確認中</span></summary><div class="light-ready-body"><p class="light-ready-copy">初回公開前に、作品情報・内容区分・第1話の準備を確認します。</p><ul id="lightReadyList" class="light-ready-list"></ul><a id="lightReadyEdit" class="light-ready-edit" href="#">作品情報を見直す →</a></div></details>
    </section>

    <div class="visually-hidden-actions" aria-hidden="true"><a id="cancel" href="my-novels.html">キャンセル</a><button id="saveDraft" type="button" disabled>サーバーに下書き保存</button></div>
  </form>
</main>

<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="settingsDrawer" class="settings-drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-head"><h2 id="drawerTitle">設定</h2><button id="closeDrawer" class="drawer-close" type="button" aria-label="設定を閉じる">×</button></div>
  <div class="drawer-body">
    <section id="chapterPane" class="drawer-pane" hidden>
      <label for="chapterId">この話の章</label>
      <select id="chapterId"><option value="">章なし</option></select>
      <p class="drawer-note">既存の章を選択できます。章の追加や話の並び替えは管理画面で行えます。</p>
      <a id="manageStructureLink" class="drawer-action" href="#">章・並び順管理を開く</a>
    </section>
    <section id="illustrationPane" class="drawer-pane" hidden>
      <p class="drawer-note">本文で挿入したい位置にカーソルを置いたまま、ここから画像を追加してください。</p>
      <div id="episodeIllustrationsMount"></div>
    </section>
    <section id="schedulePane" class="drawer-pane" hidden>
      <label for="scheduleAt">予約公開日時</label>
      <input id="scheduleAt" type="datetime-local" step="60">
      <p class="drawer-note">日時を指定して予約すると、この話を予約したまま次のエピソード作成へ進みます。</p>
      <button id="scheduleNext" class="drawer-action primary" type="button" disabled>予約して次の話へ</button>
    </section>
  </div>
</aside>

<script src="/assets/vendor/supabase-js-2.112.3.js"></script><script src="novelight-client.js"></script><script src="novelight-episode-illustrations.js"></script>

const status=document.getElementById('status'),publish=document.getElementById('publish'),saveDraft=document.getElementById('saveDraft'),scheduleNext=document.getElementById('scheduleNext'),scheduleAt=document.getElementById('scheduleAt'),chapterSelect=document.getElementById('chapterId'),lightReady=document.getElementById('lightReady'),lightReadySummary=document.getElementById('lightReadySummary'),lightReadyList=document.getElementById('lightReadyList'),lightReadyEdit=document.getElementById('lightReadyEdit'),openIllustrationEditor=document.getElementById('openIllustrationEditor'),openChapterSettings=document.getElementById('openChapterSettings'),openScheduleSettings=document.getElementById('openScheduleSettings'),episodeIllustrationsMount=document.getElementById('episodeIllustrationsMount'),content=document.getElementById('content'),titleInput=document.getElementById('title'),episodeHeading=document.getElementById('episodeHeading'),saveState=document.getElementById('saveState'),settingsDrawer=document.getElementById('settingsDrawer'),drawerBackdrop=document.getElementById('drawerBackdrop'),drawerTitle=document.getElementById('drawerTitle'),chapterPane=document.getElementById('chapterPane'),illustrationPane=document.getElementById('illustrationPane'),schedulePane=document.getElementById('schedulePane'),manageStructureLink=document.getElementById('manageStructureLink');

document.getElementById('closeDrawer').addEventListener('click',closeDrawer);drawerBackdrop.addEventListener('click',closeDrawer);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&settingsDrawer.classList.contains('open'))closeDrawer()});

(async()=>{status.textContent='投稿画面を準備しています...';void NovelightClient.recordVisit(client);void NovelightClient.claimAcquisition(client);if(!novelId){status.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-post.html?novel_id='+novelId);return}const result=await client.from('novels').select('*').eq('id',novelId).single();novel=result.data;if(result.error||!novel||novel.user_id!==session.user.id)throw result.error||new Error('not authorized');document.getElementById('novelTitle').textContent=novel.title;document.getElementById('back').href='novel.html?id='+novelId;document.getElementById('cancel').href='novel.html?id='+novelId;manageStructureLink.href='episode-structure.html?novel_id='+encodeURIComponent(novelId);const [chapterResult,episodeResult]=await Promise.all([client.from('novel_chapters').select('id,title,position').eq('novel_id',novelId).order('position',{ascending:true}),client.from('episodes').select('episode_number').eq('novel_id',novelId).order('episode_number',{ascending:false}).limit(1)]);if(chapterResult.error)throw chapterResult.error;if(episodeResult.error)throw episodeResult.error;chapterSelect.replaceChildren(new Option('章なし',''));(chapterResult.data||[]).forEach(chapter=>chapterSelect.add(new Option(chapter.title,String(chapter.id))));const nextEpisode=episodeResult.data?.length?Number(episodeResult.data[0].episode_number)+1:1;document.getElementById('episodeNumber').value=nextEpisode;episodeHeading.textContent=`第${nextEpisode}話`;scheduleAt.min=localDateTimeValue(new Date(Date.now()+3*60*1000));scheduleAt.max=localDateTimeValue(new Date(Date.now()+365*24*60*60*1000));renderLightReady();status.textContent='';ready=true;setBusy(false);setSaveState('自動保存')}catch(error){console.error(error);status.textContent='投稿画面の準備に失敗しました。再読み込みしてお試しください。';ready=false;setBusy(false)}})();

openIllustrationEditor.addEventListener('click',async()=>{if(!ready||busy)return;openDrawer('illustration');await waitForAutoSave();setBusy(true);status.textContent=illustrationEditorMounted?'':'挿絵を準備しています...';try{await mountIllustrationEditor();status.textContent=''}catch(error){console.error(error);status.textContent=String(error?.message||'挿絵機能を開けませんでした。時間をおいて再度お試しください。')}finally{setBusy(false)}});
saveDraft.addEventListener('click',async()=>{if(!ready||busy)return;await waitForAutoSave();const values=authorValues(),validation=validateCommon(values,false);if(validation){status.textContent=validation;return}setBusy(true);status.textContent='下書きを保存しています...';let navigating=false;try{const draftId=await persistDraft(values);navigating=true;clearLocalDraftBeforeNavigation();location.href='episode-edit.html?id='+encodeURIComponent(draftId)}catch(error){console.error(error);status.textContent=String(error?.message||'下書きを保存できませんでした。時間をおいて再度お試しください。')}finally{if(!navigating)setBusy(false)}});
scheduleNext.addEventListener('click',async()=>{if(!ready||busy)return;await waitForAutoSave();const values=authorValues(),validation=validateCommon(values,true);if(validation){status.textContent=validation;return}if(novel?.status==='draft'&&values.episodeNumber!==1){status.textContent='初回公開は第1話として予約してください。';return}const requested=new Date(scheduleAt.value);if(!scheduleAt.value||!Number.isFinite(requested.getTime())){status.textContent='予約する公開日時を入力してください。';return}if(requested.getTime()<Date.now()+2*60*1000){status.textContent='予約日時は現在より2分以上先に設定してください。';return}if(requested.getTime()>Date.now()+365*24*60*60*1000){status.textContent='予約日時は1年以内に設定してください。';return}setBusy(true);status.textContent='予約しています...';let navigating=false;try{const draftId=await persistDraft(values);const result=await client.rpc('novelight_schedule_episode_draft',{p_episode_id:draftId,p_publish_at:requested.toISOString()});if(result.error)throw result.error;navigating=true;dirty=false;clearLocalDraftBeforeNavigation();location.href='episode-post.html?novel_id='+encodeURIComponent(novelId)}catch(error){console.error(error);status.textContent=pendingDraftId?'下書きは保存済みですが、予約できませんでした。日時と公開条件を確認してもう一度お試しください。':'予約できませんでした。日時と公開条件を確認してもう一度お試しください。'}finally{if(!navigating)setBusy(false)}});
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();if(!ready||busy){if(!ready)status.textContent='投稿画面の準備が完了していません。';return}await waitForAutoSave();const values=authorValues(),episodeNumber=values.episodeNumber,validation=validateCommon(values,true);if(validation){status.textContent=validation;return}if(novel?.status==='draft'&&episodeNumber!==1){status.textContent='初回公開は第1話として登録してください。';return}setBusy(true);status.textContent='公開しています...';let navigating=false;try{let publishedId;if(pendingDraftId){const draftId=await persistDraft(values);const result=await client.rpc('novelight_publish_episode_draft_atomic',{p_episode_id:draftId});if(result.error)throw result.error;publishedId=draftId}else{const args={p_novel_id:novelId,p_episode_number:episodeNumber,p_title:values.title,p_content:values.content};const result=await client.rpc('novelight_publish_episode_atomic',args);if(result.error)throw result.error;publishedId=Number(result.data);if(!Number.isFinite(publishedId)||publishedId<1)throw new Error('公開したエピソードIDを確認できませんでした。')}const chapterResult=await client.from('episodes').update({chapter_id:values.chapterId}).eq('id',publishedId).eq('novel_id',novelId).eq('user_id',session.user.id);if(chapterResult.error)throw chapterResult.error;navigating=true;dirty=false;clearLocalDraftBeforeNavigation();location.href='novel.html?id='+encodeURIComponent(novelId)}catch(error){console.error(error);status.textContent='エピソードを公開できませんでした。時間をおいて再度お試しください。'}finally{if(!navigating)setBusy(false)}});
</script>

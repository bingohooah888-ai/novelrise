<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>コンテスト順位発表管理 | NOVELIGHT ADMIN</title>
  <link rel="stylesheet" href="novelight-accessibility.css">
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#10131b;color:#f6f7fa}
    header{padding:20px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid #313b4c}
    a{color:#c7bdff}
    main{max-width:1020px;margin:auto;padding:25px 20px 70px}
    h1{font-size:26px} h2{font-size:19px}
    p{line-height:1.7}
    .notice{padding:16px;border:1px solid #726239;border-radius:9px;background:#241f17;color:#f5dda6}
    .card{background:#171d29;border:1px solid #343c4c;border-radius:10px;margin:18px 0;padding:17px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .muted{color:#acb5c8;font-size:13px}
    button,select,textarea,input{font:inherit}
    button{padding:11px 16px;border:1px solid #8775d8;background:#48358f;color:#fff;border-radius:8px;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #eed081;outline-offset:3px}
    select,textarea,input{padding:11px;border:1px solid #61708a;border-radius:7px;background:#111723;color:#fff;width:100%;margin:8px 0}
    textarea{min-height:100px}
    label{display:block;margin-top:18px}
    .danger{background:#7e3434;border-color:#d27f7f}
    .table-container{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:580px}
    td,th{padding:11px;border-bottom:1px solid #394356;text-align:left}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<a class="skip-link" href="#main-content">本文へスキップ</a>
<header><strong>NOVELIGHT / 中間ランキング発表管理</strong><nav><a href="admin.html">管理ダッシュボード</a>　<a href="admin-contest-review.html">読書審査</a></nav></header>
<main id="main-content" tabindex="-1">
  <h1>11月コンテスト・発表操作</h1>
  <p class="notice">ランキングの下書き準備と、読者に順位を公開する「発表」は別の操作です。運営判断なしに発表しません。受賞確定・賞金振込はこの画面では実施しません。</p>
  <div id="status" role="status" aria-live="polite">管理者認証を確認しています。</div>
  <section id="workspace" hidden>
    <p class="muted" id="contestInfo"></p>
    <div class="card">
      <label for="slot">発表日</label>
      <select id="slot">
        <option value="1">11月7日 12:00 JST</option>
        <option value="2">11月15日 12:00 JST</option>
        <option value="3">11月22日 12:00 JST</option>
      </select>
      <button id="refresh" type="button">最新状態を取得</button>
      <p id="slotStatus" class="muted"></p>
      <div class="table-container">
        <table><thead><tr><th>順位</th><th>作品エントリーID</th><th>ポイント</th><th>有効読者</th></tr></thead><tbody id="previewRows"></tbody></table>
      </div>
      <p class="muted">表示は運営専用のスナップショットです。未発表の順位は読者に公開されません。</p>
    </div>
    <div class="card">
      <h2>操作を記録する</h2>
      <label for="note">確認した証拠・判断理由（20〜500文字、必須）</label>
      <textarea id="note" minlength="20" maxlength="500" placeholder="当該回の読書記録、不正疑義、作品の適格性を確認した内容を記録"></textarea>
      <div class="row">
        <button id="prepare" type="button">下書きを確定・再計算</button>
      </div>
      <label for="confirm">一般公開の最終確認：発表するときだけ「発表承認」と入力</label>
      <input id="confirm" autocomplete="off" placeholder="発表承認">
      <button id="publish" class="danger" type="button">順位を一般公開する</button>
      <p class="muted">公開操作には管理者権限、サーバー側の明示的な機能フラグ、発表時刻の到達、下書き内容の一致が必要です。</p>
    </div>
  </section>
</main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="admin-contest-rankings.js"></script>
</body>
</html>

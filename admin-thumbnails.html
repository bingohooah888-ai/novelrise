<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>公式サムネイル素材管理 | NOVELIGHT ADMIN</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#0f1020;color:#f4f4f8}a{color:inherit;text-decoration:none}button,input,select{font:inherit}header{border-bottom:1px solid #292b47;background:#0f1020}.header-inner{max-width:1220px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:21px;font-weight:950}.back{padding:9px 12px;border:1px solid #393c61;border-radius:9px;background:#17182c;color:#ddd;font-weight:850}main{max-width:1220px;margin:auto;padding:36px 22px 80px}h1{margin:0 0 8px;font-size:31px}.lead{margin:0 0 24px;color:#a9abc2;line-height:1.7}.panel{padding:22px;border:1px solid #303253;border-radius:15px;background:#17182c}.upload-form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:end}.field{grid-column:span 3}.field.file{grid-column:span 4}.field label{display:block;margin-bottom:7px;color:#c8cada;font-size:12px;font-weight:850}.field input,.field select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #393c61;border-radius:9px;background:#101121;color:#fff}.primary{grid-column:span 2;min-height:44px;padding:10px 16px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font-weight:900;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.help{margin:12px 0 0;color:#8589a8;font-size:11px;line-height:1.7}.status{min-height:48px;margin:18px 0;padding:13px 15px;border:1px solid #303253;border-radius:11px;background:#151629;color:#b7bad0}.status.error{border-color:#7c3039;background:#2a161a;color:#ffb8c0}.status.ok{border-color:#285d4d;background:#11271f;color:#9fe4cd}.status.warn{border-color:#6a5522;background:#241e11;color:#f0d990}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 12px}.section-head h2{margin:0;font-size:20px}.section-head span{color:#8589a8;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.filters select{min-height:40px;padding:8px 10px;border:1px solid #353857;border-radius:8px;background:#151629;color:#eee}.library{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.asset{overflow:hidden;border:1px solid #303253;border-radius:13px;background:#17182c}.asset img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#0b0c18}.asset-copy{padding:12px}.asset-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{padding:3px 6px;border-radius:999px;background:#252743;color:#c8cada;font-size:9px;font-weight:850}.tag.active{background:#173c31;color:#9fe4cd}.tag.retired{background:#3a321d;color:#edd28b}.tag.emergency_disabled{background:#4a2027;color:#ffbac1}.asset-meta{margin-top:8px;color:#8589a8;font-size:10px;line-height:1.5}.asset-actions{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}.asset-actions select{min-height:36px;padding:7px 8px;border:1px solid #3a3d60;border-radius:7px;background:#101121;color:#eee;font-size:11px}.empty{grid-column:1/-1;padding:32px;border:1px dashed #343755;border-radius:12px;color:#8589a8;text-align:center}.legacy-note{display:none;margin-top:12px;padding:11px;border:1px solid #67582f;border-radius:8px;background:#231f14;color:#e3cf91;font-size:11px;line-height:1.6}@media(max-width:980px){.field,.field.file{grid-column:span 6}.primary{grid-column:span 4}.library{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){main{padding:28px 15px 60px}.header-inner{padding:10px 15px}.field,.field.file,.primary{grid-column:1/-1}.library{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:390px){.library{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="header-inner"><div class="brand">NOVELIGHT <span style="color:#b8adff">ADMIN</span></div><a class="back" href="admin.html">← 管理画面へ戻る</a></div></header>
<main>
  <h1>公式サムネイル素材管理</h1>
  <p class="lead">1086×1448（3:4）の公式素材をレイヤー別に登録します。作者が選べるのはここで「公開中」にした素材だけです。</p>
  <section class="panel">
    <form id="uploadForm" class="upload-form">
      <div class="field file"><label for="thumbnailFile">素材ファイル（WebP / PNG / JPEG、最大5MB）</label><input id="thumbnailFile" type="file" accept="image/webp,image/png,image/jpeg" required></div>
      <div class="field"><label for="thumbnailLabel">表示名</label><input id="thumbnailLabel" maxlength="80" placeholder="例：深夜の書斎 01" required></div>
      <div class="field"><label for="layerType">レイヤー種別</label><select id="layerType" required><option value="background">背景</option><option value="base_book">基準本</option><option value="cover">表紙カラー・質感</option><option value="pattern">背景模様</option><option value="symbol">中央シンボル</option><option value="frame">枠・四隅装飾</option><option value="effect">光・エフェクト</option><option value="cover_mask">内部表紙マスク</option></select></div>
      <div class="field"><label for="templateKey">対応テンプレート</label><select id="templateKey" required></select></div>
      <div class="field"><label for="sortOrder">表示順</label><input id="sortOrder" type="number" min="0" max="100000" value="1000" required></div>
      <button id="uploadButton" class="primary" type="submit">素材を登録</button>
    </form>
    <p class="help">作者・一般ユーザーには公式素材Storageへの直接書込権限を与えません。ADMIN認証後に一度限りの署名アップロードURLを発行し、素材IDだけを作品構成へ保存します。</p>
    <p id="legacyNote" class="legacy-note">Chapter 39のDB migrationが未適用です。この状態では旧完成画像の管理のみ利用できます。</p>
  </section>
  <div id="status" class="status">管理者権限を確認しています...</div>
  <div class="section-head"><h2>素材ライブラリ</h2><span id="assetCount">—</span></div>
  <div class="filters"><select id="templateFilter"><option value="">全テンプレート</option></select><select id="layerFilter"><option value="">全レイヤー</option><option value="background">背景</option><option value="base_book">基準本</option><option value="cover">表紙カラー・質感</option><option value="pattern">背景模様</option><option value="symbol">中央シンボル</option><option value="frame">枠・四隅装飾</option><option value="effect">光・エフェクト</option><option value="cover_mask">内部表紙マスク</option><option value="legacy_complete">旧完成画像</option></select><select id="statusFilter"><option value="">全状態</option><option value="active">公開中</option><option value="retired">選択終了</option><option value="emergency_disabled">緊急無効</option></select></div>
  <section id="library" class="library"><div class="empty">読み込み中...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const statusNode=document.getElementById('status'),library=document.getElementById('library'),countNode=document.getElementById('assetCount'),button=document.getElementById('uploadButton'),templateSelect=document.getElementById('templateKey'),templateFilter=document.getElementById('templateFilter'),layerFilter=document.getElementById('layerFilter'),statusFilter=document.getElementById('statusFilter'),legacyNote=document.getElementById('legacyNote');let session=null,busy=false,composerReady=false,templates=[],assets=[];
const layerLabels={background:'背景',base_book:'基準本',cover:'表紙カラー・質感',pattern:'背景模様',symbol:'中央シンボル',frame:'枠・四隅装飾',effect:'光・エフェクト',cover_mask:'内部表紙マスク',legacy_complete:'旧完成画像'};
const statusLabels={active:'公開中',retired:'選択終了',emergency_disabled:'緊急無効'};
function setStatus(message,type=''){statusNode.className='status'+(type?` ${type}`:'');statusNode.textContent=message}
async function getSession(){const {data:{session:current},error}=await client.auth.getSession();if(error)throw error;if(!current){location.href='login.html?redirect=admin-thumbnails.html';return null}return current}
async function adminRequest(method,body){const response=await fetch('/api/admin-thumbnails',{method,headers:{Authorization:`Bearer ${session.access_token}`,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'same-origin'});if(response.status===401){location.href='login.html?redirect=admin-thumbnails.html';return null}if(response.status===403)throw new Error('このアカウントにはADMIN権限がありません。');const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||`API ${response.status}`);return payload}
function refreshTemplateControls(){templateSelect.replaceChildren();templateFilter.innerHTML='<option value="">全テンプレート</option>';templates.forEach(template=>{const option=document.createElement('option');option.value=template.template_key;option.textContent=`${template.label} (${template.template_key})`;templateSelect.appendChild(option);const filter=option.cloneNode(true);templateFilter.appendChild(filter)});if(!templates.length){const option=document.createElement('option');option.value='legacy-complete-v1';option.textContent='旧完成画像互換';templateSelect.appendChild(option)}}
function filteredAssets(){return assets.filter(asset=>(!templateFilter.value||asset.template_key===templateFilter.value)&&(!layerFilter.value||asset.layer_type===layerFilter.value)&&(!statusFilter.value||asset.availability_status===statusFilter.value))}
function render(){library.replaceChildren();const rows=filteredAssets();countNode.textContent=`${rows.length}件 / 全${assets.length}件`;if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='条件に合う素材はありません。';library.appendChild(empty);return}rows.forEach(asset=>{const card=document.createElement('article');card.className='asset';const img=document.createElement('img');img.src=asset.image_url;img.alt=asset.label;img.loading='lazy';const copy=document.createElement('div');copy.className='asset-copy';const title=document.createElement('div');title.className='asset-title';title.textContent=asset.label;const tags=document.createElement('div');tags.className='asset-tags';const layer=document.createElement('span');layer.className='tag';layer.textContent=layerLabels[asset.layer_type]||asset.layer_type||'旧方式';const template=document.createElement('span');template.className='tag';template.textContent=asset.template_key||'legacy';const availability=asset.availability_status||(asset.is_active?'active':'retired');const state=document.createElement('span');state.className=`tag ${availability}`;state.textContent=statusLabels[availability]||availability;tags.append(layer,template,state);const meta=document.createElement('div');meta.className='asset-meta';meta.textContent=`表示順 ${asset.sort_order??'—'} / ${new Date(asset.created_at).toLocaleString('ja-JP')}`;copy.append(title,tags,meta);if(composerReady){const actions=document.createElement('div');actions.className='asset-actions';const select=document.createElement('select');[['active','公開中'],['retired','選択終了'],['emergency_disabled','緊急無効']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;option.selected=value===availability;select.appendChild(option)});select.addEventListener('change',async()=>{const next=select.value,previous=availability;select.disabled=true;try{await adminRequest('POST',{action:'set-status',assetId:asset.id,status:next});await loadLibrary();setStatus(`「${asset.label}」を${statusLabels[next]}へ変更しました。`,'ok')}catch(error){console.error(error);select.value=previous;setStatus(error.message||'状態を変更できませんでした。','error')}finally{select.disabled=false}});actions.appendChild(select);copy.appendChild(actions)}card.append(img,copy);library.appendChild(card)})}
async function loadLibrary(){const payload=await adminRequest('GET');composerReady=payload.composerReady===true;templates=payload.templates||[];assets=payload.assets||[];legacyNote.style.display=composerReady?'none':'block';document.getElementById('layerType').disabled=!composerReady;document.getElementById('sortOrder').disabled=!composerReady;templateSelect.disabled=!composerReady;refreshTemplateControls();render();return payload}
async function load(){try{session=await getSession();if(!session)return;await loadLibrary();setStatus(composerReady?'Chapter 39公式素材ライブラリを読み込みました。':'旧サムネイル管理を読み込みました。DB migration適用後にレイヤー管理へ切り替わります。',composerReady?'ok':'warn')}catch(error){console.error(error);setStatus(error.message||'読み込めませんでした。','error');library.innerHTML='<div class="empty">一覧を取得できませんでした。</div>'}}
[templateFilter,layerFilter,statusFilter].forEach(control=>control.addEventListener('change',render));
document.getElementById('uploadForm').addEventListener('submit',async event=>{event.preventDefault();if(busy||!session)return;const file=document.getElementById('thumbnailFile').files[0],label=document.getElementById('thumbnailLabel').value.trim();if(!file||!label)return;if(file.size>5*1024*1024){setStatus('素材は5MB以下にしてください。','error');return}busy=true;button.disabled=true;setStatus('アップロードを準備しています...');try{const prepared=await adminRequest('POST',{action:'prepare-upload',contentType:file.type,fileSize:file.size});const upload=await client.storage.from('novel-thumbnails').uploadToSignedUrl(prepared.path,prepared.token,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;setStatus('素材を登録しています...');const body={action:'finalize-upload',path:prepared.path,label};if(composerReady){body.layerType=document.getElementById('layerType').value;body.templateKey=templateSelect.value;body.sortOrder=Number(document.getElementById('sortOrder').value);body.status='active'}await adminRequest('POST',body);document.getElementById('thumbnailFile').value='';document.getElementById('thumbnailLabel').value='';await loadLibrary();setStatus(composerReady?'公式レイヤー素材を登録しました。作者の合成画面へ反映されます。':'旧完成サムネイルを登録しました。','ok')}catch(error){console.error(error);setStatus(error.message||'アップロードできませんでした。','error')}finally{busy=false;button.disabled=false}});
void load();
</script>
</body>
</html>

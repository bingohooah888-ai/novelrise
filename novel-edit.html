<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>作品編集 | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 900px;
      height: 72px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #6d4aff;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 50px 24px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #777;
    }

    .form-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 35px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d8d8df;
      border-radius: 9px;
      padding: 13px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6d4aff;
      box-shadow: 0 0 0 3px rgba(109, 74, 255, 0.1);
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 30px;
    }

    .cancel-button {
      padding: 13px 22px;
      border-radius: 9px;
      border: 1px solid #d6d6dc;
      background: white;
      color: #555;
      font-weight: 700;
    }

    .save-button {
      padding: 13px 28px;
      border: none;
      border-radius: 9px;
      background: #6d4aff;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      NovelRise
    </a>

    <a
      id="backLink"
      href="my-novels.html"
      class="back"
    >
      ← 作品へ戻る
    </a>

  </div>
</header>


<main>

  <div class="page-title">
    <h1>作品を編集</h1>

    <p>
      作品情報を変更できます。
    </p>
  </div>


  <div class="form-card">

    <form id="editNovelForm">

      <div class="form-group">

        <label for="title">
          作品タイトル
        </label>

        <input
          id="title"
          type="text"
          maxlength="100"
          required
        >

      </div>


      <div class="form-group">

        <label for="genre">
          ジャンル
        </label>

        <select id="genre" required>

          <option value="異世界ファンタジー">
            異世界ファンタジー
          </option>

          <option value="現代ファンタジー">
            現代ファンタジー
          </option>

          <option value="恋愛">
            恋愛
          </option>

          <option value="ラブコメ">
            ラブコメ
          </option>

          <option value="SF">
            SF
          </option>

          <option value="ミステリー">
            ミステリー
          </option>

          <option value="ホラー">
            ホラー
          </option>

          <option value="歴史">
            歴史
          </option>

          <option value="現代ドラマ">
            現代ドラマ
          </option>

          <option value="その他">
            その他
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="description">
          あらすじ
        </label>

        <textarea
          id="description"
          maxlength="2000"
          required
        ></textarea>

      </div>


      <div class="form-group">

        <label for="status">
          公開状態
        </label>

        <select id="status">

          <option value="published">
            公開
          </option>

          <option value="draft">
            下書き
          </option>

        </select>

      </div>


      <div class="buttons">

        <a
          id="cancelButton"
          href="#"
          class="cancel-button"
        >
          キャンセル
        </a>

        <button
          id="saveButton"
          type="submit"
          class="save-button"
        >
          変更を保存
        </button>

      </div>

    </form>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    'https://fiepaguycecrredwrcwx.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const params =
    new URLSearchParams(
      window.location.search
    );

  const novelId =
    params.get('id');


  let currentNovel = null;


  async function initializePage() {

    if (!novelId) {

      alert(
        '作品IDが指定されていません。'
      );

      window.location.href =
        'my-novels.html';

      return;
    }


    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      alert(
        '編集するにはログインが必要です。'
      );

      window.location.href =
        'login.html';

      return;
    }


    const {
      data: novel,
      error
    } =
      await supabaseClient
        .from('novels')
        .select('*')
        .eq(
          'id',
          novelId
        )
        .single();


    if (
      error ||
      !novel
    ) {

      console.error(error);

      alert(
        '作品を読み込めませんでした。'
      );

      return;
    }


    if (
      novel.user_id !==
      session.user.id
    ) {

      alert(
        'この作品を編集する権限がありません。'
      );

      window.location.href =
        'index.html';

      return;
    }


    currentNovel =
      novel;


    document.getElementById(
      'title'
    ).value =
      novel.title;


    document.getElementById(
      'genre'
    ).value =
      novel.genre;


    document.getElementById(
      'description'
    ).value =
      novel.description;


    document.getElementById(
      'status'
    ).value =
      novel.status;


    const novelUrl =
      'novel.html?id=' +
      novel.id;


    document.getElementById(
      'backLink'
    ).href =
      novelUrl;


    document.getElementById(
      'cancelButton'
    ).href =
      novelUrl;

  }


  document.getElementById(
    'editNovelForm'
  ).addEventListener(
    'submit',
    async (event) => {

      event.preventDefault();


      if (!currentNovel) {
        return;
      }


      const saveButton =
        document.getElementById(
          'saveButton'
        );


      saveButton.disabled =
        true;

      saveButton.textContent =
        '保存中...';


      const title =
        document.getElementById(
          'title'
        ).value.trim();


      const genre =
        document.getElementById(
          'genre'
        ).value;


      const description =
        document.getElementById(
          'description'
        ).value.trim();


      const status =
        document.getElementById(
          'status'
        ).value;


      const {
        error
      } =
        await supabaseClient
          .from('novels')
          .update({
            title:
              title,

            genre:
              genre,

            description:
              description,

            status:
              status
          })
          .eq(
            'id',
            currentNovel.id
          );


      if (error) {

        console.error(error);

        alert(
          '保存に失敗しました。\n' +
          error.message
        );

        saveButton.disabled =
          false;

        saveButton.textContent =
          '変更を保存';

        return;
      }


      alert(
        '作品情報を更新しました！'
      );


      window.location.href =
        'novel.html?id=' +
        currentNovel.id;

    }
  );


  initializePage();

</script>

</body>
</html>

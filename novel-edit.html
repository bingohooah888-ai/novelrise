<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>作品編集 | NOVELIGHT</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px 76px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.field{margin-bottom:21px}label,.legend{display:block;font-size:14px;font-weight:900;margin-bottom:8px}input,select,textarea{width:100%;border:1px solid #d5d8df;border-radius:9px;padding:12px 13px;font:inherit}textarea{min-height:170px;resize:vertical}.warning-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px;background:#fafafa;border-radius:10px}.check{display:flex;gap:8px;font-size:13px;line-height:1.5}.check input{width:auto}.policy{padding:14px;background:#f8f6ff;border-radius:10px;font-size:12px;line-height:1.7}.buttons{display:flex;justify-content:flex-end;gap:10px}.btn{padding:12px 18px;border-radius:9px;font:inherit;font-weight:900}.save{border:0;background:#6d4aff;color:#fff}.save:disabled{opacity:.6}.status{margin-top:14px;min-height:22px;color:#666;font-size:13px}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}.warning-grid{grid-template-columns:1fr}.buttons{flex-direction:column}.btn{width:100%;text-align:center}}</style></head>
<body><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header><main><h1>作品を編集</h1><p style="color:#6b7280;margin:8px 0 24px">AI利用区分と内容警告も作品情報の一部として正確に保ちます。</p><section class="card"><form id="form"><div class="field"><label for="title">作品タイトル</label><input id="title" maxlength="100" required></div><div class="field"><label for="genre">ジャンル</label><select id="genre" required><option>異世界ファンタジー</option><option>現代ファンタジー</option><option>恋愛</option><option>ラブコメ</option><option>SF</option><option>ミステリー</option><option>ホラー</option><option>歴史</option><option>現代ドラマ</option><option>その他</option></select></div><div class="field"><label for="description">あらすじ</label><textarea id="description" maxlength="2000" required></textarea></div><div class="field"><label for="aiUsage">AI利用区分</label><select id="aiUsage" required><option value="">選択してください</option><option value="human">人間主体</option><option value="ai_assisted">AI支援</option><option value="ai_generated">AI生成主体</option></select></div><div class="field"><label for="contentRating">内容区分</label><select id="contentRating"><option value="general">一般</option><option value="mature">成熟したテーマ・強い表現を含む</option></select></div><fieldset class="field" style="border:0;padding:0"><legend class="legend">内容警告</legend><div id="warningGrid" class="warning-grid"><label class="check"><input type="checkbox" value="violence">暴力・戦闘</label><label class="check"><input type="checkbox" value="gore">残酷・流血描写</label><label class="check"><input type="checkbox" value="sexual_theme">性的テーマへの言及</label><label class="check"><input type="checkbox" value="abuse">虐待・ハラスメント</label><label class="check"><input type="checkbox" value="discrimination">差別・偏見</label><label class="check"><input type="checkbox" value="self_harm">自傷・自殺テーマ</label><label class="check"><input type="checkbox" value="crime">犯罪・薬物</label><label class="check"><input type="checkbox" value="other">その他</label></div></fieldset><div class="field policy"><label class="check"><input id="policyAck" type="checkbox" required><span>現在の<a href="content-guidelines.html" target="_blank" style="color:#6d4aff">投稿ガイドライン</a>を確認し、禁止対象を含まず、区分・警告が実態に合っていることを確認します。</span></label></div><div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="save" class="btn save" type="submit" disabled>保存</button></div><div id="status" class="status"></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const id=new URLSearchParams(location.search).get('id');const form=document.getElementById('form'),status=document.getElementById('status'),save=document.getElementById('save');let session=null,ready=false,busy=false;
function warnings(){return [...document.querySelectorAll('#warningGrid input:checked')].map(x=>x.value)}
(async()=>{void NovelightClient.recordVisit(client);if(!id){status.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('novel-edit.html?id='+id);return}const r=await client.from('novels').select('*').eq('id',id).single();if(r.error||!r.data||r.data.user_id!==session.user.id)throw r.error||new Error('not editable');const data=r.data;document.getElementById('title').value=data.title||'';document.getElementById('genre').value=data.genre||'その他';document.getElementById('description').value=data.description||'';document.getElementById('aiUsage').value=data.ai_usage==='unspecified'?'':(data.ai_usage||'');document.getElementById('contentRating').value=data.content_rating||'general';const set=new Set(data.content_warnings||[]);document.querySelectorAll('#warningGrid input').forEach(x=>x.checked=set.has(x.value));document.getElementById('policyAck').checked=data.content_policy_ack===true;document.getElementById('back').href='novel.html?id='+id;document.getElementById('cancel').href='novel.html?id='+id;ready=true;save.disabled=false}catch(e){console.error(e);status.textContent='作品情報を読み込めませんでした。再読み込みしてお試しください。';save.disabled=true}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='作品情報の読み込みが完了していません。';return}const ai=document.getElementById('aiUsage').value,rating=document.getElementById('contentRating').value,w=warnings();if(!ai){status.textContent='AI利用区分を選択してください。';return}if(rating==='mature'&&!w.length){status.textContent='成熟したテーマには内容警告が必要です。';return}if(!document.getElementById('policyAck').checked){status.textContent='投稿ガイドラインの確認が必要です。';return}busy=true;save.disabled=true;status.textContent='保存しています...';try{const r=await client.from('novels').update({title:document.getElementById('title').value.trim(),genre:document.getElementById('genre').value,description:document.getElementById('description').value.trim(),ai_usage:ai,content_rating:rating,content_warnings:w,content_policy_ack:true,content_policy_version:'beta-2026-08-23'}).eq('id',id).eq('user_id',session.user.id);if(r.error)throw r.error;location.href='novel.html?id='+encodeURIComponent(id)}catch(err){console.error(err);status.textContent='保存できませんでした。時間をおいて再度お試しください。'}finally{busy=false;save.disabled=!ready}});
</script></body></html>

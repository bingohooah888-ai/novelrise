<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>作品編集 | NOVELIGHT</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:950px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px 76px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.field{margin-bottom:21px}label,.legend{display:block;font-size:14px;font-weight:900;margin-bottom:8px}.required{color:#d92d20;font-size:11px;margin-left:4px}input,select,textarea{width:100%;border:1px solid #d5d8df;border-radius:9px;padding:12px 13px;font:inherit}textarea{min-height:170px;resize:vertical}.help{margin-top:7px;color:#6b7280;font-size:12px;line-height:1.6}.thumbnail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.thumbnail-option{position:relative;display:block;margin:0;cursor:pointer}.thumbnail-option input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.thumbnail-visual{display:block;overflow:hidden;border:2px solid #e1e3e8;border-radius:11px;background:#f5f6f8;transition:.15s}.thumbnail-visual img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.thumbnail-name{display:block;padding:8px 9px;color:#555;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumbnail-option input:checked+.thumbnail-visual{border-color:#6d4aff;box-shadow:0 0 0 3px rgba(109,74,255,.14)}.thumbnail-state{grid-column:1/-1;padding:18px;border:1px dashed #d9dbe2;border-radius:10px;color:#6b7280;text-align:center;font-size:12px}.warning-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px;background:#fafafa;border-radius:10px}.check{display:flex;gap:8px;font-size:13px;line-height:1.5}.check input{width:auto}.policy{padding:14px;background:#f8f6ff;border-radius:10px;font-size:12px;line-height:1.7}.buttons{display:flex;justify-content:flex-end;gap:10px}.btn{padding:12px 18px;border-radius:9px;font:inherit;font-weight:900}.save{border:0;background:#6d4aff;color:#fff}.save:disabled{opacity:.6}.completion-card{margin:0 0 24px;padding:18px;border:1px solid #ddd7ff;border-radius:12px;background:#f8f6ff}.completion-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.completion-title{font-size:15px;font-weight:900}.completion-state{display:inline-flex;align-items:center;margin-top:8px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4c3da8;font-size:12px;font-weight:900}.completion-state.done{background:#ecfdf3;color:#16803d}.completion-copy{margin-top:10px;color:#5f6270;font-size:12px;line-height:1.7}.completion-meta{display:grid;gap:5px;margin-top:10px;color:#5f6270;font-size:12px;line-height:1.6}.completion-action{border:1px solid #6d4aff;background:#fff;color:#5b43bf;cursor:pointer}.completion-action:disabled{opacity:.55;cursor:not-allowed}.completion-error{color:#b42318}.status{margin-top:14px;min-height:22px;color:#666;font-size:13px}@media(max-width:720px){.thumbnail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){main{padding:28px 16px}.card{padding:22px 18px}.thumbnail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.warning-grid{grid-template-columns:1fr}.buttons{flex-direction:column}.btn{width:100%;text-align:center}}</style><link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide"></head>
<body class="novelight-theme novelight-page-novel-edit"><header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header><main><h1>作品を編集</h1><p style="color:#6b7280;margin:8px 0 24px">AI利用区分と内容警告も作品情報の一部として正確に保ちます。</p><section class="card"><form id="form"><div class="field"><label for="title">作品タイトル</label><input id="title" maxlength="100" required></div><div class="field"><label for="genre">ジャンル</label><select id="genre" required><option>異世界ファンタジー</option><option>現代ファンタジー</option><option>恋愛</option><option>ラブコメ</option><option>SF</option><option>ミステリー</option><option>ホラー</option><option>歴史</option><option>現代ドラマ</option><option>その他</option></select></div><div class="field"><label for="description">あらすじ</label><textarea id="description" maxlength="2000" required></textarea></div><fieldset class="field" style="border:0;padding:0"><legend class="legend">作品に合う画像<span class="required">必須</span></legend><div id="thumbnailGrid" class="thumbnail-grid"><div class="thumbnail-state">公式サムネイルを読み込んでいます...</div></div><div class="help">編集時も公式サムネイルは必須です。未選択のまま保存することはできません。</div></fieldset><div class="field"><label for="aiUsage">AI利用区分</label><select id="aiUsage" required><option value="">選択してください</option><option value="human">人間主体</option><option value="ai_assisted">AI支援</option><option value="ai_generated">AI生成主体</option></select></div><div class="field"><label for="contentRating">内容区分</label><select id="contentRating"><option value="general">一般</option><option value="mature">成熟したテーマ・強い表現を含む</option></select></div><fieldset class="field" style="border:0;padding:0"><legend class="legend">内容警告</legend><div id="warningGrid" class="warning-grid"><label class="check"><input type="checkbox" value="violence">暴力・戦闘</label><label class="check"><input type="checkbox" value="gore">残酷・流血描写</label><label class="check"><input type="checkbox" value="sexual_theme">性的テーマへの言及</label><label class="check"><input type="checkbox" value="abuse">虐待・ハラスメント</label><label class="check"><input type="checkbox" value="discrimination">差別・偏見</label><label class="check"><input type="checkbox" value="self_harm">自傷・自殺テーマ</label><label class="check"><input type="checkbox" value="crime">犯罪・薬物</label><label class="check"><input type="checkbox" value="other">その他</label></div></fieldset><div class="field policy"><label class="check"><input id="policyAck" type="checkbox" required><span>現在の<a href="content-guidelines.html" target="_blank" style="color:#6d4aff">投稿ガイドライン</a>を確認し、禁止対象を含まず、区分・警告が実態に合っていることを確認します。</span></label></div><section id="completionCard" class="completion-card" aria-live="polite"><div class="completion-head"><div><div class="completion-title">作品の連載状態</div><span id="completionState" class="completion-state">確認中</span></div><button id="completionToggle" class="btn completion-action" type="button" disabled>状態を変更</button></div><p id="completionCopy" class="completion-copy">公開作品の完結状態とFINAL RANKを確認しています。</p><div id="completionMeta" class="completion-meta"></div></section><div class="buttons"><a id="cancel" class="btn" href="my-novels.html">キャンセル</a><button id="save" class="btn save" type="submit" disabled>保存</button></div><div id="status" class="status"></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script><script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');const id=new URLSearchParams(location.search).get('id');const form=document.getElementById('form'),status=document.getElementById('status'),save=document.getElementById('save'),thumbnailGrid=document.getElementById('thumbnailGrid'),completionStateEl=document.getElementById('completionState'),completionToggle=document.getElementById('completionToggle'),completionCopy=document.getElementById('completionCopy'),completionMeta=document.getElementById('completionMeta');let session=null,ready=false,busy=false,thumbnailReady=false,currentThumbnail=null,novelStatus=null,completionState=null,completionBusy=false;
function warnings(){return [...document.querySelectorAll('#warningGrid input:checked')].map(x=>x.value)}
function setReady(){save.disabled=!(ready&&thumbnailReady)}
function disableThumbnailEditing(message){thumbnailReady=false;thumbnailGrid.innerHTML='<div class="thumbnail-state">'+message+'</div>';status.textContent=message;setReady()}
function thumbnailOption(asset){const label=document.createElement('label');label.className='thumbnail-option';const input=document.createElement('input');input.type='radio';input.name='thumbnailAsset';input.value=asset.id;input.required=true;input.checked=asset.id===currentThumbnail;const visual=document.createElement('span');visual.className='thumbnail-visual';const image=document.createElement('img');image.src=asset.image_url;image.alt=asset.label||'公式サムネイル';image.loading='lazy';const name=document.createElement('span');name.className='thumbnail-name';name.textContent=asset.label||'公式サムネイル';visual.append(image,name);label.append(input,visual);return label}
async function loadThumbnails(){try{const r=await client.from('novel_thumbnail_assets').select('id,label,image_url').eq('is_active',true).order('created_at',{ascending:false});if(r.error)throw r.error;const assets=r.data||[];thumbnailGrid.replaceChildren();if(!assets.length){disableThumbnailEditing('公式サムネイルがまだ登録されていません。時間をおいて再度お試しください。');return}assets.forEach(asset=>thumbnailGrid.appendChild(thumbnailOption(asset)));thumbnailReady=true;setReady()}catch(e){console.error(e);disableThumbnailEditing('公式サムネイルを読み込めませんでした。時間をおいて再度お試しください。')}}
const rankCodes={1:'EMBER',2:'SPARK',3:'GLOW',4:'BEACON',5:'STAR',6:'NOVA'};
function completionDate(value){if(!value)return'';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ja-JP')}
function renderCompletionState(){completionStateEl.classList.remove('done');completionCopy.classList.remove('completion-error');completionMeta.replaceChildren();if(novelStatus!=='published'){completionStateEl.textContent='下書き';completionCopy.textContent='完結状態は作品を公開した後に設定できます。';completionToggle.textContent='公開後に設定できます';completionToggle.disabled=true;return}if(!completionState||!completionState.rank_state_ready){completionStateEl.textContent='確認できません';completionCopy.textContent='作品Rank状態の準備が完了していないため、完結状態は変更できません。';completionToggle.textContent='状態を変更できません';completionToggle.disabled=true;return}const done=completionState.is_completed===true;completionStateEl.textContent=done?'完結':'連載中';completionStateEl.classList.toggle('done',done);if(done){completionCopy.textContent=completionState.final_rank?`FINAL RANKが確定しています。`:'完結後30日間の読者反応を含めてFINAL RANKを確定します。';}else{completionCopy.textContent=completionState.completion_ever_recorded?'現在は連載中です。過去のFINAL RANKがある場合も履歴として保持されます。':'最初の「連載中 → 完結」は、生涯2回の状態切替制限には含まれません。';}const rows=[];if(completionState.current_rank)rows.push(`現在Rank：Rank ${completionState.current_rank} ${rankCodes[completionState.current_rank]||''}`);if(done&&completionState.completed_at)rows.push(`完結設定日：${completionDate(completionState.completed_at)}`);if(completionState.final_rank)rows.push(`FINAL RANK：Rank ${completionState.final_rank} ${rankCodes[completionState.final_rank]||''}`);rows.push(`完結後の状態切替：残り ${Number(completionState.state_changes_remaining??0)} 回`);completionMeta.innerHTML=rows.map(x=>`<span>${x}</span>`).join('');const locked=completionState.state_locked===true;completionToggle.textContent=locked?'状態変更上限に到達':done?'連載中に戻す':'完結にする';completionToggle.disabled=completionBusy||locked;}
async function loadCompletionState(){if(novelStatus!=='published'){completionState=null;renderCompletionState();return}try{const r=await client.rpc('novelight_work_completion_status',{p_novel_id:String(id)});if(r.error)throw r.error;completionState=r.data;renderCompletionState()}catch(e){console.error('completion status unavailable',e);completionState=null;completionStateEl.textContent='取得エラー';completionStateEl.classList.remove('done');completionCopy.textContent='完結状態を読み込めませんでした。再読み込みしてお試しください。';completionCopy.classList.add('completion-error');completionToggle.disabled=true}}
completionToggle.addEventListener('click',async()=>{if(completionBusy||!completionState||novelStatus!=='published'||completionState.state_locked)return;const target=completionState.is_completed!==true;const message=target?'この作品を「完結」にします。最初の完結は状態切替回数に含まれません。よろしいですか？':'この作品を「連載中」に戻します。この操作から状態切替回数を1回使用します。よろしいですか？';if(!window.confirm(message))return;completionBusy=true;completionToggle.disabled=true;completionCopy.classList.remove('completion-error');let updated=false;try{const r=await client.rpc('novelight_set_work_completion_status',{p_novel_id:String(id),p_is_completed:target});if(r.error)throw r.error;completionState=r.data;updated=true}catch(e){console.error('completion update failed',e);completionCopy.textContent=e?.message?.includes('Completion state change limit reached')?'完結状態の変更上限に到達しています。':'完結状態を変更できませんでした。再読み込みしてお試しください。';completionCopy.classList.add('completion-error')}finally{completionBusy=false;if(updated)renderCompletionState();else completionToggle.disabled=completionState.state_locked===true}});
(async()=>{void NovelightClient.recordVisit(client);if(!id){status.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('novel-edit.html?id='+id);return}const r=await client.from('novels').select('*').eq('id',id).single();if(r.error||!r.data||r.data.user_id!==session.user.id)throw r.error||new Error('not editable');const data=r.data;novelStatus=data.status||'draft';currentThumbnail=data.thumbnail_asset_id||null;document.getElementById('title').value=data.title||'';document.getElementById('genre').value=data.genre||'その他';document.getElementById('description').value=data.description||'';document.getElementById('aiUsage').value=data.ai_usage==='unspecified'?'':(data.ai_usage||'');document.getElementById('contentRating').value=data.content_rating||'general';const set=new Set(data.content_warnings||[]);document.querySelectorAll('#warningGrid input').forEach(x=>x.checked=set.has(x.value));document.getElementById('policyAck').checked=data.content_policy_ack===true;document.getElementById('back').href='novel.html?id='+id;document.getElementById('cancel').href='novel.html?id='+id;ready=true;setReady();await Promise.all([loadThumbnails(),loadCompletionState()])}catch(e){console.error(e);status.textContent='作品情報を読み込めませんでした。再読み込みしてお試しください。';ready=false;setReady()}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy){if(!ready)status.textContent='作品情報の読み込みが完了していません。';return}if(!thumbnailReady){status.textContent='公式サムネイルを読み込んでから保存してください。';return}const thumbnailAsset=document.querySelector('input[name="thumbnailAsset"]:checked')?.value;if(!thumbnailAsset){status.textContent='作品に合う画像を1枚選んでください。';return}const ai=document.getElementById('aiUsage').value,rating=document.getElementById('contentRating').value,w=warnings();if(!ai){status.textContent='AI利用区分を選択してください。';return}if(rating==='mature'&&!w.length){status.textContent='成熟したテーマには内容警告が必要です。';return}if(!document.getElementById('policyAck').checked){status.textContent='投稿ガイドラインの確認が必要です。';return}busy=true;save.disabled=true;status.textContent='保存しています...';try{const r=await client.from('novels').update({title:document.getElementById('title').value.trim(),genre:document.getElementById('genre').value,description:document.getElementById('description').value.trim(),thumbnail_asset_id:thumbnailAsset,ai_usage:ai,content_rating:rating,content_warnings:w,content_policy_ack:true,content_policy_version:'beta-2026-08-23'}).eq('id',id).eq('user_id',session.user.id);if(r.error)throw r.error;location.href='novel.html?id='+encodeURIComponent(id)}catch(err){console.error(err);status.textContent='保存できませんでした。時間をおいて再度お試しください。'}finally{busy=false;setReady()}});
</script></body></html>

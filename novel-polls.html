<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>アンケート管理 | NOVELIGHT</title>
  <link rel="stylesheet" href="novelight-author-studio-shell.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07121e;color:#eef3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    button,input{font:inherit}.workspace{max-width:1040px}.page-head{margin-bottom:20px}.kicker{color:#d7b65b;font-size:11px;font-weight:900;letter-spacing:.15em}
    .page-head h1{margin:7px 0 8px;font-family:Georgia,"Yu Mincho",serif;font-size:31px}.page-head p{margin:0;color:#aab8c4;line-height:1.8}
    .notice,.panel{border:1px solid rgba(216,180,90,.25);border-radius:16px;background:rgba(13,29,43,.92)}
    .notice{margin-bottom:16px;padding:13px 15px;color:#d9cda9;font-size:12px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px;align-items:start}
    .panel{padding:20px}.field{display:grid;gap:7px;margin-top:15px}.field label{color:#d9cda9;font-size:12px;font-weight:900}
    .field input{width:100%;border:1px solid rgba(213,224,232,.24);border-radius:10px;background:#091824;color:#f5f7f8;padding:11px 12px}
    .option-row{display:flex;gap:8px;margin-top:8px}.option-row input{flex:1}.btn{min-height:40px;border:1px solid rgba(216,180,90,.38);border-radius:9px;background:transparent;color:#e9d697;padding:8px 12px;font-weight:900;cursor:pointer}
    .btn.primary{background:#d5af4e;color:#15212b;border-color:#d5af4e}.btn.danger{color:#e9b4aa;border-color:rgba(224,129,110,.4)}.btn:disabled{opacity:.45;cursor:not-allowed}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.status{min-height:22px;margin-top:12px;color:#aebbc5;font-size:12px;line-height:1.7}.status.error{color:#f0aa9e}
    .poll-list{display:grid;gap:12px}.poll{padding:16px;border:1px solid rgba(213,224,232,.14);border-radius:12px;background:rgba(6,19,30,.64)}
    .poll-top{display:flex;justify-content:space-between;gap:12px}.poll h3{margin:0;font-size:16px}.tag{flex:none;border-radius:999px;background:rgba(216,180,90,.14);color:#e8d08c;padding:4px 8px;font-size:10px;font-weight:900}
    .poll.closed .tag{background:rgba(174,187,197,.13);color:#b7c2ca}.meta{margin-top:6px;color:#8293a0;font-size:11px}.result{margin-top:9px;display:flex;justify-content:space-between;gap:10px;color:#c9d2d9;font-size:12px}
    .empty{padding:26px 12px;text-align:center;color:#93a3af}@media(max-width:820px){.layout{grid-template-columns:1fr}}@media(max-width:520px){.page-head h1{font-size:27px}.panel{padding:17px}.option-row{align-items:stretch}}
  </style>
<link rel="stylesheet" href="novelight-accessibility.css"></head>
<body><a class="skip-link" href="#main-content">本文へスキップ</a>
  <main id="main-content" tabindex="-1" class="workspace">
    <header class="page-head">
      <div class="kicker">READER POLL</div>
      <h1>アンケート管理</h1>
      <p id="novelTitle">作品情報を確認しています...</p>
    </header>
    <div id="pendingNotice" class="notice" hidden>アンケート機能はデータベース反映待ちです。反映後に作成・集計できます。</div>
    <div class="layout">
      <section class="panel">
        <h2 style="margin:0;font-size:19px">新しいアンケート</h2>
        <p style="color:#9fb0bd;font-size:12px;line-height:1.7">1作品につき公開中は1件まで。選択肢は2〜6個です。投票結果は作品評価や露出へ影響しません。</p>
        <form id="pollForm">
          <div class="field">
            <label for="question">質問</label>
            <input id="question" maxlength="200" required>
          </div>
          <div class="field">
            <label>選択肢</label>
            <div id="options"></div>
          </div>
          <div class="actions">
            <button id="addOption" class="btn" type="button">＋ 選択肢</button>
            <button id="createPoll" class="btn primary" type="submit" disabled>公開する</button>
          </div>
          <div id="status" class="status" aria-live="polite">ログイン状態を確認しています...</div>
        </form>
      </section>
      <section class="panel">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px">
          <h2 style="margin:0;font-size:19px">アンケート履歴</h2>
          <span id="summary" class="meta">読み込み中...</span>
        </div>
        <div id="pollList" class="poll-list"><div class="empty">読み込み中...</div></div>
      </section>
    </div>
  </main>
  <script src="/assets/vendor/supabase-js-2.112.3.js"></script>
  <script src="novelight-client.js"></script>
  <script src="novelight-author-studio-shell.js"></script>
  <script>
  const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
  const novelId=Number(new URLSearchParams(location.search).get('novel_id'));const form=document.getElementById('pollForm'),optionsEl=document.getElementById('options'),statusEl=document.getElementById('status'),createButton=document.getElementById('createPoll');let ready=false,busy=false,polls=[];
  function unavailable(error){const m=String(error?.message||'');return ['42883','PGRST202'].includes(String(error?.code||''))||m.includes('novelight_manage_my_novel_polls')||m.includes('novelight_create_my_novel_poll')||m.includes('Could not find the function')||m.includes('does not exist')}
  function setStatus(message,error=false){statusEl.textContent=message;statusEl.classList.toggle('error',error)}
  function formatDate(value){const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString('ja-JP'):'日時不明'}
  function optionInputs(){return Array.from(optionsEl.querySelectorAll('input'))}
  function addOption(value=''){if(optionInputs().length>=6)return;const row=document.createElement('div');row.className='option-row';const input=document.createElement('input');input.maxLength=80;input.required=true;input.placeholder=`選択肢 ${optionInputs().length+1}`;input.value=value;const remove=document.createElement('button');remove.type='button';remove.className='btn';remove.textContent='削除';remove.onclick=()=>{if(optionInputs().length<=2)return;row.remove();syncForm()};row.append(input,remove);optionsEl.appendChild(row);syncForm()}
  function syncForm(){const active=polls.some(p=>p.status==='active');const published=document.body.dataset.novelStatus==='published';createButton.disabled=!ready||busy||active||!published;document.getElementById('addOption').disabled=!ready||busy||active||optionInputs().length>=6}
  function resetForm(){form.reset();optionsEl.replaceChildren();addOption();addOption();syncForm()}
  function render(){const list=document.getElementById('pollList');list.replaceChildren();const active=polls.filter(p=>p.status==='active').length;document.getElementById('summary').textContent=`公開中 ${active}件 / 終了 ${polls.length-active}件`;if(!polls.length){const e=document.createElement('div');e.className='empty';e.textContent='アンケートはまだありません。';list.appendChild(e);syncForm();return}
    polls.forEach(poll=>{const card=document.createElement('article');card.className='poll'+(poll.status==='closed'?' closed':'');const top=document.createElement('div');top.className='poll-top';const title=document.createElement('h3');title.textContent=poll.question;const tag=document.createElement('span');tag.className='tag';tag.textContent=poll.status==='active'?'公開中':'終了';top.append(title,tag);card.appendChild(top);const meta=document.createElement('div');meta.className='meta';meta.textContent=`作成 ${formatDate(poll.created_at)}・合計 ${Number(poll.total_votes||0).toLocaleString()}票`;card.appendChild(meta);(poll.options||[]).forEach(option=>{const row=document.createElement('div');row.className='result';const label=document.createElement('span');label.textContent=option.label;const count=document.createElement('strong');count.textContent=`${Number(option.vote_count||0).toLocaleString()}票`;row.append(label,count);card.appendChild(row)});if(poll.status==='active'){const actions=document.createElement('div');actions.className='actions';const close=document.createElement('button');close.type='button';close.className='btn danger';close.textContent='投票を締め切る';close.onclick=()=>closePoll(poll.poll_id);actions.appendChild(close);card.appendChild(actions)}list.appendChild(card)});syncForm()}
  async function loadPolls(){const r=await client.rpc('novelight_manage_my_novel_polls',{p_novel_id:novelId,p_limit:50});if(r.error)throw r.error;polls=Array.isArray(r.data)?r.data:[];render()}
  async function closePoll(id){if(busy||!ready||!confirm('このアンケートを締め切りますか？締め切り後の再開はできません。'))return;busy=true;syncForm();setStatus('締め切っています...');try{const r=await client.rpc('novelight_close_my_novel_poll',{p_poll_id:Number(id)});if(r.error)throw r.error;await loadPolls();setStatus('アンケートを締め切りました。')}catch(error){console.error(error);setStatus(unavailable(error)?'アンケート機能はデータベース反映待ちです。':'締め切れませんでした。状態を確認してください。',true)}finally{busy=false;syncForm()}}
  document.getElementById('addOption').onclick=()=>addOption();
  form.addEventListener('submit',async event=>{event.preventDefault();if(!ready||busy)return;const question=document.getElementById('question').value.trim(),options=optionInputs().map(input=>input.value.trim());if(!question||options.length<2||options.some(v=>!v)){setStatus('質問と2個以上の選択肢を入力してください。',true);return}if(new Set(options.map(v=>v.toLocaleLowerCase('ja-JP'))).size!==options.length){setStatus('同じ選択肢は登録できません。',true);return}busy=true;syncForm();setStatus('公開しています...');try{const r=await client.rpc('novelight_create_my_novel_poll',{p_novel_id:novelId,p_question:question,p_options:options});if(r.error)throw r.error;resetForm();await loadPolls();setStatus('アンケートを公開しました。')}catch(error){console.error(error);setStatus(unavailable(error)?'アンケート機能はデータベース反映待ちです。':'公開できませんでした。入力内容と現在のアンケートを確認してください。',true)}finally{busy=false;syncForm()}});
  (async()=>{void NovelightClient.recordVisit(client);if(!Number.isSafeInteger(novelId)||novelId<1){document.getElementById('novelTitle').textContent='作品IDが指定されていません。';setStatus('作品ページから開いてください。',true);return}resetForm();try{const auth=await client.auth.getSession(),session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent(`novel-polls.html?novel_id=${novelId}`);return}void NovelightClient.claimAcquisition(client);const novelResult=await client.from('novels').select('id,title,status,user_id').eq('id',novelId).eq('user_id',session.user.id).maybeSingle();if(novelResult.error)throw novelResult.error;if(!novelResult.data){location.href='my-novels.html';return}document.getElementById('novelTitle').textContent=`「${novelResult.data.title}」のアンケート`;document.body.dataset.novelStatus=novelResult.data.status||'';await loadPolls();ready=true;syncForm();setStatus(novelResult.data.status==='published'?'':'下書き作品では新しいアンケートを公開できません。既存履歴のみ確認できます。')}catch(error){console.error(error);ready=false;syncForm();if(unavailable(error)){document.getElementById('pendingNotice').hidden=false;document.getElementById('pollList').innerHTML='<div class="empty">データベース反映後に表示されます。</div>';setStatus('アンケート機能はデータベース反映待ちです。',true)}else{document.getElementById('pollList').innerHTML='<div class="empty">アンケートを読み込めませんでした。</div>';setStatus('読み込めませんでした。時間をおいて再度お試しください。',true)}}})();
  </script>
</body>
</html>

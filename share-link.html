<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>限定共有リンク | NOVELIGHT</title>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
  <link rel="stylesheet" href="novelight-limited-share.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:900px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}.page-head{max-width:900px;margin:0 auto;padding:38px 22px 0}.page-head h1{margin:0;font-size:30px}.page-head p{margin:8px 0 0;color:#6b7280;line-height:1.7}@media(max-width:640px){.page-head{padding:28px 16px 0}.page-head h1{font-size:26px}}
  </style>
</head>
<body class="novelight-theme novelight-page-share-link">
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">NOVELIGHT</a>
      <a href="my-novels.html" class="back">← 自分の作品へ</a>
    </div>
  </header>
  <section class="page-head">
    <h1>限定共有リンク</h1>
    <p>下書き作品を、リンクを知っている相手だけに確認してもらうための機能です。</p>
  </section>
  <main class="limited-share-shell" data-limited-share-manager></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="novelight-limited-share.js"></script>
  <script>
    (() => {
      const client = supabase.createClient(
        'https://fiepaguycecrredwrcwx.supabase.co',
        'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE'
      );
      const params = new URLSearchParams(location.search);
      const novelId = Number(params.get('novel_id'));
      const mount = document.querySelector('[data-limited-share-manager]');

      if (!Number.isInteger(novelId) || novelId < 1) {
        mount.textContent = '作品IDが正しくありません。';
        return;
      }

      (async () => {
        try {
          const auth = await client.auth.getSession();
          const session = auth.data.session;
          if (!session) {
            location.href =
              'login.html?redirect=' +
              encodeURIComponent('share-link.html?novel_id=' + novelId);
            return;
          }

          await NovelightLimitedShare.mountManager({
            client,
            novelId,
            session,
            mount
          });
        } catch (error) {
          console.error(error);
          mount.textContent = '限定共有画面を読み込めませんでした。';
        }
      })();
    })();
  </script>
</body>
</html>

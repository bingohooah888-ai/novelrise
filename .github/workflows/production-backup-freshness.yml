name: NOVELIGHT Production Backup Freshness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-backup-freshness.yml'
      - 'scripts/check-production-backup-freshness.mjs'
  # Run every six hours at :30. The 21:30 UTC run follows the currently
  # observed daily backup window (~21:03 UTC / 06:03 JST), while the cadence
  # keeps the configured monitoring gap bounded even if provider timing drifts.
  schedule:
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novelight-production-backup-freshness
  cancel-in-progress: true

jobs:
  verify:
    name: Verify latest Production backup is fresh
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
      MAX_BACKUP_AGE_HOURS: '36'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify required read-only credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured.'
            exit 1
          }

      - name: Verify latest Production backup freshness
        run: node scripts/check-production-backup-freshness.mjs

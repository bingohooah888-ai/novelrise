name: Temporary image contract formatter

on:
  push:
    branches:
      - fix/image-upload-contracts-20260930
    paths:
      - .github/workflows/temp-format-image-contracts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/image-upload-contracts-20260930
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Format and remove temporary workflow
        shell: bash
        run: |
          npm ci
          npx prettier --write \
            api/_lib/episode-illustrations.js \
            tests/episode-illustration-png-fallback-contract.test.mjs \
            tests/thumbnail-render-png-regression.test.mjs
          git rm .github/workflows/temp-format-image-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/episode-illustrations.js \
            tests/episode-illustration-png-fallback-contract.test.mjs \
            tests/thumbnail-render-png-regression.test.mjs
          git commit -m "Format image upload contract changes"
          git push origin HEAD:fix/image-upload-contracts-20260930

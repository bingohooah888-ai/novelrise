name: Dependabot Safe Auto Merge

on:
  workflow_run:
    workflows: ["NOVELIGHT CI", "CodeQL"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-safe-update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Merge safe Dependabot patch updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          title="$(jq -r '.title' <<<"$pr_json")"

          if [ "$author" != "dependabot[bot]" ] || [ "$base_ref" != "main" ]; then
            echo "Not an eligible Dependabot PR."
            exit 0
          fi

          if [[ "$head_ref" != dependabot/npm_and_yarn/* ]]; then
            echo "Only npm Dependabot PRs are eligible for automatic merge."
            exit 0
          fi

          if [[ "$title" =~ ^Bump\ (eslint|prettier)\ from\ ([0-9]+\.[0-9]+\.[0-9]+)\ to\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            package_name="${BASH_REMATCH[1]}"
            from_version="${BASH_REMATCH[2]}"
            to_version="${BASH_REMATCH[3]}"
          else
            echo "Only individual eslint or prettier updates are eligible."
            exit 0
          fi

          IFS=. read -r from_major from_minor from_patch <<<"$from_version"
          IFS=. read -r to_major to_minor to_patch <<<"$to_version"

          if [ "$from_major" != "$to_major" ] || [ "$from_minor" != "$to_minor" ]; then
            echo "Major and minor updates require review."
            exit 0
          fi

          if [ "$to_patch" -le "$from_patch" ]; then
            echo "This is not a forward patch update."
            exit 0
          fi

          mapfile -t changed_files < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files found."
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              package.json|package-lock.json) ;;
              *)
                echo "Unexpected file changed: $file"
                exit 0
                ;;
            esac
          done

          runs_json="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$head_sha&per_page=100")"

          for workflow_name in "NOVELIGHT CI" "CodeQL"; do
            result="$(
              jq -r --arg workflow_name "$workflow_name" '
                [.workflow_runs[]
                  | select(.name == $workflow_name and .event == "pull_request")]
                | sort_by(.run_number)
                | last
                | if . == null then "missing" else "\(.status):\(.conclusion)" end
              ' <<<"$runs_json"
            )"

            if [ "$result" != "completed:success" ]; then
              echo "$workflow_name is not successful yet: $result"
              exit 0
            fi
          done

          echo "Safe patch update confirmed for $package_name: $from_version -> $to_version"

          if gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch; then
            echo "Dependabot PR merged automatically."
          else
            echo "Merge deferred because repository rules are not satisfied yet."
          fi

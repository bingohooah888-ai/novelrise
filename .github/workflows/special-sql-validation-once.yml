name: SPECIAL isolated SQL validation
on:
  push:
    branches:
      - feat/novelight-special-v1-20261023
permissions:
  contents: read
jobs:
  special-sql:
    if: github.repository == 'bingohooah888-ai/novelrise'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: special_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d special_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
      PGDATABASE: special_test
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary Supabase-compatible role and bucket stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create schema storage;
          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL
      - name: Apply DRAFT in disposable PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f docs/NOVELIGHT-SPECIAL-DB-MIGRATION-DRAFT.sql
      - name: Verify RLS, private objects and append-only atomic audit
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            first_project uuid := '11111111-1111-4111-8111-111111111111';
            other_project uuid := '22222222-2222-4222-8222-222222222222';
            actor uuid := '33333333-3333-4333-8333-333333333333';
            item uuid := '44444444-4444-4444-8444-444444444444';
            audit_count integer;
            failed boolean;
          begin
            if has_table_privilege('anon','public.special_projects','SELECT')
              or has_table_privilege('authenticated','public.special_permissions','SELECT')
              or not (select rowsecurity from pg_tables where schemaname='public'
                and tablename='special_projects')
            then raise exception 'raw public table exposure'; end if;
            if not exists (select 1 from storage.buckets where id='special-evidence'
              and public=false and file_size_limit <= 10485760)
            then raise exception 'private evidence bucket not configured'; end if;

            insert into public.special_projects
              (id,slug,title,kind,created_by,updated_by)
            values
              (first_project,'project-one','Project One','ss',actor,actor),
              (other_project,'project-two','Project Two','ss',actor,actor);
            select count(*) into audit_count from public.special_change_log
              where project_id in (first_project,other_project);
            if audit_count <> 2 then raise exception 'INSERT audit failure'; end if;

            update public.special_projects set status='published',
              first_published_at=now() where id=first_project;
            if not exists (select 1 from public.special_change_log where
              project_id=first_project and operation='status.published')
            then raise exception 'status audit failure'; end if;

            failed := false;
            begin
              update public.special_projects set slug='changed-project'
              where id=first_project;
            exception when others then failed:=true; end;
            if not failed then raise exception 'published slug mutation allowed'; end if;

            failed := false;
            begin
              update public.special_change_log set operation='tampered' where
              project_id=first_project;
            exception when others then failed:=true; end;
            if not failed then raise exception 'immutable audit overwritten'; end if;

            insert into public.special_contents
              (id,project_id,title,kind,mode,body,status,created_by,updated_by)
            values (item,first_project,'Example','ss','inline','Example','draft',actor,actor);

            failed:=false;
            begin
              insert into public.special_permissions
                (project_id,content_id,kind,rights_holder,permission_scope,
                 evidence_reference,approved_digest,approved_by)
              values (other_project,item,'content','Rights holder','Scope',
                'special-evidence/private',repeat('a',64),actor);
            exception when others then failed:=true; end;
            if not failed then raise exception 'cross-project rights reuse permitted'; end if;

            insert into public.special_permissions
              (project_id,content_id,kind,rights_holder,permission_scope,
               evidence_reference,approved_digest,approved_by)
            values (first_project,item,'content','Rights holder','Scope',
              'special-evidence/private',repeat('a',64),actor);
            if not exists (select 1 from public.special_change_log where
              project_id=first_project and operation='rights.insert')
            then raise exception 'rights audit failure'; end if;
          end $$;
          SQL

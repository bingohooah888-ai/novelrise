name: NOVELIGHT Production Auth Smoke Approval Handler

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-request:
    if: github.event_name == 'workflow_dispatch'
    name: Dispatch scoped Auth Smoke request workflow
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch request-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-auth-smoke-request.yml/dispatches" \
            -d '{"ref":"main"}'

  authenticated-smoke:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      startsWith(github.event.issue.title, '[Production Auth Smoke Approval] auth-smoke-') &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_PRODUCTION_AUTH_SMOKE_APPROVE ')
    name: Verify authenticated beta-critical production flows
    runs-on: ubuntu-latest
    concurrency:
      group: novelight-production-authenticated-smoke-execution
      cancel-in-progress: false
    environment: Production
    env:
      E2E_BASE_URL: https://novelrise.vercel.app
      SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_AUTH_SMOKE_FIXTURE: /tmp/novelight-production-auth-smoke.json
      AUTH_SMOKE_LABEL: 本番認証スモーク
      CHECKOUT_SESSION_PREFIX: cs_live_
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate one-time chat approval
        id: approval
        shell: bash
        env:
          APPROVAL_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          approval_json="${APPROVAL_BODY#NOVELIGHT_PRODUCTION_AUTH_SMOKE_APPROVE }"
          echo "$approval_json" | jq -e '
            type == "object" and
            .operation == "production-authenticated-smoke" and
            (.requestId | type == "string" and test("^auth-smoke-[0-9a-f]{40}-[0-9]+$")) and
            (.mainSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            ((keys | sort) == (["challenge", "mainSha", "operation", "requestId"] | sort))
          ' >/dev/null || {
            echo 'Safety stop: invalid Production Authenticated Smoke approval record.'
            exit 1
          }

          request_json="$(
            printf '%s\n' "$ISSUE_BODY" \
              | head -n 1 \
              | sed 's/^NOVELIGHT_PRODUCTION_AUTH_SMOKE_REQUEST //' \
              | jq -c '.'
          )"
          echo "$request_json" | jq -e '
            type == "object" and
            .operation == "production-authenticated-smoke" and
            (.requestId | type == "string" and test("^auth-smoke-[0-9a-f]{40}-[0-9]+$")) and
            (.mainSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.expiresAt | type == "string") and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            ((keys | sort) == (["challenge", "expiresAt", "mainSha", "operation", "requestId"] | sort))
          ' >/dev/null || {
            echo 'Safety stop: malformed Production Authenticated Smoke request issue.'
            exit 1
          }

          request_id="$(echo "$request_json" | jq -r '.requestId')"
          request_sha="$(echo "$request_json" | jq -r '.mainSha')"
          request_challenge="$(echo "$request_json" | jq -r '.challenge')"
          approved_request_id="$(echo "$approval_json" | jq -r '.requestId')"
          approved_sha="$(echo "$approval_json" | jq -r '.mainSha')"
          approved_challenge="$(echo "$approval_json" | jq -r '.challenge')"

          test "$ISSUE_TITLE" = "[Production Auth Smoke Approval] $request_id" || {
            echo 'Safety stop: request issue title does not match request ID.'
            exit 1
          }
          test "$approved_request_id" = "$request_id" || {
            echo 'Safety stop: approval request ID does not match this issue.'
            exit 1
          }
          test "$approved_sha" = "$request_sha" || {
            echo 'Safety stop: approval SHA does not match request SHA.'
            exit 1
          }
          test "$approved_challenge" = "$request_challenge" || {
            echo 'Safety stop: approval challenge does not match this one-time request.'
            exit 1
          }

          expires_at="$(echo "$request_json" | jq -r '.expiresAt')"
          expiry_epoch="$(date -u -d "$expires_at" +%s)" || {
            echo 'Safety stop: invalid request expiry.'
            exit 1
          }
          now_epoch="$(date -u +%s)"
          if [ "$now_epoch" -ge "$expiry_epoch" ]; then
            echo 'Safety stop: Production Authenticated Smoke approval request expired.'
            exit 1
          fi

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > /tmp/request-comments.json
          comment_count="$(jq 'length' /tmp/request-comments.json)"
          [ "$comment_count" -lt 100 ] || {
            echo 'Safety stop: dedicated approval issue exceeded the bounded comment contract.'
            exit 1
          }
          used_count="$(
            jq --arg requestId "$request_id" '[
              .[]
              | select(
                  (.body | startswith("NOVELIGHT_PRODUCTION_AUTH_SMOKE_CLAIMED ")) or
                  (.body | startswith("NOVELIGHT_PRODUCTION_AUTH_SMOKE_CONSUMED ")) or
                  (.body | startswith("NOVELIGHT_PRODUCTION_AUTH_SMOKE_FAILED "))
                )
              | select(.body | contains($requestId))
            ] | length' /tmp/request-comments.json
          )"
          if [ "$used_count" -ne 0 ]; then
            echo 'Safety stop: this Production Authenticated Smoke approval request was already used.'
            exit 1
          fi

          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          if [ "$current_main" != "$approved_sha" ]; then
            echo 'Safety stop: main changed after the user approved this Production Authenticated Smoke.'
            exit 1
          fi

          {
            echo "request_id=$request_id"
            echo "main_sha=$approved_sha"
            echo "issue_number=$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Validated one-time Production Authenticated Smoke approval for $request_id at exact main $approved_sha."

      - name: Claim approval before any Production write
        shell: bash
        env:
          REQUEST_ID: ${{ steps.approval.outputs.request_id }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          ISSUE_NUMBER: ${{ steps.approval.outputs.issue_number }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg requestId "$REQUEST_ID" --arg mainSha "$MAIN_SHA" --arg runId "$GITHUB_RUN_ID" '{requestId:$requestId,mainSha:$mainSha,runId:$runId}')"
          body="NOVELIGHT_PRODUCTION_AUTH_SMOKE_CLAIMED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

      - name: Re-check approved main immediately before Production write
        shell: bash
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        run: |
          set -euo pipefail
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$MAIN_SHA" || {
            echo 'Safety stop: main changed before Production Authenticated Smoke write.'
            exit 1
          }

      - name: Checkout approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approval.outputs.main_sha }}
          persist-credentials: false

      - name: Wait for beta-critical production pages to match approved main
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            login.html
            post.html
            episode-post.html
            novel.html
            episode.html
            scout-record.html
            analytics.html
            novelight-client.js
          )

          matched=false
          for attempt in $(seq 1 24); do
            matched=true
            for route in "${routes[@]}"; do
              target="/tmp/live-${route//\//-}"
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                "$E2E_BASE_URL/$route" > "$target"; then
                matched=false
                break
              fi
              if ! cmp -s "$route" "$target"; then
                matched=false
                break
              fi
            done

            if [ "$matched" = true ]; then
              break
            fi
            echo "Production critical pages have not converged to approved main yet (attempt ${attempt}/24)."
            sleep 10
          done

          if [ "$matched" != true ]; then
            echo 'Production critical pages did not converge to the approved main within the bounded wait.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Retrieve the production Supabase secret key for this approved run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured in the Production environment.'
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            > /tmp/supabase-api-keys.json

          secret_key="$(jq -er '
            ([.[] | select(.type == "secret") | .api_key][0]) //
            ([.[] | select(.name == "service_role") | .api_key][0]) //
            empty
          ' /tmp/supabase-api-keys.json)"

          test -n "$secret_key" || {
            echo 'No revealable Supabase secret/service-role key was returned.'
            exit 1
          }
          printf '::add-mask::%s\n' "$secret_key"
          printf 'SUPABASE_SECRET_KEY=%s\n' "$secret_key" >> "$GITHUB_ENV"

      - name: Create ephemeral production smoke users
        run: node scripts/production-auth-smoke-fixture.mjs setup

      - name: Install browser smoke dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run authenticated production smoke with runner Chrome
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.production-auth.config.mjs

      - name: Clean ephemeral production smoke data
        if: always()
        run: node scripts/production-auth-smoke-fixture.mjs cleanup

      - name: Remove temporary production credentials and fixture files
        if: always()
        shell: bash
        run: rm -f /tmp/supabase-api-keys.json "$PRODUCTION_AUTH_SMOKE_FIXTURE" /tmp/request-comments.json

      - name: Record consumed approval and close dedicated issue
        if: success() && steps.approval.outputs.request_id != ''
        shell: bash
        env:
          REQUEST_ID: ${{ steps.approval.outputs.request_id }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          ISSUE_NUMBER: ${{ steps.approval.outputs.issue_number }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg requestId "$REQUEST_ID" --arg mainSha "$MAIN_SHA" --arg runId "$GITHUB_RUN_ID" '{requestId:$requestId,mainSha:$mainSha,runId:$runId,result:"success"}')"
          body="NOVELIGHT_PRODUCTION_AUTH_SMOKE_CONSUMED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" >/dev/null
          curl --silent --show-error --fail \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -d '{"state":"closed"}' >/dev/null

      - name: Record failed claimed request and close dedicated issue
        if: failure() && steps.approval.outputs.request_id != ''
        shell: bash
        env:
          REQUEST_ID: ${{ steps.approval.outputs.request_id }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          ISSUE_NUMBER: ${{ steps.approval.outputs.issue_number }}
        run: |
          set +e
          payload="$(jq -cn --arg requestId "$REQUEST_ID" --arg mainSha "$MAIN_SHA" --arg runId "$GITHUB_RUN_ID" '{requestId:$requestId,mainSha:$mainSha,runId:$runId,result:"failure"}')"
          body="NOVELIGHT_PRODUCTION_AUTH_SMOKE_FAILED $payload"
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" >/dev/null
          curl --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -d '{"state":"closed"}' >/dev/null

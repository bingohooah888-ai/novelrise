name: NOVELIGHT Production Authenticated Smoke

on:
  push:
    branches: [main]
    paths:
      - 'login.html'
      - 'post.html'
      - 'episode-post.html'
      - 'novel.html'
      - 'episode.html'
      - 'scout-record.html'
      - 'analytics.html'
      - 'novelight-client.js'
      - 'scripts/production-auth-smoke-fixture.mjs'
      - 'tests/e2e/production-auth/**'
      - 'tests/e2e/playwright.production-auth.config.mjs'
      - '.github/workflows/production-authenticated-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novelight-production-authenticated-smoke
  cancel-in-progress: false

jobs:
  approval:
    name: Approve production write smoke
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - name: Record approval gate
        run: echo 'Production authenticated smoke approved.'

  authenticated-smoke:
    name: Verify authenticated beta-critical production flows
    needs: approval
    runs-on: ubuntu-latest
    environment: Production
    env:
      E2E_BASE_URL: https://novelrise.vercel.app
      SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_AUTH_SMOKE_FIXTURE: /tmp/novelight-production-auth-smoke.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for beta-critical production pages to match main
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            login.html
            post.html
            episode-post.html
            novel.html
            episode.html
            scout-record.html
            analytics.html
            novelight-client.js
          )

          matched=false
          for attempt in $(seq 1 24); do
            matched=true
            for route in "${routes[@]}"; do
              target="/tmp/live-${route//\//-}"
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                "$E2E_BASE_URL/$route" > "$target"; then
                matched=false
                break
              fi
              if ! cmp -s "$route" "$target"; then
                matched=false
                break
              fi
            done

            if [ "$matched" = true ]; then
              break
            fi
            echo "Production critical pages have not converged to main yet (attempt ${attempt}/24)."
            sleep 10
          done

          if [ "$matched" != true ]; then
            echo 'Production critical pages did not converge to the checked-out main within 4 minutes.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Retrieve the production Supabase secret key for this approved run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured in the Production environment.'
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            > /tmp/supabase-api-keys.json

          secret_key="$(jq -er '
            ([.[] | select(.type == "secret") | .api_key][0]) //
            ([.[] | select(.name == "service_role") | .api_key][0]) //
            empty
          ' /tmp/supabase-api-keys.json)"

          test -n "$secret_key" || {
            echo 'No revealable Supabase secret/service-role key was returned.'
            exit 1
          }
          printf '::add-mask::%s\n' "$secret_key"
          printf 'SUPABASE_SECRET_KEY=%s\n' "$secret_key" >> "$GITHUB_ENV"

      - name: Create ephemeral production smoke users
        run: node scripts/production-auth-smoke-fixture.mjs setup

      - name: Install browser smoke dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production smoke
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.production-auth.config.mjs

      - name: Clean ephemeral production smoke data
        if: always()
        run: node scripts/production-auth-smoke-fixture.mjs cleanup

      - name: Remove temporary production credentials and fixture files
        if: always()
        shell: bash
        run: rm -f /tmp/supabase-api-keys.json "$PRODUCTION_AUTH_SMOKE_FIXTURE"

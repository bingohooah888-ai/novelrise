name: PR Format Preview

on:
  push:
    branches:
      - feat/beta-pricing-480-standard-free

permissions:
  contents: write

jobs:
  format-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply canonical Prettier formatting
        run: |
          set -euo pipefail
          npm run format
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api tests
          git commit -m 'Format beta pricing implementation'
          git push origin HEAD:feat/beta-pricing-480-standard-free

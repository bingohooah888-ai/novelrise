name: NOVELIGHT High-Risk PR Approval Relay

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: novelight-high-risk-pr-approval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  rerun-ci:
    name: Validate owner approval, re-run CI, and merge safely
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_HIGH_RISK_APPROVE ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_BODY: ${{ github.event.comment.body }}
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Checkout trusted main approval logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Validate exact PR head and one-time challenge
        id: approval
        shell: bash
        run: |
          set -euo pipefail

          approval_json="${APPROVAL_BODY#NOVELIGHT_HIGH_RISK_APPROVE }"
          echo "$approval_json" | jq -e '
            type == "object" and
            .operation == "merge-high-risk-pr" and
            (.pr | type == "number" and . > 0 and floor == .) and
            (.headSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            (
              ((keys | sort) == (["challenge", "headSha", "operation", "pr"] | sort)) or
              ((keys | sort) == (["challenge", "headSha", "operation", "pr", "productionScopes"] | sort))
            ) and
            ((.productionScopes // []) | type == "array") and
            all((.productionScopes // [])[]; type == "string" and . == "supabase-migration-deploy") and
            ((.productionScopes // []) == ((.productionScopes // []) | unique | sort))
          ' >/dev/null || {
            echo 'Safety stop: malformed high-risk approval comment.'
            exit 1
          }

          approved_pr="$(echo "$approval_json" | jq -r '.pr')"
          approved_sha="$(echo "$approval_json" | jq -r '.headSha')"
          approved_challenge="$(echo "$approval_json" | jq -r '.challenge')"
          production_scopes="$(echo "$approval_json" | jq -r '(.productionScopes // []) | join(",")')"
          test "$approved_pr" = "$PR_NUMBER" || {
            echo 'Safety stop: approval PR number does not match this pull request.'
            exit 1
          }

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > /tmp/pr.json

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$approved_sha" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha' \
            /tmp/pr.json >/dev/null || {
              echo 'Safety stop: PR is closed, targets another base, or head SHA changed.'
              exit 1
            }

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > /tmp/pr-files.json

          file_count="$(jq 'length' /tmp/pr-files.json)"
          [ "$file_count" -lt 100 ] || {
            echo 'Safety stop: PR file list exceeded the bounded approval contract.'
            exit 1
          }

          jq -r '
            .[]
            | select(.filename | test("^supabase/migrations/.*\\.sql$"))
            | [.status, .filename]
            | @tsv
          ' /tmp/pr-files.json > /tmp/migration-file-changes.tsv

          if [ -s /tmp/migration-file-changes.tsv ]; then
            if awk -F '\t' '$1 != "added" { found=1 } END { exit found ? 0 : 1 }' /tmp/migration-file-changes.tsv; then
              echo 'Safety stop: inherited Production migration approval supports newly added migrations only.'
              exit 1
            fi

            if awk -F '\t' '$2 !~ /^supabase\/migrations\/[0-9]{14}_.+\.sql$/ { found=1 } END { exit found ? 0 : 1 }' /tmp/migration-file-changes.tsv; then
              echo 'Safety stop: migration filename is outside the canonical timestamped contract.'
              exit 1
            fi

            test "$production_scopes" = 'supabase-migration-deploy' || {
              echo 'Safety stop: this migration-bearing PR requires explicit supabase-migration-deploy scope in the one human Production approval.'
              exit 1
            }

            migrations="$(
              cut -f2 /tmp/migration-file-changes.tsv \
                | sed -nE 's#^supabase/migrations/([0-9]{14})_.*\.sql$#\1#p' \
                | sort -u \
                | paste -sd,
            )"
            test -n "$migrations" || {
              echo 'Safety stop: approved migration set could not be derived from the PR.'
              exit 1
            }
          else
            test -z "$production_scopes" || {
              echo 'Safety stop: Production migration scope was approved but this PR contains no migration.'
              exit 1
            }
            migrations=''
          fi

          expected_challenge="$(node scripts/high-risk-approval-lib.mjs challenge "$PR_NUMBER" "$approved_sha" "$production_scopes")"
          test "$approved_challenge" = "$expected_challenge" || {
            echo 'Safety stop: approval challenge does not match the exact PR head and Production scope.'
            exit 1
          }

          {
            echo "head_sha=$approved_sha"
            echo "production_scopes=$production_scopes"
            echo "migrations=$migrations"
          } >> "$GITHUB_OUTPUT"
          echo "Validated owner Production approval for PR #$PR_NUMBER at $approved_sha with scope '${production_scopes:-merge-only}'."

      - name: Mark approved draft PR ready for review
        shell: bash
        env:
          HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > /tmp/pr-ready-before.json

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha' \
            /tmp/pr-ready-before.json >/dev/null || {
              echo 'Safety stop: PR changed after approval validation.'
              exit 1
            }

          if [ "$(jq -r '.draft' /tmp/pr-ready-before.json)" = 'true' ]; then
            pr_node_id="$(jq -r '.node_id // empty' /tmp/pr-ready-before.json)"
            test -n "$pr_node_id" || {
              echo 'Safety stop: PR node ID is missing before ready-for-review transition.'
              exit 1
            }

            graphql_query="mutation(\$id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: \$id }) { pullRequest { number isDraft headRefOid } } }"
            gh api graphql \
              -f query="$graphql_query" \
              -F id="$pr_node_id" \
              > /tmp/pr-ready-mutation.json

            jq -e \
              --argjson pr "$PR_NUMBER" \
              --arg sha "$HEAD_SHA" \
              '.data.markPullRequestReadyForReview.pullRequest.number == $pr and .data.markPullRequestReadyForReview.pullRequest.isDraft == false and .data.markPullRequestReadyForReview.pullRequest.headRefOid == $sha' \
              /tmp/pr-ready-mutation.json >/dev/null || {
                echo 'Safety stop: ready-for-review mutation returned an unexpected PR state.'
                exit 1
              }
          else
            echo "PR #$PR_NUMBER is already ready for review."
          fi

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > /tmp/pr-ready-after.json

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and .draft == false' \
            /tmp/pr-ready-after.json >/dev/null || {
              echo 'Safety stop: ready-for-review transition failed or PR head changed.'
              exit 1
            }

          echo "PR #$PR_NUMBER is ready for review at approved head $HEAD_SHA."

      - name: Queue squash auto-merge while approval gates are pending
        shell: bash
        env:
          HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
        run: |
          set -euo pipefail

          auto_merge_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')"
          if [ "$auto_merge_enabled" != 'true' ]; then
            echo 'Repository auto-merge is disabled; continuing with the guarded CI relay.'
            exit 0
          fi

          if gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$HEAD_SHA"; then
            echo "Queued squash auto-merge for PR #$PR_NUMBER at approved head $HEAD_SHA."
          else
            echo 'Auto-merge could not be queued in the current GitHub merge state; guarded CI validation will continue.'
          fi

      - name: Re-run failed NOVELIGHT CI automatically
        id: ci
        shell: bash
        env:
          HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
        run: |
          set -euo pipefail

          run_id=''
          conclusion=''
          status=''
          for _ in $(seq 1 24); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=20" \
              > /tmp/ci-runs.json

            run_id="$(jq -r '.workflow_runs[0].id // empty' /tmp/ci-runs.json)"
            status="$(jq -r '.workflow_runs[0].status // empty' /tmp/ci-runs.json)"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' /tmp/ci-runs.json)"
            if [ -n "$run_id" ] && [ "$status" = 'completed' ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ] || [ "$status" != 'completed' ]; then
            echo 'Could not find a completed NOVELIGHT CI run for the approved head within two minutes.'
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          if [ "$conclusion" = 'success' ]; then
            echo "NOVELIGHT CI run $run_id already succeeded; no re-run needed."
            exit 0
          fi

          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun-failed-jobs" \
            >/dev/null

          echo "Re-ran failed jobs for NOVELIGHT CI run $run_id after exact owner approval."

      - name: Wait for approved-head NOVELIGHT CI success
        shell: bash
        env:
          HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "$RUN_ID" || {
            echo 'Safety stop: NOVELIGHT CI run ID is unavailable.'
            exit 1
          }

          for _ in $(seq 1 60); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
              > /tmp/approved-ci.json

            jq -e --arg sha "$HEAD_SHA" '.head_sha == $sha' /tmp/approved-ci.json >/dev/null || {
              echo 'Safety stop: NOVELIGHT CI run no longer matches the approved head.'
              exit 1
            }

            status="$(jq -r '.status // empty' /tmp/approved-ci.json)"
            conclusion="$(jq -r '.conclusion // empty' /tmp/approved-ci.json)"
            if [ "$status" = 'completed' ]; then
              test "$conclusion" = 'success' || {
                echo "Safety stop: NOVELIGHT CI completed with conclusion $conclusion."
                exit 1
              }
              echo "NOVELIGHT CI run $RUN_ID succeeded for approved head $HEAD_SHA."
              exit 0
            fi
            sleep 5
          done

          echo 'Safety stop: NOVELIGHT CI did not complete successfully within five minutes.'
          exit 1

      - name: Finalize guarded squash merge if still open
        shell: bash
        env:
          HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > /tmp/pr-final.json

          if [ "$(jq -r '.merged' /tmp/pr-final.json)" = 'true' ]; then
            echo "PR #$PR_NUMBER was already merged by queued auto-merge."
            exit 0
          fi

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and .draft == false' \
            /tmp/pr-final.json >/dev/null || {
              echo 'Safety stop: PR changed after CI success or is no longer mergeable under the approved identity.'
              exit 1
            }

          if gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$HEAD_SHA"; then
            echo "Merged PR #$PR_NUMBER with squash after exact owner approval and successful CI."
            exit 0
          fi

          echo 'Direct merge command did not complete; checking for a queued auto-merge race.'
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > /tmp/pr-after-merge-attempt.json

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            '.merged == true and .merged_at != null and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and (.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$"))' \
            /tmp/pr-after-merge-attempt.json >/dev/null || {
              echo 'Safety stop: merge command failed and the exact approved PR is not confirmed merged.'
              exit 1
            }

          merged_sha="$(jq -r '.merge_commit_sha' /tmp/pr-after-merge-attempt.json)"
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$merged_sha" \
            > /tmp/merged-commit.json
          jq -e --arg sha "$merged_sha" '.sha == $sha' /tmp/merged-commit.json >/dev/null || {
            echo 'Safety stop: reported merge commit could not be verified.'
            exit 1
          }

          echo "Queued auto-merge completed exact approved PR #$PR_NUMBER at head $HEAD_SHA; treating the guarded merge as successful."

      - name: Resolve exact merged main identity
        id: merged
        shell: bash
        env:
          HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > /tmp/pr-merged.json

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            '.merged == true and .merged_at != null and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and (.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$"))' \
            /tmp/pr-merged.json >/dev/null || {
              echo 'Safety stop: exact approved PR is not confirmed merged.'
              exit 1
            }

          merge_sha="$(jq -r '.merge_commit_sha' /tmp/pr-merged.json)"
          current_main="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          test "$current_main" = "$merge_sha" || {
            echo 'Safety stop: current main moved before single-approval Production handoff.'
            exit 1
          }

          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved exact merged main $merge_sha for PR #$PR_NUMBER."

      - name: Wait for exact Production migration plan success
        if: contains(steps.approval.outputs.production_scopes, 'supabase-migration-deploy')
        id: migration_plan
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        run: |
          set -euo pipefail

          run_id=''
          status=''
          conclusion=''
          for _ in $(seq 1 90); do
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-production-auto-deploy.yml/runs?event=push&head_sha=$MERGE_SHA&per_page=20" \
              > /tmp/production-migration-plan-runs.json

            run_id="$(jq -r --arg sha "$MERGE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")][0].id // empty' /tmp/production-migration-plan-runs.json)"
            status="$(jq -r --arg sha "$MERGE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")][0].status // empty' /tmp/production-migration-plan-runs.json)"
            conclusion="$(jq -r --arg sha "$MERGE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")][0].conclusion // empty' /tmp/production-migration-plan-runs.json)"

            if [ -n "$run_id" ] && [ "$status" = 'completed' ]; then
              break
            fi
            sleep 5
          done

          test -n "$run_id" || {
            echo 'Safety stop: exact Production migration plan run was not found.'
            exit 1
          }
          if [ "$status" != 'completed' ] || [ "$conclusion" != 'success' ]; then
            echo "Safety stop: Production migration plan run $run_id did not succeed."
            exit 1
          fi

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$MERGE_SHA" || {
            echo 'Safety stop: main changed after Production migration plan success.'
            exit 1
          }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Production migration plan run $run_id succeeded for exact merged main $MERGE_SHA."

      - name: Dispatch inherited single-approval Production migration deploy
        if: contains(steps.approval.outputs.production_scopes, 'supabase-migration-deploy')
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
          APPROVED_HEAD_SHA: ${{ steps.approval.outputs.head_sha }}
          APPROVED_MIGRATIONS: ${{ steps.approval.outputs.migrations }}
          SOURCE_APPROVAL_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          production_scopes='${{ steps.approval.outputs.production_scopes }}'
          challenge="$(node scripts/high-risk-approval-lib.mjs challenge "$PR_NUMBER" "$APPROVED_HEAD_SHA" "$production_scopes")"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$MERGE_SHA" || {
            echo 'Safety stop: main changed before inherited Production migration dispatch.'
            exit 1
          }

          payload="$(
            jq -cn \
              --arg ref 'main' \
              --arg main_sha "$MERGE_SHA" \
              --arg migrations "$APPROVED_MIGRATIONS" \
              --arg source_pr "$PR_NUMBER" \
              --arg source_head_sha "$APPROVED_HEAD_SHA" \
              --arg source_challenge "$challenge" \
              --arg source_approval_comment_id "$SOURCE_APPROVAL_COMMENT_ID" \
              '{
                ref:$ref,
                inputs:{
                  main_sha:$main_sha,
                  migrations:$migrations,
                  source_pr:$source_pr,
                  source_head_sha:$source_head_sha,
                  source_challenge:$source_challenge,
                  source_approval_comment_id:$source_approval_comment_id
                }
              }'
          )"

          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-migration-approved-dispatch.yml/dispatches" \
            -d "$payload"

          echo "Dispatched exact migration set $APPROVED_MIGRATIONS from the single human Production approval; no second human approval was requested."

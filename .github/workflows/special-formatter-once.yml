name: SPECIAL scoped formatter
on:
  push:
    branches:
      - feat/novelight-special-v1-20261023
permissions:
  contents: write
concurrency:
  group: special-scoped-formatter
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'bingohooah888-ai/novelrise' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novelight-special-v1-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Format updated SPECIAL code
        run: |
          ./node_modules/.bin/prettier --write \
            api/_lib/special-core.js api/admin-special.js \
            api/special-event.js api/special-page.js \
            tests/special-analytics.test.mjs \
            tests/site-header-complete-unification.test.mjs
      - name: Commit bounded formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/_lib/special-core.js api/admin-special.js \
            api/special-event.js api/special-page.js \
            tests/special-analytics.test.mjs \
            tests/site-header-complete-unification.test.mjs
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'style(special): apply scoped Prettier'
            git push origin HEAD:refs/heads/feat/novelight-special-v1-20261023
          fi

name: 'Account #82 Stripe TEST Premium beta price (OWNER one-shot)'

# Review-only in this Draft PR. After a separately approved merge to main,
# only a fresh OWNER issue comment may start this TEST-only writer.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: novelight-stripe-test-premium-beta-price-once
  cancel-in-progress: false

jobs:
  admit:
    name: Validate exact OWNER grant, main and immutable account-fix PR
    if: >-
      github.repository == 'bingohooah888-ai/novelrise' &&
      github.run_attempt == 1 &&
      github.event.issue.pull_request == null &&
      github.event.issue.number == 188 &&
      github.event.issue.state == 'open' &&
      github.event.issue.locked == false &&
      github.event.issue.title == '[Staging Approval Control] Preview / Staging cost gate' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.id == 317436651 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_STRIPE_TEST_PREMIUM_PRICE_APPROVE ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      main_sha: ${{ steps.admission.outputs.main_sha }}
      candidate_sha: ${{ steps.admission.outputs.candidate_sha }}
      request_id: ${{ steps.admission.outputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Verify OWNER comment and exact immutable candidate without secrets
        id: admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/188" > /tmp/price-issue.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > /tmp/price-main.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/2785" > /tmp/price-pr.json
          main="$(jq -er '.object.sha' /tmp/price-main.json)"
          head="$(jq -er '.head.sha' /tmp/price-pr.json)"
          test "$(git rev-parse HEAD)" = "$main"
          test "$GITHUB_SHA" = "$main"
          gh api "repos/$GITHUB_REPOSITORY/compare/$main...$head" > /tmp/price-compare.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/188/comments?per_page=100" \
            > /tmp/price-ledger.json
          node scripts/account-deletion-stripe-test-premium-price-admission.mjs \
            "$GITHUB_EVENT_PATH" /tmp/price-issue.json /tmp/price-main.json \
            /tmp/price-pr.json /tmp/price-compare.json /tmp/price-ledger.json \
            "$main" > /tmp/price-grant.json
          {
            echo "main_sha=$(jq -er '.mainSha' /tmp/price-grant.json)"
            echo "candidate_sha=$(jq -er '.candidateSha' /tmp/price-grant.json)"
            echo "request_id=$(jq -er '.approvalCommentId' /tmp/price-grant.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Claim one-shot grant before any Stripe connection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.admission.outputs.main_sha }}
          HEAD: ${{ steps.admission.outputs.candidate_sha }}
          REQUEST_ID: ${{ steps.admission.outputs.request_id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/188" --jq '.state')" = open
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/188" --jq '.locked')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2785" --jq '.head.sha')" = "$HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2785" --jq '.base.sha')" = "$MAIN"
          claim="$(jq -cn \
            --arg requestCommentId "$REQUEST_ID" \
            --arg mainSha "$MAIN" \
            --arg candidateSha "$HEAD" \
            --arg runId "$GITHUB_RUN_ID" \
            '{requestCommentId:$requestCommentId,mainSha:$mainSha,candidateSha:$candidateSha,runId:$runId}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/188/comments" \
            -f body="NOVELIGHT_STRIPE_TEST_PREMIUM_PRICE_CLAIMED $claim" > /dev/null

  provision:
    name: Audit full TEST catalog and create at most one Premium beta price
    needs: admit
    if: needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_MAIN_SHA: ${{ needs.admit.outputs.main_sha }}
      EXPECTED_FIX_SHA: ${{ needs.admit.outputs.candidate_sha }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_EXPECTED_ACCOUNT_SHA256: ${{ vars.STRIPE_TEST_EXPECTED_ACCOUNT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Recheck exact current main, fix SHA and protected TEST configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$APPROVED_MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/188" --jq '.state')" = open
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/188" --jq '.locked')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2785" --jq '.head.sha')" = "$EXPECTED_FIX_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2785" --jq '.base.sha')" = "$APPROVED_MAIN_SHA"
          test -n "$STRIPE_TEST_SECRET_KEY"
          test -n "$STRIPE_TEST_EXPECTED_ACCOUNT_SHA256"
      - name: Verify account digest; audit active/inactive catalog; ensure only Premium 480 JPY monthly
        run: node scripts/account-deletion-stripe-test-premium-price-once.mjs --approved-once

  consume:
    name: Consume grant on success, failure or interruption
    needs: [admit, provision]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Record one-shot result without sensitive Stripe details
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.admit.outputs.main_sha }}
          HEAD: ${{ needs.admit.outputs.candidate_sha }}
          REQUEST_ID: ${{ needs.admit.outputs.request_id }}
          RESULT: ${{ needs.provision.result }}
        run: |
          set -euo pipefail
          consumed="$(jq -cn \
            --arg requestCommentId "$REQUEST_ID" \
            --arg mainSha "$MAIN" \
            --arg candidateSha "$HEAD" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg result "$RESULT" \
            '{requestCommentId:$requestCommentId,mainSha:$mainSha,candidateSha:$candidateSha,runId:$runId,result:$result}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/188/comments" \
            -f body="NOVELIGHT_STRIPE_TEST_PREMIUM_PRICE_CONSUMED $consumed" > /dev/null

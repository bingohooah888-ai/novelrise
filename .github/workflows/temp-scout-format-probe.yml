name: TEMP SCOUT Format Probe

on:
  push:
    branches:
      - fix/scout-record-auth-diagnostic-20261005

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier output
        run: |
          npx prettier --write tests/e2e/production-auth/scout-record-auth-diagnostic.spec.js
          echo 'SCOUT_FORMAT_PROBE_BEGIN'
          cat tests/e2e/production-auth/scout-record-auth-diagnostic.spec.js
          echo 'SCOUT_FORMAT_PROBE_END'

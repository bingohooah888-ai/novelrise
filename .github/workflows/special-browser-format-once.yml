name: SPECIAL browser-test formatter once
on:
  push:
    branches:
      - feat/novelight-special-static-20261023
permissions:
  contents: write
concurrency:
  group: special-static-browser-format-once
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'bingohooah888-ai/novelrise' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novelight-special-static-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Format only SPECIAL browser regression spec
        run: ./node_modules/.bin/prettier --write tests/e2e/specs/novelight-special-display.spec.js
      - name: Save formatted spec
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/specs/novelight-special-display.spec.js
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'style(special): format focused browser regression'
            git push origin HEAD:refs/heads/feat/novelight-special-static-20261023
          fi

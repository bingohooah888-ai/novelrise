name: NOVELIGHT Staging Smoke

on:
  deployment_status:
  issues:
    types: [reopened]
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Optional HTTPS Vercel Preview/Staging URL; otherwise STAGING_BASE_URL is used'
        required: false
        type: string
      revision:
        description: 'Exact 40-character commit SHA deployed at the manual Staging URL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Verify staging surface, auth, and test billing once
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'reopened' &&
       github.event.issue.number == 188 &&
       github.event.issue.user.login == 'bingohooah888-ai' &&
       github.event.sender.login == 'bingohooah888-ai') ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production' &&
       github.event.deployment.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: novelight-staging-smoke-${{ github.event_name == 'issues' && 'chat-control' || github.event.deployment.id || github.ref }}
      cancel-in-progress: true
    environment: staging
    env:
      STAGING_TRIGGER: ${{ github.event_name == 'issues' && 'workflow_dispatch' || github.event_name }}
      MANUAL_STAGING_URL: ${{ inputs.staging_url }}
      CANONICAL_STAGING_URL: ${{ vars.STAGING_BASE_URL }}
      DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
      DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
      STAGING_EXPECTED_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_EXPECTED_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_E2E_READY: ${{ vars.STAGING_E2E_READY }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      E2E_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PRODUCTION_AUTH_SMOKE_FIXTURE: /tmp/novelight-staging-smoke.json
      CHECKOUT_SESSION_PREFIX: cs_test_

    steps:
      - name: Resolve exact Staging revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REVISION: ${{ inputs.revision }}
          DEPLOYMENT_REVISION: ${{ github.event.deployment.sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            issues)
              target="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
                  --jq '.object.sha'
              )"
              ;;
            workflow_dispatch)
              target="$DISPATCH_REVISION"
              ;;
            deployment_status)
              target="$DEPLOYMENT_REVISION"
              ;;
            *)
              echo "CONFIG_DRIFT: unexpected Staging Smoke trigger $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac

          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'CONFIG_DRIFT: resolved Staging revision is not an exact 40-character commit SHA.'
            exit 1
          fi

          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_REVISION=$target" >> "$GITHUB_ENV"

      - name: Require write-ready Staging for chat control
        if: github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$STAGING_E2E_READY" != 'true' ]; then
            echo 'CONFIG_DRIFT: chat-controlled Staging Smoke requires STAGING_E2E_READY=true.'
            exit 1
          fi

      - name: Checkout deployed revision once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha }}

      - name: Confirm controlled revision is still current main
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REVISION: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checked_revision="$(git rev-parse HEAD)"
          current_main="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"

          if [ "$checked_revision" != "$TARGET_REVISION" ]; then
            echo "CONFIG_DRIFT: checkout revision $checked_revision does not match resolved target $TARGET_REVISION."
            exit 1
          fi
          if [ "$current_main" != "$TARGET_REVISION" ]; then
            echo "CONFIG_DRIFT: current main moved to $current_main after chat control resolved $TARGET_REVISION."
            exit 1
          fi

      - name: Setup Node.js once
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Verify read-only Staging deployment contract
        env:
          STAGING_REQUIRE_WRITE_CONFIG: 'false'
        run: node scripts/verify-staging-deployment.mjs

      - name: Install browser test dependencies once
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright ffmpeg once
        working-directory: tests/e2e
        run: npx playwright install ffmpeg

      - name: Run read-only staging smoke
        working-directory: tests/e2e
        run: npm run test:staging

      - name: Upload read-only staging diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-readonly-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/staging-playwright-report
            tests/e2e/staging-test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Verify authenticated Staging credentials
        if: success() && vars.STAGING_E2E_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY" || {
            echo 'CONFIG_DRIFT: STAGING_SUPABASE_SECRET_KEY is not configured.'
            exit 1
          }
          test -n "$E2E_SUPABASE_PUBLISHABLE_KEY" || {
            echo 'CONFIG_DRIFT: STAGING_SUPABASE_PUBLISHABLE_KEY is not configured.'
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'CONFIG_DRIFT: SUPABASE_ACCESS_TOKEN is not configured for read-only Staging migration proof.'
            exit 1
          }

      - name: Verify write-capable Staging deployment contract
        if: success() && vars.STAGING_E2E_READY == 'true'
        env:
          STAGING_REQUIRE_WRITE_CONFIG: 'true'
        run: node scripts/verify-staging-deployment.mjs

      - name: Verify Staging migration parity before writes
        if: success() && vars.STAGING_E2E_READY == 'true'
        run: node scripts/verify-staging-migration-parity.mjs

      - name: Install application dependencies once
        if: success() && vars.STAGING_E2E_READY == 'true'
        run: npm ci

      - name: Create ephemeral authenticated Staging desktop users
        if: success() && vars.STAGING_E2E_READY == 'true'
        id: auth_fixture_desktop
        env:
          AUTH_SMOKE_LABEL: ステージング認証スモーク
        run: node scripts/production-auth-smoke-fixture.mjs setup

      - name: Run authenticated Staging desktop smoke
        if: success() && vars.STAGING_E2E_READY == 'true'
        id: auth_desktop
        continue-on-error: true
        working-directory: tests/e2e
        env:
          AUTH_SMOKE_LABEL: ステージング認証スモーク
          E2E_COMPLETE_BILLING: 'false'
        run: >-
          npx playwright test production-auth/authenticated-smoke.spec.js
          --project=production-authenticated-chromium
          --config=playwright.production-auth.config.mjs

      - name: Upload authenticated Staging desktop diagnostics
        if: steps.auth_desktop.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-auth-desktop-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Clean ephemeral authenticated Staging desktop data
        if: always() && steps.auth_fixture_desktop.outcome != 'skipped'
        id: auth_cleanup_desktop
        env:
          AUTH_SMOKE_LABEL: ステージング認証スモーク
        run: node scripts/production-auth-smoke-fixture.mjs cleanup

      - name: Create fresh ephemeral authenticated Staging mobile users
        if: success() && vars.STAGING_E2E_READY == 'true'
        id: auth_fixture_mobile
        env:
          AUTH_SMOKE_LABEL: ステージング認証スモーク
        run: node scripts/production-auth-smoke-fixture.mjs setup

      - name: Run authenticated Staging mobile smoke
        if: success() && vars.STAGING_E2E_READY == 'true'
        id: auth_mobile
        continue-on-error: true
        working-directory: tests/e2e
        env:
          AUTH_SMOKE_LABEL: ステージング認証スモーク
          E2E_COMPLETE_BILLING: 'false'
        run: >-
          npx playwright test production-auth/authenticated-smoke.spec.js
          --project=production-authenticated-mobile-chromium
          --config=playwright.production-auth.config.mjs

      - name: Upload authenticated Staging mobile diagnostics
        if: steps.auth_mobile.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-auth-mobile-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Clean ephemeral authenticated Staging mobile data
        if: always() && steps.auth_fixture_mobile.outcome != 'skipped'
        id: auth_cleanup_mobile
        env:
          AUTH_SMOKE_LABEL: ステージング認証スモーク
        run: node scripts/production-auth-smoke-fixture.mjs cleanup

      - name: Require authenticated Staging desktop and mobile smoke success
        if: always() && steps.auth_fixture_desktop.outcome != 'skipped'
        env:
          DESKTOP_OUTCOME: ${{ steps.auth_desktop.outcome }}
          DESKTOP_CLEANUP_OUTCOME: ${{ steps.auth_cleanup_desktop.outcome }}
          MOBILE_FIXTURE_OUTCOME: ${{ steps.auth_fixture_mobile.outcome }}
          MOBILE_OUTCOME: ${{ steps.auth_mobile.outcome }}
          MOBILE_CLEANUP_OUTCOME: ${{ steps.auth_cleanup_mobile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DESKTOP_OUTCOME" = 'success' || {
            echo "Authenticated Staging desktop smoke failed: $DESKTOP_OUTCOME"
            exit 1
          }
          test "$DESKTOP_CLEANUP_OUTCOME" = 'success' || {
            echo "Authenticated Staging desktop cleanup failed: $DESKTOP_CLEANUP_OUTCOME"
            exit 1
          }
          test "$MOBILE_FIXTURE_OUTCOME" = 'success' || {
            echo "Authenticated Staging mobile fixture failed: $MOBILE_FIXTURE_OUTCOME"
            exit 1
          }
          test "$MOBILE_OUTCOME" = 'success' || {
            echo "Authenticated Staging mobile smoke failed: $MOBILE_OUTCOME"
            exit 1
          }
          test "$MOBILE_CLEANUP_OUTCOME" = 'success' || {
            echo "Authenticated Staging mobile cleanup failed: $MOBILE_CLEANUP_OUTCOME"
            exit 1
          }

      - name: Create fresh ephemeral staging billing user
        if: success() && vars.STAGING_E2E_READY == 'true'
        id: billing_fixture
        env:
          AUTH_SMOKE_LABEL: ステージング課金スモーク
        run: node scripts/production-auth-smoke-fixture.mjs setup

      - name: Run complete Stripe test billing smoke
        if: success() && vars.STAGING_E2E_READY == 'true'
        working-directory: tests/e2e
        env:
          AUTH_SMOKE_LABEL: ステージング課金スモーク
          E2E_COMPLETE_BILLING: 'true'
        run: npx playwright test production-auth/billing-smoke.spec.js --config=playwright.production-auth.config.mjs

      - name: Upload billing staging diagnostics
        if: failure() && steps.billing_fixture.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-billing-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Clean ephemeral staging billing data
        if: always() && steps.billing_fixture.outcome != 'skipped'
        env:
          AUTH_SMOKE_LABEL: ステージング課金スモーク
        run: node scripts/production-auth-smoke-fixture.mjs cleanup

      - name: Remove temporary staging fixture
        if: always()
        run: rm -f "$PRODUCTION_AUTH_SMOKE_FIXTURE"

name: Temporary PR 170 Formatter

on:
  push:
    branches: [ops/enforce-automation-efficiency-gates]
    paths:
      - '.github/workflows/format-pr-170.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ops/enforce-automation-efficiency-gates

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format remaining test and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/automation-efficiency-gates.test.mjs
          rm .github/workflows/format-pr-170.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/automation-efficiency-gates.test.mjs .github/workflows/format-pr-170.yml
          git diff --cached --check
          git commit -m 'Format automation efficiency gate test'
          git push origin HEAD:ops/enforce-automation-efficiency-gates

name: NOVELIGHT Production Webhook Control

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-webhook-control.mjs'
      - '.github/workflows/production-webhook-control.yml'

permissions:
  contents: read

concurrency:
  group: novelight-production-webhook-control
  cancel-in-progress: false

jobs:
  control:
    name: Prove external Stripe live webhook delivery without a live charge
    runs-on: ubuntu-latest
    environment: production-approval
    env:
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ranobe1
      VERCEL_PROJECT: novelrise
      EXPECTED_BRANCH: main
      EXPECTED_PRODUCTION_SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      PRODUCTION_ENV_FILE: /tmp/novelight-production-webhook-control.env

    steps:
      - name: Refuse unexpected ref or credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || {
            echo 'Refusing to run outside main.'
            exit 1
          }
          [[ "$STRIPE_LIVE_SECRET_KEY" == sk_live_* ]] || {
            echo 'STRIPE_LIVE_SECRET_KEY is missing or is not live.'
            exit 1
          }
          test -n "$VERCEL_TOKEN" || {
            echo 'VERCEL_TOKEN is not configured.'
            exit 1
          }

      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify this main commit only introduced the control harness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
          test "${#changed[@]}" -gt 0 || {
            echo 'No changed files detected for the control-test commit.'
            exit 1
          }
          printf 'Control-test changed files:\n'
          printf ' - %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/production-webhook-control.mjs|.github/workflows/production-webhook-control.yml)
                ;;
              *)
                echo "Unexpected changed file in control-test commit: $path"
                exit 1
                ;;
            esac
          done

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Pull Vercel Production environment into runner memory
        shell: bash
        run: |
          set -euo pipefail
          vercel link \
            --yes \
            --project "$VERCEL_PROJECT" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            >/dev/null

          vercel env pull "$PRODUCTION_ENV_FILE" \
            --environment=production \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            >/dev/null

          set -a
          # shellcheck disable=SC1090
          source "$PRODUCTION_ENV_FILE"
          set +a

          required=(
            SUPABASE_URL
            SUPABASE_SECRET_KEY
            STRIPE_STANDARD_PRICE_ID
            NOVELIGHT_APP_URL
          )

          for key in "${required[@]}"; do
            value="${!key:-}"
            test -n "$value" || {
              echo "Missing Vercel Production variable: $key"
              exit 1
            }
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done

      - name: Verify Production Supabase secret against the canonical project
        id: supabase_alignment
        shell: bash
        run: |
          set -euo pipefail

          current_host="${SUPABASE_URL#https://}"
          current_host="${current_host%%/*}"
          echo "Observed Vercel Production Supabase host: $current_host"

          if [ "$SUPABASE_URL" = "$EXPECTED_PRODUCTION_SUPABASE_URL" ]; then
            echo 'Production Supabase URL is already canonical.'
            echo 'repair_needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response_code="$(curl --silent --show-error --output /tmp/canonical-supabase-probe.json \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 20 \
            --url "$EXPECTED_PRODUCTION_SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY")"

          if [[ "$response_code" =~ ^2 ]]; then
            echo 'Current Production Supabase secret authenticates against the canonical Production project.'
            echo 'Only SUPABASE_URL is misaligned; guarded repair is allowed.'
            echo 'repair_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Canonical Production Supabase probe failed with HTTP $response_code."
          echo 'Refusing to change Vercel because SUPABASE_SECRET_KEY may also be misaligned.'
          exit 1

      - name: Repair canonical Production Supabase URL in Vercel
        if: steps.supabase_alignment.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_PRODUCTION_SUPABASE_URL" \
            | vercel env add SUPABASE_URL production \
                --force \
                --yes \
                --sensitive \
                --scope "$VERCEL_SCOPE" \
                --token "$VERCEL_TOKEN" \
                >/dev/null

          echo 'Vercel Production SUPABASE_URL repaired to the canonical Production project.'

      - name: Redeploy Production after guarded Supabase URL repair
        if: steps.supabase_alignment.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy \
            --prod \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > /tmp/production-supabase-repair-deploy.txt
          tail -n 1 /tmp/production-supabase-repair-deploy.txt

      - name: Wait for Production webhook route after repair
        if: steps.supabase_alignment.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/webhook-health-response \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
              "$NOVELIGHT_APP_URL/api/stripe-webhook")"
            if [ "$code" = '405' ]; then
              echo 'Production webhook route is reachable after redeploy.'
              exit 0
            fi
            echo "Production webhook route not ready (attempt ${attempt}/24, HTTP ${code})."
            sleep 10
          done
          echo 'Production webhook route did not become healthy in time.'
          exit 1

      - name: Use canonical Production Supabase URL for control verification
        shell: bash
        run: |
          set -euo pipefail
          printf 'SUPABASE_URL=%s\n' "$EXPECTED_PRODUCTION_SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Run no-charge Production webhook control proof
        run: node scripts/production-webhook-control.mjs

      - name: Remove temporary Production environment material
        if: always()
        shell: bash
        run: rm -f "$PRODUCTION_ENV_FILE" /tmp/canonical-supabase-probe.json /tmp/production-supabase-repair-deploy.txt /tmp/webhook-health-response

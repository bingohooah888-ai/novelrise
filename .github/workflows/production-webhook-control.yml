name: NOVELIGHT Production Webhook Control

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-webhook-control.mjs'
      - '.github/workflows/production-webhook-control.yml'

permissions:
  contents: read

concurrency:
  group: novelight-production-webhook-control
  cancel-in-progress: false

jobs:
  control:
    name: Prove external Stripe live webhook delivery without a live charge
    runs-on: ubuntu-latest
    environment: production-approval
    env:
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      STRIPE_STANDARD_PRICE_ID: ${{ secrets.STRIPE_STANDARD_PRICE_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      NOVELIGHT_APP_URL: https://novelrise.vercel.app
      EXPECTED_BRANCH: main

    steps:
      - name: Refuse unexpected ref or approval-scoped inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || {
            echo 'Refusing to run outside main.'
            exit 1
          }
          [[ "$STRIPE_LIVE_SECRET_KEY" == sk_live_* ]] || {
            echo 'STRIPE_LIVE_SECRET_KEY is missing or is not live in the Production environment.'
            exit 1
          }
          [[ "$STRIPE_STANDARD_PRICE_ID" == price_* ]] || {
            echo 'STRIPE_STANDARD_PRICE_ID is missing or is not a Stripe price ID in the Production environment.'
            exit 1
          }
          test -n "$SUPABASE_SECRET_KEY" || {
            echo 'SUPABASE_SECRET_KEY is not configured in the Production environment.'
            exit 1
          }
          test "$NOVELIGHT_APP_URL" = 'https://novelrise.vercel.app' || {
            echo 'NOVELIGHT_APP_URL is not the canonical Production application URL.'
            exit 1
          }

      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify this main commit only introduced the control harness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
          test "${#changed[@]}" -gt 0 || {
            echo 'No changed files detected for the control-test commit.'
            exit 1
          }
          printf 'Control-test changed files:\n'
          printf ' - %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/production-webhook-control.mjs|.github/workflows/production-webhook-control.yml)
                ;;
              *)
                echo "Unexpected changed file in control-test commit: $path"
                exit 1
                ;;
            esac
          done

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Run no-charge Production webhook control proof
        run: node scripts/production-webhook-control.mjs

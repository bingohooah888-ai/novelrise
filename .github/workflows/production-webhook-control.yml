name: NOVELIGHT Production Webhook Control

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-webhook-control.mjs'
      - '.github/workflows/production-webhook-control.yml'

permissions:
  contents: read

concurrency:
  group: novelight-production-webhook-control
  cancel-in-progress: false

jobs:
  approval:
    name: Approve Production webhook control
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - name: Record approval gate
        run: echo 'Production webhook control approved.'

  control:
    name: Prove external Stripe live webhook delivery without a live charge
    needs: approval
    runs-on: ubuntu-latest
    environment: Production
    env:
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_SCOPE: ranobe1
      VERCEL_PROJECT: novelrise
      EXPECTED_BRANCH: main
      EXPECTED_PRODUCTION_SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
      PRODUCTION_ENV_FILE: /tmp/novelight-production-webhook-control.env

    steps:
      - name: Refuse unexpected ref or credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || {
            echo 'Refusing to run outside main.'
            exit 1
          }
          [[ "$STRIPE_LIVE_SECRET_KEY" == sk_live_* ]] || {
            echo 'STRIPE_LIVE_SECRET_KEY is missing or is not live in the Production environment.'
            exit 1
          }
          test -n "$VERCEL_TOKEN" || {
            echo 'VERCEL_TOKEN is not configured in the Production environment.'
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured in the Production environment.'
            exit 1
          }

      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify this main commit only introduced the control harness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD^1 HEAD)
          test "${#changed[@]}" -gt 0 || {
            echo 'No changed files detected for the control-test commit.'
            exit 1
          }
          printf 'Control-test changed files:\n'
          printf ' - %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/production-webhook-control.mjs|.github/workflows/production-webhook-control.yml)
                ;;
              *)
                echo "Unexpected changed file in control-test commit: $path"
                exit 1
                ;;
            esac
          done

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Retrieve canonical Production Supabase secret for this approved run
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            > /tmp/supabase-api-keys.json

          canonical_secret="$(jq -er '
            ([.[] | select(.type == "secret") | .api_key][0]) //
            ([.[] | select(.name == "service_role") | .api_key][0]) //
            empty
          ' /tmp/supabase-api-keys.json)"

          test -n "$canonical_secret" || {
            echo 'No revealable canonical Production Supabase secret/service-role key was returned.'
            exit 1
          }
          printf '::add-mask::%s\n' "$canonical_secret"
          printf 'SUPABASE_SECRET_KEY=%s\n' "$canonical_secret" >> "$GITHUB_ENV"

      - name: Pull Vercel Production environment into runner memory
        shell: bash
        run: |
          set -euo pipefail
          vercel link \
            --yes \
            --project "$VERCEL_PROJECT" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            >/dev/null

          vercel env pull "$PRODUCTION_ENV_FILE" \
            --environment=production \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            >/dev/null

          set -a
          # shellcheck disable=SC1090
          source "$PRODUCTION_ENV_FILE"
          set +a

          required=(
            SUPABASE_URL
            SUPABASE_SECRET_KEY
            STRIPE_STANDARD_PRICE_ID
            NOVELIGHT_APP_URL
          )

          for key in "${required[@]}"; do
            value="${!key:-}"
            test -n "$value" || {
              echo "Missing Vercel Production variable: $key"
              exit 1
            }
            printf '::add-mask::%s\n' "$value"
          done

          printf 'VERCEL_SUPABASE_URL=%s\n' "$SUPABASE_URL" >> "$GITHUB_ENV"
          printf 'VERCEL_SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY" >> "$GITHUB_ENV"
          printf 'STRIPE_STANDARD_PRICE_ID=%s\n' "$STRIPE_STANDARD_PRICE_ID" >> "$GITHUB_ENV"
          printf 'NOVELIGHT_APP_URL=%s\n' "$NOVELIGHT_APP_URL" >> "$GITHUB_ENV"

      - name: Compare Vercel Production Supabase credentials with canonical Production
        id: supabase_alignment
        shell: bash
        run: |
          set -euo pipefail

          if [ "$VERCEL_SUPABASE_URL" = "$EXPECTED_PRODUCTION_SUPABASE_URL" ] && \
             [ "$VERCEL_SUPABASE_SECRET_KEY" = "$SUPABASE_SECRET_KEY" ]; then
            echo 'Vercel Production Supabase URL and secret already match canonical Production.'
            echo 'repair_needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'Vercel Production Supabase credentials are misaligned; guarded pair repair is required.'
          echo 'repair_needed=true' >> "$GITHUB_OUTPUT"

      - name: Repair canonical Production Supabase URL and secret in Vercel
        if: steps.supabase_alignment.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          set_sensitive_env() {
            local key="$1"
            local value="$2"
            printf '::add-mask::%s\n' "$value"
            printf '%s' "$value" \
              | vercel env add "$key" production \
                  --force \
                  --yes \
                  --sensitive \
                  --scope "$VERCEL_SCOPE" \
                  --token "$VERCEL_TOKEN" \
                  >/dev/null
          }

          set_sensitive_env SUPABASE_URL "$EXPECTED_PRODUCTION_SUPABASE_URL"
          set_sensitive_env SUPABASE_SECRET_KEY "$SUPABASE_SECRET_KEY"
          echo 'Vercel Production Supabase URL and secret repaired as one canonical pair.'

      - name: Redeploy Production after guarded Supabase credential repair
        if: steps.supabase_alignment.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy \
            --prod \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > /tmp/production-supabase-repair-deploy.txt
          tail -n 1 /tmp/production-supabase-repair-deploy.txt

      - name: Wait for Production webhook route after repair
        if: steps.supabase_alignment.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/webhook-health-response \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
              "$NOVELIGHT_APP_URL/api/stripe-webhook")"
            if [ "$code" = '405' ]; then
              echo 'Production webhook route is reachable after redeploy.'
              exit 0
            fi
            echo "Production webhook route not ready (attempt ${attempt}/24, HTTP ${code})."
            sleep 10
          done
          echo 'Production webhook route did not become healthy in time.'
          exit 1

      - name: Use canonical Production Supabase credentials for control verification
        shell: bash
        run: |
          set -euo pipefail
          printf 'SUPABASE_URL=%s\n' "$EXPECTED_PRODUCTION_SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Run no-charge Production webhook control proof
        run: node scripts/production-webhook-control.mjs

      - name: Remove temporary Production credential material
        if: always()
        shell: bash
        run: rm -f "$PRODUCTION_ENV_FILE" /tmp/supabase-api-keys.json /tmp/production-supabase-repair-deploy.txt /tmp/webhook-health-response

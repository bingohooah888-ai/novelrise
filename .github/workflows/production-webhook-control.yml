name: NOVELIGHT Production Webhook Control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novelight-production-webhook-control
  cancel-in-progress: false

jobs:
  control:
    name: Prove Production beta billing and external Stripe live webhook delivery without a live charge
    runs-on: ubuntu-latest
    environment: production-approval
    env:
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      NOVELIGHT_APP_URL: https://novelrise.vercel.app
      NOVELIGHT_BETA_STANDARD_FREE: 'true'
      EXPECTED_BRANCH: main

    steps:
      - name: Refuse unexpected ref or approval-scoped inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || {
            echo 'Refusing to run outside main.'
            exit 1
          }
          [[ "$STRIPE_LIVE_SECRET_KEY" == sk_live_* ]] || {
            echo 'STRIPE_LIVE_SECRET_KEY is missing or is not live in the Production environment.'
            exit 1
          }
          test -n "$SUPABASE_SECRET_KEY" || {
            echo 'SUPABASE_SECRET_KEY is not configured in the Production environment.'
            exit 1
          }
          test "$SUPABASE_URL" = 'https://fiepaguycecrredwrcwx.supabase.co' || {
            echo 'SUPABASE_URL is not the canonical Production Supabase project.'
            exit 1
          }
          test "$NOVELIGHT_APP_URL" = 'https://novelrise.vercel.app' || {
            echo 'NOVELIGHT_APP_URL is not the canonical Production application URL.'
            exit 1
          }
          test "$NOVELIGHT_BETA_STANDARD_FREE" = 'true' || {
            echo 'Beta Standard free mode is not enabled for this control.'
            exit 1
          }

      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Run no-charge Production beta billing and webhook control proof
        run: node scripts/production-beta-billing-control.mjs

      - name: Audit final Production billing consistency
        run: node scripts/production-billing-audit.mjs

name: NOVELIGHT Exact Author-Cover Safari Staging Sync 20261018

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event.issue.number == 294 &&
      github.event.issue.pull_request == null &&
      github.event.issue.title == '[Staging Control] Supabase migration sync' &&
      github.event.issue.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_STAGING_AUTHOR_COVER_MIME_APPROVE ')
    name: Apply only the approved Safari MIME migration on Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: supabase-staging-migration-sync
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_DATABASE_URL_FILE: /tmp/novelight-staging-database-url
      PGSSLMODE: require
      EXPECTED_MIGRATIONS: '20261018090000'
      EXPECTED_PROJECT_REF: wmlzjgvxgoyrovdhbqbg
    steps:
      - name: Verify exact OWNER scope and 1-use request identity
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          request_json="$(printf '%s\n' "$COMMENT_BODY" |
            sed -n 's/^NOVELIGHT_STAGING_AUTHOR_COVER_MIME_APPROVE //p')"
          test -n "$request_json"
          printf '%s\n' "$request_json" | jq -e '
            type == "object" and
            (.scope == "author-cover-safari-mime-20261018") and
            (.mainSha | type == "string" and test("^[a-f0-9]{40}$")) and
            (.versions == ["20261018090000"]) and
            (.confirmation == "STAGING APPROVED") and
            ((keys | sort) == (["confirmation","mainSha","scope","versions"] | sort))
          ' >/dev/null
          main_sha="$(printf '%s\n' "$request_json" | jq -er '.mainSha')"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approval.outputs.main_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate main, Staging config and immutable artifacts
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          STAGING_DATABASE_URL_SOURCE: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_SHA"
          test -n "$STAGING_SUPABASE_URL"
          test -n "$STAGING_DATABASE_URL_SOURCE"
          test "$STAGING_SUPABASE_URL" = "https://$EXPECTED_PROJECT_REF.supabase.co"
          bash scripts/verify-staging-migrations.sh artifacts /tmp/staging-two-artifacts.txt
          test "$(wc -l < /tmp/staging-two-artifacts.txt | tr -d ' ')" = 1
          command -v psql
          command -v pg_dump

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Resolve isolated Staging SSL database route
        env:
          STAGING_DATABASE_URL_SOURCE: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/resolve-staging-session-pooler.mjs

      - name: Verify exact Staging identity and sole pending Safari migration
        run: |
          set -euo pipefail
          STAGING_DATABASE_URL="$(cat "$STAGING_DATABASE_URL_FILE")"
          export STAGING_DATABASE_URL
          node scripts/verify-staging-migration-target.mjs
          bash scripts/verify-staging-migrations.sh pending /tmp/staging-two-pending-before.txt
          psql "$STAGING_DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f supabase/checks/20261018090000_author_cover_safari_mime_fallback_precheck.sql
          # Preserve the exact existing Staging-only migration as a verified
          # local source artifact. This does not repair or mutate DB history.
          test "$(grep -Fxc '20261014052000' /tmp/staging-validated-remote.txt)" = 1
          stagedir="$(mktemp -d)"
          mkdir -p "$stagedir/supabase/migrations"
          cp supabase/config.toml "$stagedir/supabase/config.toml"
          cp supabase/migrations/*.sql "$stagedir/supabase/migrations/"
          original="20261014052000_community_plaza_phase1.sql"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/1f5ef773a4073f10cc2e1b886eb3a8c942beb5c4"             --jq '.content' | base64 --decode > "$stagedir/supabase/migrations/$original"
          test "$(git hash-object "$stagedir/supabase/migrations/$original")" =             '1f5ef773a4073f10cc2e1b886eb3a8c942beb5c4'
          echo "STAGING_WORK_DIR=$stagedir" >> "$GITHUB_ENV"
          (
            cd "$stagedir"
            supabase db push --db-url "$STAGING_DATABASE_URL" --dry-run
          )

      - name: Record one-time claim before any Staging write
        id: claim
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_SHA"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/294/comments?per_page=100" \
            > /tmp/approved-staging-two-ledger.json
          jq -e --arg id "$COMMENT_ID" --arg body "$COMMENT_BODY" '
            [ .[][] | select((.id|tostring)==$id and .body==$body and
              .user.login=="bingohooah888-ai" and .author_association=="OWNER") ]
            | length == 1
          ' /tmp/approved-staging-two-ledger.json >/dev/null
          claimed="$(jq --arg id "$COMMENT_ID" '
            [ .[][] | select(.body | startswith("NOVELIGHT_STAGING_AUTHOR_COVER_MIME_CLAIMED "))
              | select(.body | contains($id)) ] | length
          ' /tmp/approved-staging-two-ledger.json)"
          test "$claimed" = 0
          payload="$(jq -cn --arg id "$COMMENT_ID" --arg sha "$MAIN_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{requestCommentId:$id,mainSha:$sha,runId:$run,versions:["20261018090000"]}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/294/comments" \
            -f body="NOVELIGHT_STAGING_AUTHOR_COVER_MIME_CLAIMED $payload" >/dev/null

      - name: Apply only 20261018090000
        id: apply09
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_SHA"
          STAGING_DATABASE_URL="$(cat "$STAGING_DATABASE_URL_FILE")"
          export STAGING_DATABASE_URL
          node scripts/verify-staging-migration-target.mjs
          EXPECTED_MIGRATIONS='20261018090000' \
            bash scripts/verify-staging-migrations.sh pending /tmp/staging-two-immediate-second.txt
          (
            cd "$STAGING_WORK_DIR"
            supabase db push --db-url "$STAGING_DATABASE_URL" --dry-run
            supabase db push --db-url "$STAGING_DATABASE_URL" --yes
          )

      - name: Postcheck Safari MIME and exact Staging parity
        id: parity
        run: |
          set -euo pipefail
          STAGING_DATABASE_URL="$(cat "$STAGING_DATABASE_URL_FILE")"
          export STAGING_DATABASE_URL
          psql "$STAGING_DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f supabase/checks/20261018090000_author_cover_safari_mime_fallback_postcheck.sql
          supabase migration list --db-url "$STAGING_DATABASE_URL"             | tee /tmp/staging-two-after.txt
          bash scripts/extract-supabase-remote.sh /tmp/staging-two-after.txt             | sort -u > /tmp/staging-two-applied.txt
          find "$STAGING_WORK_DIR/supabase/migrations" -maxdepth 1 -type f             -name '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql'             -printf '%f\n' | sed -E 's/^([0-9]{14})_.*/\1/'             | sort -u > /tmp/staging-two-expected-applied.txt
          diff -u /tmp/staging-two-expected-applied.txt             /tmp/staging-two-applied.txt
          echo 'Staging now matches all main migrations plus exact pinned Staging-only 20261014052000.'

      - name: Record one-time outcome; never automatically retry or roll back
        if: always() && steps.claim.outcome == 'success'
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          APPLY: ${{ steps.apply09.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          result=failure
          if [ "$APPLY" = success ] && [ "$PARITY" = success ]; then
            result=success
          else
            echo 'STAGING_RECOVERY_REQUIRED: assess read-only migration state before another approved operation.'
          fi
          payload="$(jq -cn --arg id "$COMMENT_ID" --arg sha "$MAIN_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg result "$result" \
            --arg applied "$APPLY" --arg parity "$PARITY" \
            '{requestCommentId:$id,mainSha:$sha,runId:$run,result:$result,applied:$applied,parity:$parity}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/294/comments" \
            -f body="NOVELIGHT_STAGING_AUTHOR_COVER_MIME_CONSUMED $payload" >/dev/null

      - name: Remove temporary Staging credential and isolated source tree
        if: always()
        shell: bash
        run: |
          rm -f "$STAGING_DATABASE_URL_FILE"
          if [ -n "${STAGING_WORK_DIR:-}" ] && [ -d "$STAGING_WORK_DIR" ]; then
            rm -rf -- "$STAGING_WORK_DIR"
          fi

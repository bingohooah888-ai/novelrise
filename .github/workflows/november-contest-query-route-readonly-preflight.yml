name: NOVELIGHT Contest Management Query-Route Fixed SELECT

# Exactly one OWNER comment on Issue #2120. No push, pull_request or dispatch.
# This diagnostic never opens registration and does not prove SQL write rights.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: novelight-contest-query-route-readonly-preflight
  cancel-in-progress: false

jobs:
  fixed-select:
    name: Fixed read_only SELECT via query-capable Management API
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'bingohooah888-ai' &&
      github.event.issue.number == 2120 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'NOVELIGHT_CONTEST_QUERY_ENDPOINT_SELECT_PREFLIGHT_RUN'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NOVELIGHT_CONTEST_QUERY_ROUTE_PREFLIGHT: FIXED_SELECT_READ_ONLY

    steps:
      - name: Checkout exact main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify signed main identity and execute one fixed SELECT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/november-contest-query-route-readonly-preflight.mjs

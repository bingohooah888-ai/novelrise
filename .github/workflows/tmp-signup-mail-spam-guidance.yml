name: Temporary Signup Mail Spam Guidance

on:
  push:
    branches:
      - launch/signup-mail-spam-guidance
    paths:
      - .github/workflows/tmp-signup-mail-spam-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/signup-mail-spam-guidance
      - name: Patch exact signup confirmation guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('signup.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "確認メールを送信しました。メール内の期限付きリンクから本人確認を完了してください。",
                  "確認メールを送信しました。メール内の期限付きリンクから本人確認を完了してください。届かない場合は迷惑メールフォルダをご確認のうえ、auth@novelight.jp からのメールを検索してください。",
              ),
              (
                  "会員登録を受け付けました。確認メール内の期限付きリンクから本人確認を完了してください。",
                  "会員登録を受け付けました。確認メール内の期限付きリンクから本人確認を完了してください。届かない場合は迷惑メールフォルダをご確認のうえ、auth@novelight.jp からのメールを検索してください。",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact replacement safety stop: {old!r} count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          for _, new in replacements:
              if text.count(new) != 1:
                  raise SystemExit('patched guidance verification failed')
          PY
          git diff --check
      - name: Commit focused UI copy change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signup.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add signup confirmation spam-folder guidance'
          git push origin HEAD:launch/signup-mail-spam-guidance

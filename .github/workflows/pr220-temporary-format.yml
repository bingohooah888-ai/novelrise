name: PR220 Temporary Formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.number == 220 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format exact PR targets
        run: >-
          npx prettier --write
          tests/production-migration-approved-dispatch.test.mjs
          .github/workflows/production-migration-approved-dispatch.yml
          .github/workflows/supabase-production-auto-deploy.yml

      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            tests/production-migration-approved-dispatch.test.mjs \
            .github/workflows/production-migration-approved-dispatch.yml \
            .github/workflows/supabase-production-auto-deploy.yml; then
            echo 'Formatting already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/production-migration-approved-dispatch.test.mjs \
            .github/workflows/production-migration-approved-dispatch.yml \
            .github/workflows/supabase-production-auto-deploy.yml
          git commit -m 'Format Production migration approval changes'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

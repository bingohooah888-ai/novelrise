name: Temporary account deletion formatter

on:
  push:
    branches:
      - feat/account-deletion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-deletion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository-locked Prettier
        run: npx prettier --write api/_lib/delete-account.js api/delete-account.js tests/account-deletion-api.test.mjs tests/account-deletion-page.test.mjs

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- api/_lib/delete-account.js api/delete-account.js tests/account-deletion-api.test.mjs tests/account-deletion-page.test.mjs; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/delete-account.js api/delete-account.js tests/account-deletion-api.test.mjs tests/account-deletion-page.test.mjs
          git commit -m "style: format account deletion implementation"
          git push origin HEAD:feat/account-deletion

name: Temporary High-Risk Approval Formatter Probe

on:
  push:
    branches:
      - fix/auto-merge-approved-high-risk

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write .github/workflows/high-risk-pr-approval.yml
          git diff -- .github/workflows/high-risk-pr-approval.yml

name: Temporary sync Production Auth Smoke

on:
  push:
    branches:
      - fix/production-auth-smoke-current-ui
    paths:
      - .github/workflows/temp-sync-production-auth-smoke.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-auth-smoke-current-ui
          fetch-depth: 0

      - name: Apply exact current-UI smoke updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('tests/e2e/production-auth/authenticated-smoke.spec.js')
          text = auth_path.read_text()

          old = """const exposureConversionRpcPath =\n  '/rest/v1/rpc/record_novel_exposure_conversion';\n"""
          new = old + """const validReadRpcPath = '/rest/v1/rpc/record_valid_read_progress';\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """async function readEpisodeAndRecord(page, episodeHref, title, label) {\n  const conversion = waitForExposureConversion(page, 'episode_read_10s');\n  await page.goto(`/${episodeHref}`);\n  await expect(page.locator('#card h1')).toHaveText(title);\n  await expect(pageContent(page)).toContainText(label);\n  const response = await conversion;\n  expect(response.ok()).toBeTruthy();\n}\n"""
          new = old + """\nasync function qualifyValidRead(page) {\n  const qualifiedResponse = page.waitForResponse(\n    async (response) => {\n      if (\n        !response.url().includes(validReadRpcPath) ||\n        response.request().method() !== 'POST' ||\n        !response.ok()\n      ) {\n        return false;\n      }\n      try {\n        return (await response.json())?.qualified === true;\n      } catch {\n        return false;\n      }\n    },\n    { timeout: 15000 }\n  );\n\n  const content = pageContent(page);\n  await content.scrollIntoViewIfNeeded();\n  for (let index = 0; index < 3; index += 1) {\n    await content.click();\n    await page.waitForTimeout(700);\n  }\n  await page.evaluate(() => globalThis.scrollTo(0, document.body.scrollHeight));\n\n  const response = await qualifiedResponse;\n  expect(response.ok()).toBeTruthy();\n  expect(await response.json()).toMatchObject({ qualified: true });\n}\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """      await authorPage.locator('#contentRating').selectOption('general');\n      await authorPage.locator('#policyAck').check();\n      await authorPage.locator('#submitButton').click();\n"""
          new = """      await authorPage.locator('#contentRating').selectOption('general');\n      const thumbnailOption = authorPage.locator('.thumbnail-option').first();\n      await expect(thumbnailOption).toBeVisible();\n      await thumbnailOption.click();\n      await expect(\n        thumbnailOption.locator('input[name=\"thumbnailAsset\"]')\n      ).toBeChecked();\n      await authorPage.locator('#policyAck').check();\n      await expect(authorPage.locator('#submitButton')).toBeEnabled();\n      await authorPage.locator('#submitButton').click();\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    await test.step('Send LIGHT SEED', async () => {\n      const seedButton = readerPage.locator('#seedButton');\n      await expect(seedButton).toBeVisible();\n      await expect(seedButton).toBeEnabled();\n      readerPage.once('dialog', (dialog) => dialog.accept());\n      await seedButton.click();\n      await expect(seedButton).toBeDisabled();\n      await expect(readerPage.locator('#seedMessage')).toContainText(\n        'すでに贈っています'\n      );\n    });\n\n    await test.step('Verify SCOUT RECORD', async () => {\n      await readerPage.goto('/scout-record.html');\n      await expect(\n        readerPage.getByRole('heading', { name: 'SCOUT RECORD' })\n      ).toBeVisible();\n      await expect(\n        readerPage.getByText(novelTitle, { exact: true })\n      ).toBeVisible();\n    });\n\n    await test.step('Read first and second episode with engagement', async () => {\n      await readEpisodeAndRecord(\n        readerPage,\n        firstEpisodeHref,\n        firstEpisodeTitle,\n        smokeLabel\n      );\n      await readEpisodeAndRecord(\n        readerPage,\n        secondEpisodeHref,\n        secondEpisodeTitle,\n        smokeLabel\n      );\n    });\n"""
          new = """    await test.step('Qualify first episode as valid reading', async () => {\n      await readEpisodeAndRecord(\n        readerPage,\n        firstEpisodeHref,\n        firstEpisodeTitle,\n        smokeLabel\n      );\n      await qualifyValidRead(readerPage);\n      await readerPage.goto(`/novel.html?id=${encodeURIComponent(novelId)}`);\n      await expect(readerPage.locator('.title')).toHaveText(novelTitle);\n    });\n\n    await test.step('Send BRONZE LIGHT SEED', async () => {\n      const seedButton = readerPage.locator(\n        '.seed-choice[data-seed-type=\"BRONZE\"]'\n      );\n      await expect(seedButton).toBeVisible();\n      await expect(seedButton).toBeEnabled();\n      readerPage.once('dialog', (dialog) => dialog.accept());\n      await seedButton.click();\n      await expect(seedButton).toBeDisabled();\n      await expect(readerPage.locator('#seedMessage')).toContainText(\n        'すでにLIGHT SEEDを贈っています'\n      );\n    });\n\n    await test.step('Verify LIGHT SEED send history', async () => {\n      await readerPage.goto('/scout-record.html');\n      await expect(\n        readerPage.getByRole('heading', { name: 'LIGHT SEED送信履歴' })\n      ).toBeVisible();\n      await expect(\n        readerPage.getByText(novelTitle, { exact: true })\n      ).toBeVisible();\n    });\n\n    await test.step('Read second episode with engagement', async () => {\n      await readEpisodeAndRecord(\n        readerPage,\n        secondEpisodeHref,\n        secondEpisodeTitle,\n        smokeLabel\n      );\n    });\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          auth_path.write_text(text)

          home_path = Path('tests/e2e/production-auth/author-home-smoke.spec.js')
          home = home_path.read_text()
          old = "const authorHomeHeading = page.getByRole('heading', { name: /作者ホーム$/ });"
          new = "const authorHomeHeading = page.getByRole('heading', { name: /さんの創作室$/ });"
          assert home.count(old) == 1
          home_path.write_text(home.replace(old, new, 1))

          contract_path = Path('tests/production-auth-smoke-current-ui-contract.test.mjs')
          contract_path.write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst authenticatedSmoke = await readFile(\n  'tests/e2e/production-auth/authenticated-smoke.spec.js',\n  'utf8'\n);\nconst authorHomeSmoke = await readFile(\n  'tests/e2e/production-auth/author-home-smoke.spec.js',\n  'utf8'\n);\n\ntest('Production Auth Smoke follows the current beta UI contracts', () => {\n  assert.match(authenticatedSmoke, /\\.thumbnail-option/);\n  assert.match(authenticatedSmoke, /input\\[name=\\\"thumbnailAsset\\\"\\]/);\n  assert.match(authenticatedSmoke, /record_valid_read_progress/);\n  assert.match(\n    authenticatedSmoke,\n    /\\.seed-choice\\[data-seed-type=\\\"BRONZE\\\"\\]/\n  );\n  assert.match(authenticatedSmoke, /LIGHT SEED送信履歴/);\n  assert.doesNotMatch(authenticatedSmoke, /locator\\('#seedButton'\\)/);\n  assert.doesNotMatch(authenticatedSmoke, /name: 'SCOUT RECORD'/);\n\n  assert.match(authorHomeSmoke, /さんの創作室\\$/);\n  assert.doesNotMatch(authorHomeSmoke, /作者ホーム\\$/);\n});\n""")
          PY

          rm .github/workflows/temp-sync-production-auth-smoke.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/production-auth/authenticated-smoke.spec.js \
            tests/e2e/production-auth/author-home-smoke.spec.js \
            tests/production-auth-smoke-current-ui-contract.test.mjs \
            .github/workflows/temp-sync-production-auth-smoke.yml
          git commit -m 'Align Production Auth Smoke with current beta UI'
          git push origin HEAD:fix/production-auth-smoke-current-ui

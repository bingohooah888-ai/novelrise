name: TEMP Format Thumbnail

on:
  pull_request:
    paths:
      - tests/e2e/staging/thumbnail-flow.spec.js
      - .github/workflows/temp-format-thumbnail.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format thumbnail smoke exactly
        run: npx prettier --write tests/e2e/staging/thumbnail-flow.spec.js
      - name: Upload exact formatted file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-thumbnail-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/staging/thumbnail-flow.spec.js
          if-no-files-found: error
          retention-days: 1

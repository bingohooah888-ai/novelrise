name: NOVELIGHT Production Billing Repair

on:
  workflow_dispatch:
    inputs:
      target_display_name:
        description: Exact Production profile display_name to repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: novelight-production-billing-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Reset a stale paid profile only when its Stripe customer is missing
    runs-on: ubuntu-latest
    environment: production-approval
    env:
      TARGET_DISPLAY_NAME: ${{ inputs.target_display_name }}
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: https://fiepaguycecrredwrcwx.supabase.co
      NOVELIGHT_APP_URL: https://novelrise.vercel.app
      EXPECTED_BRANCH: main

    steps:
      - name: Refuse unexpected ref or approval-scoped inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH" || {
            echo 'Refusing to run outside main.'
            exit 1
          }
          test -n "$TARGET_DISPLAY_NAME" || {
            echo 'target_display_name is required.'
            exit 1
          }
          [[ "$STRIPE_LIVE_SECRET_KEY" == sk_live_* ]] || {
            echo 'STRIPE_LIVE_SECRET_KEY is missing or is not live in the Production environment.'
            exit 1
          }
          test -n "$SUPABASE_SECRET_KEY" || {
            echo 'SUPABASE_SECRET_KEY is not configured in the Production environment.'
            exit 1
          }
          test "$SUPABASE_URL" = 'https://fiepaguycecrredwrcwx.supabase.co' || {
            echo 'SUPABASE_URL is not the canonical Production Supabase project.'
            exit 1
          }

      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Verify missing Stripe customer and repair exactly one Production profile
        run: node scripts/production-billing-repair.mjs

      - name: Audit final Production billing consistency
        run: node scripts/production-billing-audit.mjs

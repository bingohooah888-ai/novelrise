name: NOVELIGHT Production Billing Guard

on:
  push:
    branches: [main]
    paths:
      - 'pricing.html'
      - 'api/create-checkout-session.js'
      - 'api/stripe-webhook.js'
      - 'api/production-billing-guard.js'
      - 'api/production-billing-remediate.js'
      - 'api/_lib/github-actions-oidc.js'
      - 'api/_lib/webhook-observability.js'
      - 'scripts/production-billing-*'
      - 'scripts/production-webhook-*'
      - 'scripts/stripe-production-*'
      - '.github/workflows/production-billing-guard.yml'
      - '.github/workflows/production-chat-approval.yml'
      - '.github/workflows/production-billing-health.yml'
      - '.github/workflows/production-webhook-control.yml'
      - '.github/workflows/production-webhook-legacy-cleanup.yml'
      - '.github/workflows/stripe-production-bootstrap.yml'
  workflow_run:
    workflows: ['NOVELIGHT Chat-Mediated Production Approval']
    types: [completed]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: novelight-production-billing-guard
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Production billing without operator action
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.actor.login == 'bingohooah888-ai'
    runs-on: ubuntu-latest
    outputs:
      repair_required: ${{ steps.guard.outputs.repair_required }}
      repair_fingerprint: ${{ steps.guard.outputs.repair_fingerprint }}
      cleanup_required: ${{ steps.guard.outputs.cleanup_required }}
      cleanup_fingerprint: ${{ steps.guard.outputs.cleanup_fingerprint }}
      blocking_issue_count: ${{ steps.guard.outputs.blocking_issue_count }}
    steps:
      - name: Request GitHub OIDC token and query deployed Production guard
        id: guard
        shell: bash
        env:
          BASE_URL: https://novelrise.vercel.app
          OIDC_AUDIENCE: novelight-production-billing-guard
          EXPECTED_GUARD_VERSION: chat-approval-v1
        run: |
          set -euo pipefail

          oidc_token="$(
            curl --silent --show-error --fail \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
              | jq -er '.value'
          )"
          printf '::add-mask::%s\n' "$oidc_token"

          status=''
          guard_version=''
          for attempt in $(seq 1 24); do
            status="$(
              curl --silent --show-error \
                --output /tmp/production-billing-guard.json \
                --write-out '%{http_code}' \
                --connect-timeout 10 \
                --max-time 30 \
                -X POST \
                -H "Authorization: Bearer $oidc_token" \
                -H 'Content-Type: application/json' \
                "$BASE_URL/api/production-billing-guard"
            )"

            if [ "$status" = '200' ]; then
              guard_version="$(jq -r '.guardVersion // empty' /tmp/production-billing-guard.json)"
              if [ "$guard_version" = "$EXPECTED_GUARD_VERSION" ]; then
                echo "Production billing guard version is current: $guard_version"
                break
              fi
              echo "Production billing guard is still an older deployment (version '${guard_version:-none}', attempt ${attempt}/24)."
            elif [[ "$status" =~ ^(401|403)$ ]]; then
              echo "Production billing guard rejected GitHub OIDC authentication (HTTP $status)."
              exit 1
            else
              echo "Production billing guard is not ready yet (HTTP $status, attempt ${attempt}/24)."
            fi

            sleep 10
          done

          if [ "$status" != '200' ] || [ "$guard_version" != "$EXPECTED_GUARD_VERSION" ]; then
            echo "Production billing guard did not reach expected version '$EXPECTED_GUARD_VERSION' in time."
            exit 1
          fi

          repair_required="$(jq -r '.repairRequired' /tmp/production-billing-guard.json)"
          repair_candidate_count="$(jq -r '.repairCandidateCount' /tmp/production-billing-guard.json)"
          repair_fingerprint="$(jq -r '.repairFingerprint // empty' /tmp/production-billing-guard.json)"
          cleanup_required="$(jq -r '.cleanupRequired' /tmp/production-billing-guard.json)"
          cleanup_endpoint_count="$(jq -r '.cleanupEndpointCount' /tmp/production-billing-guard.json)"
          cleanup_fingerprint="$(jq -r '.cleanupFingerprint // empty' /tmp/production-billing-guard.json)"
          blocking_issue_count="$(jq -r '.blockingIssueCount' /tmp/production-billing-guard.json)"
          issue_codes="$(jq -c '.issueCodes' /tmp/production-billing-guard.json)"
          warning_codes="$(jq -c '.warningCodes' /tmp/production-billing-guard.json)"

          for value in "$repair_required" "$cleanup_required"; do
            case "$value" in
              true|false) ;;
              *) echo 'Guard returned an invalid remediation boolean.'; exit 1 ;;
            esac
          done
          [[ "$repair_candidate_count" =~ ^[0-9]+$ ]] || {
            echo 'Guard returned an invalid repairCandidateCount value.'
            exit 1
          }
          [[ "$cleanup_endpoint_count" =~ ^[0-9]+$ ]] || {
            echo 'Guard returned an invalid cleanupEndpointCount value.'
            exit 1
          }
          [[ "$blocking_issue_count" =~ ^[0-9]+$ ]] || {
            echo 'Guard returned an invalid blockingIssueCount value.'
            exit 1
          }
          if [ "$repair_required" = 'true' ] && [[ ! "$repair_fingerprint" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Guard did not return a valid repair scope fingerprint.'
            exit 1
          fi
          if [ "$cleanup_required" = 'true' ] && [[ ! "$cleanup_fingerprint" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Guard did not return a valid cleanup scope fingerprint.'
            exit 1
          fi

          {
            echo "repair_required=$repair_required"
            echo "repair_fingerprint=$repair_fingerprint"
            echo "cleanup_required=$cleanup_required"
            echo "cleanup_fingerprint=$cleanup_fingerprint"
            echo "blocking_issue_count=$blocking_issue_count"
            echo "issue_codes=$issue_codes"
            echo "warning_codes=$warning_codes"
          } >> "$GITHUB_OUTPUT"
          echo "Production billing issue codes: $issue_codes"
          echo "Production billing warning codes: $warning_codes"

          if [ "$blocking_issue_count" -gt 0 ]; then
            echo 'Blocking Production billing drift detected. No automatic mutation will run.'
            exit 1
          fi

          if [ "$repair_required" = 'true' ] || [ "$cleanup_required" = 'true' ]; then
            echo 'Verified repairable Production billing drift detected; creating one scoped approval issue.'
          else
            echo 'PASS: Production billing guard found no approval-requiring remediation.'
          fi

      - name: Create or reuse one scoped Production approval issue
        if: >-
          steps.guard.outputs.blocking_issue_count == '0' &&
          (steps.guard.outputs.repair_required == 'true' ||
           steps.guard.outputs.cleanup_required == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_REQUIRED: ${{ steps.guard.outputs.repair_required }}
          REPAIR_FINGERPRINT: ${{ steps.guard.outputs.repair_fingerprint }}
          CLEANUP_REQUIRED: ${{ steps.guard.outputs.cleanup_required }}
          CLEANUP_FINGERPRINT: ${{ steps.guard.outputs.cleanup_fingerprint }}
          ISSUE_CODES: ${{ steps.guard.outputs.issue_codes }}
        run: |
          set -euo pipefail

          request_id="billing-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          issued_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d '+30 minutes' +'%Y-%m-%dT%H:%M:%SZ')"
          challenge="$(printf '%s' "$request_id:$REPAIR_FINGERPRINT:$CLEANUP_FINGERPRINT" | sha256sum | cut -c1-8 | tr '[:lower:]' '[:upper:]')"

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            > /tmp/open-issues.json

          now_epoch="$(date -u +%s)"
          jq -r --argjson now "$now_epoch" '
            .[]
            | select(.pull_request == null)
            | select(.title | startswith("[Production Approval] "))
            | . as $issue
            | (($issue.body // "" | split("\n")[0] | sub("^NOVELIGHT_PRODUCTION_REQUEST "; "") | fromjson?) // {}) as $request
            | select(($request.expiresAt // "1970-01-01T00:00:00Z" | fromdateiso8601) <= $now)
            | $issue.number
          ' /tmp/open-issues.json > /tmp/expired-approval-issues.txt

          while IFS= read -r issue_number; do
            [ -n "$issue_number" ] || continue
            curl --silent --show-error --fail \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number" \
              -d '{"state":"closed"}' >/dev/null
          done < /tmp/expired-approval-issues.txt

          existing_issue="$(
            jq -r \
              --arg sha "$GITHUB_SHA" \
              --arg repairFingerprint "$REPAIR_FINGERPRINT" \
              --arg cleanupFingerprint "$CLEANUP_FINGERPRINT" \
              --argjson repairRequired "$REPAIR_REQUIRED" \
              --argjson cleanupRequired "$CLEANUP_REQUIRED" \
              --argjson now "$now_epoch" '
                [
                  .[]
                  | select(.pull_request == null)
                  | select(.title | startswith("[Production Approval] "))
                  | . as $issue
                  | (($issue.body // "" | split("\n")[0] | sub("^NOVELIGHT_PRODUCTION_REQUEST "; "") | fromjson?) // {}) as $request
                  | select($request.mainSha == $sha)
                  | select($request.repairRequired == $repairRequired)
                  | select($request.cleanupRequired == $cleanupRequired)
                  | select(($request.repairFingerprint // "") == $repairFingerprint)
                  | select(($request.cleanupFingerprint // "") == $cleanupFingerprint)
                  | select(($request.expiresAt | fromdateiso8601) > $now)
                  | $issue.number
                ]
                | first // empty
              ' /tmp/open-issues.json
          )"

          if [ -n "$existing_issue" ]; then
            echo "Reusing active scoped Production approval issue #$existing_issue; no duplicate request created."
            exit 0
          fi

          payload="$(
            jq -cn \
              --arg requestId "$request_id" \
              --arg operation 'production-billing-remediation' \
              --arg mainSha "$GITHUB_SHA" \
              --arg issuedAt "$issued_at" \
              --arg expiresAt "$expires_at" \
              --arg sourceRunId "$GITHUB_RUN_ID" \
              --arg challenge "$challenge" \
              --arg repairFingerprint "$REPAIR_FINGERPRINT" \
              --arg cleanupFingerprint "$CLEANUP_FINGERPRINT" \
              --argjson repairRequired "$REPAIR_REQUIRED" \
              --argjson cleanupRequired "$CLEANUP_REQUIRED" \
              --argjson issueCodes "$ISSUE_CODES" \
              '{requestId:$requestId,operation:$operation,mainSha:$mainSha,issuedAt:$issuedAt,expiresAt:$expiresAt,sourceRunId:$sourceRunId,challenge:$challenge,repairRequired:$repairRequired,repairFingerprint:(if $repairRequired then $repairFingerprint else null end),cleanupRequired:$cleanupRequired,cleanupFingerprint:(if $cleanupRequired then $cleanupFingerprint else null end),issueCodes:$issueCodes}'
          )"
          title="[Production Approval] $request_id"
          body="$(printf 'NOVELIGHT_PRODUCTION_REQUEST %s\n\nThis issue is a one-request approval ledger and expires automatically.\nApproval challenge: %s' "$payload" "$challenge")"

          response="$(
            curl --silent --show-error --fail \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
              -d "$(jq -cn --arg title "$title" --arg body "$body" '{title:$title,body:$body}')"
          )"
          issue_number="$(echo "$response" | jq -er '.number')"
          echo "Created scoped Production approval issue #$issue_number with challenge $challenge."

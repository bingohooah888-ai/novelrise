name: NOVELIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

      - name: Lint API JavaScript
        run: npm run lint

      - name: Check API JavaScript syntax
        run: |
          node --input-type=module --check < api/create-checkout-session.js
          node --input-type=module --check < api/stripe-webhook.js

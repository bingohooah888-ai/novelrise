name: NOVELIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.classify.outputs.fast }}
      db: ${{ steps.classify.outputs.db }}
      e2e: ${{ steps.classify.outputs.e2e }}
      audit: ${{ steps.classify.outputs.audit }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base="$PR_BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="HEAD^"
          fi

          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
          echo 'Changed files:'
          cat /tmp/changed-files.txt

          fast=false
          db=false
          e2e=false
          audit=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            case "$file" in
              package.json|package-lock.json|api/*|scripts/*|tests/*.js|tests/*.mjs|eslint.config.mjs|docs/NOVELIGHT-MASTER.md|AGENTS.md|.github/workflows/*.yml)
                fast=true
                ;;
            esac

            case "$file" in
              supabase/*/20260823150500_*|tests/rls/contact-inquiries*.sql|supabase/checks/production_beta_observability.sql)
                # Dedicated contact/security or production-observability workflows own these files.
                ;;
              supabase/*/2026082317*.sql|supabase/*/20260823192500_*.sql|supabase/*/20260823204500_*.sql|tests/rls/beta-p0-foundations.sql|tests/rls/signup-display-name.sql|tests/rls/founding-internal-exclusion*.sql|scripts/run-beta-p0-db-tests.sh)
                # The beta-P0 gate owns these migrations/tests.
                ;;
              supabase/*|tests/rls/*|scripts/run-rls-integration.sh)
                db=true
                ;;
            esac

            case "$file" in
              *.html|novelight-client.js|tests/e2e/*)
                e2e=true
                ;;
            esac

            case "$file" in
              package.json|package-lock.json|tests/e2e/package.json|tests/e2e/package-lock.json)
                audit=true
                ;;
            esac

            case "$file" in
              .github/workflows/ci.yml)
                fast=true
                db=true
                e2e=true
                audit=true
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "audit=$audit" >> "$GITHUB_OUTPUT"

  fast-quality:
    name: Fast quality checks
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Lint JavaScript
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run syntax:check

  db-safety:
    name: Database and RLS safety
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novelight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novelight_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run RLS integration tests
        env:
          PGPASSWORD: postgres
        run: bash scripts/run-rls-integration.sh

  browser-smoke:
    name: Browser smoke tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run browser smoke tests with runner Chrome
        working-directory: tests/e2e
        run: npm test

  dependency-audit:
    name: Dependency vulnerability audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Audit application dependencies
        run: npm audit --audit-level=high

      - name: Audit browser test dependencies
        working-directory: tests/e2e
        run: npm audit --audit-level=high

  check:
    name: check
    if: always()
    needs:
      - changes
      - fast-quality
      - db-safety
      - browser-smoke
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_RESULT: ${{ needs.fast-quality.result }}
          DB_RESULT: ${{ needs.db-safety.result }}
          E2E_RESULT: ${{ needs.browser-smoke.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        shell: bash
        run: |
          set -euo pipefail

          check_result() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name gate failed: $result"
                exit 1
                ;;
            esac
          }

          check_result changes "$CHANGES_RESULT"
          check_result fast-quality "$FAST_RESULT"
          check_result db-safety "$DB_RESULT"
          check_result browser-smoke "$E2E_RESULT"
          check_result dependency-audit "$AUDIT_RESULT"

          echo 'All relevant NOVELIGHT CI gates passed.'

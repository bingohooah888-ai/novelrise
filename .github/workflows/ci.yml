name: NOVELIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.classify.outputs.fast }}
      db: ${{ steps.classify.outputs.db }}
      e2e: ${{ steps.classify.outputs.e2e }}
      audit: ${{ steps.classify.outputs.audit }}
      workflow: ${{ steps.classify.outputs.workflow }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base="$PR_BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="HEAD^"
          fi

          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
          echo 'Changed files:'
          cat /tmp/changed-files.txt

          fast=false
          db=false
          e2e=false
          audit=false
          workflow=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            case "$file" in
              package.json|package-lock.json|api/*|scripts/*|tests/*.js|tests/*.mjs|eslint.config.mjs|.github/workflows/*.yml)
                fast=true
                ;;
            esac

            case "$file" in
              supabase/*/20260823150500_*|tests/rls/contact-inquiries*.sql|supabase/checks/production_beta_observability.sql)
                ;;
              supabase/*/2026082317*.sql|supabase/*/20260823192500_*.sql|supabase/*/20260823204500_*.sql|tests/rls/beta-p0-foundations.sql|tests/rls/signup-display-name.sql|tests/rls/founding-internal-exclusion*.sql|scripts/run-beta-p0-db-tests.sh)
                ;;
              supabase/*|tests/rls/*|scripts/run-rls-integration.sh)
                db=true
                ;;
            esac

            case "$file" in
              *.html|novelight-client.js|tests/e2e/*)
                e2e=true
                ;;
            esac

            case "$file" in
              package.json|package-lock.json|tests/e2e/package.json|tests/e2e/package-lock.json)
                audit=true
                ;;
            esac

            case "$file" in
              .github/workflows/*.yml)
                workflow=true
                ;;
            esac

            if [ "$file" = '.github/workflows/ci.yml' ]; then
              fast=true
              db=true
              e2e=true
              audit=true
              workflow=true
            fi
          done < /tmp/changed-files.txt

          {
            echo "fast=$fast"
            echo "db=$db"
            echo "e2e=$e2e"
            echo "audit=$audit"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

  merge-readiness:
    name: Merge readiness preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Verify current base and merge-readiness contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_BASE_REF:-}" || {
            echo 'GITHUB_BASE_REF is unavailable for this pull request.'
            exit 1
          }
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git merge-base --is-ancestor "origin/${GITHUB_BASE_REF}" HEAD || {
            echo "Pull request merge ref does not contain current origin/${GITHUB_BASE_REF}."
            exit 1
          }
          node scripts/check-merge-readiness.mjs

  preflight:
    name: Preflight
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run non-mutating preflight
        run: npm run preflight

      - name: Check shell script syntax
        shell: bash
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

  workflow-lint:
    name: GitHub Actions semantic lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/actionlint.tar.gz
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' \
            | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp actionlint
          /tmp/actionlint -version

      - name: Validate GitHub Actions workflows
        run: /tmp/actionlint

  rls:
    name: RLS integration and rollback
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novelight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novelight_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run RLS integration tests
        env:
          PGPASSWORD: postgres
        run: bash scripts/run-rls-integration.sh

  browser:
    name: Browser E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright ffmpeg for failure video
        working-directory: tests/e2e
        run: npx playwright install ffmpeg

      - name: Run browser smoke and async UI tests with runner Chrome
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Audit application dependencies
        run: npm audit --audit-level=high

      - name: Audit browser test dependencies
        working-directory: tests/e2e
        run: npm audit --audit-level=high

  temporary-master-patch:
    name: Temporary MASTER chat gate patch
    if: github.head_ref == 'docs/chat-continuation-gate'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Patch MASTER and push branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/NOVELIGHT-MASTER.md')
          text = path.read_text(encoding='utf-8')
          marker = 'チャット継続判定ゲート'
          if marker in text:
              print('Chat continuation decision gate is already present.')
              raise SystemExit(0)

          anchor = 'NOVELIGHTの作業チャットが長くなり、応答速度、参照効率、作業精度、操作の分かりやすさ等が低下する可能性がある場合、ChatGPTはユーザーから聞かれるまで待たず、キリの良い工程で新しいチャットへの切替を提案する。\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected chat-switch anchor exactly once; refusing to modify MASTER.')

          addition = '''チャット継続判定ゲート

NOVELIGHTの主要工程が完了した時点で、ChatGPTは必ず「現在のチャットを継続するか、新しいチャットへ切り替えるか」を判定する。ユーザーから切替時期を質問されるまで、この判定を先送りしない。

特に、PRのmerge完了、大規模テスト・E2Eの完了、MASTER更新完了、復旧作業の完了、1つの開発・企画・制作テーマの完了等、明確な区切りではチャット継続判定を省略しない。

判定時は、チャットの長さだけでなく、参照対象となるPR・Workflow Run・ブランチ・決定事項の増加、複数テーマの混在、修正や再試行の蓄積、応答速度・参照効率・作業精度・操作の分かりやすさへの影響を総合して判断する。

チャット切替が有利と判断した場合は、次の主要作業へ進む前にChatGPT側から切替を提案する。その際は、現在の工程が安全に完了していることを明示し、次チャットへそのまま貼り付けられる引き継ぎ指示文を同時に提示する。

現在のチャットを継続した方が文脈保持・作業効率上有利な場合は、そのまま継続してよい。ただし「判定そのもの」を省略してはならない。

主要工程の完了報告では、原則として「完了した内容」「次に行う作業」「チャット継続判定」を一連の終了確認として扱う。切替推奨の場合は必ずユーザーから聞かれる前に伝える。

'''
          path.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet -- docs/NOVELIGHT-MASTER.md; then
            echo 'No MASTER change required.'
            exit 0
          fi
          git config user.name 'NOVELIGHT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/NOVELIGHT-MASTER.md
          git commit -m 'Add chat continuation decision gate'
          git push origin HEAD:docs/chat-continuation-gate

  check:
    name: check
    if: always()
    needs:
      - changes
      - merge-readiness
      - preflight
      - workflow-lint
      - rls
      - browser
      - dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MERGE_READINESS_RESULT: ${{ needs.merge-readiness.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          RLS_RESULT: ${{ needs.rls.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        shell: bash
        run: |
          set -euo pipefail

          check_result() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name gate failed: $result"
                exit 1
                ;;
            esac
          }

          check_result changes "$CHANGES_RESULT"
          check_result merge-readiness "$MERGE_READINESS_RESULT"
          check_result preflight "$PREFLIGHT_RESULT"
          check_result workflow-lint "$WORKFLOW_LINT_RESULT"
          check_result rls "$RLS_RESULT"
          check_result browser "$BROWSER_RESULT"
          check_result dependency-audit "$DEPENDENCY_AUDIT_RESULT"

          echo 'All relevant NOVELIGHT CI gates passed.'

name: NOVELIGHT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, RLS, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novelight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novelight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint JavaScript
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Run RLS integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f tests/rls/fixture.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260819190000_secure_content_rls_and_constraints.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f supabase/checks/20260822_content_write_rls_precheck.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260822194000_manage_content_write_rls.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f tests/rls/read-access.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f tests/rls/write-access.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f supabase/checks/20260822_content_write_rls_postcheck.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f supabase/rollback/20260822194000_manage_content_write_rls_rollback.sql
          psql -h 127.0.0.1 -U postgres -d novelight_test -v ON_ERROR_STOP=1 -f tests/rls/write-rollback.sql

      - name: Check API JavaScript syntax
        run: npm run syntax:check

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: tests/e2e
        run: npm test

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Audit application dependencies
        run: npm audit --audit-level=high

      - name: Audit browser test dependencies
        working-directory: tests/e2e
        run: npm audit --audit-level=high

  check:
    name: check
    if: always()
    needs: [quality, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required gates
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "Quality gate failed: $QUALITY_RESULT"
            exit 1
          fi

          if [ "$DEPENDENCY_AUDIT_RESULT" != "success" ]; then
            echo "Dependency audit gate failed: $DEPENDENCY_AUDIT_RESULT"
            exit 1
          fi

          echo "All required NOVELIGHT CI gates passed."

name: SPECIAL one-time formatting
on:
  push:
    branches:
      - feat/novelight-special-v1-20261023
permissions:
  contents: write
concurrency:
  group: special-format-once
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'bingohooah888-ai/novelrise' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/novelight-special-v1-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Format SPECIAL touched files only
        run: |
          ./node_modules/.bin/prettier --write \
            api/_lib/special-core.js api/admin-special.js \
            api/admin-special-evidence.js api/sitemap.js \
            api/special-event.js api/special-page.js \
            admin-special.js special-analytics.js \
            tests/special-analytics.test.mjs tests/special-core.test.mjs \
            tests/special-evidence.test.mjs tests/special-page.test.mjs \
            tests/accessibility-baseline.test.mjs \
            tests/critical-navigation-contract.test.mjs vercel.json
      - name: Commit scoped formatting changes to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/_lib/special-core.js api/admin-special.js \
            api/admin-special-evidence.js api/sitemap.js \
            api/special-event.js api/special-page.js \
            admin-special.js special-analytics.js \
            tests/special-analytics.test.mjs tests/special-core.test.mjs \
            tests/special-evidence.test.mjs tests/special-page.test.mjs \
            tests/accessibility-baseline.test.mjs \
            tests/critical-navigation-contract.test.mjs vercel.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'style(special): format scoped code with pinned Prettier'
            git push origin HEAD:refs/heads/feat/novelight-special-v1-20261023
          fi

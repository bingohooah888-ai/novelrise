name: NOVELIGHT Contest Management API Read-Only Preflight

# Never triggers on PR/push, issue comments or contest approval records.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novelight-contest-management-api-readonly-preflight
  cancel-in-progress: false

jobs:
  probe:
    name: One read-only SELECT via Production Management API
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'bingohooah888-ai'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NOVELIGHT_CONTEST_READONLY_PREFLIGHT: MANUAL_READONLY_ONLY

    steps:
      - name: Check out exact main without persistent GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Check main identity and run only the fixed SELECT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          node scripts/november-contest-management-readonly-preflight.mjs

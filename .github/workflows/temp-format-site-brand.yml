name: Temporary format site brand test

on:
  push:
    branches:
      - fix/light-sitewide-header
    paths:
      - .github/workflows/temp-format-site-brand.yml
      - tests/site-brand-logo.test.mjs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-sitewide-header
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format target test
        run: npx prettier --write tests/site-brand-logo.test.mjs
      - name: Commit formatted test when needed
        run: |
          if git diff --quiet -- tests/site-brand-logo.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/site-brand-logo.test.mjs
          git commit -m "Format light header regression test"
          git push origin HEAD:fix/light-sitewide-header

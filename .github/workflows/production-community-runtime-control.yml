name: NOVELIGHT Community Phase1 Production Runtime Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: novelight-community-phase1-production-gate
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 2139 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_COMMUNITY_RUNTIME_APPROVE ')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      APPROVAL_BODY: ${{ github.event.comment.body }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact owner request, one-use ledger and immutable main
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          approval="${APPROVAL_BODY#NOVELIGHT_COMMUNITY_RUNTIME_APPROVE }"
          printf '%s' "$approval" > /tmp/community-approval.json
          jq -e '
            type == "object" and
            .operation == "community-phase1-runtime" and
            (.action == "enable" or .action == "disable") and
            (.mainSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            ((keys | sort) == (["operation","action","mainSha","challenge"] | sort))
          ' /tmp/community-approval.json >/dev/null
          action="$(jq -r '.action' /tmp/community-approval.json)"
          approved_sha="$(jq -r '.mainSha' /tmp/community-approval.json)"
          approved_challenge="$(jq -r '.challenge' /tmp/community-approval.json)"
          expected_challenge="$(printf '%s' "$approved_sha" | cut -c 1-8 | tr '[:lower:]' '[:upper:]')"
          test "$approved_challenge" = "$expected_challenge"
          test "$(git rev-parse HEAD)" = "$approved_sha"
          actual_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$actual_main" = "$approved_sha" || {
            echo 'Safety stop: main has moved since approval.'
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/issues/2139/comments?per_page=100" > /tmp/community-ledger.json
          jq -e --arg action "$action" --arg sha "$approved_sha" '
            length < 97 and
            ([.[] | .body | select(startswith("NOVELIGHT_COMMUNITY_RUNTIME_CLAIMED "))
              | sub("^NOVELIGHT_COMMUNITY_RUNTIME_CLAIMED "; "") | fromjson?
              | select(.mainSha == $sha and .action == $action)] | length) == 0
          ' /tmp/community-ledger.json >/dev/null || {
            echo 'Safety stop: the operation was already claimed or ledger capacity is exhausted.'
            exit 1
          }

          {
            echo "action=$action"
            echo "approved_sha=$approved_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify live release and database state before approval claim
        id: preflight
        shell: bash
        env:
          ACTION: ${{ steps.admission.outputs.action }}
          APPROVED_SHA: ${{ steps.admission.outputs.approved_sha }}
        run: |
          set -euo pipefail
          query_sql="select (select count(*) from supabase_migrations.schema_migrations where version='20261014052000') = 1 as migrated, (select public_enabled from public.community_runtime_control where singleton=true) as public_enabled, (select count(*) from pg_tables where schemaname='public' and tablename like 'community_%' and rowsecurity=true) = 8 as rls_ok"
          jq -cn --arg query "$query_sql" '{query:$query,read_only:true}' > /tmp/community-query.json
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/community-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            > /tmp/community-preflight.json
          jq -e 'type=="array" and length==1 and .[0].migrated==true and .[0].rls_ok==true' /tmp/community-preflight.json >/dev/null
          current_flag="$(jq -r '.[0].public_enabled' /tmp/community-preflight.json)"
          if [ "$ACTION" = 'enable' ]; then
            test "$current_flag" = 'false'
            vercel_ok="$(gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/status" --jq '[.statuses[] | select(.context=="Vercel" and .state=="success")] | length')"
            test "$vercel_ok" -gt 0 || { echo 'Safety stop: approved main is not deployed by Vercel.'; exit 1; }
            curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://novelight.jp/novelight-client.js?community_release=$APPROVED_SHA" \
              > /tmp/community-live-client.js
            grep -Fq 'timeline: true,' /tmp/community-live-client.js
            grep -Fq 'board: false' /tmp/community-live-client.js
          else
            test "$current_flag" = 'true'
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_SHA"

      - name: Claim once before touching Production
        shell: bash
        env:
          ACTION: ${{ steps.admission.outputs.action }}
          APPROVED_SHA: ${{ steps.admission.outputs.approved_sha }}
        run: |
          set -euo pipefail
          claim="$(jq -cn --arg operation 'community-phase1-runtime' --arg action "$ACTION" \
            --arg mainSha "$APPROVED_SHA" --arg runId "$GITHUB_RUN_ID" \
            '{operation:$operation,action:$action,mainSha:$mainSha,runId:$runId}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/2139/comments" \
            -f body="NOVELIGHT_COMMUNITY_RUNTIME_CLAIMED $claim" >/dev/null

      - name: Change only the independent Community runtime gate
        shell: bash
        env:
          ACTION: ${{ steps.admission.outputs.action }}
          APPROVED_SHA: ${{ steps.admission.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/issues/2139/comments?per_page=100" > /tmp/community-claimed.json
          jq -e --arg action "$ACTION" --arg sha "$APPROVED_SHA" --arg run "$GITHUB_RUN_ID" '
            ([.[] | .body | select(startswith("NOVELIGHT_COMMUNITY_RUNTIME_CLAIMED "))
              | sub("^NOVELIGHT_COMMUNITY_RUNTIME_CLAIMED "; "") | fromjson?
              | select(.action==$action and .mainSha==$sha and .runId==$run)] | length) == 1
          ' /tmp/community-claimed.json >/dev/null

          if [ "$ACTION" = "enable" ]; then
            sql="update public.community_runtime_control set public_enabled=true, activated_at=now(), activated_by=null where singleton=true and public_enabled=false returning public_enabled"
            wanted=true
          else
            sql="update public.community_runtime_control set public_enabled=false, activated_at=null, activated_by=null where singleton=true and public_enabled=true returning public_enabled"
            wanted=false
          fi
          jq -cn --arg query "$sql" '{query:$query}' > /tmp/community-write.json
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/community-write.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            > /tmp/community-write-result.json
          jq -e --argjson wanted "$wanted" 'type=="array" and length==1 and .[0].public_enabled==$wanted' \
            /tmp/community-write-result.json >/dev/null

      - name: Verify final gate and record result
        shell: bash
        env:
          ACTION: ${{ steps.admission.outputs.action }}
          APPROVED_SHA: ${{ steps.admission.outputs.approved_sha }}
        run: |
          set -euo pipefail
          sql='select public_enabled from public.community_runtime_control where singleton=true'
          jq -cn --arg query "$sql" '{query:$query,read_only:true}' > /tmp/community-postcheck-request.json
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/community-postcheck-request.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            > /tmp/community-postcheck.json
          if [ "$ACTION" = "enable" ]; then wanted=true; else wanted=false; fi
          jq -e --argjson wanted "$wanted" 'type=="array" and length==1 and .[0].public_enabled==$wanted' \
            /tmp/community-postcheck.json >/dev/null

          event="$(jq -cn --arg operation 'community-phase1-runtime' --arg action "$ACTION" \
            --arg mainSha "$APPROVED_SHA" --arg runId "$GITHUB_RUN_ID" \
            '{operation:$operation,action:$action,mainSha:$mainSha,runId:$runId,result:"success"}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/2139/comments" \
            -f body="NOVELIGHT_COMMUNITY_RUNTIME_EXECUTED $event" >/dev/null
          echo "Community Phase 1 Production runtime flag $ACTION verified."

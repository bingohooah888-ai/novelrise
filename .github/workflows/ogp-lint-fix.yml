name: OGP lint fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ogp-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout OGP branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/x-share-ogp-final-20261006
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted ESLint fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/og/novel-data.js')
          s = p.read_text()
          needle = "import { createHash } from 'node:crypto';\n"
          assert s.count(needle) == 1
          s = s.replace(needle, needle + "import { URL } from 'node:url';\n", 1)
          p.write_text(s)

          p = Path('api/og/novel.js')
          s = p.read_text()
          assert s.count('await fetch(data.coverUrl') == 1
          assert s.count('AbortSignal.timeout(2200)') == 1
          s = s.replace('await fetch(data.coverUrl', 'await globalThis.fetch(data.coverUrl', 1)
          s = s.replace('AbortSignal.timeout(2200)', 'globalThis.AbortSignal.timeout(2200)', 1)
          p.write_text(s)

          p = Path('tests/novel-ogp.test.mjs')
          s = p.read_text()
          needle = "import { test } from 'node:test';\n"
          assert s.count(needle) == 1
          s = s.replace(needle, needle + "import { URL } from 'node:url';\n", 1)
          p.write_text(s)
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Verify formatting, lint and tests
        run: |
          npx prettier --write api/og/novel-data.js api/og/novel.js tests/novel-ogp.test.mjs
          npm run format:check
          npm run lint
          npm test
          npm run syntax:check
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/og/novel-data.js api/og/novel.js tests/novel-ogp.test.mjs
          git commit -m 'fix: satisfy OGP Node lint globals'
          git push origin HEAD:codex/x-share-ogp-final-20261006

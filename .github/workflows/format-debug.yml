name: Temporary Format Preview

on:
  push:
    branches: [ci/staging-billing-e2e]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format billing smoke
        run: npx prettier --write tests/e2e/production-auth/billing-smoke.spec.js
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- tests/e2e/production-auth/billing-smoke.spec.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/production-auth/billing-smoke.spec.js
          git commit -m "Format billing smoke"
          git push origin HEAD:ci/staging-billing-e2e

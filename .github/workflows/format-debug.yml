name: Temporary Format Preview

on:
  push:
    branches: [ci/staging-billing-e2e]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact formatted file as base64
        run: npx prettier tests/e2e/production-auth/billing-smoke.spec.js | base64 -w0

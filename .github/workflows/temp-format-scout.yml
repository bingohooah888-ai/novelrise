name: Temporary SCOUT formatter

on:
  push:
    branches:
      - feat/ch38-admin-scout-beta-analytics

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format SCOUT files
        run: npx prettier --write api/_lib/admin-scout-analytics.js tests/admin-scout-analytics-api.test.mjs tests/admin-scout-analytics-page.test.mjs

      - name: Commit formatted files when changed
        shell: bash
        run: |
          set -euo pipefail
          git add api/_lib/admin-scout-analytics.js tests/admin-scout-analytics-api.test.mjs tests/admin-scout-analytics-page.test.mjs
          if git diff --cached --quiet; then
            echo 'No formatting changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format SCOUT analytics files'
          git push origin HEAD:feat/ch38-admin-scout-beta-analytics

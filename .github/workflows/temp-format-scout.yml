name: Temporary SCOUT formatter

on:
  push:
    branches:
      - feat/ch38-admin-scout-beta-analytics

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format SCOUT files
        run: npx prettier --write api/_lib/admin-scout-analytics.js tests/admin-scout-analytics-api.test.mjs tests/admin-scout-analytics-page.test.mjs

      - name: Stage formatted files
        shell: bash
        run: |
          mkdir -p /tmp/scout-format/api/_lib /tmp/scout-format/tests
          cp api/_lib/admin-scout-analytics.js /tmp/scout-format/api/_lib/
          cp tests/admin-scout-analytics-api.test.mjs /tmp/scout-format/tests/
          cp tests/admin-scout-analytics-page.test.mjs /tmp/scout-format/tests/

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scout-prettier-output
          path: /tmp/scout-format
          if-no-files-found: error
          retention-days: 1

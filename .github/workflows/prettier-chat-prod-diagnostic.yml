name: Prettier Chat Production Diagnostic

on:
  pull_request:
    paths:
      - 'tests/production-approved-dispatch.test.mjs'
      - '.github/workflows/prettier-chat-prod-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write tests/production-approved-dispatch.test.mjs
          git diff -- tests/production-approved-dispatch.test.mjs

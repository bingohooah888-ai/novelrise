name: NOVELIGHT One-shot Staging Campaign Synthetic Exclusion
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  admit:
    name: Admit one exact owner-approved Staging migration
    if: >-
      github.event.issue.number == 294 &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == '[Staging Control] Supabase migration sync' &&
      github.event.issue.pull_request == null &&
      github.event.issue.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == 'bingohooah888-ai' &&
      github.triggering_actor == 'bingohooah888-ai' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_STAGING_CAMPAIGN_EXCLUSION_APPROVE ')
    concurrency:
      group: staging-campaign-exclusion-admission-294
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    outputs:
      main_sha: ${{ steps.scope.outputs.main_sha }}
      request_id: ${{ steps.scope.outputs.request_id }}
    steps:
      - name: Check owner request, live main and one-use ledger
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          request="${BODY#NOVELIGHT_STAGING_CAMPAIGN_EXCLUSION_APPROVE }"
          test "$request" != "$BODY"
          printf '%s' "$request" | jq -e '
            type == "object" and
            (.scope == "scout-campaign-internal-e2e-migration") and
            (.mainSha | type == "string" and test("^[a-f0-9]{40}$")) and
            (.migration == "20261029142000") and
            (.confirmation == "STAGING APPROVED") and
            ((keys | sort) == (["confirmation","mainSha","migration","scope"] | sort))
          ' >/dev/null
          approved="$(printf '%s' "$request" | jq -er '.mainSha')"
          live="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" = "$approved"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/294/comments?per_page=100" > /tmp/campaign-ledger.json
          jq -e '
            [.[][] | select(.body |
              startswith("NOVELIGHT_STAGING_CAMPAIGN_EXCLUSION_CLAIMED ") or
              startswith("NOVELIGHT_STAGING_CAMPAIGN_EXCLUSION_CONSUMED "))] |
            length == 0
          ' /tmp/campaign-ledger.json >/dev/null
          echo "main_sha=$approved" >> "$GITHUB_OUTPUT"
          echo "request_id=${{ github.event.comment.id }}" >> "$GITHUB_OUTPUT"
      - name: Consume approval before Staging secrets become accessible
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.scope.outputs.main_sha }}
          REQUEST: ${{ steps.scope.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          body="$(jq -cn --arg requestCommentId "$REQUEST" --arg mainSha "$MAIN" --arg runId "$GITHUB_RUN_ID" '{requestCommentId:$requestCommentId,mainSha:$mainSha,runId:$runId}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/294/comments" -f body="NOVELIGHT_STAGING_CAMPAIGN_EXCLUSION_CLAIMED $body" >/dev/null

  stage:
    name: Verify isolated Staging and atomically apply one SQL migration
    needs: admit
    if: needs.admit.result == 'success'
    environment: staging
    concurrency:
      group: supabase-staging-migration-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_MAIN: ${{ needs.admit.outputs.main_sha }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_DATABASE_URL_SOURCE: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_DATABASE_URL_FILE: /tmp/scout-campaign-stage-db-route
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.main_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify fixed Staging destination and exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_MAIN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_MAIN"
          test "$STAGING_SUPABASE_URL" = 'https://wmlzjgvxgoyrovdhbqbg.supabase.co'
          test -n "$STAGING_DATABASE_URL_SOURCE"
          node scripts/resolve-staging-session-pooler.mjs
          STAGING_DATABASE_URL="$(cat "$STAGING_DATABASE_URL_FILE")"
          export STAGING_DATABASE_URL
          node scripts/verify-staging-migration-target.mjs
      - name: Verify complete baseline history and reviewed SQL blobs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-scout-campaign-staging.mjs > /tmp/scout-campaign-stage-transaction.sql
          STAGING_DATABASE_URL="$(cat "$STAGING_DATABASE_URL_FILE")"
          find supabase/migrations -maxdepth 1 -type f -name '[0-9]*_*.sql' -printf '%f\n' |
            cut -c1-14 | grep -vx '20261029142000' | sort -u > /tmp/campaign-local-migrations
          { cat /tmp/campaign-local-migrations; echo '20261028084410'; } | sort -u > /tmp/campaign-expected-remote
          psql "$STAGING_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c             'select version from supabase_migrations.schema_migrations order by version' > /tmp/campaign-actual-remote
          diff -u /tmp/campaign-expected-remote /tmp/campaign-actual-remote
      - name: Apply one reviewed transaction with rollback-on-error
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_MAIN"
          STAGING_DATABASE_URL="$(cat "$STAGING_DATABASE_URL_FILE")"
          export STAGING_DATABASE_URL
          node scripts/verify-staging-migration-target.mjs
          psql "$STAGING_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /tmp/scout-campaign-stage-transaction.sql
          echo 'SCOUT_CAMPAIGN_STAGING_MIGRATION_PASS: migration and ledger committed atomically'
      - name: Destroy ephemeral credentials and composed SQL
        if: always()
        shell: bash
        run: |
          rm -f "$STAGING_DATABASE_URL_FILE" /tmp/scout-campaign-stage-transaction.sql /tmp/campaign-actual-remote

  record:
    name: Mark approval consumed, including failed runs
    needs: [admit, stage]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record exact one-shot outcome
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.admit.outputs.main_sha }}
          REQUEST: ${{ needs.admit.outputs.request_id }}
          OUTCOME: ${{ needs.stage.result }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OUTCOME" in success|failure|skipped|cancelled) ;; *) exit 1 ;; esac
          data="$(jq -cn --arg requestCommentId "$REQUEST" --arg mainSha "$MAIN" --arg runId "$GITHUB_RUN_ID" --arg result "$OUTCOME" '{requestCommentId:$requestCommentId,mainSha:$mainSha,runId:$runId,result:$result}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/294/comments" -f body="NOVELIGHT_STAGING_CAMPAIGN_EXCLUSION_CONSUMED $data" >/dev/null

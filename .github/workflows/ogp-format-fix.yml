name: OGP format fix

on:
  pull_request:
    branches:
      - main
    paths:
      - api/og/novel-data.js
      - api/og/novel.js
      - api/seo/novel.js
      - api/seo/public-page.js
      - novelight-public-share.js
      - package.json
      - package-lock.json
      - tests/novel-ogp.test.mjs
      - .github/workflows/ogp-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout OGP branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/x-share-ogp-final-20261006
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format OGP changes
        run: npx prettier --write api/og/novel-data.js api/og/novel.js api/seo/novel.js api/seo/public-page.js novelight-public-share.js package.json package-lock.json tests/novel-ogp.test.mjs
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/og/novel-data.js api/og/novel.js api/seo/novel.js api/seo/public-page.js novelight-public-share.js package.json package-lock.json tests/novel-ogp.test.mjs
          if git diff --cached --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git commit -m 'style: format OGP implementation'
          git push origin HEAD:codex/x-share-ogp-final-20261006

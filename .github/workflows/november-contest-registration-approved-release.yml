name: NOVELIGHT November Contest Registration One-Time Release

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: novelight-contest-registration-one-time-production
  cancel-in-progress: false

jobs:
  owner-authorized-registration:
    name: Verify independent owner approval and open registration once
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 2120 &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_CONTEST_REGISTRATION_OPEN_APPROVE ')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NOVELIGHT_CONTEST_RELEASE_SCOPE: OWNER_APPROVED_REGISTRATION_OPEN_ONLY

    steps:
      - name: Check out exact main and keep repository credentials disabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed if event no longer references current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo 'STEP05_RELEASE_BLOCKED: checkout and signed main differ.'
            exit 1
          }

      - name: Verify, claim once, apply scoped transaction and postcheck
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'STEP05_RELEASE_BLOCKED: Production access token not set.'
            exit 1
          }
          node scripts/november-contest-registration-release.mjs

name: Fix chat approval OIDC lint

on:
  push:
    branches: [ops/chat-approval-oidc-remediation]
    paths:
      - '.github/workflows/fix-chat-approval-oidc-lint.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/chat-approval-oidc-remediation
          fetch-depth: 0

      - name: Import Node setTimeout explicitly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('api/production-billing-remediate.js')
          text = path.read_text()
          needle = "import { randomBytes } from 'node:crypto';\n"
          replacement = needle + "import { setTimeout } from 'node:timers';\n"
          if "from 'node:timers'" not in text:
              if needle not in text:
                  raise SystemExit('Expected import anchor not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

      - name: Commit lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/production-billing-remediate.js
          if git diff --cached --quiet; then
            echo 'No lint fix required.'
            exit 0
          fi
          git commit -m 'Import Node timer in Production remediation endpoint'
          git push origin HEAD:ops/chat-approval-oidc-remediation

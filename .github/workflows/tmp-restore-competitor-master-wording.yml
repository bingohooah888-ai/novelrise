name: Temporary restore competitor MASTER wording

on:
  push:
    branches:
      - docs/competitor-feature-adoption-policy
    paths:
      - .github/workflows/tmp-restore-competitor-master-wording.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/competitor-feature-adoption-policy
          fetch-depth: 0
      - name: Restore exact unrelated MASTER wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/NOVELIGHT-MASTER.md')
          text = path.read_text(encoding='utf-8')
          old = 'チャット切替が有利と判断した場合は、次の主要作業へ進む前にChatGPT側から切替を提案する。その際は、現在の工程が安全に完了していることを明示し、次チャットへそのまま貼り付けられる短い引き継ぎ指示文を同時に提示する。'
          new = 'チャット切替が有利と判断した場合は、次の主要作業へ進む前にChatGPT側から切替を提案する。その際は、現在の工程が安全に完了していることを明示し、次チャットへそのまま貼り付けられる引き継ぎ指示文を同時に提示する。'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target sentence, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/tmp-restore-competitor-master-wording.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NOVELIGHT-MASTER.md .github/workflows/tmp-restore-competitor-master-wording.yml
          git commit -m "Restore unrelated MASTER wording exactly"
          git push origin HEAD:docs/competitor-feature-adoption-policy

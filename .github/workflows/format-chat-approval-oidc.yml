name: Format chat approval OIDC remediation

on:
  push:
    branches: [ops/chat-approval-oidc-remediation]
    paths:
      - 'api/production-billing-remediate.js'
      - '.github/workflows/format-chat-approval-oidc.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/chat-approval-oidc-remediation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format the remediation endpoint
        run: npx prettier --write api/production-billing-remediate.js

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- api/production-billing-remediate.js; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/production-billing-remediate.js
          git commit -m 'Format Production billing remediation endpoint'
          git push origin HEAD:ops/chat-approval-oidc-remediation

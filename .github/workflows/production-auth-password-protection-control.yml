name: NOVELIGHT Production Auth Password Protection Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: novelight-production-auth-password-protection-control
  cancel-in-progress: false

jobs:
  enable-protection:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 460 &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_PRODUCTION_AUTH_PASSWORD_APPROVE ')
    name: Enable and verify leaked password protection
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '460'
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OPERATION: enable-leaked-password-protection

    steps:
      - name: Validate exact one-time owner approval
        id: approval
        shell: bash
        env:
          APPROVAL_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          approval_json="${APPROVAL_BODY#NOVELIGHT_PRODUCTION_AUTH_PASSWORD_APPROVE }"
          echo "$approval_json" | jq -e --arg operation "$OPERATION" '
            type == "object" and
            .operation == $operation and
            (.mainSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            ((keys | sort) == (["challenge", "mainSha", "operation"] | sort))
          ' >/dev/null || {
            echo 'Safety stop: invalid Production Auth password approval record.'
            exit 1
          }

          main_sha="$(echo "$approval_json" | jq -r '.mainSha')"
          challenge="$(echo "$approval_json" | jq -r '.challenge')"
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$main_sha" || {
            echo 'Safety stop: main changed after Production Auth password approval.'
            exit 1
          }

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > /tmp/ledger-comments.json

          [ "$(jq 'length' /tmp/ledger-comments.json)" -lt 100 ] || {
            echo 'Safety stop: Production Approval Ledger exceeded the bounded comment contract.'
            exit 1
          }

          used_count="$(
            jq \
              --arg operation "$OPERATION" \
              --arg mainSha "$main_sha" \
              --arg challenge "$challenge" \
              '[
                .[]
                | .body as $body
                | select(
                    ($body | startswith("NOVELIGHT_PRODUCTION_AUTH_PASSWORD_CLAIMED ")) or
                    ($body | startswith("NOVELIGHT_PRODUCTION_AUTH_PASSWORD_EXECUTED ")) or
                    ($body | startswith("NOVELIGHT_PRODUCTION_AUTH_PASSWORD_FAILED "))
                  )
                | ($body | sub("^[^ ]+ "; "") | fromjson?)
                | select(.operation == $operation and .mainSha == $mainSha and .challenge == $challenge)
              ] | length' \
              /tmp/ledger-comments.json
          )"
          [ "$used_count" -eq 0 ] || {
            echo 'Safety stop: this Production Auth password approval was already used.'
            exit 1
          }

          {
            echo "main_sha=$main_sha"
            echo "challenge=$challenge"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approval.outputs.main_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Inspect current hosted Auth password configuration
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured in the production environment.'
            exit 1
          }

          status="$(
            curl --silent --show-error \
              --output /tmp/auth-password-before.json \
              --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Accept: application/json' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          )"
          [ "$status" = '200' ] || {
            echo "Safety stop: Auth config precheck returned HTTP $status."
            exit 1
          }

          jq -e '(.password_hibp_enabled | type) == "boolean"' /tmp/auth-password-before.json >/dev/null || {
            echo 'Safety stop: password_hibp_enabled has an unexpected shape.'
            exit 1
          }

          current_enabled="$(jq -r '.password_hibp_enabled' /tmp/auth-password-before.json)"
          echo "previous_enabled=$current_enabled" >> "$GITHUB_OUTPUT"
          if [ "$current_enabled" = 'true' ]; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Re-check approved main immediately before claim
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        run: |
          set -euo pipefail
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$APPROVED_MAIN_SHA" || {
            echo 'Safety stop: main changed before the Production Auth password claim.'
            exit 1
          }

      - name: Claim approval before Production Auth mutation
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          APPROVAL_CHALLENGE: ${{ steps.approval.outputs.challenge }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg operation "$OPERATION" \
            --arg mainSha "$APPROVED_MAIN_SHA" \
            --arg challenge "$APPROVAL_CHALLENGE" \
            --arg runId "$GITHUB_RUN_ID" \
            '{operation:$operation,mainSha:$mainSha,challenge:$challenge,runId:$runId}')"
          body="NOVELIGHT_PRODUCTION_AUTH_PASSWORD_CLAIMED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

      - name: Re-check approved main immediately before Auth mutation
        if: steps.precheck.outputs.needs_patch == 'true'
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        run: |
          set -euo pipefail
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$APPROVED_MAIN_SHA" || {
            echo 'Safety stop: main changed before the Production Auth password mutation.'
            exit 1
          }

      - name: Enable only leaked password protection
        id: mutate
        if: steps.precheck.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload='{"password_hibp_enabled":true}'
          jq -e '
            .password_hibp_enabled == true and
            ((keys | sort) == (["password_hibp_enabled"] | sort))
          ' <<<"$payload" >/dev/null

          status="$(
            curl --silent --show-error \
              --output /tmp/auth-password-patch.json \
              --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -X PATCH \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data "$payload" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          )"
          [ "$status" = '200' ] || {
            echo "Production Auth password mutation failed safely with HTTP $status."
            exit 1
          }

      - name: Verify leaked password protection after mutation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error \
              --output /tmp/auth-password-after.json \
              --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Accept: application/json' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          )"
          [ "$status" = '200' ] || {
            echo "Production Auth password postcheck returned HTTP $status."
            exit 1
          }
          jq -e '.password_hibp_enabled == true' /tmp/auth-password-after.json >/dev/null || {
            echo 'Production Auth password postcheck did not confirm leaked password protection.'
            exit 1
          }

      - name: Record successful Production Auth password protection
        if: success()
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          APPROVAL_CHALLENGE: ${{ steps.approval.outputs.challenge }}
          NEEDS_PATCH: ${{ steps.precheck.outputs.needs_patch }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg operation "$OPERATION" \
            --arg mainSha "$APPROVED_MAIN_SHA" \
            --arg challenge "$APPROVAL_CHALLENGE" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg needsPatch "$NEEDS_PATCH" \
            '{operation:$operation,mainSha:$mainSha,challenge:$challenge,runId:$runId,passwordHibpEnabled:true,mutationApplied:($needsPatch == "true")}')"
          body="NOVELIGHT_PRODUCTION_AUTH_PASSWORD_EXECUTED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

      - name: Roll back only this Auth password mutation after failed verification
        if: failure() && steps.mutate.outcome == 'success' && steps.precheck.outputs.needs_patch == 'true'
        id: rollback
        shell: bash
        env:
          PREVIOUS_ENABLED: ${{ steps.precheck.outputs.previous_enabled }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --argjson enabled "$PREVIOUS_ENABLED" '{password_hibp_enabled:$enabled}')"
          status="$(
            curl --silent --show-error \
              --output /tmp/auth-password-rollback.json \
              --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -X PATCH \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data "$payload" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          )"
          [ "$status" = '200' ] || {
            echo "Auth password rollback failed with HTTP $status."
            exit 1
          }

      - name: Record failed Production Auth password attempt
        if: failure()
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          APPROVAL_CHALLENGE: ${{ steps.approval.outputs.challenge }}
          ROLLBACK_RESULT: ${{ steps.rollback.outcome }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg operation "$OPERATION" \
            --arg mainSha "$APPROVED_MAIN_SHA" \
            --arg challenge "$APPROVAL_CHALLENGE" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg rollbackResult "${ROLLBACK_RESULT:-not-run}" \
            '{operation:$operation,mainSha:$mainSha,challenge:$challenge,runId:$runId,rollbackResult:$rollbackResult}')"
          body="NOVELIGHT_PRODUCTION_AUTH_PASSWORD_FAILED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

      - name: Remove temporary Production Auth password files
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/ledger-comments.json \
            /tmp/auth-password-before.json \
            /tmp/auth-password-patch.json \
            /tmp/auth-password-after.json \
            /tmp/auth-password-rollback.json

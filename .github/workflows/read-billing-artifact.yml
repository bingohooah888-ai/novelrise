name: Temporary Billing Artifact Reader

on:
  push:
    branches: [ci/dispatch-staging-billing-gate]
    paths:
      - '.github/workflows/read-billing-artifact.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download failed billing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 32856798862 --repo "$GITHUB_REPOSITORY" --name staging-billing-playwright-failure-32856798862-1 --dir /tmp/billing-artifact
      - name: Print Playwright error context
        run: |
          find /tmp/billing-artifact -maxdepth 5 -type f -printf '%p\n'
          context_file="$(find /tmp/billing-artifact -name error-context.md -type f -print -quit)"
          test -n "$context_file"
          echo '===== error-context.md ====='
          cat "$context_file"

name: NOVELIGHT Staging Authenticated Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Optional HTTPS Vercel Preview/Staging URL; otherwise STAGING_BASE_URL is used'
        required: false
        type: string
      revision:
        description: 'Exact 40-character commit SHA deployed at the manual Staging URL'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: novelight-staging-authenticated-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-smoke:
    if: >-
      vars.STAGING_E2E_READY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment != 'Production' &&
        github.event.deployment.environment != 'production'))
    name: Verify authenticated beta-critical staging flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      STAGING_TRIGGER: ${{ github.event_name }}
      MANUAL_STAGING_URL: ${{ inputs.staging_url }}
      CANONICAL_STAGING_URL: ${{ vars.STAGING_BASE_URL }}
      DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
      DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
      EXPECTED_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.deployment.sha }}
      STAGING_REQUIRE_WRITE_CONFIG: 'true'
      STAGING_EXPECTED_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_EXPECTED_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      E2E_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PRODUCTION_AUTH_SMOKE_FIXTURE: /tmp/novelight-staging-auth-smoke.json
      AUTH_SMOKE_LABEL: ステージング認証スモーク
      CHECKOUT_SESSION_PREFIX: cs_test_

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.deployment.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Verify GitHub Staging fixture credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY" || {
            echo 'CONFIG_DRIFT: STAGING_SUPABASE_SECRET_KEY is not configured.'
            exit 1
          }
          test -n "$E2E_SUPABASE_PUBLISHABLE_KEY" || {
            echo 'CONFIG_DRIFT: STAGING_SUPABASE_PUBLISHABLE_KEY is not configured.'
            exit 1
          }

      - name: Verify deployed Staging contract before writes
        run: node scripts/verify-staging-deployment.mjs

      - name: Verify staging critical pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            login.html
            post.html
            episode-post.html
            novel.html
            episode.html
            scout-record.html
            analytics.html
            novelight-client.js
          )

          curl_args=(
            --fail
            --silent
            --show-error
            --location
            --connect-timeout 10
            --max-time 20
          )
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            curl_args+=(--header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          for route in "${routes[@]}"; do
            curl "${curl_args[@]}" "$E2E_BASE_URL/$route" > /dev/null
          done

      - name: Install application dependencies
        run: npm ci

      - name: Install browser smoke dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Create ephemeral staging smoke users
        id: staging_fixture
        run: node scripts/production-auth-smoke-fixture.mjs setup

      - name: Run authenticated staging smoke with Stripe test mode
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.production-auth.config.mjs

      - name: Summarize authenticated staging failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '## Authenticated staging smoke failure diagnostics'
            echo ''
            echo 'Playwright traces, screenshots, and raw test results are attached when available.'
            echo ''
            echo '### Failure files'
          } >> "$GITHUB_STEP_SUMMARY"
          find tests/e2e/test-results -maxdepth 3 -type f -printf '%p (%k KB)\n' 2>/dev/null | sort | tee /tmp/staging-auth-failure-files.txt
          if [ -s /tmp/staging-auth-failure-files.txt ]; then
            {
              echo '```text'
              cat /tmp/staging-auth-failure-files.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No Playwright failure files were found.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload authenticated staging failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-auth-playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Clean ephemeral staging smoke data
        if: ${{ always() && steps.staging_fixture.outcome != 'skipped' }}
        run: node scripts/production-auth-smoke-fixture.mjs cleanup

      - name: Remove temporary staging fixture
        if: always()
        run: rm -f "$PRODUCTION_AUTH_SMOKE_FIXTURE"

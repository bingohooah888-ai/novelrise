name: NOVELIGHT Owner Draft PR Auto Sync

# Trust boundary: this workflow only runs from main (never PR-supplied code).
# Native GitHub update-branch plus exact-HEAD CI/CodeQL dispatch. No merge or deploy.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, converted_to_draft]
  workflow_run:
    workflows: ['NOVELIGHT High-Risk PR Approval Relay']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Explicit owner Draft PR number (trusted repository only)'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  actions: write
  issues: read

concurrency:
  group: novelight-owner-draft-pr-auto-sync
  cancel-in-progress: false

jobs:
  sync-owner-drafts:
    name: Keep owner Draft PRs current with main
    if: github.repository == 'bingohooah888-ai/novelrise'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout trusted main (never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Sync eligible owner Draft PRs with native GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOVELIGHT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '0' }}
        run: node scripts/novelight-pr-auto-sync.mjs

name: Temporary MASTER chat handoff patch

on:
  push:
    branches: [docs/master-chat-handoff]
    paths:
      - '.github/workflows/temp-master-chat-handoff.yml'

permissions:
  contents: write

jobs:
  patch-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Patch canonical MASTER
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/NOVELIGHT-MASTER.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## 20. 開発基本方針\n'
          heading = 'チャット切替・引き継ぎ'

          if heading in text:
              raise SystemExit('Chat handoff policy already exists.')
          if marker not in text:
              raise SystemExit('Section 20 marker was not found.')

          addition = '''
          チャット切替・引き継ぎ

          NOVELIGHTの作業チャットが長くなり、応答速度、参照効率、作業精度、操作の分かりやすさ等が低下する可能性がある場合、ChatGPTはユーザーから聞かれるまで待たず、キリの良い工程で新しいチャットへの切替を提案する。

          ただし、実行中の重要処理、未確認の本番変更、復旧途中の作業等を中断させる形では切り替えない。現在の工程が完了しているか、切り替えて安全な状態かを明示してから提案する。

          チャット切替を提案する際は、ユーザーが長い経緯を自分で書き直さなくて済むよう、次の新しいチャットへそのまま貼り付けられる短い引き継ぎ指示文を必ず作成する。

          引き継ぎ指示文には、少なくとも以下を含める。

          現在の作業目的
          直前までに完了した重要事項
          次に行うべき作業
          関係するPR、Workflow Run、ブランチ、画面操作等がある場合はその現在地
          作業開始時に最新mainとmain上の `docs/NOVELIGHT-MASTER.md` を再取得し、それを唯一の正式な基準とする指示
          全体と主要工程ごとの予想所要時間を先に示す指示

          新しいチャットでは、前チャットの要約・記憶だけを正式な状態として扱わず、開発作業ではGitHubの最新main、最新MASTER、必要なPR・Workflow等を実際に再確認してから続行する。

          X・マーケティング・デザイン・企画等についても、必要な最新決定事項と次の目的を短く引き継ぎ、ユーザーに過去の会話を再説明させることを可能な限り避ける。

          目的はチャットを細かく分けることではなく、長時間作業でも文脈の正確性、作業速度、引き継ぎの容易さを維持することである。
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()).strip() + '\n\n'
          path.write_text(text.replace(marker, '\n' + addition + marker.lstrip('\n'), 1), encoding='utf-8')
          PY

      - name: Commit patched MASTER
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/NOVELIGHT-MASTER.md
          git diff --cached --check
          git commit -m 'Document NOVELIGHT chat handoff policy'
          git push origin HEAD:docs/master-chat-handoff

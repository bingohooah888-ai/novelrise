name: NOVELIGHT Approved Production Execution

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  statuses: write

concurrency:
  group: novelight-production-approved-dispatch
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate one fixed chat-approved Production action
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 165 &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_PRODUCTION_DISPATCH_APPROVE ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      APPROVAL_BODY: ${{ github.event.comment.body }}
      MANUAL_WORKFLOW: supabase-production.yml
      REPAIR_VERSION: '20260815000000'
    outputs:
      operation: ${{ steps.approval.outputs.operation }}
      main_sha: ${{ steps.approval.outputs.main_sha }}
      challenge: ${{ steps.approval.outputs.challenge }}
      repair_version: ${{ steps.approval.outputs.repair_version }}

    steps:
      - name: Validate exact one-time Production approval
        id: approval
        shell: bash
        run: |
          set -euo pipefail

          approval_json="${APPROVAL_BODY#NOVELIGHT_PRODUCTION_DISPATCH_APPROVE }"
          echo "$approval_json" | jq -e --arg repairVersion "$REPAIR_VERSION" '
            type == "object" and
            .operation == "supabase-baseline-history-repair" and
            (.mainSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            .repairVersion == $repairVersion and
            ((keys | sort) == (["challenge", "mainSha", "operation", "repairVersion"] | sort))
          ' >/dev/null || {
            echo 'Safety stop: invalid Production approval record.'
            exit 1
          }

          operation="$(echo "$approval_json" | jq -r '.operation')"
          main_sha="$(echo "$approval_json" | jq -r '.mainSha')"
          challenge="$(echo "$approval_json" | jq -r '.challenge')"
          repair_version="$(echo "$approval_json" | jq -r '.repairVersion')"

          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          if [ "$current_main" != "$main_sha" ]; then
            echo 'Safety stop: main changed after the user approved this Production action.'
            exit 1
          fi

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > /tmp/ledger-comments.json

          comment_count="$(jq 'length' /tmp/ledger-comments.json)"
          [ "$comment_count" -lt 100 ] || {
            echo 'Safety stop: Production Approval Ledger exceeded the bounded comment contract.'
            exit 1
          }

          used_count="$(
            jq \
              --arg operation "$operation" \
              --arg mainSha "$main_sha" \
              --arg challenge "$challenge" \
              '[
                .[]
                | .body as $body
                | select(
                    ($body | startswith("NOVELIGHT_PRODUCTION_DISPATCH_CLAIMED ")) or
                    ($body | startswith("NOVELIGHT_PRODUCTION_DISPATCHED ")) or
                    ($body | startswith("NOVELIGHT_PRODUCTION_EXECUTED "))
                  )
                | ($body | sub("^[^ ]+ "; "") | fromjson?)
                | select(
                    .operation == $operation and
                    .mainSha == $mainSha and
                    .challenge == $challenge
                  )
              ] | length' \
              /tmp/ledger-comments.json
          )"
          if [ "$used_count" -ne 0 ]; then
            echo 'Safety stop: this Production approval was already used.'
            exit 1
          fi

          {
            echo "operation=$operation"
            echo "main_sha=$main_sha"
            echo "challenge=$challenge"
            echo "repair_version=$repair_version"
          } >> "$GITHUB_OUTPUT"
          echo "Validated one-time Production approval for exact main $main_sha."

      - name: Remove only stale bridge-dispatched manual approval run
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$MANUAL_WORKFLOW/runs?per_page=100" \
            > /tmp/manual-production-runs.json

          jq '[.workflow_runs[] | select(.status != "completed")]' \
            /tmp/manual-production-runs.json > /tmp/active-manual-production-runs.json

          human_active_count="$(
            jq '[.[] | select(.actor.login != "github-actions[bot]")] | length' \
              /tmp/active-manual-production-runs.json
          )"
          if [ "$human_active_count" -ne 0 ]; then
            echo 'Safety stop: a human-started Supabase Production workflow is still active.'
            exit 1
          fi

          bot_active_count="$(
            jq '[.[] | select(.actor.login == "github-actions[bot]" and .event == "workflow_dispatch")] | length' \
              /tmp/active-manual-production-runs.json
          )"
          if [ "$bot_active_count" -gt 1 ]; then
            echo 'Safety stop: multiple stale bot-dispatched Production runs require manual investigation.'
            exit 1
          fi

          if [ "$bot_active_count" -eq 1 ]; then
            stale_run_id="$(
              jq -r '.[] | select(.actor.login == "github-actions[bot]" and .event == "workflow_dispatch") | .id' \
                /tmp/active-manual-production-runs.json
            )"
            stale_head_sha="$(
              jq -r '.[] | select(.actor.login == "github-actions[bot]" and .event == "workflow_dispatch") | .head_sha' \
                /tmp/active-manual-production-runs.json
            )"

            if [ "$stale_head_sha" = "$MAIN_SHA" ]; then
              echo 'Safety stop: a bot-dispatched Production run already exists for the approved main.'
              exit 1
            fi

            prior_bridge_dispatch_count="$(
              jq \
                --arg staleMainSha "$stale_head_sha" \
                --arg repairVersion "$REPAIR_VERSION" \
                --arg targetWorkflow "$MANUAL_WORKFLOW" \
                '[
                  .[]
                  | .body as $body
                  | select($body | startswith("NOVELIGHT_PRODUCTION_DISPATCHED "))
                  | ($body | sub("^[^ ]+ "; "") | fromjson?)
                  | select(
                      .operation == "supabase-baseline-history-repair" and
                      .mainSha == $staleMainSha and
                      .repairVersion == $repairVersion and
                      .targetWorkflow == $targetWorkflow
                    )
                ] | length' \
                /tmp/ledger-comments.json
            )"
            if [ "$prior_bridge_dispatch_count" -ne 1 ]; then
              echo 'Safety stop: active bot Production run is not uniquely backed by the prior bridge ledger.'
              exit 1
            fi

            cancel_status="$(
              curl --silent --show-error \
                --output /tmp/cancel-response.txt \
                --write-out '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$stale_run_id/cancel"
            )"
            if [ "$cancel_status" != '202' ]; then
              echo "Safety stop: stale Production run cancellation failed with HTTP $cancel_status."
              cat /tmp/cancel-response.txt
              exit 1
            fi

            cancelled=false
            for _ in $(seq 1 20); do
              curl --silent --show-error --fail \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$stale_run_id" \
                > /tmp/stale-run.json
              run_status="$(jq -r '.status' /tmp/stale-run.json)"
              run_conclusion="$(jq -r '.conclusion // ""' /tmp/stale-run.json)"
              if [ "$run_status" = 'completed' ] && [ "$run_conclusion" = 'cancelled' ]; then
                cancelled=true
                break
              fi
              sleep 2
            done

            if [ "$cancelled" != 'true' ]; then
              echo 'Safety stop: stale Production run did not reach cancelled state.'
              exit 1
            fi
            echo "Cancelled stale bridge-dispatched Production run $stale_run_id."
          fi

      - name: Re-check approved main immediately before claim
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$MAIN_SHA" || {
            echo 'Safety stop: main changed before Production approval claim.'
            exit 1
          }

      - name: Claim approval before Production execution
        env:
          OPERATION: ${{ steps.approval.outputs.operation }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          CHALLENGE: ${{ steps.approval.outputs.challenge }}
          REPAIR_VERSION_OUTPUT: ${{ steps.approval.outputs.repair_version }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -cn \
              --arg operation "$OPERATION" \
              --arg mainSha "$MAIN_SHA" \
              --arg challenge "$CHALLENGE" \
              --arg repairVersion "$REPAIR_VERSION_OUTPUT" \
              --arg bridgeRunId "$GITHUB_RUN_ID" \
              '{operation:$operation,mainSha:$mainSha,challenge:$challenge,repairVersion:$repairVersion,bridgeRunId:$bridgeRunId}'
          )"
          body="NOVELIGHT_PRODUCTION_DISPATCH_CLAIMED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

  repair:
    name: Execute fixed chat-approved baseline history repair
    needs: authorize
    outputs:
      mutation_result: ${{ steps.execution_phase.outputs.mutation_result }}
      postcheck_result: ${{ steps.execution_phase.outputs.postcheck_result }}
      failure_phase: ${{ steps.execution_phase.outputs.failure_phase }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production-migration
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '165'
      OPERATION: ${{ needs.authorize.outputs.operation }}
      APPROVED_MAIN_SHA: ${{ needs.authorize.outputs.main_sha }}
      APPROVAL_CHALLENGE: ${{ needs.authorize.outputs.challenge }}
      REPAIR_VERSION: '20260815000000'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx

    steps:
      - name: Re-validate claimed chat approval at Production boundary
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_EVENT_NAME" = 'issue_comment'
          test "$OPERATION" = 'supabase-baseline-history-repair'
          test "$REPAIR_VERSION" = '20260815000000'
          [[ "$APPROVED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_CHALLENGE" =~ ^[A-F0-9]{8}$ ]]

          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$APPROVED_MAIN_SHA" || {
            echo 'Safety stop: main changed before the Production boundary.'
            exit 1
          }

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > /tmp/ledger-comments.json

          comment_count="$(jq 'length' /tmp/ledger-comments.json)"
          [ "$comment_count" -lt 100 ] || {
            echo 'Safety stop: Production Approval Ledger exceeded the bounded comment contract.'
            exit 1
          }

          claim_count="$(
            jq \
              --arg operation "$OPERATION" \
              --arg mainSha "$APPROVED_MAIN_SHA" \
              --arg challenge "$APPROVAL_CHALLENGE" \
              --arg repairVersion "$REPAIR_VERSION" \
              --arg bridgeRunId "$GITHUB_RUN_ID" \
              '[
                .[]
                | .body as $body
                | select($body | startswith("NOVELIGHT_PRODUCTION_DISPATCH_CLAIMED "))
                | ($body | sub("^[^ ]+ "; "") | fromjson?)
                | select(
                    .operation == $operation and
                    .mainSha == $mainSha and
                    .challenge == $challenge and
                    .repairVersion == $repairVersion and
                    .bridgeRunId == $bridgeRunId
                  )
              ] | length' \
              /tmp/ledger-comments.json
          )"
          if [ "$claim_count" -ne 1 ]; then
            echo 'Safety stop: exact claimed chat approval was not found at the Production boundary.'
            exit 1
          fi

      - name: Checkout approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.main_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_MAIN_SHA"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured.'
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo 'PRODUCTION_DB_PASSWORD is not configured.'
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.111.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Require baseline history version to be pending
        shell: bash
        run: |
          set -euo pipefail

          test "$REPAIR_VERSION" = '20260815000000'
          test -f supabase/migrations/20260815000000_initial_schema_baseline.sql
          supabase migration list --linked | tee /tmp/repair-migration-list.txt
          bash scripts/extract-supabase-pending.sh /tmp/repair-migration-list.txt \
            | tee /tmp/repair-pending.txt

          if ! grep -Fxq "$REPAIR_VERSION" /tmp/repair-pending.txt; then
            echo "History repair blocked: $REPAIR_VERSION is not currently pending in Production."
            exit 1
          fi

      - name: Verify Production core tables before baseline history repair
        run: bash scripts/verify-production-initial-baseline-state.sh

      - name: Align verified Production baseline migration history
        id: baseline_history_mutation
        run: supabase migration repair --status applied "$REPAIR_VERSION"

      - name: Verify production migration status after repair
        id: migration_status_postcheck
        run: supabase migration list --linked

      - name: Verify production beta observability
        id: production_beta_observability
        continue-on-error: true
        run: bash scripts/verify-production-observability.sh

      - name: Publish production beta verification status
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.production_beta_observability.outcome }}
        shell: bash
        run: |
          state=failure
          description='Production beta verification failed'
          if [ "$VERIFY_OUTCOME" = 'success' ]; then
            state=success
            description='Production beta verification passed'
          fi
          bash scripts/publish-commit-status.sh "$state" production-beta-verification "$description"

      - name: Classify Production execution phases
        id: execution_phase
        if: always()
        env:
          MUTATION_OUTCOME: ${{ steps.baseline_history_mutation.outcome }}
          MIGRATION_POSTCHECK_OUTCOME: ${{ steps.migration_status_postcheck.outcome }}
          INTEGRITY_POSTCHECK_OUTCOME: ${{ steps.production_beta_observability.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          mutation_result='not-run'
          postcheck_result='not-run'
          failure_phase='pre-mutation'

          if [ "$MUTATION_OUTCOME" = 'failure' ]; then
            mutation_result='failure'
            failure_phase='mutation'
          elif [ "$MUTATION_OUTCOME" = 'success' ]; then
            mutation_result='success'
            if [ "$MIGRATION_POSTCHECK_OUTCOME" != 'success' ]; then
              postcheck_result='failure'
              failure_phase='postcheck:migration-status'
            elif [ "$INTEGRITY_POSTCHECK_OUTCOME" != 'success' ]; then
              postcheck_result='failure'
              failure_phase='postcheck:integrity'
            else
              postcheck_result='success'
              failure_phase='none'
            fi
          fi

          {
            echo "mutation_result=$mutation_result"
            echo "postcheck_result=$postcheck_result"
            echo "failure_phase=$failure_phase"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce production beta verification result
        if: steps.production_beta_observability.outcome == 'failure'
        run: |
          echo 'Production beta observability verification failed.'
          exit 1

  record:
    name: Record chat-approved Production execution result
    needs:
      - authorize
      - repair
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '165'
      OPERATION: ${{ needs.authorize.outputs.operation }}
      MAIN_SHA: ${{ needs.authorize.outputs.main_sha }}
      CHALLENGE: ${{ needs.authorize.outputs.challenge }}
      REPAIR_VERSION_OUTPUT: ${{ needs.authorize.outputs.repair_version }}
      REPAIR_RESULT: ${{ needs.repair.result }}
      MUTATION_RESULT: ${{ needs.repair.outputs.mutation_result }}
      POSTCHECK_RESULT: ${{ needs.repair.outputs.postcheck_result }}
      FAILURE_PHASE: ${{ needs.repair.outputs.failure_phase }}

    steps:
      - name: Record Production execution result
        shell: bash
        run: |
          set -euo pipefail
          marker='NOVELIGHT_PRODUCTION_EXECUTION_FAILED'
          result="$REPAIR_RESULT"
          mutation_result="${MUTATION_RESULT:-unknown}"
          postcheck_result="${POSTCHECK_RESULT:-unknown}"
          failure_phase="${FAILURE_PHASE:-unknown}"
          if [ "$REPAIR_RESULT" = 'success' ]; then
            marker='NOVELIGHT_PRODUCTION_EXECUTED'
            result='success'
          elif [ "$failure_phase" = 'none' ]; then
            failure_phase='workflow'
          fi

          payload="$(
            jq -cn \
              --arg operation "$OPERATION" \
              --arg mainSha "$MAIN_SHA" \
              --arg challenge "$CHALLENGE" \
              --arg repairVersion "$REPAIR_VERSION_OUTPUT" \
              --arg bridgeRunId "$GITHUB_RUN_ID" \
              --arg result "$result" \
              --arg mutation_result "$mutation_result" \
              --arg postcheck_result "$postcheck_result" \
              --arg failure_phase "$failure_phase" \
              '{operation:$operation,mainSha:$mainSha,challenge:$challenge,repairVersion:$repairVersion,bridgeRunId:$bridgeRunId,result:$result,mutation_result:$mutation_result,postcheck_result:$postcheck_result,failure_phase:$failure_phase}'
          )"
          body="$marker $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

name: Format PR 161

on:
  push:
    branches:
      - ops/harden-production-billing-incidents

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/harden-production-billing-incidents
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format affected tests and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            tests/production-billing-audit.test.mjs \
            tests/production-billing-operations-contract.test.mjs \
            tests/webhook-observability.test.js
          rm -f .github/workflows/format-pr-161.yml

      - name: Commit exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to format.'
            exit 0
          fi
          git commit -m 'Apply Prettier formatting to billing incident tests'
          git push origin HEAD:ops/harden-production-billing-incidents

name: NOVELIGHT Beta P0 Database Gate

on:
  pull_request:
    branches: [main]
    paths: &beta_p0_paths
      - 'scripts/run-beta-p0-db-tests.sh'
      - 'tests/rls/fixture.sql'
      - 'tests/rls/billing-fixture.sql'
      - 'tests/rls/light-seed-fixture.sql'
      - 'tests/rls/exposure-fixture.sql'
      - 'tests/rls/beta-p0-foundations.sql'
      - 'tests/rls/signup-display-name.sql'
      - 'tests/rls/founding-internal-exclusion*.sql'
      - 'supabase/**/20260819190000_*.sql'
      - 'supabase/**/20260822_content_write_rls_*.sql'
      - 'supabase/**/20260822194000_*.sql'
      - 'supabase/**/20260823073000_*.sql'
      - 'supabase/**/20260823074300_*.sql'
      - 'supabase/**/20260823083500_*.sql'
      - 'supabase/**/20260823112000_*.sql'
      - 'supabase/**/20260823115300_*.sql'
      - 'supabase/**/20260823133000_*.sql'
      - 'supabase/**/2026082317*.sql'
      - 'supabase/**/20260823192500_*.sql'
      - 'supabase/**/20260823204500_*.sql'
      - '.github/workflows/beta-p0-database.yml'
  push:
    branches: [main]
    paths: *beta_p0_paths

permissions:
  contents: read

concurrency:
  group: beta-p0-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  beta-p0-db:
    name: Beta P0 migrations, RLS, and rollback safety
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novelight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novelight_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run beta P0 database gate
        env:
          PGPASSWORD: postgres
        run: bash scripts/run-beta-p0-db-tests.sh

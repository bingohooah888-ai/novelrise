name: NOVELIGHT Typo Format Once

on:
  push:
    branches:
      - feature/typo-report-workflow-current
    paths:
      - 'tests/typo-report-workflow-contract.test.mjs'
      - '.github/workflows/typo-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/typo-report-workflow-current
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/typo-report-workflow-contract.test.mjs
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/typo-report-workflow-contract.test.mjs; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/typo-report-workflow-contract.test.mjs
          git commit -m 'Format typo report contract test [format]'
          git push origin HEAD:feature/typo-report-workflow-current

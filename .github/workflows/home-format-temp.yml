name: NOVELIGHT Home Format Temporary

on:
  push:
    branches:
      - codex/home-scroll-visuals-final-20261003
    paths:
      - .github/workflows/home-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only home-specific tests
        run: |
          set -euo pipefail
          npx prettier --write tests/home-discovery-section-36.test.mjs tests/home-hero-copy-lines.test.mjs tests/home-promo-assets.test.mjs
          git rm .github/workflows/home-format-temp.yml
          git add -- tests/home-discovery-section-36.test.mjs tests/home-hero-copy-lines.test.mjs tests/home-promo-assets.test.mjs
          git diff --cached --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/home-format-temp.yml
          tests/home-discovery-section-36.test.mjs
          tests/home-hero-copy-lines.test.mjs
          tests/home-promo-assets.test.mjs
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format home promotional tests'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

name: NOVELIGHT Production Readiness Smoke

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'novelight-client.js'
      - 'api/**'
      - 'supabase/checks/production_beta_observability.sql'
      - 'scripts/verify-production-static.sh'
      - 'scripts/verify-production-observability.sh'
      - 'scripts/publish-commit-status.sh'
      - 'tests/e2e/production/**'
      - 'tests/e2e/playwright.production.config.mjs'
      - 'tests/e2e/package.json'
      - 'tests/e2e/package-lock.json'
      - '.github/workflows/production-readiness-smoke.yml'
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: novelight-production-readiness-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed public surfaces and production observability
    runs-on: ubuntu-latest
    environment: production
    env:
      BASE_URL: https://novelrise.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx
      STATIC_CHECK_MODE: ${{ github.event_name == 'push' && 'changed' || 'all' }}
      BASE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify production static routes
        run: bash scripts/verify-production-static.sh

      - name: Verify safe API route contracts
        shell: bash
        run: |
          set -euo pipefail

          checkout_code="$(curl --silent --show-error --output /tmp/checkout-response \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
            "$BASE_URL/api/create-checkout-session")"
          webhook_code="$(curl --silent --show-error --output /tmp/webhook-response \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
            "$BASE_URL/api/stripe-webhook")"

          case "$checkout_code" in
            401|405) ;;
            *) echo "Unexpected checkout GET status: $checkout_code"; exit 1 ;;
          esac

          if [ "$webhook_code" != '405' ]; then
            echo "Unexpected Stripe webhook GET status: $webhook_code"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install production browser smoke dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run read-only production reader smoke
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: https://novelrise.vercel.app
        run: npx playwright test --config=playwright.production.config.mjs

      - name: Verify production beta observability
        id: observability
        run: bash scripts/verify-production-observability.sh

      - name: Publish production readiness status
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='Production readiness smoke failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Production readiness smoke passed'
          fi
          bash scripts/publish-commit-status.sh "$state" production-readiness-smoke "$description"

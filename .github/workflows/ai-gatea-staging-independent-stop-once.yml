name: NOVELIGHT Gate A Staging Independent STOP (one-shot)

# Cloudflare-independent, OWNER-triggered STOP only. It cannot arm AI or call providers.
# Preventive candidate: fixed Data API STOP only, with separate final census.
# Activation requires separately approved Staging-only role/JWT isolation.
# No generic DB login, PAT, provider credential or automatic activation.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.comment.body == 'NOVELIGHT_GATEA_INDEPENDENT_RECOVERY_PREFLIGHT' && 'novelight-gatea-independent-recovery-preflight' || 'novelight-gatea-staging-independent-stop' }}
  cancel-in-progress: false

jobs:
  stop:
    if: >-
      github.repository == 'bingohooah888-ai/novelrise' &&
      github.event.issue.number == 294 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == '[Staging Control] Supabase migration sync' &&
      github.event.issue.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == 'bingohooah888-ai' &&
      github.triggering_actor == 'bingohooah888-ai' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_GATEA_STAGING_STOP_ONCE ')
    runs-on: ubuntu-latest
    environment: gatea-independent-recovery
    timeout-minutes: 6
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact OWNER event and pinned Draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          approved_sha="$(jq -er '.comment.body | capture("^NOVELIGHT_GATEA_STAGING_STOP_ONCE (?<sha>[0-9a-f]{40})$").sha' "$GITHUB_EVENT_PATH")"
          jq -e --arg approved_sha "$approved_sha" '
            .repository.full_name == "bingohooah888-ai/novelrise" and
            .issue.number == 294 and
            .issue.pull_request == null and
            .issue.state == "open" and
            .issue.title == "[Staging Control] Supabase migration sync" and
            .issue.user.login == "bingohooah888-ai" and
            .comment.user.login == "bingohooah888-ai" and
            .comment.author_association == "OWNER" and
            .comment.body == ("NOVELIGHT_GATEA_STAGING_STOP_ONCE " + $approved_sha)
          ' "$GITHUB_EVENT_PATH" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/pulls/2895" |
            jq -e --arg approved_sha "$approved_sha" '
              .state == "open" and .draft == true and .merged == false and
              .head.sha == $approved_sha
            ' >/dev/null

      - name: Configure locked Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: STOP Staging through dedicated fixed RPC and verify actual row
        shell: bash
        env:
          GATEA_PREVENTIVE_STOP_ENABLED: ${{ vars.GATEA_PREVENTIVE_STOP_ENABLED }}
          GATEA_STOP_PRINCIPAL_ID: ${{ vars.GATEA_STOP_PRINCIPAL_ID }}
          GATEA_STOP_ACCESS_TOKEN: ${{ secrets.GATEA_STOP_ACCESS_TOKEN }}
          GATEA_STAGING_PUBLISHABLE_KEY: ${{ vars.GATEA_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GATEA_PREVENTIVE_STOP_ENABLED" = 'true'
          node --input-type=module <<'NODE'
          import { create020705PreventiveStopRpc } from './.github/ai-02-07-05-app-composition/gatea-independent-stop-ports.mjs';
          const stop = create020705PreventiveStopRpc({
            principalId: process.env.GATEA_STOP_PRINCIPAL_ID,
            accessToken: process.env.GATEA_STOP_ACCESS_TOKEN,
            publishableKey: process.env.GATEA_STAGING_PUBLISHABLE_KEY
          });
          await stop();
          console.log('GATEA_STAGING_STOP_READBACK_PASS: independent final census still required');
          NODE

  recovery-preflight:
    # Separate OWNER trigger; never runs on PR CI or the existing STOP event.
    # This is deliberately not live recovery until the trusted bootstrap and
    # real STOP/revoke/census privileges are separately reviewed and connected.
    if: >-
      github.repository == 'bingohooah888-ai/novelrise' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 294 &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.issue.title == '[Staging Control] Supabase migration sync' &&
      github.event.issue.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == 'bingohooah888-ai' &&
      github.triggering_actor == 'bingohooah888-ai' &&
      github.event.comment.body == 'NOVELIGHT_GATEA_INDEPENDENT_RECOVERY_PREFLIGHT'
    runs-on: ubuntu-latest
    environment: gatea-independent-recovery
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout trusted default-branch event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify trusted main and immutable OWNER event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          comment_id="$(jq -er '.comment.id | numbers' "$GITHUB_EVENT_PATH")"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" |
            jq -e '.user.login == "bingohooah888-ai" and
              .user.id == 317436651 and .author_association == "OWNER" and
              .created_at == .updated_at and
              .issue_url == "https://api.github.com/repos/bingohooah888-ai/novelrise/issues/294" and
              .body == "NOVELIGHT_GATEA_INDEPENDENT_RECOVERY_PREFLIGHT"' >/dev/null
      - name: Configure locked Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install locked dependencies without recovery credentials
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund --quiet
      - name: Validate isolated references without privileged I/O
        shell: bash
        env:
          GATEA_ACCESS_CLIENT_ID: ${{ secrets.GATEA_ACCESS_CLIENT_ID }}
          GATEA_ACCESS_CLIENT_SECRET: ${{ secrets.GATEA_ACCESS_CLIENT_SECRET }}
          GATEA_ACCESS_ORIGIN: ${{ vars.GATEA_ACCESS_ORIGIN }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import { validate020705RecoveryEnvironment } from './.github/ai-02-07-05-app-composition/gatea-independent-recovery-runner.mjs';
          validate020705RecoveryEnvironment(process.env);
          NODE
          echo 'GATEA_RECOVERY_LIVE_NO_GO: approved isolated observer and STOP/revoke/Preview ports not activated; PAT rejected'
          exit 1

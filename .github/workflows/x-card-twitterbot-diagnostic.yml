name: NOVELIGHT X card Twitterbot read-only diagnostic

on:
  push:
    branches:
      - diagnostics/x-card-twitterbot-20261022

permissions:
  contents: read

jobs:
  probe:
    name: Probe Twitterbot HTTP response (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live card HTML and PNG with Twitterbot and browser user agents
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://novelight.jp/' 'https://novelight.jp/assets/ogp/novelight-ogp-1200x630.png'; do
            for agent in 'Twitterbot/1.0' 'Mozilla/5.0 (compatible; NOVELIGHT-diagnostic/1.0)'; do
              echo "=== Target: $url ==="
              echo "Agent: $agent"
              curl --silent --show-error --location --max-time 25 --connect-timeout 10 \
                -A "$agent" --dump-header /tmp/nl-head --output /tmp/nl-body \
                --write-out 'HTTP: %{http_code} MIME: %{content_type} Bytes: %{size_download} Redirects: %{num_redirects} Final: %{url_effective}\n' "$url"
              grep -iE '^(HTTP/|content-type:|content-length:|cache-control:|x-robots-tag:|x-vercel-id:|x-vercel-cache:|server:|location:|cf-ray:)' /tmp/nl-head | tail -16 || true
              if [[ "$url" == 'https://novelight.jp/' ]]; then
                echo 'Card HTML in response:'
                grep -ioE '<meta[^>]*(twitter:card|twitter:image|og:image)[^>]*>' /tmp/nl-body | head -12 || true
                printf 'HTML bytes: '; wc -c < /tmp/nl-body
              else
                echo 'PNG signature:'
                od -An -tx1 -N8 /tmp/nl-body
                printf 'PNG bytes: '; wc -c < /tmp/nl-body
              fi
            done
          done

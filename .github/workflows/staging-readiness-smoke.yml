name: NOVELIGHT Staging Readiness Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Optional HTTPS Vercel Preview/Staging URL; otherwise STAGING_BASE_URL is used'
        required: false
        type: string
      revision:
        description: 'Exact 40-character commit SHA deployed at the manual Staging URL'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-readiness-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify read-only staging surface
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production' &&
       github.event.deployment.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_TRIGGER: ${{ github.event_name }}
      MANUAL_STAGING_URL: ${{ inputs.staging_url }}
      CANONICAL_STAGING_URL: ${{ vars.STAGING_BASE_URL }}
      DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
      DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
      EXPECTED_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.deployment.sha }}
      STAGING_REQUIRE_WRITE_CONFIG: 'false'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.deployment.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Verify Staging deployment contract
        run: node scripts/verify-staging-deployment.mjs

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright ffmpeg for failure video
        working-directory: tests/e2e
        run: npx playwright install ffmpeg

      - name: Run read-only staging smoke with runner Chrome
        working-directory: tests/e2e
        run: npm run test:staging

      - name: Summarize staging failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '## Read-only staging smoke failure diagnostics'
            echo ''
            echo 'Playwright trace, screenshots, video, HTML report, and raw test results are attached when available.'
            echo ''
            echo '### Failure files'
          } >> "$GITHUB_STEP_SUMMARY"
          find tests/e2e/staging-test-results -maxdepth 3 -type f -printf '%p (%k KB)\n' 2>/dev/null | sort | tee /tmp/staging-failure-files.txt
          if [ -s /tmp/staging-failure-files.txt ]; then
            {
              echo '```text'
              cat /tmp/staging-failure-files.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No Playwright failure files were found.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/staging-playwright-report
            tests/e2e/staging-test-results
          if-no-files-found: warn
          retention-days: 14

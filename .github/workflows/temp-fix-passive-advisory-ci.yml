name: Temporary passive advisory CI fix

on:
  push:
    branches:
      - codex/passive-content-advisories

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary passive advisory CI fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/passive-content-advisories
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Update contracts for passive advisories and owner bypass
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              Path('tests/episode-performance-gate-contract.test.mjs'),
              "    /continue'\\)\\.onclick=async\\(\\)=>[\\s\\S]*rememberWarningAccepted\\(\\);await loadEpisodeContentAndRender\\(\\)/",
              "    /continue'\\)\\.onclick=async\\(\\)=>[\\s\\S]*rememberWarningAccepted\\([\\s\\S]*?\\);await loadEpisodeContentAndRender\\(\\)/",
              'episode acknowledgement contract'
          )

          replace_once(
              Path('tests/novel-detail-performance-gate-contract.test.mjs'),
              "    'if(needsWarningGate()&&!warningAccepted()){showWarningGate();return}'",
              "    'if(!isOwner()&&needsWarningGate()&&!warningAccepted()){showWarningGate();return}'",
              'novel owner bypass gate contract'
          )
          replace_once(
              Path('tests/novel-detail-performance-gate-contract.test.mjs'),
              "    /rememberWarningAccepted\\(\\);await loadFullNovelAndRender\\(\\)/",
              "    /rememberWarningAccepted\\([\\s\\S]*?\\);await loadFullNovelAndRender\\(\\)/",
              'novel acknowledgement contract'
          )

          replace_once(
              Path('tests/e2e/specs/edit-existing-content.js'),
              "  await expect(page.locator('#warningGate')).toBeVisible();\n  await page.locator('#continueButton').click();\n  await expect(page.locator('.title')).toHaveText('編集後の作品');\n  await expect(page.locator('.description')).toHaveText(\n    '編集後のあらすじです。'\n  );\n  await expect(page.locator('.tag.ai')).toHaveText('AI支援');",
              "  await expect(page.locator('#warningGate')).toBeHidden();\n  await expect(page.locator('.title')).toHaveText('編集後の作品');\n  await expect(page.locator('.description')).toHaveText(\n    '編集後のあらすじです。'\n  );\n  await expect(page.locator('.tag.ai')).toHaveText('AI支援');\n  await expect(page.locator('#contentAdvisory')).toContainText('R15');\n  await expect(page.locator('#contentAdvisory')).toContainText(\n    '暴力・戦闘が含まれます'\n  );",
              'owner edit e2e gate expectation'
          )
          PY
      - name: Format changed tests
        run: npx prettier --write tests/content-advisory-contract.test.mjs tests/episode-performance-gate-contract.test.mjs tests/novel-detail-performance-gate-contract.test.mjs tests/e2e/specs/edit-existing-content.js
      - name: Verify focused node contracts
        run: node --test tests/content-advisory-contract.test.mjs tests/episode-performance-gate-contract.test.mjs tests/novel-detail-performance-gate-contract.test.mjs
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/content-advisory-contract.test.mjs tests/episode-performance-gate-contract.test.mjs tests/novel-detail-performance-gate-contract.test.mjs tests/e2e/specs/edit-existing-content.js
          git commit -m 'Align advisory tests with passive warning UX'
          git push origin HEAD:codex/passive-content-advisories

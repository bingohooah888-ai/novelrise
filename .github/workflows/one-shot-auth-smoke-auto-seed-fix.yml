name: One-shot auth smoke auto LIGHT SEED fix

on:
  push:
    branches:
      - fix/auth-smoke-auto-light-seed
    paths:
      - .github/workflows/one-shot-auth-smoke-auto-seed-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-smoke-auto-light-seed
          fetch-depth: 0
      - name: Replace stale manual-tier smoke contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/e2e/production-auth/authenticated-smoke.spec.js')
          text = path.read_text(encoding='utf-8')
          old = '''    await test.step('Send BRONZE LIGHT SEED', async () => {
                const seedButton = readerPage.locator(
                  '.seed-choice[data-seed-type="BRONZE"]'
                );
                await expect(seedButton).toBeVisible();
                await expect(seedButton).toBeEnabled();
                readerPage.once('dialog', (dialog) => dialog.accept());
                await seedButton.click();
                await expect(seedButton).toBeDisabled();
                await expect(readerPage.locator('#seedMessage')).toContainText(
                  'すでにLIGHT SEEDを贈っています'
                );
              });'''
          new = '''    await test.step('Send automatic LIGHT SEED', async () => {
                const seedButton = readerPage.locator('#sendLightSeedButton');
                await expect(seedButton).toBeVisible();
                await expect(seedButton).toBeEnabled();
                await expect(seedButton).toContainText('LIGHT SEEDを贈る');
                readerPage.once('dialog', (dialog) => dialog.accept());
                await seedButton.click();
                await expect(seedButton).toBeDisabled();
                await expect(readerPage.locator('#seedMessage')).toContainText(
                  'すでにLIGHT SEEDを贈っています'
                );
              });'''
          if text.count(old) != 1:
              raise SystemExit(f'Safety stop: expected exactly one stale LIGHT SEED block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          helper = Path('.github/workflows/one-shot-auth-smoke-auto-seed-fix.yml')
          helper.unlink()
      - name: Commit scoped test-only fix and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/production-auth/authenticated-smoke.spec.js .github/workflows/one-shot-auth-smoke-auto-seed-fix.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Align auth smoke with automatic LIGHT SEED"
          git push origin HEAD:fix/auth-smoke-auto-light-seed

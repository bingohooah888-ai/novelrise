name: NOVELIGHT Production Static Diagnose

on:
  push:
    branches:
      - codex/production-static-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe canonical production static assets
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://novelight.jp/'
            'https://novelight.jp/index.html'
            'https://novelight.jp/novelight-theme.css'
            'https://novelight.jp/novelight-public-dark.css'
            'https://novelight.jp/novelight-brand-refinement.css'
            'https://novelight.jp/novelight-home-thumbnails.css'
            'https://novelight.jp/novelight-accessibility.css'
            'https://novelight.jp/novelight-client.js'
            'https://novelight.jp/assets/novelight-header-logo.webp'
          )
          failed=0
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            rm -f /tmp/h /tmp/b
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 25 -D /tmp/h -o /tmp/b -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code"
            awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|content-type:|content-length:|location:|server:|x-vercel-|cache-control:)/ {gsub(/\r$/,""); print}' /tmp/h || true
            echo "BYTES=$(wc -c < /tmp/b 2>/dev/null || echo 0)"
            case "$url" in
              *.css)
                if [ "$code" != '200' ] || ! grep -Eqi 'text/css' /tmp/h; then failed=1; fi
                ;;
              *.js)
                if [ "$code" != '200' ] || ! grep -Eqi '(javascript|text/plain|application/octet-stream)' /tmp/h; then failed=1; fi
                ;;
              *.webp)
                if [ "$code" != '200' ] || ! grep -Eqi 'image/webp' /tmp/h; then failed=1; fi
                ;;
              *)
                if [ "$code" != '200' ]; then failed=1; fi
                ;;
            esac
          done
          exit "$failed"

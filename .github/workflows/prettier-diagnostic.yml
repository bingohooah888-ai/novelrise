name: Temporary Prettier Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/e2e/production/reader-smoke.spec.js
          git diff -- tests/e2e/production/reader-smoke.spec.js

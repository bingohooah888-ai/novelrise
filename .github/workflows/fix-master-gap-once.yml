name: One-shot MASTER spacing fix

on:
  push:
    branches:
      - codex/beta-content-rating-v2

permissions:
  contents: write

jobs:
  fix-master-spacing:
    if: github.event.head_commit.message == 'Temporarily normalize MASTER section boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta-content-rating-v2
          fetch-depth: 0
      - name: Normalize only section 30 to 31 spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/NOVELIGHT-MASTER.md')
          text = path.read_text(encoding='utf-8')
          old = '成人向け表現の対応範囲を再評価する。\n## 31. 作者と読者のコミュニティ'
          new = '成人向け表現の対応範囲を再評価する。\n\n## 31. 作者と読者のコミュニティ'
          if text.count(old) != 1:
              raise SystemExit(f'expected one section boundary, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-master-gap-once.yml
          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/fix-master-gap-once.yml' 'docs/NOVELIGHT-MASTER.md' | sort)"
          test "$changed" = "$expected"
          git add docs/NOVELIGHT-MASTER.md
          git commit -m 'Normalize MASTER content zoning section boundary'
          git push origin HEAD:codex/beta-content-rating-v2

name: Supabase Production Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose a production migration action
        required: true
        default: status
        type: choice
        options:
          - status
          - dry-run
          - repair-history
          - deploy
      confirmation:
        description: Type REPAIR for repair-history or DEPLOY for deploy
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode }} production migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "PRODUCTION_DB_PASSWORD is not configured."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Require explicit history repair confirmation
        if: inputs.mode == 'repair-history'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [ "$CONFIRMATION" != "REPAIR" ]; then
            echo "History repair blocked: confirmation must be exactly REPAIR."
            exit 1
          fi

      - name: Align verified production migration history
        if: inputs.mode == 'repair-history'
        shell: bash
        run: |
          test -f supabase/migrations/20260819190000_secure_content_rls_and_constraints.sql
          test -f supabase/migrations/20260822194000_manage_content_write_rls.sql
          supabase migration repair --status applied 20260819190000
          supabase migration repair --status applied 20260822194000

      - name: Dry-run pending migrations
        if: inputs.mode == 'dry-run' || inputs.mode == 'deploy'
        run: supabase db push --linked --dry-run

      - name: Require explicit deploy confirmation
        if: inputs.mode == 'deploy'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "Production deployment blocked: confirmation must be exactly DEPLOY."
            exit 1
          fi

      - name: Apply pending migrations
        if: inputs.mode == 'deploy'
        run: supabase db push --linked --yes

      - name: Verify production migration status
        if: inputs.mode == 'deploy' || inputs.mode == 'repair-history'
        run: supabase migration list --linked

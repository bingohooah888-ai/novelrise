name: Supabase Production Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose a production migration action
        required: true
        default: status
        type: choice
        options:
          - status
          - dry-run
          - repair-history
          - deploy
      repair_version:
        description: Migration version to align when mode is repair-history
        required: false
        default: '20260815000000'
        type: choice
        options:
          - '20260815000000'
          - '20260819190000'
          - '20260822194000'
      confirmation:
        description: Type REPAIR for repair-history or DEPLOY for deploy
        required: false
        default: ''
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  approval:
    name: Approve manual production mutation
    if: inputs.mode == 'deploy' || inputs.mode == 'repair-history'
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - name: Verify approval gate and typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GATE_READY: ${{ vars.PRODUCTION_APPROVAL_GATE_READY }}
          MIGRATION_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GATE_READY" != 'true' ]; then
            echo 'Production mutation blocked: the approval gate is SAFE-DISABLED.'
            exit 1
          fi

          if [ "$MIGRATION_MODE" = 'repair-history' ] && [ "$CONFIRMATION" != 'REPAIR' ]; then
            echo 'History repair blocked: confirmation must be exactly REPAIR.'
            exit 1
          fi

          if [ "$MIGRATION_MODE" = 'deploy' ] && [ "$CONFIRMATION" != 'DEPLOY' ]; then
            echo 'Production deployment blocked: confirmation must be exactly DEPLOY.'
            exit 1
          fi

          echo "Manual $MIGRATION_MODE approved through GitHub Environment protection."

  migrate:
    name: ${{ inputs.mode }} production migrations
    needs: approval
    if: >-
      always() &&
      (inputs.mode == 'status' ||
      inputs.mode == 'dry-run' ||
      needs.approval.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      MIGRATION_MODE: ${{ inputs.mode }}
      REPAIR_VERSION: ${{ inputs.repair_version }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured.'
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo 'PRODUCTION_DB_PASSWORD is not configured.'
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Require explicit history repair confirmation
        if: env.MIGRATION_MODE == 'repair-history'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [ "$CONFIRMATION" != 'REPAIR' ]; then
            echo 'History repair blocked: confirmation must be exactly REPAIR.'
            exit 1
          fi

      - name: Require selected history version to be pending and allowlisted
        if: env.MIGRATION_MODE == 'repair-history'
        shell: bash
        run: |
          set -euo pipefail

          case "$REPAIR_VERSION" in
            20260815000000|20260819190000|20260822194000) ;;
            *)
              echo "History repair blocked: unsupported migration version $REPAIR_VERSION."
              exit 1
              ;;
          esac

          test -f "supabase/migrations/${REPAIR_VERSION}_"*.sql
          supabase migration list --linked | tee /tmp/repair-migration-list.txt
          bash scripts/extract-supabase-pending.sh /tmp/repair-migration-list.txt \
            | tee /tmp/repair-pending.txt

          if ! grep -Fxq "$REPAIR_VERSION" /tmp/repair-pending.txt; then
            echo "History repair blocked: $REPAIR_VERSION is not currently pending in Production."
            exit 1
          fi

      - name: Verify Production core tables before baseline history repair
        if: env.MIGRATION_MODE == 'repair-history' && env.REPAIR_VERSION == '20260815000000'
        run: bash scripts/verify-production-initial-baseline-state.sh

      - name: Align selected verified production migration history
        if: env.MIGRATION_MODE == 'repair-history'
        run: supabase migration repair --status applied "$REPAIR_VERSION"

      - name: Dry-run pending migrations
        if: env.MIGRATION_MODE == 'dry-run' || env.MIGRATION_MODE == 'deploy'
        run: supabase db push --linked --dry-run

      - name: Require explicit deploy confirmation
        if: env.MIGRATION_MODE == 'deploy'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [ "$CONFIRMATION" != 'DEPLOY' ]; then
            echo 'Production deployment blocked: confirmation must be exactly DEPLOY.'
            exit 1
          fi

      - name: Apply pending migrations
        if: env.MIGRATION_MODE == 'deploy'
        run: supabase db push --linked --yes

      - name: Verify production migration status after mutation
        if: env.MIGRATION_MODE == 'deploy' || env.MIGRATION_MODE == 'repair-history'
        run: supabase migration list --linked

      - name: Verify production beta observability
        id: production_beta_observability
        continue-on-error: true
        run: bash scripts/verify-production-observability.sh

      - name: Publish production beta verification status
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.production_beta_observability.outcome }}
        shell: bash
        run: |
          state=failure
          description='Production beta verification failed'
          if [ "$VERIFY_OUTCOME" = 'success' ]; then
            state=success
            description='Production beta verification passed'
          fi
          bash scripts/publish-commit-status.sh "$state" production-beta-verification "$description"

      - name: Enforce production beta verification result
        if: steps.production_beta_observability.outcome == 'failure'
        run: |
          echo 'Production beta observability verification failed.'
          exit 1

name: Supabase Production Migration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/checks/production_beta_observability.sql'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Choose a production migration action
        required: true
        default: status
        type: choice
        options:
          - status
          - dry-run
          - repair-history
          - deploy
      confirmation:
        description: Type REPAIR for repair-history or DEPLOY for deploy
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ github.event_name == 'push' && 'automatic status + dry-run' || inputs.mode }} production migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      MIGRATION_MODE: ${{ github.event_name == 'push' && 'dry-run' || inputs.mode }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "PRODUCTION_DB_PASSWORD is not configured."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Require explicit history repair confirmation
        if: env.MIGRATION_MODE == 'repair-history'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [ "$CONFIRMATION" != "REPAIR" ]; then
            echo "History repair blocked: confirmation must be exactly REPAIR."
            exit 1
          fi

      - name: Align verified production migration history
        if: env.MIGRATION_MODE == 'repair-history'
        shell: bash
        run: |
          test -f supabase/migrations/20260819190000_secure_content_rls_and_constraints.sql
          test -f supabase/migrations/20260822194000_manage_content_write_rls.sql
          supabase migration repair --status applied 20260819190000
          supabase migration repair --status applied 20260822194000

      - name: Dry-run pending migrations
        if: env.MIGRATION_MODE == 'dry-run' || env.MIGRATION_MODE == 'deploy'
        run: supabase db push --linked --dry-run

      - name: Require explicit deploy confirmation
        if: env.MIGRATION_MODE == 'deploy'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "Production deployment blocked: confirmation must be exactly DEPLOY."
            exit 1
          fi

      - name: Apply pending migrations
        if: env.MIGRATION_MODE == 'deploy'
        run: supabase db push --linked --yes

      - name: Verify production migration status
        if: env.MIGRATION_MODE == 'deploy' || env.MIGRATION_MODE == 'repair-history'
        run: supabase migration list --linked

      - name: Verify production beta observability
        shell: bash
        run: |
          set -euo pipefail

          jq -Rs '{query: .}' \
            supabase/checks/production_beta_observability.sql \
            > /tmp/production-beta-query.json

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query/read-only" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/production-beta-query.json \
            > /tmp/production-beta-result.json

          if ! jq -e '
            (if type == "array" then .[0]
             elif (.result? | type) == "array" then .result[0]
             else . end) as $row
            | $row.ok == true
          ' /tmp/production-beta-result.json >/dev/null; then
            echo "Production beta observability checks failed."
            jq '
              (if type == "array" then .[0]
               elif (.result? | type) == "array" then .result[0]
               else . end)
              | {
                  ok,
                  signup_name_migration_applied,
                  profile_names_present,
                  acquisition_claims_present,
                  acquisition_rows_valid,
                  lifecycle_rows_present,
                  lifecycle_rows_valid,
                  recent_activity_present,
                  activity_rows_valid,
                  acquisition_has_lifecycle,
                  acquisition_tokens_hashed
                }
            ' /tmp/production-beta-result.json
            exit 1
          fi

          echo "Production beta observability checks passed."

name: NOVELIGHT Production Auth Smoke Approved Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch scoped Production Auth Smoke approval request
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 165 &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCH_APPROVE ')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    concurrency:
      group: novelight-production-auth-smoke-approved-dispatch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '165'
      APPROVAL_BODY: ${{ github.event.comment.body }}
      TARGET_WORKFLOW: production-auth-smoke-request.yml

    steps:
      - name: Validate exact one-time Auth Smoke dispatch approval
        id: approval
        shell: bash
        run: |
          set -euo pipefail

          approval_json="${APPROVAL_BODY#NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCH_APPROVE }"
          if [ "$approval_json" = "$APPROVAL_BODY" ]; then
            echo 'Safety stop: Production Auth Smoke dispatch approval prefix mismatch.'
            exit 1
          fi

          echo "$approval_json" | jq -e '
            type == "object" and
            .operation == "production-authenticated-smoke" and
            (.mainSha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.challenge | type == "string" and test("^[A-F0-9]{8}$")) and
            ((keys | sort) == (["challenge", "mainSha", "operation"] | sort))
          ' >/dev/null || {
            echo 'Safety stop: invalid Production Auth Smoke dispatch approval record.'
            exit 1
          }

          operation="$(echo "$approval_json" | jq -r '.operation')"
          main_sha="$(echo "$approval_json" | jq -r '.mainSha')"
          challenge="$(echo "$approval_json" | jq -r '.challenge')"

          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          if [ "$current_main" != "$main_sha" ]; then
            echo 'Safety stop: main changed after the user approved this Production Auth Smoke dispatch.'
            exit 1
          fi

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > /tmp/auth-smoke-ledger-comments.json

          comment_count="$(jq 'length' /tmp/auth-smoke-ledger-comments.json)"
          [ "$comment_count" -lt 100 ] || {
            echo 'Safety stop: Production Approval Ledger exceeded the bounded comment contract.'
            exit 1
          }

          used_count="$(
            jq \
              --arg operation "$operation" \
              --arg mainSha "$main_sha" \
              --arg challenge "$challenge" \
              '[
                .[]
                | .body as $body
                | select(
                    ($body | startswith("NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCH_CLAIMED ")) or
                    ($body | startswith("NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCHED ")) or
                    ($body | startswith("NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCH_FAILED "))
                  )
                | ($body | sub("^[^ ]+ "; "") | fromjson?)
                | select(
                    .operation == $operation and
                    .mainSha == $mainSha and
                    .challenge == $challenge
                  )
              ] | length' \
              /tmp/auth-smoke-ledger-comments.json
          )"
          if [ "$used_count" -ne 0 ]; then
            echo 'Safety stop: this Production Auth Smoke dispatch approval was already used.'
            exit 1
          fi

          {
            echo "operation=$operation"
            echo "main_sha=$main_sha"
            echo "challenge=$challenge"
          } >> "$GITHUB_OUTPUT"

      - name: Re-check approved main immediately before dispatch claim
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$MAIN_SHA" || {
            echo 'Safety stop: main changed before Production Auth Smoke dispatch claim.'
            exit 1
          }

      - name: Claim Auth Smoke dispatch approval
        id: claim
        env:
          OPERATION: ${{ steps.approval.outputs.operation }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          CHALLENGE: ${{ steps.approval.outputs.challenge }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -cn \
              --arg operation "$OPERATION" \
              --arg mainSha "$MAIN_SHA" \
              --arg challenge "$CHALLENGE" \
              --arg bridgeRunId "$GITHUB_RUN_ID" \
              --arg targetWorkflow "$TARGET_WORKFLOW" \
              '{operation:$operation,mainSha:$mainSha,challenge:$challenge,bridgeRunId:$bridgeRunId,targetWorkflow:$targetWorkflow}'
          )"
          body="NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCH_CLAIMED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"

      - name: Re-check approved main immediately before Auth Smoke request dispatch
        env:
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          test "$current_main" = "$MAIN_SHA" || {
            echo 'Safety stop: main changed before Production Auth Smoke request dispatch.'
            exit 1
          }

      - name: Dispatch fixed Production Auth Smoke request workflow
        id: dispatch_request
        shell: bash
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          dispatch_status="$(
            curl --silent --show-error \
              --output /tmp/auth-smoke-dispatch-response.txt \
              --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
              -d '{"ref":"main"}'
          )"
          if [ "$dispatch_status" != '204' ]; then
            echo "Safety stop: Production Auth Smoke request dispatch failed with HTTP $dispatch_status."
            cat /tmp/auth-smoke-dispatch-response.txt
            exit 1
          fi
          echo 'dispatched=true' >> "$GITHUB_OUTPUT"

      - name: Record successful Auth Smoke request dispatch
        if: success() && steps.dispatch_request.outputs.dispatched == 'true'
        env:
          OPERATION: ${{ steps.approval.outputs.operation }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          CHALLENGE: ${{ steps.approval.outputs.challenge }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -cn \
              --arg operation "$OPERATION" \
              --arg mainSha "$MAIN_SHA" \
              --arg challenge "$CHALLENGE" \
              --arg bridgeRunId "$GITHUB_RUN_ID" \
              --arg targetWorkflow "$TARGET_WORKFLOW" \
              '{operation:$operation,mainSha:$mainSha,challenge:$challenge,bridgeRunId:$bridgeRunId,targetWorkflow:$targetWorkflow,result:"success"}'
          )"
          body="NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCHED $payload"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null

      - name: Record failed claimed Auth Smoke request dispatch
        if: failure() && steps.claim.outputs.claimed == 'true'
        env:
          OPERATION: ${{ steps.approval.outputs.operation }}
          MAIN_SHA: ${{ steps.approval.outputs.main_sha }}
          CHALLENGE: ${{ steps.approval.outputs.challenge }}
          DISPATCH_ATTEMPTED: ${{ steps.dispatch_request.outputs.attempted }}
          DISPATCHED: ${{ steps.dispatch_request.outputs.dispatched }}
        shell: bash
        run: |
          set +e
          dispatch_result='not-started'
          failure_phase='pre-dispatch'
          if [ "$DISPATCH_ATTEMPTED" = 'true' ]; then
            dispatch_result='failure'
            failure_phase='dispatch'
          fi
          if [ "$DISPATCHED" = 'true' ]; then
            dispatch_result='success'
            failure_phase='post-dispatch-ledger'
          fi
          payload="$(
            jq -cn \
              --arg operation "$OPERATION" \
              --arg mainSha "$MAIN_SHA" \
              --arg challenge "$CHALLENGE" \
              --arg bridgeRunId "$GITHUB_RUN_ID" \
              --arg targetWorkflow "$TARGET_WORKFLOW" \
              --arg dispatchResult "$dispatch_result" \
              --arg failurePhase "$failure_phase" \
              '{operation:$operation,mainSha:$mainSha,challenge:$challenge,bridgeRunId:$bridgeRunId,targetWorkflow:$targetWorkflow,result:"failure",dispatchResult:$dispatchResult,failurePhase:$failurePhase}'
          )"
          body="NOVELIGHT_PRODUCTION_AUTH_SMOKE_DISPATCH_FAILED $payload"
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -cn --arg body "$body" '{body:$body}')" \
            >/dev/null
          rm -f /tmp/auth-smoke-ledger-comments.json /tmp/auth-smoke-dispatch-response.txt

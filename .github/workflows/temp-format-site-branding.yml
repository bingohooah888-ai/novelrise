name: Temporary format site branding regression

on:
  push:
    branches:
      - fix/unify-header-branding

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/unify-header-branding
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format only the site branding regression test
        run: npx prettier --write tests/site-brand-logo.test.mjs

      - name: Commit exact Prettier output if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/site-brand-logo.test.mjs; then
            echo "Target already matches Prettier output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/site-brand-logo.test.mjs
          git commit -m "Apply exact Prettier output to branding regression test"
          git push origin HEAD:fix/unify-header-branding

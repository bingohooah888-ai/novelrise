name: Temp format execution card test

on:
  push:
    branches:
      - fix/execution-card-hardening

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier output
        run: npx prettier tests/execution-turn-card-gate.test.mjs

name: Apply proactive chat switch gate

on:
  push:
    branches:
      - docs/proactive-chat-switch-gate

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Apply proactive chat switch gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/proactive-chat-switch-gate
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply proactive chat switch policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected policy anchor not found in ${path}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'docs/CHAT-HANDOFF-PREFLIGHT.md',
            `## 1. 発火条件\n\n以下のいずれかに当てはまる場合、このPreflightを必ず通す。\n\n- 新しいチャットへの切替を推奨する\n- 「この区切りでチャットを変えた方がよい」と判断する\n- 主要工程完了後のチャット継続判定で「切替」が有利と判断する\n- ユーザーに次チャットで続きを行うよう案内する\n\n## 2. 送信ゲート`,
            `## 1. 発火条件\n\n### 1.1 区切り時の継続／切替判定は必須\n\n主要工程が安全に完了した区切りでは、ユーザーから聞かれるのを待たず、**現在のチャットを継続するか、新しいチャットへ切り替えるかを必ず一度判定する。** 判定した結果が「継続」であれば、切替提案を無理に表示する必要はない。\n\n特に次のいずれかは、切替を積極的に検討するシグナルとする。\n\n- PRがmainへマージされ、一つの作業テーマ／workstreamが完了した\n- Production対応、CI修正、復旧、調査等がcleanup・確認まで含めて安全に完了し、次が別テーマになる\n- 開発 → X運用、Production → UI、法務 → 実装など、担当分野・作業テーマが大きく変わる\n- 会話履歴が長く複雑になり、過去状態・古いSHA・別工程との混線リスクが上がっている\n- 日や作業セッションの区切りで、次回が独立した新しい主要工程になる\n\n次の場合は、原則として切替を提案しない。\n\n- CI、Workflow、deploy、retry、rollback、cleanup等がまだ実行中または未確認\n- 直後の次工程が同じ障害・同じPR・同じProduction操作の継続で、現チャットの局所文脈を保持した方が安全\n- 単に1回の短い操作が終わっただけで、作業テーマ自体は続いている\n\n**「最近長くなった気がする」だけで毎回切替を勧めるのではなく、引き継ぎによる整理効果が継続による文脈保持の利点を上回るかで判断する。** ただし、切替が有利と判断した場合はユーザーに聞かれるまで黙らず、こちらから提案する。\n\n### 1.2 切替を提案する場合\n\n以下のいずれかに当てはまる場合、このPreflightを最後まで通す。\n\n- 新しいチャットへの切替を推奨する\n- 「この区切りでチャットを変えた方がよい」と判断する\n- 主要工程完了後のチャット継続判定で「切替」が有利と判断する\n- ユーザーに次チャットで続きを行うよう案内する\n\n## 2. 送信ゲート`
          );

          replaceExact(
            'docs/CHAT-HANDOFF-PREFLIGHT.md',
            `- 「必要なら引き継ぎ文を作ります」と後回しにする\n- ユーザーから「指示文は？」と聞かれるまで待つ`,
            `- 「必要なら引き継ぎ文を作ります」と後回しにする\n- ユーザーから「チャット変える？」と聞かれるまで継続／切替判定そのものを行わない\n- ユーザーから「指示文は？」と聞かれるまで待つ`
          );

          replaceExact(
            'docs/WORK-EXECUTION-PREFLIGHT.md',
            `ただし、ユーザー本人しか行えない認証・Secret入力・本番承認が未完了の場合は、その地点を合理的な停止理由として明示する。\n\n## 10. 送信前セルフチェック`,
            `ただし、ユーザー本人しか行えない認証・Secret入力・本番承認が未完了の場合は、その地点を合理的な停止理由として明示する。\n\n主要工程が安全に完了してユーザーへ結果を返す区切りでは、**送信前に \`docs/CHAT-HANDOFF-PREFLIGHT.md\` の継続／切替判定を必ず行う。** PRのmainマージ完了、workstream完了、次テーマへの大きな切替、長い会話による状態混線リスク上昇は切替検討シグナルとする。切替が有利ならユーザーから「チャット変える？」と聞かれるのを待たず、同じ応答内で切替理由とコピペ可能な引き継ぎ指示文を提示する。CI・retry・rollback・cleanup等が未完了の途中では、原則として切替を提案しない。\n\n## 10. 送信前セルフチェック`
          );

          replaceExact(
            'docs/WORK-EXECUTION-PREFLIGHT.md',
            `- [ ] 準備工程を最終成果と誤認していない\n`,
            `- [ ] 準備工程を最終成果と誤認していない\n- [ ] 主要工程が安全に完了した区切りでは、CHAT-HANDOFF-PREFLIGHTによる継続／切替判定を行った\n- [ ] 切替が有利なのに、ユーザーから「チャット変える？」と聞かれるまで提案を先送りしていない\n`
          );

          fs.writeFileSync(
            'tests/chat-handoff-preflight.test.mjs',
            `import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst handoff = await readFile('docs/CHAT-HANDOFF-PREFLIGHT.md', 'utf8');\nconst preflight = await readFile('docs/WORK-EXECUTION-PREFLIGHT.md', 'utf8');\n\ntest('major safe boundaries require a proactive continue-or-switch decision', () => {\n  assert.match(handoff, /主要工程が安全に完了した区切り/);\n  assert.match(handoff, /現在のチャットを継続するか、新しいチャットへ切り替えるかを必ず一度判定/);\n  assert.match(handoff, /PRがmainへマージ/);\n  assert.match(handoff, /混線リスク/);\n  assert.match(preflight, /CHAT-HANDOFF-PREFLIGHT\.md/);\n  assert.match(preflight, /継続／切替判定を必ず行う/);\n});\n\ntest('chat switching is proactive but not suggested during unresolved work', () => {\n  assert.match(handoff, /「チャット変える？」と聞かれるまで継続／切替判定そのものを行わない/);\n  assert.match(handoff, /CI、Workflow、deploy、retry、rollback、cleanup/);\n  assert.match(handoff, /切替が有利と判断した場合はユーザーに聞かれるまで黙らず/);\n  assert.match(preflight, /CI・retry・rollback・cleanup等が未完了の途中では、原則として切替を提案しない/);\n});\n`,
            'utf8'
          );
          NODE

      - name: Run focused regression test
        run: node --test tests/chat-handoff-preflight.test.mjs

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHAT-HANDOFF-PREFLIGHT.md docs/WORK-EXECUTION-PREFLIGHT.md tests/chat-handoff-preflight.test.mjs
          git commit -m 'Apply proactive chat switch gate'
          git push origin HEAD:docs/proactive-chat-switch-gate

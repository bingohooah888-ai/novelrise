name: Format SCOUT campaign once

on:
  push:
    branches:
      - feat/scout-lv10-campaign-page

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scout-lv10-campaign-page
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format campaign files and remove one-shot workflow
        run: |
          npx prettier --write api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs
          git rm .github/workflows/format-scout-campaign-temp.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs
          git commit -m "chore: format SCOUT campaign files"
          git push origin HEAD:feat/scout-lv10-campaign-page

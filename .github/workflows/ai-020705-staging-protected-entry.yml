name: NOVELIGHT AI 02-07-05 Protected Staging Entry (admission only)

# This code-only bridge never creates a Preview, mutates DB, reads Secrets,
# invokes real JWT or paid AI. GitHub issue_comment workflows only run from
# trusted default main. The independently signed Gate A controller and the
# OWNER ledger's run-bound approval MUST be connected before live execution.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: novelight-ai-020705-protected-staging-entry-294
  cancel-in-progress: false

jobs:
  admit:
    name: Read-only OWNER intent and exact SHA admission
    if: >-
      github.event.issue.number == 294 &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null &&
      github.event.issue.title == '[Staging Control] Supabase migration sync' &&
      github.event.issue.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == 'bingohooah888-ai' &&
      github.triggering_actor == 'bingohooah888-ai' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_STAGING_AI_020705_INTEGRATION_INTENT ')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact OWNER intent and latest PR refs without secrets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD)" = "$current_main"
          jq -e '
            .repository.full_name == "bingohooah888-ai/novelrise" and
            .issue.number == 294 and
            .comment.user.login == "bingohooah888-ai" and
            .comment.author_association == "OWNER" and
            (.comment.body | startswith("NOVELIGHT_STAGING_AI_020705_INTEGRATION_INTENT "))
          ' "$GITHUB_EVENT_PATH" >/dev/null
          body="$(jq -er '.comment.body' "$GITHUB_EVENT_PATH")"
          payload="${body#'NOVELIGHT_STAGING_AI_020705_INTEGRATION_INTENT '}"
          printf '%s' "$payload" | jq -e --arg main "$current_main" '
            type == "object" and
            ((keys | sort) == (["mainSha","candidateSha","stagingProjectRef","pr","scope"] | sort)) and
            .scope == "read-only-protected-entry-no-live-execution" and
            .stagingProjectRef == "wmlzjgvxgoyrovdhbqbg" and
            .pr == 2895 and
            .mainSha == $main and
            (.candidateSha | type == "string" and test("^[a-f0-9]{40}$"))
          ' >/dev/null
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/2895")"
          candidate="$(printf '%s' "$payload" | jq -er .candidateSha)"
          printf '%s' "$pr" | jq -e --arg main "$current_main" --arg head "$candidate" '
            .number == 2895 and .state == "open" and .draft == true and
            .merged == false and .base.sha == $main and .head.sha == $head
          ' >/dev/null
          echo 'AI_020705_PROTECTED_ADMISSION_READONLY_PASS: no Staging mutation or paid authorization'

  staging-review:
    name: Protected Staging readiness (no secrets, no live actions)
    needs: admit
    if: needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: staging
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted main without PR code execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Configure locked Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Validate later OWNER paid approval against assigned run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This is READ ONLY. The run ID did not exist when the triggering
          # intent comment was created; OWNER approves this ID separately
          # while the protected environment job awaits human review.
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'issue_comment'
          test "$GITHUB_REF" = 'refs/heads/main'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { inspect020705PostRunOwnerApproval } from './.github/staging-ai-02-07-05/owner-paid-trial-ledger.mjs';

          const REPO = 'bingohooah888-ai/novelrise';
          const PREFIX = 'NOVELIGHT_STAGING_AI_020705_PAID_APPROVE ';
          const INTENT = 'NOVELIGHT_STAGING_AI_020705_INTEGRATION_INTENT ';
          function deny() {
            throw new Error('AI_020705_RUN_BOUND_APPROVAL_NO_GO');
          }
          async function github(path) {
            const res = await fetch('https://api.github.com/repos/' + REPO + path, {
              headers: {
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              },
              redirect: 'error',
              signal: AbortSignal.timeout(10000)
            });
            if (res.status !== 200) deny();
            return res.json();
          }
          try {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const runId = Number(process.env.GITHUB_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0 ||
                event?.repository?.full_name !== REPO ||
                event?.issue?.number !== 294 ||
                event?.comment?.user?.login !== 'bingohooah888-ai' ||
                event?.comment?.author_association !== 'OWNER' ||
                !event?.comment?.body?.startsWith(INTENT)) deny();

            let intent;
            try { intent = JSON.parse(event.comment.body.slice(INTENT.length)); }
            catch { deny(); }
            const [main, pr] = await Promise.all([
              github('/git/ref/heads/main'),
              github('/pulls/2895')
            ]);
            const mainSha = main?.object?.sha;
            const candidateSha = pr?.head?.sha;
            if (mainSha !== process.env.GITHUB_SHA ||
                pr?.number !== 2895 || pr?.draft !== true ||
                pr?.state !== 'open' || pr?.merged !== false ||
                pr?.base?.sha !== mainSha ||
                candidateSha !== intent.candidateSha ||
                mainSha !== intent.mainSha) deny();

            const comments = [];
            for (let page = 1; page <= 20; page += 1) {
              const batch = await github(
                '/issues/294/comments?per_page=100&page=' + page
              );
              if (!Array.isArray(batch) || batch.length > 100) deny();
              comments.push(...batch);
              if (batch.length < 100) break;
              if (page === 20) deny();
            }

            // Derive a proposed branch only from one run-bound OWNER
            // comment; independently verify that branch's pinned HEAD.
            const matching = comments.filter((comment) => {
              if (!comment?.body?.startsWith(PREFIX)) return false;
              try {
                return JSON.parse(comment.body.slice(PREFIX.length)).runId === runId;
              } catch { return false; }
            });
            if (matching.length !== 1) deny();
            const paid = JSON.parse(matching[0].body.slice(PREFIX.length));
            const branch = paid.stagingBranch;
            if (typeof branch !== 'string' ||
                !/^staging\/ai-02-07-05-[a-z0-9-]+$/u.test(branch)) deny();
            const branchRef = await github(
              '/git/ref/heads/' + encodeURIComponent(branch)
            );
            if (branchRef?.object?.sha !== candidateSha) deny();

            const proof = inspect020705PostRunOwnerApproval({
              comments,
              intentCommentId: event.comment.id,
              runId,
              mainSha,
              candidateSha,
              stagingBranch: branch,
              now: Date.now()
            });
            if (proof.state !== 'RUN_BOUND_OWNER_APPROVAL_READ_ONLY' ||
                proof.authorizesPaidCall !== false ||
                proof.authorizesStagingWrite !== false ||
                proof.authorizesPreviewCreation !== false) deny();
            console.log('AI_020705_RUN_BOUND_OWNER_APPROVAL_READONLY_VERIFIED');
          } catch {
            console.error('AI_020705_RUN_BOUND_APPROVAL_NO_GO');
            process.exitCode = 1;
          }
          NODE
      - name: Refuse live execution until independent Gate A and run-bound paid approval
        shell: bash
        run: |
          set -euo pipefail
          echo 'AI_020705_LIVE_NO_GO: external independent watchdog and run-bound paid OWNER ledger not connected.'
          echo 'Existing protected paid composition remains default OFF. No secrets, Preview, JWT, DB write or model call.'

name: Mobile image optimization artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-image-optimization-artifact.yml"
      - "scripts/optimize-mobile-images.py"
      - "assets/**"

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Generate optimized WebP assets
        run: python scripts/optimize-mobile-images.py | tee mobile-image-report.json

      - name: Upload optimized assets
        uses: actions/upload-artifact@v4
        with:
          name: mobile-image-optimized-assets
          path: |
            optimized-assets/**
            mobile-image-report.json
          if-no-files-found: error
          retention-days: 1

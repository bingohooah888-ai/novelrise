name: Community Phase 1 Candidate Preview (OWNER only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  admit:
    if: >-
      github.event.issue.number == 188 &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null &&
      github.event.issue.title == '[Staging Approval Control] Preview / Staging cost gate' &&
      github.event.issue.user.login == 'bingohooah888-ai' &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_STAGING_COMMUNITY_PREVIEW_APPROVE ')
    concurrency:
      group: community-candidate-preview-approval
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      main_sha: ${{ steps.bind.outputs.main_sha }}
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
      request_id: ${{ steps.bind.outputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Validate OWNER and current immutable PR with unused ledger
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > /tmp/preview-main.json
          gh api "repos/$GITHUB_REPOSITORY/issues/188" > /tmp/preview-issue.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/2222" > /tmp/preview-pr.json
          main="$(jq -er '.object.sha' /tmp/preview-main.json)"
          head="$(jq -er '.head.sha' /tmp/preview-pr.json)"
          test "$(git rev-parse HEAD)" = "$main"
          gh api "repos/$GITHUB_REPOSITORY/compare/$main...$head" > /tmp/preview-compare.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/188/comments?per_page=100" > /tmp/preview-ledger.json
          node scripts/community-preview-admission.mjs "$GITHUB_EVENT_PATH" /tmp/preview-issue.json /tmp/preview-main.json /tmp/preview-pr.json /tmp/preview-compare.json /tmp/preview-ledger.json > /tmp/preview-decision.json
          {
            echo "main_sha=$(jq -er '.mainSha' /tmp/preview-decision.json)"
            echo "candidate_sha=$(jq -er '.candidateSha' /tmp/preview-decision.json)"
            echo "request_id=$(jq -er '.requestCommentId' /tmp/preview-decision.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Claim one-time approval before costs
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.bind.outputs.main_sha }}
          HEAD: ${{ steps.bind.outputs.candidate_sha }}
          REQUEST: ${{ steps.bind.outputs.request_id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/188" --jq '.state')" = open
          data="$(jq -cn --arg requestCommentId "$REQUEST" --arg mainSha "$MAIN" --arg candidateSha "$HEAD" --arg runId "$GITHUB_RUN_ID" '{requestCommentId:$requestCommentId,mainSha:$mainSha,candidateSha:$candidateSha,runId:$runId}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/188/comments" -f body="NOVELIGHT_STAGING_COMMUNITY_PREVIEW_CLAIMED $data" > /dev/null
  preview:
    if: needs.admit.result == 'success'
    needs: admit
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_MAIN_SHA: ${{ needs.admit.outputs.main_sha }}
      EXPECTED_REVISION: ${{ needs.admit.outputs.candidate_sha }}
      STAGING_PREVIEW_REF: feat/community-plaza-phase1-20261014
      STAGING_TRIGGER: approval_comment
      STAGING_E2E_READY: ${{ vars.STAGING_E2E_READY }}
      STAGING_EXPECTED_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_EXPECTED_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_SECRET_READONLY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_NAME: novelrise
      GITHUB_REPOSITORY_ID: '1335499017'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.main_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Reject unreviewed candidate changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_MAIN_SHA"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/2222")"
          test "$(jq -r '.head.sha' <<< "$pr")" = "$EXPECTED_REVISION"
          test "$(jq -r '.head.ref' <<< "$pr")" = "$STAGING_PREVIEW_REF"
          test "$(jq -r '.state' <<< "$pr")" = open
          test "$(jq -r '.draft' <<< "$pr")" = true
          gh api "repos/$GITHUB_REPOSITORY/compare/$APPROVED_MAIN_SHA...$EXPECTED_REVISION" \
            > /tmp/preview-reviewed-compare.json
          node scripts/community-phase1-reviewed-candidate.mjs verify-compare \
            "$APPROVED_MAIN_SHA" "$EXPECTED_REVISION" /tmp/preview-reviewed-compare.json
      - name: Prove dedicated Staging is gated OFF before Preview exists
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_E2E_READY" = 'true'
          test "$STAGING_EXPECTED_SUPABASE_URL" = 'https://wmlzjgvxgoyrovdhbqbg.supabase.co'
          test -n "$STAGING_EXPECTED_PUBLISHABLE_KEY"
          test -n "$STAGING_SECRET_READONLY"
          test -n "$VERCEL_API_TOKEN"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          node --input-type=module <<'NODE'
          const resp=await fetch(process.env.STAGING_EXPECTED_SUPABASE_URL+'/rest/v1/rpc/novelight_community_feed',{
            method:'POST',
            headers:{apikey:process.env.STAGING_EXPECTED_PUBLISHABLE_KEY,'Content-Type':'application/json'},
            body:'{"p_limit":1}',signal:AbortSignal.timeout(15000)
          });
          if (!resp.ok || JSON.stringify(await resp.json()) !== '[]')
            throw new Error('Community schema not verified. Preview creation denied.');
          const key=process.env.STAGING_SECRET_READONLY;
          const ctl=await fetch(
            process.env.STAGING_EXPECTED_SUPABASE_URL+
            '/rest/v1/community_runtime_control?select=public_enabled&singleton=eq.true',
            {headers:{apikey:key,Authorization:'Bearer '+key},
              signal:AbortSignal.timeout(15000)}
          );
          const rows=ctl.ok?await ctl.json():null;
          if(!Array.isArray(rows) || rows.length!==1 ||
             rows[0]?.public_enabled!==false) {
            throw new Error('Community DB public_enabled=false is not proven. Preview denied.');
          }
          NODE
      - name: Recheck exact refs and open OWNER gate before cost-bearing creation
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/188" --jq '.state')" = open
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$APPROVED_MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2222" --jq '.head.sha')" = "$EXPECTED_REVISION"
      - name: Create exactly one non-Production Preview at candidate SHA
        run: node scripts/vercel-preview-deployment.mjs
      - name: Verify Preview environment facts before browser access
        env:
          STAGING_REQUIRE_WRITE_CONFIG: 'true'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-staging-deployment.mjs
  consume:
    if: always() && needs.admit.result == 'success'
    needs: [admit, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Consume approval, including failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.admit.outputs.main_sha }}
          HEAD: ${{ needs.admit.outputs.candidate_sha }}
          REQUEST: ${{ needs.admit.outputs.request_id }}
          OUTCOME: ${{ needs.preview.result }}
        run: |
          set -euo pipefail
          data="$(jq -cn --arg requestCommentId "$REQUEST" --arg mainSha "$MAIN" --arg candidateSha "$HEAD" --arg runId "$GITHUB_RUN_ID" --arg result "$OUTCOME" '{requestCommentId:$requestCommentId,mainSha:$mainSha,candidateSha:$candidateSha,runId:$runId,result:$result}')"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/188/comments" -f body="NOVELIGHT_STAGING_COMMUNITY_PREVIEW_CONSUMED $data" >/dev/null

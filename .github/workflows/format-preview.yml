name: Temporary Format Preview

on:
  push:
    branches:
      - fix/live-checkout-smoke-response

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/production-auth/authenticated-smoke.spec.js
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/e2e/production-auth/authenticated-smoke.spec.js; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/production-auth/authenticated-smoke.spec.js
          git commit -m 'Apply Prettier to live checkout smoke'
          git push origin HEAD:fix/live-checkout-smoke-response

name: Temporary Format Preview

on:
  push:
    branches:
      - fix/live-checkout-smoke-response

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/production-auth/authenticated-smoke.spec.js
      - run: git diff -- tests/e2e/production-auth/authenticated-smoke.spec.js

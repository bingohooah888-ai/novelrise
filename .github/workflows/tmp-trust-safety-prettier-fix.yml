name: Temporary Trust Safety Prettier Fix

on:
  push:
    branches:
      - feat/trust-safety-v1-20261004

permissions:
  contents: write

jobs:
  format-and-cleanup:
    if: github.repository == 'bingohooah888-ai/novelrise'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/trust-safety-v1-20261004
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository Prettier config
        run: |
          npx prettier --write \
            api/_lib/admin-trust-safety.js \
            api/admin-trust-safety.js \
            tests/admin-trust-safety-api.test.mjs \
            tests/admin-trust-safety-page.test.mjs \
            tests/trust-safety-migration-contract.test.mjs

      - name: Remove temporary diagnostics
        run: |
          rm -f tests/_trust-safety-prettier-config-dump.test.mjs
          rm -f .github/workflows/tmp-trust-safety-prettier-fix.yml

      - name: Verify formatting and commit
        run: |
          npx prettier --check \
            api/_lib/admin-trust-safety.js \
            api/admin-trust-safety.js \
            tests/admin-trust-safety-api.test.mjs \
            tests/admin-trust-safety-page.test.mjs \
            tests/trust-safety-migration-contract.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api/_lib/admin-trust-safety.js \
            api/admin-trust-safety.js \
            tests/admin-trust-safety-api.test.mjs \
            tests/admin-trust-safety-page.test.mjs \
            tests/trust-safety-migration-contract.test.mjs \
            tests/_trust-safety-prettier-config-dump.test.mjs \
            .github/workflows/tmp-trust-safety-prettier-fix.yml
          git commit -m 'style: apply repository Prettier config to Trust & Safety files'
          git push origin HEAD:feat/trust-safety-v1-20261004

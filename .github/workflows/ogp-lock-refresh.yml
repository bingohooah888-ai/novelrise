name: OGP lock refresh

on:
  push:
    branches:
      - codex/x-share-ogp-final-20261006
    paths:
      - .github/workflows/ogp-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/x-share-ogp-final-20261006
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate OGP lock entry
        run: |
          node -e "const x=require('./package-lock.json'); if(x.packages?.['']?.dependencies?.['@vercel/og']!=='1.0.3'||x.packages?.['node_modules/@vercel/og']?.version!=='1.0.3') process.exit(1); console.log('OGP lock verified')"
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore: refresh OGP dependency lockfile'
          git push origin HEAD:codex/x-share-ogp-final-20261006

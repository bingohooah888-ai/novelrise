name: Prettier Production Dispatch Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/production-approved-dispatch.test.mjs
          git diff -- tests/production-approved-dispatch.test.mjs
          test -z "$(git status --porcelain -- tests/production-approved-dispatch.test.mjs)"

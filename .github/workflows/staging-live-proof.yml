name: Staging Live Proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-preview-target:
    if: github.event.pull_request.number == 149 || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Preview browser config is isolated Staging
        env:
          PREVIEW_URL: https://novelrise-git-fix-staging-client-bootstrap-ranobe1.vercel.app
          PRODUCTION_SUPABASE_HOST: fiepaguycecrredwrcwx.supabase.co
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured in GitHub Actions secrets."
            exit 2
          fi
          tmp_body="$(mktemp)"
          tmp_headers="$(mktemp)"
          status="$(curl --location --silent --show-error --max-time 20 --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" --dump-header "$tmp_headers" --output "$tmp_body" --write-out '%{http_code}' "$PREVIEW_URL/api/staging-browser-config")"
          echo "Final HTTP status: $status"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/,""); value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); print value}' "$tmp_headers")"
          echo "Final Content-Type: ${content_type:-unknown}"
          if [ "$status" != "200" ]; then
            echo "Preview endpoint did not return HTTP 200"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const productionHost = process.env.PRODUCTION_SUPABASE_HOST;
            const url = new URL(body.supabaseUrl);
            if (url.hostname === productionHost) throw new Error("Preview returned Production Supabase host");
            if (!/^sb_publishable_/.test(body.supabasePublishableKey || "")) throw new Error("Preview did not return browser-safe publishable key");
            if (/secret/i.test(body.supabasePublishableKey || "")) throw new Error("Preview exposed secret-class key");
            console.log(`Verified isolated Preview Supabase host: ${url.hostname}`);
          ' "$tmp_body"

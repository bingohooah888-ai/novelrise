name: Staging Live Proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prove-preview-target:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 188 &&
      github.event.comment.user.login == 'bingohooah888-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'NOVELIGHT_STAGING_APPROVE {"scope":"live-proof",')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact approved Preview target
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_APPROVAL_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          prefix='NOVELIGHT_STAGING_APPROVE '
          case "$STAGING_APPROVAL_BODY" in
            "$prefix"*) payload="${STAGING_APPROVAL_BODY#"$prefix"}" ;;
            *)
              echo 'CONFIG_DRIFT: invalid Staging approval prefix.'
              exit 1
              ;;
          esac

          echo "$payload" | jq -e 'keys == ["confirmation","mainSha","previewUrl","scope"]' >/dev/null
          scope="$(echo "$payload" | jq -er '.scope')"
          expected_revision="$(echo "$payload" | jq -er '.mainSha')"
          preview_url="$(echo "$payload" | jq -er '.previewUrl' | sed 's#/$##')"
          confirmation="$(echo "$payload" | jq -er '.confirmation')"

          test "$scope" = 'live-proof' || {
            echo "CONFIG_DRIFT: unexpected Staging approval scope: $scope"
            exit 1
          }
          test "$confirmation" = 'STAGING APPROVED' || {
            echo 'CONFIG_DRIFT: Staging approval confirmation mismatch.'
            exit 1
          }
          if [[ ! "$preview_url" =~ ^https://[^/]+$ ]]; then
            echo 'Preview URL must be an exact HTTPS origin.'
            exit 1
          fi
          if [[ ! "$expected_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Preview revision must be an exact 40-character commit SHA.'
            exit 1
          fi

          current_main="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          test "$current_main" = "$expected_revision" || {
            echo "CONFIG_DRIFT: approval targets $expected_revision but current main is $current_main."
            exit 1
          }

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "revision=$expected_revision" >> "$GITHUB_OUTPUT"
          echo "Resolved approved Preview URL: $preview_url"
          echo "Resolved approved Preview revision: $expected_revision"

      - name: Verify exact deployed Preview revision
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_REVISION: ${{ steps.preview.outputs.revision }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 2
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          ready=false
          for attempt in $(seq 1 20); do
            status="$(curl \
              --location \
              --silent \
              --show-error \
              --max-time 20 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$PREVIEW_URL/api/deployment-revision" || true)"

            if [ "$status" = "200" ]; then
              ready=true
              break
            fi

            echo "Preview revision not ready yet (HTTP $status, attempt $attempt/20)."
            sleep 15
          done

          if [ "$ready" != true ]; then
            echo "Preview revision did not become ready within 5 minutes."
            exit 1
          fi

          deployed_revision="$(jq -er '.commitSha' "$body_file")"
          if [ "$deployed_revision" != "$EXPECTED_REVISION" ]; then
            echo "Preview revision mismatch: expected $EXPECTED_REVISION, got $deployed_revision."
            exit 1
          fi

          echo "Verified exact Preview revision: $deployed_revision"

      - name: Verify deployed Preview browser config is isolated Staging
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PRODUCTION_SUPABASE_HOST: fiepaguycecrredwrcwx.supabase.co
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 2
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          ready=false
          for attempt in $(seq 1 20); do
            status="$(curl \
              --location \
              --silent \
              --show-error \
              --max-time 20 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$PREVIEW_URL/api/staging-browser-config" || true)"

            if [ "$status" = "200" ]; then
              ready=true
              break
            fi

            echo "Preview config not ready yet (HTTP $status, attempt $attempt/20)."
            sleep 15
          done

          if [ "$ready" != true ]; then
            echo "Preview config did not become ready within 5 minutes."
            exit 1
          fi

          supabase_url="$(jq -er '.supabaseUrl' "$body_file")"
          publishable_key="$(jq -er '.supabasePublishableKey' "$body_file")"
          supabase_host="$(printf '%s' "$supabase_url" | sed -E 's#^https://([^/]+).*$#\1#')"

          if [ "$supabase_host" = "$PRODUCTION_SUPABASE_HOST" ]; then
            echo "Preview returned Production Supabase host."
            exit 1
          fi

          if [[ "$supabase_host" != *.supabase.co ]]; then
            echo "Preview returned a non-Supabase host."
            exit 1
          fi

          if [[ "$publishable_key" != sb_publishable_* ]]; then
            echo "Preview did not return a browser-safe publishable key."
            exit 1
          fi

          if [[ "$publishable_key" == *secret* ]]; then
            echo "Preview exposed a secret-class key."
            exit 1
          fi

          echo "Verified isolated Preview Supabase host: $supabase_host"

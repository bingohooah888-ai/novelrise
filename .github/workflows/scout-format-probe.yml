name: SCOUT format probe

on:
  push:
    branches:
      - feat/scout-lv10-campaign-page

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs
          git diff -- api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs

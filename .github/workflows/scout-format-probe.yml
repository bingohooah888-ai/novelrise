name: SCOUT format probe

on:
  push:
    branches:
      - feat/scout-lv10-campaign-page

permissions:
  contents: write

jobs:
  prettier-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/scout-lv10-campaign-page
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact Prettier output
        run: |
          npx prettier --write api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs
          if git diff --quiet -- api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/scout-lv10-campaign.js tests/scout-lv10-campaign-contract.test.mjs
          git commit -m "style: apply Prettier to SCOUT campaign files"
          git push origin HEAD:feat/scout-lv10-campaign-page

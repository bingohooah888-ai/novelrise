name: TEMP PR1715 CodeQL alert diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: read

jobs:
  alert-details:
    if: github.event.pull_request.number == 1715
    runs-on: ubuntu-latest
    steps:
      - name: Print open CodeQL alerts for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&pr=1715&per_page=100" \
            --jq '.[] | {number, state, rule: {id: .rule.id, name: .rule.name, security_severity_level: .rule.security_severity_level}, most_recent_instance: {ref: .most_recent_instance.ref, state: .most_recent_instance.state, message: .most_recent_instance.message.text, location: .most_recent_instance.location}}'

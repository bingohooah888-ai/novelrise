name: Temporary format Chapter 38 history

on:
  push:
    branches:
      - fix/ch38-beta-light-seed-history

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ch38-beta-light-seed-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format exact test files and remove temporary workflow
        run: |
          npx prettier --write tests/chapter38-beta-scout-record-visibility.test.mjs tests/mypage-author-home-ui.test.mjs
          rm .github/workflows/temp-format-ch38-history.yml
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Format Chapter 38 beta history tests'
          git push origin HEAD:fix/ch38-beta-light-seed-history

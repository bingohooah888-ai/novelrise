name: Temporary fix Production Auth Smoke lint

on:
  push:
    branches:
      - fix/production-auth-smoke-current-ui
    paths:
      - .github/workflows/temp-fix-production-auth-smoke-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-auth-smoke-current-ui
      - name: Fix lint-safe browser global and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/production-auth/authenticated-smoke.spec.js')
          text = path.read_text()
          old = "globalThis.scrollTo(0, document.body.scrollHeight)"
          new = "globalThis.scrollTo(0, globalThis.document.body.scrollHeight)"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/temp-fix-production-auth-smoke-lint.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/production-auth/authenticated-smoke.spec.js .github/workflows/temp-fix-production-auth-smoke-lint.yml
          git commit -m "Fix Production Auth Smoke lint"
          git push

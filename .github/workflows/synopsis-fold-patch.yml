name: Temporary synopsis fold patch

on:
  push:
    branches:
      - feat/synopsis-fold

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: feat/synopsis-fold
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi

      - name: FAST PATCH before gate
        shell: bash
        run: |
          npm run nlo:fast-patch -- \
            --stage=before \
            --workstream=synopsis-fold \
            --target=ranking.html \
            --target=search.html \
            --target=author.html \
            --target=favorites.html \
            --target=novelight-bookshelf.js \
            --target=curation.html \
            --target=my-novels.html \
            --target=novel.html \
            --target=novelight-synopsis-fold.js

      - name: Apply synopsis fold patch
        run: node scripts/apply-synopsis-fold.mjs

      - name: Remove temporary runner
        shell: bash
        run: |
          rm -f scripts/apply-synopsis-fold.mjs
          rm -f .github/workflows/synopsis-fold-patch.yml

      - name: Install dependencies
        run: npm ci

      - name: Focused checks
        shell: bash
        run: |
          node --check novelight-synopsis-fold.js
          npm run syntax:check
          npm run format:check
          git diff --check
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pages = ['ranking.html','search.html','author.html','favorites.html','curation.html','my-novels.html','novel.html'];
          for (const page of pages) {
            const text = readFileSync(page, 'utf8');
            if (!text.includes('<script src="novelight-synopsis-fold.js"></script>')) {
              throw new Error(page + ': synopsis runtime missing');
            }
          }
          const detail = readFileSync('novel.html', 'utf8');
          if (!detail.includes('data-novelight-synopsis-lines="6"')) throw new Error('novel.html: six-line detail clamp missing');
          const runtime = readFileSync('novelight-synopsis-fold.js', 'utf8');
          for (const label of ['あらすじをもっと見る ▼', '閉じる ▲']) {
            if (!runtime.includes(label)) throw new Error('runtime label missing: ' + label);
          }
          NODE

      - name: Commit final patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 1
          fi
          git commit -m 'Fold long novel synopses'

      - name: FAST PATCH after gate
        run: npm run nlo:fast-patch -- --stage=after --workstream=synopsis-fold

      - name: Push final branch
        run: git push origin HEAD:feat/synopsis-fold

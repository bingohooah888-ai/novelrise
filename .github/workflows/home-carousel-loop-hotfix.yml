name: Temporary Home Carousel Loop Hotfix

on:
  push:
    branches:
      - fix/home-carousel-loop-autoplay-20261003

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/home-carousel-loop-autoplay-20261003
          fetch-depth: 0

      - name: Apply loop autoplay carousel
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexPath = 'index.html';
          const index = fs.readFileSync(indexPath, 'utf8');
          const startMarker = '<section class="home-promo-carousel" aria-label="NOVELIGHT プロモーション">';
          const endMarker = '</section>\n\n<div class="home-hero-actions"';
          const start = index.indexOf(startMarker);
          const end = index.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Homepage carousel markers not found.');

          const section = `<section class="home-promo-carousel" aria-label="NOVELIGHT プロモーション">
            <div class="home-promo-track">
              <article class="home-promo-slide" aria-label="NOVELIGHT イベント告知">
                <img id="homeLeadVisual" class="home-promo-image" width="1600" height="900" alt="NOVELIGHT イベント告知" loading="eager" fetchpriority="high" decoding="async">
              </article>

              <article class="home-promo-slide" aria-label="NOVELIGHT メインビジュアル">
                <img class="home-promo-image" src="assets/home/01_hero_pc_2560x1280.png" width="2560" height="1280" alt="NOVELIGHT すべての物語に、光を。" loading="eager" fetchpriority="high" decoding="async">
              </article>

              <article class="home-promo-slide" aria-label="作者向け機能">
                <img class="home-promo-image" src="assets/home/03_author_features_1600x900.png" width="1600" height="900" alt="NOVELIGHT 作者向け機能" loading="lazy" decoding="async">
              </article>

              <article class="home-promo-slide" aria-label="読者向け機能">
                <img class="home-promo-image" src="assets/home/04_reader_promo_1600x900.png" width="1600" height="900" alt="NOVELIGHT 読者向け機能" loading="lazy" decoding="async">
              </article>
            </div>

            <button class="home-promo-nav home-promo-prev" type="button" data-carousel-prev aria-label="前の画像">
              <span aria-hidden="true">‹</span>
            </button>
            <button class="home-promo-nav home-promo-next" type="button" data-carousel-next aria-label="次の画像">
              <span aria-hidden="true">›</span>
            </button>
            <div class="home-promo-dots" aria-label="表示する画像を選択">
              <button class="home-promo-dot" type="button" data-carousel-dot aria-label="1枚目を表示" aria-current="true"></button>
              <button class="home-promo-dot" type="button" data-carousel-dot aria-label="2枚目を表示" aria-current="false"></button>
              <button class="home-promo-dot" type="button" data-carousel-dot aria-label="3枚目を表示" aria-current="false"></button>
              <button class="home-promo-dot" type="button" data-carousel-dot aria-label="4枚目を表示" aria-current="false"></button>
            </div>

            <script>
              (() => {
                const homeLeadVisuals = Object.freeze({
                  teaser: 'assets/home/05_event_teaser_1600x900.png',
                  official: 'assets/home/05_campaign_official_after_announcement_1600x900.png'
                });
                const currentLeadVisual = 'teaser';
                const lead = document.getElementById('homeLeadVisual');
                lead.src = homeLeadVisuals[currentLeadVisual];

                const carousel = lead.closest('.home-promo-carousel');
                const track = carousel.querySelector('.home-promo-track');
                const previousButton = carousel.querySelector('[data-carousel-prev]');
                const nextButton = carousel.querySelector('[data-carousel-next]');
                const dots = [...carousel.querySelectorAll('[data-carousel-dot]')];
                const originals = [...track.querySelectorAll('.home-promo-slide')];
                if (originals.length < 2) return;

                const firstClone = originals[0].cloneNode(true);
                const lastClone = originals.at(-1).cloneNode(true);
                for (const clone of [firstClone, lastClone]) {
                  clone.dataset.carouselClone = 'true';
                  clone.setAttribute('aria-hidden', 'true');
                  clone.querySelectorAll('[id]').forEach(element => element.removeAttribute('id'));
                }
                track.insertBefore(lastClone, originals[0]);
                track.append(firstClone);

                let physicalIndex = 1;
                let autoplayTimer = 0;
                let settleTimer = 0;
                let resizeTimer = 0;
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
                const width = () => track.clientWidth;
                const logicalIndex = index => {
                  if (index <= 0) return originals.length - 1;
                  if (index >= originals.length + 1) return 0;
                  return index - 1;
                };
                const updateDots = () => {
                  const active = logicalIndex(physicalIndex);
                  dots.forEach((dot, index) => {
                    dot.setAttribute('aria-current', index === active ? 'true' : 'false');
                    dot.tabIndex = index === active ? 0 : -1;
                  });
                };
                const goTo = (index, behavior = reducedMotion.matches ? 'auto' : 'smooth') => {
                  physicalIndex = index;
                  track.scrollTo({ left: width() * index, behavior });
                  updateDots();
                };
                const normalize = () => {
                  const slideWidth = width();
                  if (!slideWidth) return;
                  physicalIndex = Math.round(track.scrollLeft / slideWidth);
                  if (physicalIndex === 0) {
                    physicalIndex = originals.length;
                    track.scrollTo({ left: slideWidth * physicalIndex, behavior: 'auto' });
                  } else if (physicalIndex === originals.length + 1) {
                    physicalIndex = 1;
                    track.scrollTo({ left: slideWidth, behavior: 'auto' });
                  }
                  updateDots();
                };
                const stopAutoplay = () => {
                  if (autoplayTimer) window.clearInterval(autoplayTimer);
                  autoplayTimer = 0;
                };
                const startAutoplay = () => {
                  stopAutoplay();
                  if (reducedMotion.matches || document.hidden) return;
                  autoplayTimer = window.setInterval(() => goTo(physicalIndex + 1), 6000);
                };
                const restartAutoplay = () => {
                  stopAutoplay();
                  startAutoplay();
                };

                previousButton.addEventListener('click', () => {
                  goTo(physicalIndex - 1);
                  restartAutoplay();
                });
                nextButton.addEventListener('click', () => {
                  goTo(physicalIndex + 1);
                  restartAutoplay();
                });
                dots.forEach((dot, index) => {
                  dot.addEventListener('click', () => {
                    goTo(index + 1);
                    restartAutoplay();
                  });
                });

                track.addEventListener('pointerdown', stopAutoplay, { passive: true });
                track.addEventListener('pointerup', startAutoplay, { passive: true });
                track.addEventListener('pointercancel', startAutoplay, { passive: true });
                track.addEventListener('scroll', () => {
                  window.clearTimeout(settleTimer);
                  settleTimer = window.setTimeout(normalize, 140);
                }, { passive: true });
                if ('onscrollend' in window) track.addEventListener('scrollend', normalize);

                carousel.addEventListener('mouseenter', stopAutoplay);
                carousel.addEventListener('mouseleave', startAutoplay);
                carousel.addEventListener('focusin', stopAutoplay);
                carousel.addEventListener('focusout', startAutoplay);
                document.addEventListener('visibilitychange', () => {
                  if (document.hidden) stopAutoplay();
                  else startAutoplay();
                });
                reducedMotion.addEventListener?.('change', startAutoplay);
                window.addEventListener('resize', () => {
                  window.clearTimeout(resizeTimer);
                  resizeTimer = window.setTimeout(() => goTo(physicalIndex, 'auto'), 120);
                });

                window.requestAnimationFrame(() => {
                  goTo(1, 'auto');
                  startAutoplay();
                });
              })();
            </script>
          </section>`;

          fs.writeFileSync(indexPath, index.slice(0, start) + section + '\n\n<div class="home-hero-actions"' + index.slice(end + endMarker.length), 'utf8');

          fs.writeFileSync('novelight-home-promo.css', `/* Home promotional horizontal carousel.
          Source PNGs are rendered as-is: no crop, no forced aspect ratio, no recompression. */
          body.novelight-page-index.novelight-public-dark .home-promo-carousel {
            position: relative;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #02070d;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-track {
            display: flex;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x pan-y;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-track::-webkit-scrollbar {
            display: none;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-slide {
            flex: 0 0 100%;
            width: 100%;
            min-width: 100%;
            margin: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            line-height: 0;
            background: #02070d;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-image {
            display: block;
            width: 100%;
            height: auto;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-nav {
            position: absolute;
            z-index: 3;
            top: 50%;
            display: grid;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 999px;
            background: rgba(2, 7, 13, 0.58);
            color: #fff;
            font: inherit;
            font-size: 34px;
            line-height: 1;
            place-items: center;
            transform: translateY(-50%);
            cursor: pointer;
            backdrop-filter: blur(5px);
          }

          body.novelight-page-index.novelight-public-dark .home-promo-prev { left: 14px; }
          body.novelight-page-index.novelight-public-dark .home-promo-next { right: 14px; }

          body.novelight-page-index.novelight-public-dark .home-promo-nav:hover,
          body.novelight-page-index.novelight-public-dark .home-promo-nav:focus-visible {
            background: rgba(2, 7, 13, 0.82);
            border-color: rgba(214, 164, 71, 0.82);
            outline: none;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-dots {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 12px;
            display: flex;
            gap: 8px;
            transform: translateX(-50%);
          }

          body.novelight-page-index.novelight-public-dark .home-promo-dot {
            width: 9px;
            height: 9px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 999px;
            background: rgba(2, 7, 13, 0.54);
            cursor: pointer;
          }

          body.novelight-page-index.novelight-public-dark .home-promo-dot[aria-current="true"] {
            width: 24px;
            border-color: #d6a447;
            background: #d6a447;
          }

          body.novelight-page-index.novelight-public-dark .home-hero-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 14px 22px;
            border-top: 1px solid rgba(214, 164, 71, 0.16);
            border-bottom: 1px solid rgba(214, 164, 71, 0.16);
            background: #040b14;
          }

          body.novelight-page-index.novelight-public-dark .home-hero-actions .hero-primary,
          body.novelight-page-index.novelight-public-dark .home-hero-actions .hero-secondary {
            min-width: 148px;
          }

          @media (max-width: 767px) {
            body.novelight-page-index.novelight-public-dark .home-promo-nav {
              width: 38px;
              height: 38px;
              font-size: 30px;
            }
            body.novelight-page-index.novelight-public-dark .home-promo-prev { left: 8px; }
            body.novelight-page-index.novelight-public-dark .home-promo-next { right: 8px; }
            body.novelight-page-index.novelight-public-dark .home-promo-dots { bottom: 8px; }
            body.novelight-page-index.novelight-public-dark .home-hero-actions {
              gap: 9px;
              padding: 11px 14px;
            }
            body.novelight-page-index.novelight-public-dark .home-hero-actions .hero-primary,
            body.novelight-page-index.novelight-public-dark .home-hero-actions .hero-secondary {
              min-width: 0;
              flex: 1 1 0;
              padding-inline: 12px;
            }
          }
          `, 'utf8');

          fs.writeFileSync('tests/home-carousel-loop-autoplay.test.mjs', `import assert from 'node:assert/strict';
          import { readTextSync } from './test-text-utils.mjs';
          import path from 'node:path';
          import test from 'node:test';

          const repoRoot = path.resolve(import.meta.dirname, '..');
          const homeHtml = readTextSync(path.join(repoRoot, 'index.html'), 'utf8');
          const promoCss = readTextSync(path.join(repoRoot, 'novelight-home-promo.css'), 'utf8');

          test('Home promo loops manually and advances automatically', () => {
            assert.match(homeHtml, /data-carousel-prev/u);
            assert.match(homeHtml, /data-carousel-next/u);
            assert.match(homeHtml, /data-carousel-dot/u);
            assert.match(homeHtml, /const firstClone = originals\\[0\\]\\.cloneNode\\(true\\);/u);
            assert.match(homeHtml, /const lastClone = originals\\.at\\(-1\\)\\.cloneNode\\(true\\);/u);
            assert.match(homeHtml, /track\\.insertBefore\\(lastClone, originals\\[0\\]\\);/u);
            assert.match(homeHtml, /track\\.append\\(firstClone\\);/u);
            assert.match(homeHtml, /physicalIndex === originals\\.length \\+ 1/u);
            assert.match(homeHtml, /window\\.setInterval\\(\\(\\) => goTo\\(physicalIndex \\+ 1\\), 6000\\)/u);
            assert.match(homeHtml, /previousButton\\.addEventListener\\('click'/u);
            assert.match(homeHtml, /nextButton\\.addEventListener\\('click'/u);
            assert.match(homeHtml, /track\\.addEventListener\\('pointerdown', stopAutoplay/u);
            assert.match(homeHtml, /track\\.addEventListener\\('pointerup', startAutoplay/u);
            assert.match(homeHtml, /prefers-reduced-motion: reduce/u);
            assert.match(promoCss, /\\.home-promo-nav \\{/u);
            assert.match(promoCss, /\\.home-promo-dots \\{/u);
            assert.match(promoCss, /\\.home-promo-dot\\[aria-current="true"\\]/u);
          });
          `, 'utf8');
          NODE

      - name: Remove temporary workflow
        run: rm .github/workflows/home-carousel-loop-hotfix.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "NOVELIGHT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html novelight-home-promo.css tests/home-carousel-loop-autoplay.test.mjs .github/workflows/home-carousel-loop-hotfix.yml
          git commit -m "Add looping autoplay home carousel"
          git push origin HEAD:fix/home-carousel-loop-autoplay-20261003

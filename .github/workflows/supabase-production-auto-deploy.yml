name: NOVELIGHT Supabase Production Migration Plan

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: fiepaguycecrredwrcwx

jobs:
  plan:
    name: Plan production migrations safely
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect migration versions introduced by this push
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$PUSH_BEFORE" ] || [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            echo 'Production migration plan blocked: previous main revision cannot be proven.'
            exit 1
          fi

          git cat-file -e "${PUSH_BEFORE}^{commit}"
          git cat-file -e "${PUSH_AFTER}^{commit}"

          git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" -- 'supabase/migrations/*.sql' \
            | sed -nE 's#^supabase/migrations/([0-9]{14})_.*\.sql$#\1#p' \
            | sort -u \
            > /tmp/changed-migration-versions.txt

          if [ ! -s /tmp/changed-migration-versions.txt ]; then
            echo 'Production migration plan blocked: no migration version was detected.'
            exit 1
          fi

          changed_versions="$(paste -sd, /tmp/changed-migration-versions.txt)"
          echo "changed_versions=$changed_versions" >> "$GITHUB_OUTPUT"
          echo "Changed migration versions: $changed_versions"

      - name: Verify required production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured.'
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo 'PRODUCTION_DB_PASSWORD is not configured.'
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Require pending migrations to match this push exactly
        env:
          CHANGED_VERSIONS: ${{ steps.changes.outputs.changed_versions }}
        run: bash scripts/verify-supabase-pending.sh

      - name: Dry-run pending migrations
        run: supabase db push --linked --dry-run

      - name: Require Staging migration parity before approval handoff
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
        run: node scripts/verify-staging-migration-parity.mjs

      - name: Record chat-approval handoff
        env:
          CHANGED_VERSIONS: ${{ steps.changes.outputs.changed_versions }}
        shell: bash
        run: |
          {
            echo '### Production migration plan passed'
            echo
            echo "Current main: \`$GITHUB_SHA\`"
            echo "Pending migration versions: \`$CHANGED_VERSIONS\`"
            echo 'Staging migration parity: `PASS`'
            echo
            echo 'No Production database mutation was performed.'
            echo 'Actual deploy requires a fresh explicit chat approval or the protected manual fallback.'
          } >> "$GITHUB_STEP_SUMMARY"

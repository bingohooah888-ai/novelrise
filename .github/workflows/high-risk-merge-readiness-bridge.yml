name: NOVELIGHT High-Risk Merge Production Readiness Bridge

on:
  workflow_run:
    workflows: ['NOVELIGHT High-Risk PR Approval Relay']
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: novelight-high-risk-merge-readiness-bridge
  cancel-in-progress: false

jobs:
  dispatch-readiness:
    name: Dispatch Production Readiness after guarded high-risk merge
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted current main recovery logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Dispatch readiness unless current main is already covered
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          recovery_reason='successful high-risk approval relay'

          if [ "$RELAY_CONCLUSION" = 'failure' ]; then
            gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=50" \
              > /tmp/recent-closed-prs.json

            matching_pr_count="$(
              jq \
                --arg sha "$current_main" \
                '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length' \
                /tmp/recent-closed-prs.json
            )"
            if [ "$matching_pr_count" -ne 1 ]; then
              echo "Relay failed and current main $current_main is not uniquely attributable to a recently merged PR; no readiness recovery needed."
              exit 0
            fi

            pr_number="$(
              jq -r \
                --arg sha "$current_main" \
                '.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .number' \
                /tmp/recent-closed-prs.json
            )"
            head_sha="$(
              jq -r \
                --arg sha "$current_main" \
                '.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .head.sha' \
                /tmp/recent-closed-prs.json
            )"

            if [ "$head_sha" = 'null' ] || ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo 'Relay failed and the merged PR head SHA could not be verified; skipping readiness recovery.'
              exit 0
            fi

            gh api \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" \
              > /tmp/recovery-pr-files.json
            file_count="$(jq 'length' /tmp/recovery-pr-files.json)"
            if [ "$file_count" -ge 100 ]; then
              echo 'Relay failed and source PR file list exceeds the bounded recovery contract; skipping readiness recovery.'
              exit 0
            fi

            migration_count="$(
              jq '[.[] | select(.filename | test("^supabase/migrations/.*\\.sql$"))] | length' /tmp/recovery-pr-files.json
            )"
            production_scopes=''
            production_scopes_json='[]'
            if [ "$migration_count" -gt 0 ]; then
              invalid_migration_count="$(
                jq '[.[] | select(.filename | test("^supabase/migrations/.*\\.sql$")) | select(.status != "added" or (.filename | test("^supabase/migrations/[0-9]{14}_.+\\.sql$") | not))] | length' /tmp/recovery-pr-files.json
              )"
              if [ "$invalid_migration_count" -ne 0 ]; then
                echo 'Relay failed and migration changes are outside the inherited approval recovery contract; skipping readiness recovery.'
                exit 0
              fi
              production_scopes='supabase-migration-deploy'
              production_scopes_json='["supabase-migration-deploy"]'
            fi

            expected_challenge="$(node scripts/high-risk-approval-lib.mjs challenge "$pr_number" "$head_sha" "$production_scopes")"
            scoped_approval_json="$(
              jq -cn \
                --argjson pr "$pr_number" \
                --arg headSha "$head_sha" \
                --arg challenge "$expected_challenge" \
                --argjson productionScopes "$production_scopes_json" \
                '{operation:"merge-high-risk-pr",pr:$pr,headSha:$headSha,challenge:$challenge,productionScopes:$productionScopes}'
            )"
            expected_scoped_approval="NOVELIGHT_HIGH_RISK_APPROVE $scoped_approval_json"

            legacy_approval_json="$(
              jq -cn \
                --argjson pr "$pr_number" \
                --arg headSha "$head_sha" \
                --arg challenge "$expected_challenge" \
                '{operation:"merge-high-risk-pr",pr:$pr,headSha:$headSha,challenge:$challenge}'
            )"
            expected_legacy_approval="NOVELIGHT_HIGH_RISK_APPROVE $legacy_approval_json"

            gh api \
              "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments?per_page=100" \
              > /tmp/pr-comments.json
            comment_count="$(jq 'length' /tmp/pr-comments.json)"
            if [ "$comment_count" -ge 100 ]; then
              echo 'Relay failed and approval evidence exceeds the bounded comment window; skipping readiness recovery.'
              exit 0
            fi

            approval_count="$(
              jq \
                --arg scoped "$expected_scoped_approval" \
                --arg legacy "$expected_legacy_approval" \
                --arg scopes "$production_scopes" '
                [
                  .[]
                  | select(.user.login == "bingohooah888-ai" and .author_association == "OWNER")
                  | select(
                      .body == $scoped or
                      ($scopes == "" and .body == $legacy)
                    )
                ] | length
              ' /tmp/pr-comments.json
            )"
            if [ "$approval_count" -lt 1 ]; then
              echo "Relay failed and current main PR #$pr_number lacks exact owner approval for head $head_sha and Production scope; skipping readiness recovery."
              exit 0
            fi

            recovery_reason="verified merged high-risk PR #$pr_number after relay failure"
            echo "Recovered safe readiness handoff for PR #$pr_number at merged main $current_main."
          fi

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/production-readiness-smoke.yml/runs?head_sha=$current_main&per_page=20" \
            > /tmp/readiness-runs.json

          existing_count="$(
            jq \
              --arg sha "$current_main" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | length' \
              /tmp/readiness-runs.json
          )"

          if [ "$existing_count" -gt 0 ]; then
            echo "Production Readiness already exists for current main $current_main; skipping duplicate dispatch."
            exit 0
          fi

          echo "Dispatching Production Readiness for current main $current_main after $recovery_reason."
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/production-readiness-smoke.yml/dispatches" \
            -d '{"ref":"main"}'

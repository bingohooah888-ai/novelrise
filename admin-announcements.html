<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>お知らせ管理 | NOVELIGHT ADMIN</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#0f1020;color:#f4f4f8}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{border-bottom:1px solid #292b47;background:#121326}.header-inner{max-width:1120px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:21px;font-weight:950}.badge{margin-left:8px;color:#c7c1ff;font-size:11px}.actions{display:flex;gap:8px}.ghost,.primary,.danger{border-radius:9px;padding:10px 13px;font-weight:900}.ghost{border:1px solid #393c61;background:#17182c;color:#ddd}.primary{border:0;background:#6d4aff;color:#fff}.danger{border:1px solid #7c3039;background:#2a161a;color:#ffb8c0}main{max-width:1120px;margin:auto;padding:30px 20px 70px}.hero h1{margin:0;font-size:30px}.hero p{color:#999db9;line-height:1.6}.status{margin:16px 0;padding:12px 14px;border:1px solid #303253;border-radius:10px;background:#17182c;color:#b7bad0}.status.error{border-color:#7c3039;color:#ffb8c0}.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}.panel{border:1px solid #2d2f4d;background:#17182c;border-radius:14px;padding:18px}.panel h2{margin:0 0 14px;font-size:18px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900;color:#c5c7d7}.field input,.field textarea,.field select{width:100%;border:1px solid #393c61;border-radius:9px;background:#101121;color:#fff;padding:11px 12px}.field textarea{min-height:230px;resize:vertical}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.image-editor{display:grid;gap:9px;padding:12px;border:1px solid #303253;border-radius:10px;background:#121326}.image-preview{display:block;max-width:100%;max-height:300px;width:auto;height:auto;border-radius:9px}.image-preview[hidden]{display:none}.image-note{margin:0;color:#8f93b0;font-size:11px;line-height:1.6}.image-actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:9px}.item{width:100%;text-align:left;border:1px solid #303253;border-radius:11px;background:#121326;color:#fff;padding:13px}.item:hover{border-color:#5d50cc}.item-title{font-weight:900}.meta{margin-top:6px;color:#8f93b0;font-size:11px;line-height:1.55}.chip{display:inline-block;margin-right:6px;padding:3px 6px;border-radius:999px;background:#252744;color:#c9c5ff;font-size:10px;font-weight:900}.empty{padding:20px;text-align:center;color:#8589a8;border:1px dashed #343755;border-radius:10px}.gate{max-width:640px;margin:60px auto;padding:24px;border:1px solid #393c61;border-radius:14px;background:#17182c}@media(max-width:780px){.grid{grid-template-columns:1fr}.header-inner{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.field textarea{min-height:180px}}
  </style>
<link rel="stylesheet" href="novelight-accessibility.css"></head>
<body><a class="skip-link" href="#main-content">本文へスキップ</a>
<header><div class="header-inner"><div class="brand">NOVELIGHT <span class="badge">ADMIN</span></div><div class="actions"><a class="ghost" href="admin.html">ADMINトップ</a><a class="ghost" href="admin-inquiries.html">お問い合わせ管理</a><button id="logout" class="ghost" type="button">ログアウト</button></div></div></header>
<main id="main-content" tabindex="-1">
  <section id="gate" class="gate hidden"><h1 id="gateTitle">アクセスを確認しています</h1><p id="gateMessage">管理者権限を確認しています。</p></section>
  <div id="app" class="hidden">
    <section class="hero"><h1>お知らせ管理</h1><p>下書き・公開・アーカイブを管理します。公開サイトへ出るのはpublishedだけです。</p></section>
    <div id="status" class="status">読み込み中...</div>
    <div class="grid">
      <section class="panel">
        <h2 id="formHeading">新規お知らせ</h2>
        <form id="announcementForm" class="form">
          <input id="announcementId" type="hidden">
          <div class="field"><label for="title">タイトル</label><input id="title" maxlength="120" required></div>
          <div class="field"><label for="category">カテゴリ</label><input id="category" maxlength="40" value="運営" required></div>
          <div class="field"><label for="body">本文</label><textarea id="body" maxlength="10000" required></textarea></div>
          <div class="field">
            <label for="announcementImage">お知らせ画像（任意）</label>
            <div class="image-editor">
              <input id="announcementImage" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp">
              <img id="announcementImagePreview" class="image-preview" alt="選択中のお知らせ画像" hidden>
              <p id="announcementImageState" class="image-note">JPG / JPEG / PNG / WebP、5MBまで。1件につき1枚です。</p>
              <div class="image-actions"><button id="removeImageButton" class="ghost hidden" type="button">画像を削除</button></div>
            </div>
          </div>
          <div class="form-actions">
            <button class="primary" type="button" data-save-status="draft">下書き保存</button>
            <button class="primary" type="button" data-save-status="published">公開</button>
            <button id="archiveButton" class="danger hidden" type="button" data-save-status="archived">アーカイブ</button>
            <button id="newButton" class="ghost" type="button">新規作成へ戻す</button>
          </div>
        </form>
      </section>
      <section class="panel"><h2>一覧</h2><div id="announcementList" class="list"><div class="empty">読み込み中...</div></div></section>
    </div>
  </div>
</main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="novelight-client.js"></script>
<script>
  const client = supabase.createClient(
    'https://fiepaguycecrredwrcwx.supabase.co',
    'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE'
  );
  const IMAGE_BUCKET = 'announcement-images';
  const IMAGE_MAX_BYTES = 5 * 1024 * 1024;
  const IMAGE_TYPES = new Set(['image/jpeg', 'image/png', 'image/webp']);

  let rows = [];
  let currentImagePath = null;
  let pendingImageFile = null;
  let pendingObjectUrl = null;
  let removeCurrentImage = false;

  const statusEl = document.getElementById('status');
  const imageInput = document.getElementById('announcementImage');
  const imagePreview = document.getElementById('announcementImagePreview');
  const imageState = document.getElementById('announcementImageState');
  const removeImageButton = document.getElementById('removeImageButton');
  const dt = (value) => (value ? new Date(value).toLocaleString('ja-JP') : '—');

  function showGate(title, message) {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('gate').classList.remove('hidden');
    document.getElementById('gateTitle').textContent = title;
    document.getElementById('gateMessage').textContent = message;
  }

  function showApp() {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }

  async function session() {
    const {
      data: { session },
      error
    } = await client.auth.getSession();
    if (error) throw error;
    if (!session) {
      location.href = 'login.html?redirect=admin-announcements.html';
      return null;
    }
    return session;
  }

  async function adminFetch(url, options = {}) {
    const current = await session();
    if (!current) return null;
    const response = await fetch(url, {
      ...options,
      headers: {
        Authorization: `Bearer ${current.access_token}`,
        Accept: 'application/json',
        'Content-Type': 'application/json',
        ...(options.headers || {})
      },
      cache: 'no-store',
      credentials: 'same-origin'
    });
    if (response.status === 401) {
      location.href = 'login.html?redirect=admin-announcements.html';
      return null;
    }
    if (response.status === 403) {
      showGate(
        'アクセスできません',
        'このアカウントにはNOVELIGHT ADMINの管理者権限がありません。'
      );
      return null;
    }
    if (response.status === 503) {
      showGate(
        'お知らせ管理を利用できません',
        '必要なDB migrationまたはStorage設定が反映されるまで画像管理は利用できません。'
      );
      return null;
    }
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || `ADMIN API ${response.status}`);
    }
    return response.json();
  }

  function publicImageUrl(path) {
    if (!path) return '';
    return (
      client.storage.from(IMAGE_BUCKET).getPublicUrl(path)?.data?.publicUrl || ''
    );
  }

  function clearPendingObjectUrl() {
    if (pendingObjectUrl) URL.revokeObjectURL(pendingObjectUrl);
    pendingObjectUrl = null;
  }

  function renderImagePreview() {
    clearPendingObjectUrl();

    let url = '';
    let label = 'JPG / JPEG / PNG / WebP、5MBまで。1件につき1枚です。';
    if (pendingImageFile) {
      pendingObjectUrl = URL.createObjectURL(pendingImageFile);
      url = pendingObjectUrl;
      label = `差し替え予定: ${pendingImageFile.name}`;
    } else if (currentImagePath && !removeCurrentImage) {
      url = publicImageUrl(currentImagePath);
      label = '現在登録されている画像です。';
    } else if (removeCurrentImage) {
      label = '保存すると現在の画像を削除します。';
    }

    if (url) {
      imagePreview.src = encodeURI(url);
      imagePreview.hidden = false;
    } else {
      imagePreview.removeAttribute('src');
      imagePreview.hidden = true;
    }
    imageState.textContent = label;
    removeImageButton.classList.toggle(
      'hidden',
      !pendingImageFile && (!currentImagePath || removeCurrentImage)
    );
  }

  function resetForm() {
    document.getElementById('announcementId').value = '';
    document.getElementById('title').value = '';
    document.getElementById('category').value = '運営';
    document.getElementById('body').value = '';
    document.getElementById('formHeading').textContent = '新規お知らせ';
    document.getElementById('archiveButton').classList.add('hidden');
    imageInput.value = '';
    currentImagePath = null;
    pendingImageFile = null;
    removeCurrentImage = false;
    renderImagePreview();
  }

  function edit(row) {
    document.getElementById('announcementId').value = row.id;
    document.getElementById('title').value = row.title || '';
    document.getElementById('category').value = row.category || '';
    document.getElementById('body').value = row.body || '';
    document.getElementById('formHeading').textContent = `編集 #${row.id}`;
    document
      .getElementById('archiveButton')
      .classList.toggle('hidden', row.status === 'archived');
    imageInput.value = '';
    currentImagePath = row.image_path || null;
    pendingImageFile = null;
    removeCurrentImage = false;
    renderImagePreview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function render() {
    const list = document.getElementById('announcementList');
    list.replaceChildren();
    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'お知らせはまだありません。';
      list.appendChild(empty);
      return;
    }

    rows.forEach((row) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'item';
      const title = document.createElement('div');
      title.className = 'item-title';
      title.textContent = row.title;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = row.status;
      meta.append(
        chip,
        document.createTextNode(
          `${row.category} / 公開 ${dt(row.published_at)} / 更新 ${dt(row.updated_at)}`
        )
      );
      if (row.image_path) {
        const imageChip = document.createElement('span');
        imageChip.className = 'chip';
        imageChip.textContent = '画像あり';
        meta.appendChild(imageChip);
      }
      button.append(title, meta);
      button.addEventListener('click', () => edit(row));
      list.appendChild(button);
    });
  }

  async function load() {
    try {
      statusEl.className = 'status';
      statusEl.textContent = '読み込み中...';
      const data = await adminFetch('/api/admin-announcements');
      if (!data) return;
      rows = data.announcements || [];
      showApp();
      render();
      statusEl.textContent = `${rows.length}件のお知らせを読み込みました。`;
    } catch (error) {
      console.error(error);
      showApp();
      statusEl.className = 'status error';
      statusEl.textContent = 'お知らせを取得できませんでした。';
    }
  }

  async function deleteStoredImage(path) {
    if (!path) return true;
    try {
      const result = await adminFetch('/api/admin-announcement-images', {
        method: 'DELETE',
        body: JSON.stringify({ path })
      });
      return Boolean(result?.removed);
    } catch (error) {
      console.error('announcement image cleanup failed', error);
      return false;
    }
  }

  async function uploadImage(file) {
    const signed = await adminFetch('/api/admin-announcement-images', {
      method: 'POST',
      body: JSON.stringify({
        contentType: file.type,
        fileSize: file.size
      })
    });
    if (!signed?.upload) throw new Error('Image upload could not be prepared');

    const upload = signed.upload;
    const { error } = await client.storage
      .from(upload.bucket)
      .uploadToSignedUrl(upload.path, upload.token, file, {
        contentType: file.type,
        cacheControl: '3600'
      });

    if (error) {
      await deleteStoredImage(upload.path);
      throw error;
    }
    return upload.path;
  }

  async function save(nextStatus) {
    const id = document.getElementById('announcementId').value;
    const payload = {
      title: document.getElementById('title').value.trim(),
      category: document.getElementById('category').value.trim(),
      body: document.getElementById('body').value.trim(),
      status: nextStatus
    };
    if (!payload.title || !payload.category || !payload.body) {
      statusEl.className = 'status error';
      statusEl.textContent = 'タイトル・カテゴリ・本文を入力してください。';
      return;
    }
    if (id) payload.id = Number(id);

    const previousPath = currentImagePath;
    let uploadedPath = null;
    let nextImagePath = removeCurrentImage ? null : currentImagePath;

    try {
      statusEl.className = 'status';
      statusEl.textContent = pendingImageFile
        ? '画像をアップロードしています...'
        : '保存中...';

      if (pendingImageFile) {
        uploadedPath = await uploadImage(pendingImageFile);
        nextImagePath = uploadedPath;
      }
      payload.image_path = nextImagePath;

      const data = await adminFetch('/api/admin-announcements', {
        method: id ? 'PATCH' : 'POST',
        body: JSON.stringify(payload)
      });
      if (!data) {
        if (uploadedPath) await deleteStoredImage(uploadedPath);
        return;
      }

      let cleanupOk = true;
      if (previousPath && previousPath !== nextImagePath) {
        cleanupOk = await deleteStoredImage(previousPath);
      }

      resetForm();
      await load();
      const successText =
        nextStatus === 'published'
          ? '公開しました。'
          : nextStatus === 'archived'
            ? 'アーカイブしました。'
            : '下書きを保存しました。';
      statusEl.className = cleanupOk ? 'status' : 'status error';
      statusEl.textContent = cleanupOk
        ? successText
        : `${successText} 旧画像の削除だけ失敗したため、再確認してください。`;
    } catch (error) {
      console.error(error);
      if (uploadedPath) await deleteStoredImage(uploadedPath);
      statusEl.className = 'status error';
      statusEl.textContent =
        '保存できませんでした。入力内容と画像形式・容量を確認してください。';
    }
  }

  imageInput.addEventListener('change', () => {
    const file = imageInput.files?.[0] || null;
    if (!file) {
      pendingImageFile = null;
      renderImagePreview();
      return;
    }
    if (!IMAGE_TYPES.has(file.type) || file.size <= 0 || file.size > IMAGE_MAX_BYTES) {
      imageInput.value = '';
      pendingImageFile = null;
      statusEl.className = 'status error';
      statusEl.textContent =
        '画像はJPG / JPEG / PNG / WebP形式、5MB以下を選択してください。';
      renderImagePreview();
      return;
    }
    pendingImageFile = file;
    removeCurrentImage = false;
    renderImagePreview();
  });

  removeImageButton.addEventListener('click', () => {
    imageInput.value = '';
    pendingImageFile = null;
    removeCurrentImage = true;
    renderImagePreview();
  });

  document
    .querySelectorAll('[data-save-status]')
    .forEach((button) =>
      button.addEventListener('click', () => void save(button.dataset.saveStatus))
    );
  document.getElementById('newButton').addEventListener('click', resetForm);
  document.getElementById('logout').addEventListener('click', async () => {
    await client.auth.signOut();
    location.href = 'index.html';
  });

  void load();
</script>
</body>
</html>

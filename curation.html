<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<meta name="referrer" content="no-referrer">
<title>読者キュレーション | NOVELIGHT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}
a{color:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:960px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900;text-decoration:none}.back{color:#666;font-size:14px;text-decoration:none}
footer{padding:26px;background:#111118;color:#999}.footer-links{max-width:960px;margin:auto;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:12px}.footer-links a{text-decoration:none}
</style>
<link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
<link rel="stylesheet" href="novelight-curation.css">
</head>
<body class="novelight-theme novelight-page-curation">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a class="back" href="search.html">作品を探す</a></div></header>
<main class="novelight-curation-shell">
<section id="hero" class="novelight-curation-hero">
<h1 id="title">読者キュレーション</h1>
<div id="meta" class="novelight-curation-public-meta">読み込み中...</div>
<div id="description" class="novelight-curation-public-desc"></div>
<div class="novelight-curation-policy">このリストの掲載・閲覧は作品Rank・露出・LIGHT SEED・SCOUT・おすすめに影響しません。</div>
</section>
<section id="items" class="novelight-curation-public-items" aria-live="polite"></section>
</main><footer><div class="footer-links"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="novelight-client.js"></script>
<script src="novelight-curation.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const share=new URLSearchParams(location.search).get('share');
const title=document.getElementById('title');
const meta=document.getElementById('meta');
const description=document.getElementById('description');
const items=document.getElementById('items');

function node(tag,className,text){
  const element=document.createElement(tag);
  if(className)element.className=className;
  if(text!==undefined)element.textContent=text;
  return element;
}

function empty(message){
  items.replaceChildren(node('div','novelight-curation-empty',message));
}

function render(list){
  title.textContent=String(list.title||'読者キュレーション');
  meta.textContent='選者：'+String(list.curator_display_name||'名前未設定')+' ・ 更新 '+new Date(list.updated_at).toLocaleDateString('ja-JP');
  description.textContent=String(list.description||'');
  items.replaceChildren();
  const rows=Array.isArray(list.items)?list.items:[];
  if(!rows.length){
    empty('現在表示できる公開作品はありません。');
    return;
  }  for(const item of rows){
    const card=document.createElement('a');
    card.className='novelight-curation-public-item';
    card.href='novel.html?id='+encodeURIComponent(item.novel_id);
    const genre=node('span','genre',String(item.genre||'ジャンル未設定'));
    const heading=node('h2','',String(item.title||'作品名未設定'));
    const desc=node('p','',String(item.description||''));
    card.append(genre,heading,desc);
    items.append(card);
  }
}

(async()=>{
  void NovelightClient.captureAcquisition(client);
  void NovelightClient.recordVisit(client);
  if(!share){
    meta.textContent='';
    empty('共有URLが正しくありません。');
    return;
  }
  try{
    const result=await NovelightCuration.loadPublicList(client,share);
    if(!result.available){
      meta.textContent='';
      empty('キュレーション機能はデータベース反映待ちです。');
      return;
    }
    if(!result.list){
      meta.textContent='';
      empty('この共有リストは非公開になったか、URLが更新されています。');
      return;
    }
    render(result.list);
  }catch(error){
    console.error(error);
    meta.textContent='';
    empty('キュレーションを読み込めませんでした。時間をおいて再度お試しください。');
  }
})();
</script>
</body>
</html>

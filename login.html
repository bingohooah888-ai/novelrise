<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:#6d4aff}header{height:72px;background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1100px;height:100%;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;color:#6d4aff;font-size:25px;font-weight:900}.back{text-decoration:none;color:#666;font-size:14px}main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:42px 18px 70px}.card{width:100%;max-width:460px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:34px;box-shadow:0 12px 40px rgba(0,0,0,.06)}h1{margin:0 0 8px;text-align:center;font-size:29px}.lead{margin:0 0 26px;text-align:center;color:#777;font-size:14px}.form-group{margin-bottom:18px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:800}input{width:100%;padding:12px 13px;border:1px solid #d9d9df;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#6d4aff;box-shadow:0 0 0 3px rgba(109,74,255,.1)}button{width:100%;padding:14px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.row{display:flex;justify-content:space-between;gap:16px;margin-top:16px;font-size:13px}.signup{text-align:center;margin-top:23px;color:#666;font-size:14px}.status{min-height:20px;margin-top:12px;color:#666;font-size:13px;line-height:1.6}.legal{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin-top:22px;font-size:11px}@media(max-width:560px){.card{padding:26px 20px}.row{flex-direction:column;gap:8px}}
  </style>
</head>
<body>
<header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="index.html" class="back">← トップページ</a></div></header>
<main>
  <section class="card" aria-labelledby="loginHeading">
    <h1 id="loginHeading">ログイン</h1>
    <p class="lead">NOVELIGHTへおかえりなさい。</p>
    <form id="loginForm">
      <div class="form-group"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="form-group"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginButton" type="submit">ログイン</button>
      <div id="loginStatus" class="status" role="status" aria-live="polite"></div>
    </form>
    <div class="row"><a href="forgot-password.html">パスワードを忘れた方</a><a href="signup.html">会員登録</a></div>
    <div class="legal"><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a><a href="contact.html">お問い合わせ</a></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="novelight-client.js"></script>
<script>
  const SUPABASE_URL='https://fiepaguycecrredwrcwx.supabase.co';
  const SUPABASE_KEY='sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';
  const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const form=document.getElementById('loginForm');
  const button=document.getElementById('loginButton');
  const status=document.getElementById('loginStatus');

  const ALLOWED_PATHS=new Set([
    '/mypage.html','/pricing.html','/scout-record.html','/post.html','/favorites.html',
    '/novel.html','/episode.html','/analytics.html','/my-novels.html'
  ]);

  function safeRedirectTarget(raw){
    if(!raw)return 'mypage.html';
    try{
      const url=new URL(raw,window.location.origin);
      if(url.origin!==window.location.origin)return 'mypage.html';
      if(!ALLOWED_PATHS.has(url.pathname))return 'mypage.html';
      return url.pathname.replace(/^\//,'')+url.search;
    }catch{return 'mypage.html'}
  }

  (async()=>{
    await NovelightClient.captureAcquisition(supabaseClient);
    await NovelightClient.recordVisit(supabaseClient);
  })();

  form.addEventListener('submit',async(event)=>{
    event.preventDefault();
    button.disabled=true;status.textContent='ログイン中...';
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    const {error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){console.error(error);status.textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。';button.disabled=false;return;}
    await NovelightClient.claimAcquisition(supabaseClient);
    await NovelightClient.recordVisit(supabaseClient);
    const redirect=new URLSearchParams(window.location.search).get('redirect');
    window.location.href=safeRedirectTarget(redirect);
  });
</script>
</body>
</html>

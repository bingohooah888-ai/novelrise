<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ログイン | NovelRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f8fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
    }

    .header-inner {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 0 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #6d4aff;
    }

    .back {
      color: #666;
      font-size: 14px;
    }

    .main {
      min-height: calc(100vh - 72px);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 50px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;

      background: white;

      border-radius: 16px;

      padding: 40px;

      box-shadow: 0 10px 40px rgba(0,0,0,0.07);
    }

    h1 {
      text-align: center;
      font-size: 28px;

      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #777;

      font-size: 14px;

      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      font-size: 14px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d9d9df;
      border-radius: 8px;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color: #6d4aff;

      box-shadow:
        0 0 0 3px rgba(109,74,255,0.1);
    }

    .forgot {
      text-align: right;

      margin-top: -8px;
      margin-bottom: 20px;

      font-size: 13px;
    }

    .forgot a {
      color: #6d4aff;
    }

    .login-button {
      width: 100%;

      padding: 14px;

      background: #6d4aff;
      color: white;

      border: none;
      border-radius: 9px;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }

    .login-button:hover {
      background: #5938e8;
    }

    .signup-link {
      text-align: center;

      margin-top: 28px;

      color: #666;
      font-size: 14px;
    }

    .signup-link a {
      color: #6d4aff;
      font-weight: 700;
    }

  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      NovelRise
    </a>

    <a
      href="index.html"
      class="back"
    >
      ← トップページへ
    </a>

  </div>

</header>


<main class="main">

  <div class="login-card">

    <h1>
      ログイン
    </h1>

    <p class="description">
      NovelRiseへようこそ
    </p>


    <form>

      <div class="form-group">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          type="email"
          placeholder="example@email.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          type="password"
          placeholder="パスワード"
          required
        >

      </div>


      <div class="forgot">

        <a href="#">
          パスワードを忘れた方
        </a>

      </div>


      <button
        class="login-button"
        type="submit"
      >
        ログイン
      </button>

    </form>


    <div class="signup-link">

      アカウントをお持ちでないですか？

      <a href="signup.html">
        無料会員登録
      </a>

    </div>

  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://fiepaguycecrredwrcwx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE';

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.querySelector('form');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email =
      document.getElementById('email').value.trim();

    const password =
      document.getElementById('password').value;

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      alert(
        'ログインに失敗しました。\n' +
        'メールアドレスまたはパスワードを確認してください。\n\n' +
        error.message
      );

      return;
    }

    alert('ログインしました！');

    const params = new URLSearchParams(window.location.search);
const redirect = params.get('redirect') || 'mypage.html';
window.location.href = redirect;
  });
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>NOVELIGHT SCOUT REWARD 管理者画面 — ローカル試作</title>
    <link rel="stylesheet" href="../../assets/formal-scout-reward-admin.css" />
    <style>
      body {
        margin: 0;
        padding: 28px 16px;
        background: #0e0e1c;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic', sans-serif;
      }
      .preview-head,
      .footnote {
        max-width: 1050px;
        margin: 0 auto 20px;
      }
      .preview-head strong {
        color: #cdb176;
      }
      .footnote {
        font-size: 12px;
        color: #a9a5bb;
        line-height: 1.8;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <header class="preview-head">
      <strong>NOVELIGHT / 非公開・管理者向け交換申請一覧（架空データ）</strong>
    </header>
    <main id="preview"></main>
    <p class="footnote">
      この画面は開発用のローカル試作です。管理者の実セッション、利用者の実情報、DB、ギフト事業者は接続していません。ボタンを押しても実際のPointやギフトを動かしません。
    </p>
    <script src="../../assets/formal-scout-reward-admin.js"></script>
    <script src="../../assets/formal-scout-reward-mount.js"></script>
    <script>
      (function () {
        const example = [
          {
            operationId: '00000000-0000-4000-8000-000000000221',
            userId: '00000000-0000-4000-8000-000000000231',
            amountPoints: 30000,
            phase: 'reserved'
          }
        ];
        window.NovelightFormalRewardMount.mountFormalRewardAdmin({
          root: document.getElementById('preview'),
          authorized: true,
          request: async ({ method, query }) => {
            if (method !== 'GET')
              return { status: 'fulfillment_evidence_missing' };
            if (query?.view === 'reward_overview')
              return {
                status: 'reward_overview_ready',
                pointsPerYen: 10,
                issuedMonth: 420,
                issuedTotal: 1400,
                readMonth: 320,
                commentMonth: 100,
                giftSpentNet: 0,
                aiSpentNet: 120,
                eligibleAvailable: 1200,
                eligibleReserved: 30000,
                pendingExchangePoints: 30000,
                pendingExchangeCount: 1,
                recent: [
                  {
                    eventId: '00000000-0000-4000-8000-000000000231',
                    userId: '00000000-0000-4000-8000-000000000232',
                    kind: 'formal_read_reward',
                    points: 5,
                    status: 'confirmed',
                    occurredAt: '2026-11-12T00:00:00.000Z'
                  }
                ]
              };
            if (query?.view === 'refunds')
              return { status: 'refund_candidates_ready', items: [] };
            return { status: 'queue_ready', items: example };
          }
        });
      })();
    </script>
  </body>
</html>

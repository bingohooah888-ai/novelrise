<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>小説を投稿 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1000px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:850px;margin:auto;padding:42px 22px 76px}.page-title{margin-bottom:24px}.page-title h1{font-size:31px;margin:0 0 8px}.page-title p{color:#6b7280;line-height:1.7}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.field{margin-bottom:22px}label,.legend{display:block;font-size:14px;font-weight:900;margin-bottom:8px}.required{color:#d92d20;font-size:11px;margin-left:4px}input,select,textarea{width:100%;border:1px solid #d5d8df;border-radius:9px;padding:12px 13px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical;line-height:1.7}.help{margin-top:7px;color:#6b7280;font-size:12px;line-height:1.6}.warning-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;padding:14px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}.check input{width:auto;margin-top:3px}.policy{padding:15px;border:1px solid #e2dafd;border-radius:10px;background:#f8f6ff;font-size:12px;line-height:1.75}.policy strong{color:#5d42c8}.buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:28px}.cancel,.submit{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.cancel{border:1px solid #d5d7de;background:#fff}.submit{border:0;background:#6d4aff;color:#fff;cursor:pointer}.submit:disabled{opacity:.6}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px;line-height:1.6}@media(max-width:640px){main{padding:30px 16px 60px}.card{padding:22px 18px}.warning-grid{grid-template-columns:1fr}.buttons{flex-direction:column}.cancel,.submit{width:100%;text-align:center}}
  </style>
</head>
<body>
<header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="mypage.html" class="back">← 作者ホーム</a></div></header>
<main>
  <div class="page-title"><h1>新しい小説を投稿</h1><p>作品情報を登録したあと第1話を作成します。第1話が公開されるまでは作品は発見フィードに出ないため、初期露出を空の作品で消費しません。</p></div>
  <section class="card">
    <form id="novelForm">
      <div class="field"><label for="title">作品タイトル<span class="required">必須</span></label><input id="title" type="text" maxlength="100" required></div>
      <div class="field"><label for="genre">ジャンル<span class="required">必須</span></label><select id="genre" required><option value="">選択してください</option><option>異世界ファンタジー</option><option>現代ファンタジー</option><option>恋愛</option><option>ラブコメ</option><option>SF</option><option>ミステリー</option><option>ホラー</option><option>歴史</option><option>現代ドラマ</option><option>その他</option></select></div>
      <div class="field"><label for="description">あらすじ<span class="required">必須</span></label><textarea id="description" maxlength="2000" required></textarea></div>
      <div class="field"><label for="aiUsage">AI利用区分<span class="required">必須</span></label><select id="aiUsage" required><option value="">選択してください</option><option value="human">人間主体</option><option value="ai_assisted">AI支援（校正・アイデア整理・表現提案等）</option><option value="ai_generated">AI生成主体（本文主要部分を生成AIが作成）</option></select><div class="help">AI利用自体は禁止しません。実態に合う区分を自己申告してください。</div></div>
      <div class="field"><label for="contentRating">内容区分<span class="required">必須</span></label><select id="contentRating" required><option value="general">一般</option><option value="mature">成熟したテーマ・強い表現を含む</option></select></div>
      <fieldset class="field" style="border:0;padding:0"><legend class="legend">内容警告</legend><div class="warning-grid" id="warningGrid"><label class="check"><input type="checkbox" value="violence">暴力・戦闘</label><label class="check"><input type="checkbox" value="gore">残酷・流血描写</label><label class="check"><input type="checkbox" value="sexual_theme">性的テーマへの言及</label><label class="check"><input type="checkbox" value="abuse">虐待・ハラスメント</label><label class="check"><input type="checkbox" value="discrimination">差別・偏見</label><label class="check"><input type="checkbox" value="self_harm">自傷・自殺テーマ</label><label class="check"><input type="checkbox" value="crime">犯罪・薬物</label><label class="check"><input type="checkbox" value="other">その他の強い表現</label></div><div class="help">「成熟したテーマ」を選んだ場合は1つ以上選択してください。</div></fieldset>
      <div class="field policy"><label class="check"><input id="policyAck" type="checkbox" required><span><strong>投稿ガイドラインを確認しました。</strong> 性的満足を主目的とする露骨な性的・ポルノグラフィックな作品、権利侵害、法令・外部サービス規約に反する内容を投稿しません。成熟したテーマは上記の内容区分・警告を正しく申告します。 <a href="content-guidelines.html" target="_blank" rel="noopener" style="color:#6d4aff">投稿ガイドラインを開く</a></span></label></div>
      <div class="buttons"><a href="mypage.html" class="cancel">キャンセル</a><button id="submitButton" class="submit" type="submit">作品情報を保存して第1話へ</button></div><div id="status" class="status" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const form=document.getElementById('novelForm'),button=document.getElementById('submitButton'),status=document.getElementById('status');
function warnings(){return [...document.querySelectorAll('#warningGrid input:checked')].map(x=>x.value)}
(async()=>{await NovelightClient.captureAcquisition(client);await NovelightClient.recordVisit(client);await NovelightClient.claimAcquisition(client);const {data:{session}}=await client.auth.getSession();if(!session)window.location.href='login.html?redirect=post.html'})();
form.addEventListener('submit',async(e)=>{e.preventDefault();const {data:{session}}=await client.auth.getSession();if(!session){window.location.href='login.html?redirect=post.html';return}const ai=document.getElementById('aiUsage').value,rating=document.getElementById('contentRating').value,contentWarnings=warnings();if(!ai){status.textContent='AI利用区分を選択してください。';return}if(rating==='mature'&&!contentWarnings.length){status.textContent='成熟したテーマには内容警告を1つ以上設定してください。';return}if(!document.getElementById('policyAck').checked){status.textContent='投稿ガイドラインの確認が必要です。';return}button.disabled=true;status.textContent='保存しています...';const {data,error}=await client.from('novels').insert({user_id:session.user.id,title:document.getElementById('title').value.trim(),genre:document.getElementById('genre').value,description:document.getElementById('description').value.trim(),status:'draft',pv:0,favorites:0,ai_usage:ai,content_rating:rating,content_warnings:contentWarnings,content_policy_ack:true,content_policy_version:'beta-2026-08-23'}).select('id').single();if(error){console.error(error);status.textContent=error.message||'作品を保存できませんでした。';button.disabled=false;return}window.location.href='episode-post.html?novel_id='+encodeURIComponent(data.id)});
</script></body></html>

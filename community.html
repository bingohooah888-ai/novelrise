<!doctype html>
<html lang="ja" class="novelight-page-community">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>交流広場 | NOVELIGHT</title>
<meta name="description" content="NOVELIGHTで公開された作品や作者の近況をチェック。物語の発見につながる交流広場です。">
<link rel="stylesheet" href="novelight-theme.css">
<link rel="stylesheet" href="novelight-public-dark.css">
<link rel="stylesheet" href="novelight-community.css">
<link rel="stylesheet" href="novelight-community-board.css">
<link rel="stylesheet" href="novelight-accessibility.css">
</head>
<body class="novelight-theme novelight-public-dark novelight-page-community">
<a class="skip-link" href="#main-content">本文へスキップ</a>
<header class="site-header"><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a></div></header>
<main id="main-content" tabindex="-1">
<section id="communityPage" class="community-page" aria-labelledby="communityPageHeading">
 <div class="community-inner">
  <h1 id="communityPageHeading">交流広場</h1>
  <p class="community-intro">作品の更新や近況を通じて、まだ知らない物語と出会おう。</p>
  <p id="communityPending" class="community-state" role="status" hidden>交流広場はタイムラインと掲示板を準備中です。両機能が完成してから同時に公開します。</p>
  <nav id="communityTabs" class="community-tabs" aria-label="交流広場の機能">
    <a class="community-tab" href="community.html" aria-current="page">タイムライン</a>
    <a class="community-tab" href="#board" id="communityBoardTab">掲示板</a>
  </nav>
  <section id="communityNotifications" aria-label="あなたへの交流通知" hidden></section>
  <section id="communityTimeline" aria-label="タイムライン">
   <div class="community-filters" aria-label="表示する投稿">
     <button type="button" data-community-filter="everyone" aria-pressed="true">みんな</button>
     <button type="button" data-community-filter="following" aria-pressed="false">フォロー中</button>
     <button type="button" id="communityRefresh" class="community-refresh">最新の投稿を更新</button>
   </div>
   <p id="communityFilterStatus" class="community-filter-status" role="status" hidden></p>
   <div id="communityPageFeed" class="community-feed" aria-live="polite"><p class="community-state">タイムラインを準備しています。</p></div>
   <div class="community-pagination"><button id="communityLoadMore" class="community-refresh" type="button" hidden>さらに見る</button></div>
  </section>
  <section id="communityBoardInfo" aria-label="掲示板" hidden>
    <div class="board-heading">
      <div><h2>掲示板</h2><p>物語のこと、創作のこと。作者も読者も気軽に話そう。</p></div>
      <button type="button" id="boardComposeOpen" class="community-refresh">スレッドを作る</button>
    </div>
    <form id="boardComposeForm" class="board-compose" hidden>
      <h3 id="boardComposeHeading">新しいスレッド</h3>
      <label for="boardComposeCategory">カテゴリ</label>
      <select id="boardComposeCategory" required><option value="stories">作品の話</option><option value="writing">創作相談</option><option value="general">雑談</option></select>
      <label for="boardComposeTitle">タイトル（4〜80文字）</label>
      <input id="boardComposeTitle" maxlength="80" minlength="4" required>
      <label for="boardComposeBody">本文（最大2,000文字）</label>
      <textarea id="boardComposeBody" rows="6" maxlength="2000" required></textarea>
      <label class="board-safety"><input id="boardComposeSafety" type="checkbox" required> 全年齢向けの内容であることを確認しました</label>
      <div class="board-actions"><button class="community-refresh" id="boardComposeSave" type="submit">投稿する</button><button class="board-secondary" type="button" id="boardComposeCancel">キャンセル</button></div>
    </form>
    <p id="boardStatus" role="status" class="community-filter-status"></p>
    <div id="boardListPanel">
      <label class="board-filter-label" for="boardCategoryFilter">カテゴリで探す
        <select id="boardCategoryFilter"><option value="">すべて</option><option value="stories">作品の話</option><option value="writing">創作相談</option><option value="general">雑談</option></select>
      </label>
      <div id="boardThreadList" class="board-thread-list" aria-live="polite"></div>
      <button type="button" id="boardLoadMore" class="community-refresh" hidden>さらに見る</button>
    </div>
    <article id="boardThreadDetail" class="board-detail" hidden>
      <button id="boardBack" type="button" class="board-secondary">← スレッド一覧へ戻る</button>
      <h2 id="boardDetailTitle"></h2>
      <p id="boardDetailMeta" class="board-meta"></p>
      <p id="boardDetailBody" class="board-detail-body"></p>
      <div id="boardDetailActions" class="board-actions"></div>
      <h3>返信</h3>
      <div id="boardReplyList" class="board-replies" aria-live="polite"></div>
      <form id="boardReplyForm" class="board-reply-form">
        <label id="boardReplyLabel" for="boardReplyBody">返信を書く（500文字以内）</label>
        <textarea id="boardReplyBody" rows="3" maxlength="500" required></textarea>
        <div class="board-actions"><button type="submit" id="boardReplySend" class="community-refresh">返信する</button><button type="button" id="boardReplyCancel" class="board-secondary" hidden>返信先を解除</button></div>
      </form>
    </article>
  </section>
 </div>
</section>
</main>
<footer class="site-footer"><div class="footer-inner"><span>© 2026 NOVELIGHT</span><div class="footer-links"><a href="index.html">ホーム</a><a href="terms.html">利用規約</a><a href="content-guidelines.html">投稿ガイドライン</a><a href="contact.html">お問い合わせ</a></div></div></footer>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="novelight-community-config.js"></script>
<script src="novelight-client.js"></script>
<script src="novelight-community.js" defer></script>
<script src="novelight-community-board.js" defer></script>
<script src="novelight-community-alerts.js" defer></script>
<script>
(() => {
 const boardTab=document.getElementById('communityBoardTab');
 const timeline=document.getElementById('communityTimeline');
 const board=document.getElementById('communityBoardInfo');
 const tabs=document.querySelectorAll('.community-tab');
 const flags=window.NOVELIGHT_COMMUNITY_FLAGS || {};
 if (!flags.timeline || !flags.board) {
   document.getElementById('communityPending').hidden=false;
   document.getElementById('communityTabs').hidden=true;
   timeline.hidden=true;
   board.hidden=true;
   return;
 }
 function setTab(showingBoard){
   board.hidden=!showingBoard;
   timeline.hidden=showingBoard;
   tabs.forEach(tab=>tab.removeAttribute('aria-current'));
   tabs[showingBoard?1:0].setAttribute('aria-current','page');
   history.replaceState(null,'',showingBoard?'community.html#board':'community.html');
 }
 boardTab.addEventListener('click',event=>{
   event.preventDefault();
   setTab(board.hidden);
 });
 tabs[0].addEventListener('click',event=>{
   event.preventDefault();
   setTab(false);
 });
 if(location.hash.startsWith('#board-thread-')) {
   window.NOVELIGHT_BOARD_INITIAL_THREAD=location.hash.slice('#board-thread-'.length);
   setTab(true);
 } else if(location.hash==='#board') setTab(true);
})();
</script>
</body></html>

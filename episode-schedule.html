<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>予約投稿 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button,input{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:920px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:760px;margin:auto;padding:42px 22px 76px}h1{font-size:30px;margin:0}.lead{margin:8px 0 24px;color:#6b7280;line-height:1.7}.card{padding:26px;border:1px solid #e5e7eb;border-radius:16px;background:#fff}.episode{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #eee}.number{font-size:11px;font-weight:900;color:#8c765d}.title{margin-top:6px;font-size:20px;font-weight:900}.copy{margin-top:7px;color:#6b7280;font-size:12px;line-height:1.7}.field{margin:20px 0}.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:900}.field input{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px}.timezone{margin-top:6px;color:#8a8f98;font-size:11px}.current{margin:18px 0;padding:14px;border:1px solid #ded3c3;border-radius:10px;background:#fffaf2;color:#624d31;font-size:13px;line-height:1.7}.current.failed{border-color:#f1b4ae;background:#fff6f5;color:#8b2d24}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{min-height:42px;padding:10px 15px;border-radius:9px;border:1px solid #d6d8df;background:#fff;font-weight:900;cursor:pointer}.btn.primary{border-color:#3d2d20;background:#3d2d20;color:#fff}.btn.danger{border-color:#d92d20;color:#b42318}.btn:disabled{opacity:.55;cursor:not-allowed}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px;line-height:1.6}.unavailable{padding:18px;border:1px solid #ead7ae;border-radius:10px;background:#fffaf0;color:#6c5531;line-height:1.7}.edit-link{display:inline-block;margin-top:16px;color:#5d42c8;font-size:12px;font-weight:900}@media(max-width:640px){main{padding:28px 16px 60px}.card{padding:21px 18px}.buttons{flex-direction:column}.btn{width:100%}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
</head>
<body class="novelight-theme novelight-page-episode-schedule">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 下書きへ戻る</a></div></header>
<main>
  <h1>予約投稿</h1>
  <p class="lead">保存済みの非公開下書きを、指定した日時に自動公開します。β版では1作品につき同時に予約できるのは1話です。</p>
  <section id="card" class="card">
    <div id="loading">予約投稿画面を準備しています...</div>
    <div id="content" hidden>
      <div class="episode"><div id="episodeNumber" class="number"></div><div id="episodeTitle" class="title"></div><div class="copy">予約中もこの話は非公開下書きのままです。予約日時までは読者に表示されません。</div></div>
      <div id="currentSchedule" class="current" hidden></div>
      <div class="field"><label for="scheduledAt">公開日時</label><input id="scheduledAt" type="datetime-local" step="60"><div id="timezone" class="timezone"></div></div>
      <div class="buttons"><button id="schedule" class="btn primary" type="button">この日時に予約する</button><button id="cancelSchedule" class="btn danger" type="button" hidden>予約を取り消す</button></div>
      <div id="status" class="status" aria-live="polite"></div>
      <a id="editLink" class="edit-link" href="#">← 下書きを編集する</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const episodeId=new URLSearchParams(location.search).get('id');
const loading=document.getElementById('loading'),content=document.getElementById('content'),status=document.getElementById('status'),scheduledAt=document.getElementById('scheduledAt'),scheduleButton=document.getElementById('schedule'),cancelButton=document.getElementById('cancelSchedule'),currentSchedule=document.getElementById('currentSchedule');
let session=null,episode=null,novel=null,current=null,busy=false;
function localInputValue(date){const d=new Date(date);if(Number.isNaN(d.getTime()))return'';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function localDateTime(value){const d=new Date(value);return Number.isNaN(d.getTime())?'日時不明':d.toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function setBusy(value){busy=value;scheduleButton.disabled=value;cancelButton.disabled=value}
function validateDraft(row){if(!row||row.status!=='draft')return'公開済みのエピソードは予約できません。';if(!Number.isFinite(Number(row.episode_number))||Number(row.episode_number)<1)return'話数を確認してください。';if(!String(row.title||'').trim()||String(row.title||'').length>150)return'タイトルを入力してから予約してください。';if(!String(row.content||'').trim()||String(row.content||'').length>100000)return'本文を入力してから予約してください。';if(novel?.status!=='published'&&Number(row.episode_number)!==1)return'作品の初回公開は第1話を予約してください。';return''}
function renderSchedule(){currentSchedule.classList.remove('failed');if(!current){currentSchedule.hidden=true;cancelButton.hidden=true;scheduleButton.textContent='この日時に予約する';return}currentSchedule.hidden=false;cancelButton.hidden=false;scheduledAt.value=localInputValue(current.scheduled_at);if(current.state==='failed'){currentSchedule.classList.add('failed');currentSchedule.textContent='予約公開を実行できませんでした。下書き内容や第1話条件を確認し、日時を再設定してください。';scheduleButton.textContent='修正して再予約する'}else{currentSchedule.textContent=`予約済み：${localDateTime(current.scheduled_at)} に自動公開します。`;scheduleButton.textContent='予約日時を変更する'}}
async function loadCurrentSchedule(){const result=await client.from('episode_publish_schedules').select('episode_id,novel_id,scheduled_at,state,last_error_code').eq('episode_id',episodeId).maybeSingle();if(result.error)throw result.error;current=result.data||null;renderSchedule()}
async function refreshEpisode(){const result=await client.from('episodes').select('id,novel_id,user_id,episode_number,title,content,status').eq('id',episodeId).single();if(result.error)throw result.error;episode=result.data;const novelResult=await client.from('novels').select('id,user_id,title,status').eq('id',episode.novel_id).single();if(novelResult.error)throw novelResult.error;novel=novelResult.data;if(!episode||!novel||episode.user_id!==session.user.id||novel.user_id!==session.user.id)throw new Error('not authorized')}
(async()=>{void NovelightClient.recordVisit(client);if(!episodeId){loading.textContent='エピソードIDがありません。';return}try{const auth=await client.auth.getSession();if(auth.error)throw auth.error;session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('episode-schedule.html?id='+episodeId);return}void NovelightClient.claimAcquisition(client);await refreshEpisode();if(episode.status!=='draft'){loading.textContent='このエピソードはすでに公開されています。';return}document.getElementById('episodeNumber').textContent=`第${Number(episode.episode_number)}話`;document.getElementById('episodeTitle').textContent=episode.title||'（タイトル未入力）';document.getElementById('editLink').href='episode-edit.html?id='+encodeURIComponent(episode.id);document.getElementById('back').href='episode-drafts.html?novel_id='+encodeURIComponent(episode.novel_id);document.getElementById('timezone').textContent=`入力した日時はこの端末の時刻（${Intl.DateTimeFormat().resolvedOptions().timeZone||'ローカル時間'}）として扱います。`;const minDate=new Date(Date.now()+2*60*1000);scheduledAt.min=localInputValue(minDate);scheduledAt.value=localInputValue(new Date(Date.now()+24*60*60*1000));try{await loadCurrentSchedule()}catch(error){console.warn('scheduled publication storage is not ready',error);loading.innerHTML='<div class="unavailable">予約投稿機能は現在準備中です。下書きの保存・編集・即時公開は通常どおり利用できます。</div>';return}loading.hidden=true;content.hidden=false}catch(error){console.error(error);loading.textContent='予約投稿画面を読み込めませんでした。時間をおいて再度お試しください。'}})();
scheduleButton.addEventListener('click',async()=>{if(busy||!session||!episode)return;status.textContent='';const date=new Date(scheduledAt.value);if(!scheduledAt.value||Number.isNaN(date.getTime())){status.textContent='公開日時を入力してください。';return}if(date.getTime()<Date.now()+60*1000){status.textContent='公開日時は1分以上先を指定してください。';return}setBusy(true);status.textContent='予約を設定しています...';try{await refreshEpisode();const validation=validateDraft(episode);if(validation){status.textContent=validation;return}const result=await client.rpc('novelight_schedule_episode_publication',{p_episode_id:String(episodeId),p_scheduled_at:date.toISOString()});if(result.error)throw result.error;await loadCurrentSchedule();status.textContent='予約投稿を設定しました。予約日時までは非公開です。'}catch(error){console.error(error);status.textContent='予約を設定できませんでした。日時・下書き内容・同じ作品の既存予約を確認してください。'}finally{setBusy(false)}});
cancelButton.addEventListener('click',async()=>{if(busy||!current)return;if(!confirm('この予約投稿を取り消しますか？下書き自体は削除されません。'))return;setBusy(true);status.textContent='予約を取り消しています...';try{const result=await client.rpc('novelight_cancel_episode_publication_schedule',{p_episode_id:String(episodeId)});if(result.error)throw result.error;current=null;renderSchedule();scheduledAt.value=localInputValue(new Date(Date.now()+24*60*60*1000));status.textContent='予約を取り消しました。下書きはそのまま残っています。'}catch(error){console.error(error);status.textContent='予約を取り消せませんでした。時間をおいて再度お試しください。'}finally{setBusy(false)}});
</script>
</body>
</html>

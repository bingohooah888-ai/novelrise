<!DOCTYPE html>
<html lang="ja">
<head>
  <script src="novelight-author-backgrounds.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>表紙を設定 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1000px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:920px;margin:auto;padding:42px 22px 76px}.page-title{margin-bottom:24px}.page-title h1{font-size:31px;margin:0 0 8px}.page-title p{color:#6b7280;line-height:1.7}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:30px}.work-name{margin:0 0 22px;padding:13px 15px;border-radius:10px;background:#f7f5ff;color:#4f3e88;font-size:14px;font-weight:900}.composer-intro{margin:0 0 14px;color:#5f6571;font-size:13px;line-height:1.7}.thumbnail-state{padding:22px;border:1px dashed #d9dbe2;border-radius:10px;color:#6b7280;text-align:center;font-size:13px}.buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}.cancel,.submit{padding:12px 20px;border-radius:9px;font:inherit;font-weight:900}.cancel{border:1px solid #d5d7de;background:#fff}.submit{border:0;background:#6d4aff;color:#fff;cursor:pointer}.submit:disabled{opacity:.6;cursor:not-allowed}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px;line-height:1.6}.status.success{color:#16803d;font-weight:800}.status.error{color:#b42318}.view-link{display:inline-block;margin-left:8px;color:#6d4aff;text-decoration:underline}@media(max-width:640px){main{padding:30px 16px 60px}.card{padding:22px 18px}.buttons{flex-direction:column}.cancel,.submit{width:100%;text-align:center}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
  <link rel="stylesheet" href="novelight-thumbnail-composer.css">
  <link rel="stylesheet" href="novelight-accessibility.css">
  <link rel="stylesheet" href="novelight-page-heading.css">
  <link rel="stylesheet" href="novelight-author-backgrounds.css">
  <link rel="stylesheet" href="novelight-author-font-sizes.css">
</head>
<body class="novelight-theme novelight-page-work-cover">
  <a class="skip-link" href="#main-content">本文へスキップ</a>
  <header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="my-novels.html" class="back">← 自分の作品</a></div></header>
  <main id="main-content" tabindex="-1">
    <div class="page-title novelight-page-heading"><h1>表紙を設定</h1><p>NOVELIGHT公式素材を組み合わせて、作品ページに表示する表紙を設定できます。</p></div>
    <section class="card">
      <div id="workName" class="work-name">作品を確認しています...</div>
      <p class="composer-intro">新規投稿時と同じGeometry Thumbnail Composerを使用します。背景・本・表紙・装飾を選び、保存すると作品ページの左側へ反映されます。</p>
      <div id="thumbnailComposer"><div class="thumbnail-state">公式素材を読み込んでいます...</div></div>
      <div class="buttons"><a id="cancelLink" href="my-novels.html" class="cancel">キャンセル</a><button id="saveButton" class="submit" type="button" disabled>表紙を保存</button></div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/assets/vendor/supabase-js-2.112.3.js"></script>
  <script src="novelight-client.js"></script>
  <script src="novelight-thumbnail-composer.js"></script>
  <script>
    const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
    const params=new URLSearchParams(location.search),novelId=params.get('novel_id');
    const root=document.getElementById('thumbnailComposer'),saveButton=document.getElementById('saveButton'),status=document.getElementById('status'),workName=document.getElementById('workName'),cancelLink=document.getElementById('cancelLink');
    let controller=null,session=null,busy=false;
    function setStatus(message,type=''){status.textContent=message;status.className=`status${type?` ${type}`:''}`}
    function setBusy(value){busy=value;saveButton.disabled=value||!controller;saveButton.textContent=value?'保存中...':'表紙を保存'}
    (async()=>{
      void NovelightClient.recordVisit(client);
      if(!novelId){workName.textContent='作品を指定できませんでした。';setStatus('自分の作品一覧から設定する作品を選んでください。','error');return}
      try{
        const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href=`login.html?redirect=${encodeURIComponent(`work-cover.html?novel_id=${novelId}`)}`;return}
        const result=await client.from('novels').select('id,title,user_id').eq('id',novelId).maybeSingle();
        if(result.error)throw result.error;
        const work=result.data;
        if(!work||String(work.user_id)!==String(session.user.id)){workName.textContent='この作品の表紙は編集できません。';setStatus('作品の所有者としてログインしているか確認してください。','error');return}
        workName.textContent=work.title||'タイトル未設定';
        cancelLink.href=`novel.html?id=${encodeURIComponent(novelId)}`;
        const mounted=await NovelightThumbnailComposer.mount({client,root,novelId:String(novelId)});
        if(!mounted.ready){root.innerHTML='<div class="thumbnail-state">公式サムネイル素材を準備しています。時間をおいて再度お試しください。</div>';setStatus('表紙設定を読み込めませんでした。','error');return}
        controller=mounted.controller;saveButton.disabled=false;setStatus('現在の表紙設定を読み込みました。');
      }catch(error){console.error(error);root.innerHTML='<div class="thumbnail-state">表紙設定を読み込めませんでした。</div>';setStatus('時間をおいて再度お試しください。','error')}
    })();
    saveButton.addEventListener('click',async()=>{
      if(!controller||busy||!session)return;
      if(!controller.isValid()){setStatus('必須のサムネイル素材を選択してください。','error');return}
      setBusy(true);setStatus('表紙を保存しています...');
      try{
        const refreshed=await client.auth.getSession();session=refreshed.data.session||session;
        await controller.persist({novelId:String(novelId),accessToken:session.access_token});
        setStatus('表紙を保存しました。作品ページへ反映されます。','success');
        const link=document.createElement('a');link.className='view-link';link.href=`novel.html?id=${encodeURIComponent(novelId)}`;link.textContent='作品ページを見る';status.appendChild(link);
      }catch(error){console.error(error);setStatus('表紙を保存できませんでした。選択内容を確認して再度お試しください。','error')}
      finally{setBusy(false)}
    });
  </script>
</body>
</html>

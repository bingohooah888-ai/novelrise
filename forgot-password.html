<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>パスワード再設定 | NOVELIGHT</title>
  <style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:#6d4aff}main{min-height:100vh;display:grid;place-items:center;padding:30px 16px}.card{width:100%;max-width:460px;background:white;border:1px solid #e5e7eb;border-radius:18px;padding:32px}h1{font-size:27px;margin:0 0 10px}.lead{color:#666;line-height:1.8;font-size:14px;margin-bottom:20px}.field{margin-bottom:18px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:800}input{width:100%;padding:12px 13px;border:1px solid #d9d9df;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#6d4aff;box-shadow:0 0 0 3px rgba(109,74,255,.1)}button{width:100%;padding:14px;border:0;border-radius:9px;background:#6d4aff;color:#fff;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px;line-height:1.7}.back{display:inline-block;margin-top:18px;font-size:13px}</style>
  <link rel="stylesheet" href="novelight-accessibility.css">
</head>
<body><a class="skip-link" href="#main-content">本文へスキップ</a><main id="main-content" tabindex="-1"><section class="card">
  <h1>パスワードを再設定</h1>
  <p class="lead">登録メールアドレスへ、期限付きの再設定リンクを送信します。</p>
  <form id="form">
    <div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div>
    <button id="button" type="submit">再設定メールを送る</button>
    <div id="status" class="status" aria-live="polite"></div>
  </form>
  <a class="back" href="login.html">← ログインへ戻る</a>
</section></main>
<script src="/assets/vendor/supabase-js-2.112.3.js"></script>
<script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const form=document.getElementById('form'),button=document.getElementById('button'),status=document.getElementById('status');
const neutralMessage='登録済みのメールアドレスであれば、再設定リンクを送信しました。メールが届かない場合は、少し時間をおいてから再度お試しください。';
let cooldownTimer=null;
function startCooldown(){let remaining=60;button.disabled=true;button.textContent=`再送まで ${remaining}秒`;cooldownTimer=setInterval(()=>{remaining-=1;if(remaining<=0){clearInterval(cooldownTimer);cooldownTimer=null;button.disabled=false;button.textContent='再設定メールを送る';return}button.textContent=`再送まで ${remaining}秒`},1000)}
form.addEventListener('submit',async(event)=>{event.preventDefault();if(button.disabled)return;const email=document.getElementById('email').value.trim();if(!email)return;button.disabled=true;button.textContent='送信しています...';status.textContent='';try{const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});if(error)console.error('password recovery request was not accepted',{status:error.status||null,code:error.code||null});status.textContent=neutralMessage;startCooldown()}catch(error){console.error('password recovery request failed',{name:error?.name||'Error'});status.textContent=neutralMessage;startCooldown()}});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>パスワード再設定 | NOVELIGHT</title>
  <style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:#6d4aff}main{min-height:100vh;display:grid;place-items:center;padding:30px 16px}.card{width:100%;max-width:460px;background:white;border:1px solid #e5e7eb;border-radius:18px;padding:32px}h1{font-size:27px;margin:0 0 10px}.lead{color:#666;line-height:1.7;font-size:14px;margin-bottom:24px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#6d4aff;color:white;font:inherit;font-weight:900;cursor:pointer}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px;line-height:1.6}.back{display:inline-block;margin-top:18px;font-size:13px}</style>
</head>
<body><main><section class="card"><h1>パスワードを再設定</h1><p class="lead">登録済みのメールアドレスへ再設定リンクを送ります。アカウントの有無を第三者に推測されにくくするため、送信後の表示は共通です。</p><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required><button id="button" type="submit">再設定メールを送る</button><div id="status" class="status" aria-live="polite"></div></form><a class="back" href="login.html">← ログインへ戻る</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const form=document.getElementById('form'),button=document.getElementById('button'),status=document.getElementById('status');
(async()=>{await NovelightClient.captureAcquisition(client);await NovelightClient.recordVisit(client)})();
form.addEventListener('submit',async(e)=>{e.preventDefault();button.disabled=true;status.textContent='送信しています...';const email=document.getElementById('email').value.trim();const redirectTo=window.location.origin+'/reset-password.html';const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});if(error)console.error(error);status.textContent='入力されたメールアドレスが登録済みの場合、パスワード再設定メールを送信しました。';button.disabled=false});
</script></body></html>

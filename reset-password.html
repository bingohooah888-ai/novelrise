<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>新しいパスワード | NOVELIGHT</title>
  <style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:#6d4aff}main{min-height:100vh;display:grid;place-items:center;padding:30px 16px}.card{width:100%;max-width:460px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px}h1{font-size:27px;margin:0 0 10px}.lead{color:#666;line-height:1.7;font-size:14px;margin-bottom:24px}.field{margin-bottom:16px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d6d8df;border-radius:9px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:9px;background:#6d4aff;color:white;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.status{min-height:24px;margin-top:14px;color:#666;font-size:13px;line-height:1.6}</style>
</head>
<body><main><section class="card"><h1>新しいパスワード</h1><p class="lead">メールの再設定リンクから開いた場合のみ変更できます。8文字以上の新しいパスワードを設定してください。</p><form id="form"><div class="field"><label for="password">新しいパスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">確認</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button id="button" type="submit" disabled>パスワードを変更</button><div id="status" class="status" aria-live="polite">再設定リンクを確認しています...</div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const form=document.getElementById('form'),button=document.getElementById('button'),status=document.getElementById('status');
let recoveryReady=false;
async function checkRecovery(){const {data}=await client.auth.getSession();if(data?.session){recoveryReady=true;button.disabled=false;status.textContent='新しいパスワードを入力してください。';}else{status.textContent='再設定リンクが無効または期限切れです。もう一度再設定メールを送信してください。';}}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){recoveryReady=true;button.disabled=false;status.textContent='新しいパスワードを入力してください。';}});
setTimeout(checkRecovery,250);
form.addEventListener('submit',async(e)=>{e.preventDefault();if(!recoveryReady)return;const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password.length<8){status.textContent='8文字以上で設定してください。';return}if(password!==confirm){status.textContent='パスワードが一致していません。';return}button.disabled=true;status.textContent='変更しています...';const {error}=await client.auth.updateUser({password});if(error){console.error(error);status.textContent='変更できませんでした。リンクの期限を確認し、再度お試しください。';button.disabled=false;return}await client.auth.signOut({scope:'local'});status.textContent='パスワードを変更しました。新しいパスワードでログインしてください。';setTimeout(()=>{window.location.href='login.html'},600)});
</script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>シリーズ管理 | NOVELIGHT</title>
<link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:1050px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:1000px;margin:auto;padding:42px 22px 76px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}.head h1{font-size:30px;margin:0}.head p{color:#6b7280;margin:7px 0 0;line-height:1.7}.panel,.series-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.panel{padding:22px;margin-bottom:20px}.panel h2{margin:0 0 14px;font-size:20px}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:12px;font-weight:900;color:#555}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #d6d8df;border-radius:9px;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #d6d8df;border-radius:8px;background:#fff;padding:9px 12px;font-weight:900;cursor:pointer}.btn.primary{background:#6d4aff;color:#fff;border-color:#6d4aff}.btn.danger{color:#b42318;border-color:#f0b6b1}.btn:disabled{opacity:.55;cursor:wait}.list{display:grid;gap:14px}.series-card{padding:20px}.series-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.work-list{display:grid;gap:8px;margin-top:16px}.work-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid #e5e7eb;border-radius:9px;background:#fafafa}.work-title{font-weight:800}.work-meta{font-size:11px;color:#777;margin-top:2px}.order-actions{display:flex;gap:5px}.order-actions button{min-width:38px}.available{margin-top:16px;padding-top:14px;border-top:1px solid #eee}.available h3{font-size:14px;margin:0 0 8px}.available-list{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d6d8df;border-radius:999px;background:#fff;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.status{min-height:20px;margin-top:10px;color:#666;font-size:12px}.empty{padding:32px;text-align:center;color:#6b7280;background:#fff;border:1px solid #e5e7eb;border-radius:14px}@media(max-width:640px){main{padding:28px 16px 60px}.head{align-items:flex-start;flex-direction:column}.series-top{flex-direction:column}.work-row{grid-template-columns:1fr}.order-actions{justify-content:flex-start}.actions .btn{flex:1}}
</style>
</head>
<body class="novelight-theme novelight-page-series">
<header><div class="header-inner"><a href="index.html" class="logo">NOVELIGHT</a><a href="my-novels.html" class="back">← 自分の作品</a></div></header>
<main>
<div class="head"><div><h1>シリーズ管理</h1><p>複数の作品をひとつのシリーズとして整理し、読む順番を設定できます。シリーズ自体はランキング・作品評価・LIGHT SEED・露出の加点単位にはなりません。</p></div></div>
<section class="panel"><h2>新しいシリーズ</h2><div class="field"><label for="newTitle">シリーズ名</label><input id="newTitle" maxlength="120" placeholder="例：星渡り年代記"></div><div class="field"><label for="newDescription">シリーズ説明</label><textarea id="newDescription" maxlength="2000" placeholder="シリーズ全体の説明"></textarea></div><div class="actions"><button id="createSeries" class="btn primary" type="button">シリーズを作成</button></div><div id="createStatus" class="status"></div></section>
<div id="seriesList" class="list">読み込み中...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
let session=null;let novels=[];let series=[];let memberships=[];
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function statusLabel(n){return n.status==='published'?'公開中':'下書き'}
function itemsFor(seriesId){const ids=memberships.filter(x=>String(x.series_id)===String(seriesId)).sort((a,b)=>Number(a.position)-Number(b.position)).map(x=>String(x.novel_id));return ids.map(id=>novels.find(n=>String(n.id)===id)).filter(Boolean)}
function assignedNovelIds(){return new Set(memberships.map(x=>String(x.novel_id)))}
async function reload(){const [s,n,i]=await Promise.all([client.from('novel_series').select('*').eq('user_id',session.user.id).order('updated_at',{ascending:false}),client.from('novels').select('id,title,status,created_at').eq('user_id',session.user.id).order('created_at',{ascending:true}),client.from('novel_series_items').select('series_id,novel_id,position')]);if(s.error)throw s.error;if(n.error)throw n.error;if(i.error)throw i.error;series=s.data||[];novels=n.data||[];memberships=i.data||[];render()}
function render(){const root=document.getElementById('seriesList');if(!series.length){root.innerHTML='<div class="empty">まだシリーズがありません。上のフォームから作成できます。</div>';return}const assigned=assignedNovelIds();root.innerHTML=series.map(s=>{const current=itemsFor(s.id);const available=novels.filter(n=>!assigned.has(String(n.id)));return `<article class="series-card" data-series-id="${esc(s.id)}"><div class="series-top"><div style="flex:1"><div class="field" style="margin-top:0"><label>シリーズ名</label><input class="edit-title" maxlength="120" value="${esc(s.title)}"></div><div class="field"><label>シリーズ説明</label><textarea class="edit-description" maxlength="2000">${esc(s.description||'')}</textarea></div></div></div><div class="work-list">${current.length?current.map((n,index)=>`<div class="work-row" data-novel-id="${esc(n.id)}"><div><div class="work-title">${index+1}. ${esc(n.title)}</div><div class="work-meta">${statusLabel(n)}</div></div><div class="order-actions"><button class="btn move-up" type="button" ${index===0?'disabled':''}>↑</button><button class="btn move-down" type="button" ${index===current.length-1?'disabled':''}>↓</button><button class="btn remove-work" type="button">外す</button></div></div>`).join(''):'<div class="status">作品はまだ登録されていません。</div>'}</div><div class="available"><h3>作品を追加</h3><div class="available-list">${available.length?available.map(n=>`<button class="chip add-work" type="button" data-novel-id="${esc(n.id)}">＋ ${esc(n.title)}</button>`).join(''):'<span class="status">追加できる未所属作品はありません。</span>'}</div></div><div class="actions"><button class="btn primary save-series" type="button">変更を保存</button><button class="btn danger delete-series" type="button">シリーズを削除</button></div><div class="status card-status"></div></article>`}).join('');bindCards()}
function localOrder(card){return Array.from(card.querySelectorAll('.work-row')).map(row=>String(row.dataset.novelId))}
function preserveDraftMetadata(card){const current=series.find(s=>String(s.id)===String(card.dataset.seriesId));if(!current)return;current.title=card.querySelector('.edit-title').value;current.description=card.querySelector('.edit-description').value}
function rerenderCardFromOrder(card,order){preserveDraftMetadata(card);const seriesId=card.dataset.seriesId;memberships=memberships.filter(x=>String(x.series_id)!==String(seriesId));order.forEach((id,index)=>memberships.push({series_id:seriesId,novel_id:id,position:index+1}));render()}
function bindCards(){document.querySelectorAll('.series-card').forEach(card=>{card.querySelectorAll('.move-up').forEach(button=>button.onclick=()=>{const row=button.closest('.work-row'),order=localOrder(card),index=order.indexOf(String(row.dataset.novelId));if(index>0)[order[index-1],order[index]]=[order[index],order[index-1]];rerenderCardFromOrder(card,order)});card.querySelectorAll('.move-down').forEach(button=>button.onclick=()=>{const row=button.closest('.work-row'),order=localOrder(card),index=order.indexOf(String(row.dataset.novelId));if(index>=0&&index<order.length-1)[order[index+1],order[index]]=[order[index],order[index+1]];rerenderCardFromOrder(card,order)});card.querySelectorAll('.remove-work').forEach(button=>button.onclick=()=>{const id=String(button.closest('.work-row').dataset.novelId);rerenderCardFromOrder(card,localOrder(card).filter(x=>x!==id))});card.querySelectorAll('.add-work').forEach(button=>button.onclick=()=>rerenderCardFromOrder(card,[...localOrder(card),String(button.dataset.novelId)]));card.querySelector('.save-series').onclick=()=>void saveSeries(card);card.querySelector('.delete-series').onclick=()=>void deleteSeries(card)})}
async function saveSeries(card){const button=card.querySelector('.save-series'),status=card.querySelector('.card-status'),seriesId=card.dataset.seriesId,title=card.querySelector('.edit-title').value.trim(),description=card.querySelector('.edit-description').value.trim(),order=localOrder(card).map(Number);if(!title){status.textContent='シリーズ名を入力してください。';return}button.disabled=true;status.textContent='保存中...';try{const update=await client.from('novel_series').update({title,description,updated_at:new Date().toISOString()}).eq('id',seriesId).eq('user_id',session.user.id);if(update.error)throw update.error;const setItems=await client.rpc('novelight_set_series_items',{p_series_id:Number(seriesId),p_novel_ids:order});if(setItems.error)throw setItems.error;status.textContent='保存しました。';await reload()}catch(e){console.error(e);status.textContent=e?.message?.includes('NOVEL_ALREADY_IN_SERIES')?'その作品は別のシリーズに所属しています。':'保存できませんでした。時間をおいて再度お試しください。'}finally{button.disabled=false}}
async function deleteSeries(card){if(!confirm('このシリーズを削除しますか？作品自体は削除されません。'))return;const button=card.querySelector('.delete-series'),status=card.querySelector('.card-status');button.disabled=true;status.textContent='削除中...';try{const result=await client.from('novel_series').delete().eq('id',card.dataset.seriesId).eq('user_id',session.user.id);if(result.error)throw result.error;await reload()}catch(e){console.error(e);status.textContent='削除できませんでした。時間をおいて再度お試しください。';button.disabled=false}}
document.getElementById('createSeries').onclick=async()=>{const button=document.getElementById('createSeries'),status=document.getElementById('createStatus'),title=document.getElementById('newTitle').value.trim(),description=document.getElementById('newDescription').value.trim();if(!title){status.textContent='シリーズ名を入力してください。';return}button.disabled=true;status.textContent='作成中...';try{const result=await client.from('novel_series').insert({user_id:session.user.id,title,description}).select('id').single();if(result.error)throw result.error;document.getElementById('newTitle').value='';document.getElementById('newDescription').value='';status.textContent='シリーズを作成しました。';await reload()}catch(e){console.error(e);status.textContent='シリーズを作成できませんでした。時間をおいて再度お試しください。'}finally{button.disabled=false}};
(async()=>{void NovelightClient.recordVisit(client);try{const auth=await client.auth.getSession();session=auth.data.session}catch(e){console.error(e)}if(!session){location.href='login.html?redirect=series.html';return}try{await reload()}catch(e){console.error(e);document.getElementById('seriesList').innerHTML='<div class="empty">シリーズ情報を読み込めませんでした。時間をおいて再度お試しください。</div>'}})();
</script>
</body>
</html>

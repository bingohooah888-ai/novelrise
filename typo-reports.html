<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>誤字報告管理 | NOVELIGHT</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#222}a{color:inherit;text-decoration:none}button,select,input{font:inherit}header{background:#fff;border-bottom:1px solid #e5e7eb}.header-inner{max-width:980px;min-height:72px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{color:#6d4aff;font-size:25px;font-weight:900}.back{color:#666;font-size:14px}main{max-width:900px;margin:auto;padding:42px 22px 80px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.head h1{font-size:30px}.head p{margin-top:7px;color:#666;line-height:1.7}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;margin-bottom:18px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.switch{display:flex;align-items:center;gap:9px;font-weight:900}.switch input{width:20px;height:20px}.note{margin-top:8px;color:#6b7280;font-size:12px;line-height:1.7}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar select{padding:9px 11px;border:1px solid #d6d8df;border-radius:8px;background:#fff}.status{min-height:22px;margin:10px 0;color:#666;font-size:13px}.status.error{color:#b42318}.list{display:grid;gap:13px}.report-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:19px}.report-meta{display:flex;gap:9px;flex-wrap:wrap;color:#777;font-size:12px;margin-bottom:13px}.chip{display:inline-flex;padding:3px 7px;border-radius:999px;background:#f0edff;color:#5b43bf;font-weight:900}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff-box{min-width:0}.diff-label{font-size:11px;font-weight:900;color:#666;margin-bottom:6px}.diff-text{min-height:74px;margin:0;padding:12px;border-radius:9px;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;line-height:1.7}.before{background:#fff3f2;border:1px solid #ffd0cb}.after{background:#effcf4;border:1px solid #bee9cf}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.button{padding:9px 13px;border-radius:8px;border:1px solid #d6d8df;background:#fff;font-weight:900;cursor:pointer}.apply{background:#6d4aff;color:#fff;border-color:#6d4aff}.reject{color:#b42318}.button:disabled{opacity:.55;cursor:wait}.empty{padding:28px;text-align:center;color:#777;border:1px dashed #d8dbe2;border-radius:12px}.unavailable{padding:18px;border-radius:10px;background:#fff7ed;color:#9a4f08;line-height:1.7}@media(max-width:650px){main{padding:28px 16px 65px}.head,.setting-row,.toolbar{align-items:flex-start;flex-direction:column}.diff{grid-template-columns:1fr}.actions{flex-direction:column}.button{width:100%}}
  </style>
  <link rel="stylesheet" href="novelight-theme.css" data-novelight-theme="sitewide">
</head>
<body class="novelight-theme novelight-page-typo-reports">
<header><div class="header-inner"><a class="logo" href="index.html">NOVELIGHT</a><a id="back" class="back" href="my-novels.html">← 作品へ戻る</a></div></header>
<main>
  <div class="head"><div><h1>誤字報告管理</h1><p id="workTitle">作品情報を確認しています。</p></div><a id="interactionSettings" class="button" href="interaction-settings.html">交流設定</a></div>
  <section class="panel">
    <div class="setting-row">
      <div><strong>この作品で誤字報告を受け付ける</strong><p class="note">ここで変更すると、この作品だけの個別設定になります。作者デフォルトへ戻す場合は「交流設定」を使います。読者の提案は自動適用されません。</p></div>
      <label class="switch"><input id="enabled" type="checkbox" disabled><span id="enabledLabel">OFF</span></label>
    </div>
    <div id="settingStatus" class="status"></div>
  </section>
  <section class="panel">
    <div class="toolbar"><div><strong>届いた提案</strong><div id="pendingCount" class="note"></div></div><label>表示 <select id="filter" disabled><option value="pending">未処理</option><option value="applied">採用済み</option><option value="rejected">却下済み</option><option value="stale">本文変更で失効</option><option value="all">すべて</option></select></label></div>
    <div id="reportStatus" class="status"></div>
    <div id="list" class="list"><div class="empty">読み込み中...</div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="novelight-client.js"></script>
<script>
const client=supabase.createClient('https://fiepaguycecrredwrcwx.supabase.co','sb_publishable_8CnbGjZ-P8PYPNLhJ7igAg_XVonmJRE');
const novelId=new URLSearchParams(location.search).get('novel_id');
const enabled=document.getElementById('enabled'),enabledLabel=document.getElementById('enabledLabel'),settingStatus=document.getElementById('settingStatus'),reportStatus=document.getElementById('reportStatus'),pendingCount=document.getElementById('pendingCount'),filter=document.getElementById('filter'),list=document.getElementById('list');
let session=null,busy=false,runtimeAvailable=true;
function missingRuntime(error){const m=String(error?.message||'');return error?.code==='42883'||error?.code==='PGRST202'||m.includes('Could not find the function')||m.includes('does not exist')}
function setUnavailable(){runtimeAvailable=false;enabled.disabled=true;filter.disabled=true;list.replaceChildren();const box=document.createElement('div');box.className='unavailable';box.textContent='誤字報告機能のデータベース反映待ちです。反映後にこの画面から受付設定と提案確認を利用できます。';list.append(box)}
function formatDate(value){return value?new Date(value).toLocaleString('ja-JP'):'—'}
function statusLabel(value){return({pending:'未処理',applied:'採用済み',rejected:'却下済み',stale:'本文変更で失効'})[value]||value}
function reviewErrorMessage(error){const message=String(error?.message||'');if(message.includes('TYPO_REPORT_RESULT_EMPTY'))return'この修正では公開本文が空になるため適用できません。エピソード編集画面で確認してください。';if(message.includes('TYPO_REPORT_RESULT_TOO_LONG'))return'この修正では本文が10万字を超えるため適用できません。エピソード編集画面で確認してください。';if(message.includes('TYPO_REPORT_NOT_PENDING'))return'この提案はすでに処理済みです。一覧を更新しました。';return'処理できませんでした。本文や報告状態を再確認してください。'}
function setSettingState(value){enabled.checked=value===true;enabledLabel.textContent=value===true?'ON':'OFF'}
async function loadSettings(){const r=await client.rpc('novelight_author_typo_report_settings',{p_novel_id:String(novelId)});if(r.error)throw r.error;setSettingState(r.data?.enabled===true);pendingCount.textContent='未処理 '+Number(r.data?.pending_count||0).toLocaleString()+'件';enabled.disabled=false;filter.disabled=false}
function buildReport(row){const card=document.createElement('article');card.className='report-card';const meta=document.createElement('div');meta.className='report-meta';const chip=document.createElement('span');chip.className='chip';chip.textContent=statusLabel(row.report_status);const episode=document.createElement('a');episode.href='episode-edit.html?id='+encodeURIComponent(row.episode_id);episode.textContent='第'+row.episode_number+'話 '+(row.episode_title||'無題');const created=document.createElement('span');created.textContent=formatDate(row.created_at);meta.append(chip,episode,created);
const diff=document.createElement('div');diff.className='diff';const beforeBox=document.createElement('div');beforeBox.className='diff-box';const beforeLabel=document.createElement('div');beforeLabel.className='diff-label';beforeLabel.textContent='報告された本文';const before=document.createElement('pre');before.className='diff-text before';before.textContent=row.source_text;beforeBox.append(beforeLabel,before);
const afterBox=document.createElement('div');afterBox.className='diff-box';const afterLabel=document.createElement('div');afterLabel.className='diff-label';afterLabel.textContent='修正案';const after=document.createElement('pre');after.className='diff-text after';after.textContent=row.replacement_text===''?'（この箇所を削除）':row.replacement_text;afterBox.append(afterLabel,after);diff.append(beforeBox,afterBox);card.append(meta,diff);
if(row.report_status==='pending'){const actions=document.createElement('div');actions.className='actions';const apply=document.createElement('button');apply.type='button';apply.className='button apply';apply.textContent='この修正を採用';apply.addEventListener('click',()=>void resolveReport(row.report_id,'apply',apply));const reject=document.createElement('button');reject.type='button';reject.className='button reject';reject.textContent='却下';reject.addEventListener('click',()=>void resolveReport(row.report_id,'reject',reject));actions.append(apply,reject);card.append(actions)}return card}
async function loadReports(){if(!runtimeAvailable)return;reportStatus.textContent='読み込んでいます...';const r=await client.rpc('novelight_author_typo_reports',{p_novel_id:String(novelId),p_status:filter.value});if(r.error)throw r.error;list.replaceChildren();const rows=r.data||[];if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='該当する誤字報告はありません。';list.append(empty)}else rows.forEach(row=>list.append(buildReport(row)));reportStatus.textContent=rows.length+'件を表示しています。'}
async function resolveReport(reportId,mode,button){if(busy)return;const message=mode==='apply'?'この修正案を本文へ適用します。現在の本文と報告時の対象箇所が一致する場合だけ適用されます。よろしいですか？':'この提案を却下しますか？';if(!window.confirm(message))return;busy=true;button.disabled=true;reportStatus.textContent=mode==='apply'?'修正を確認しています...':'却下しています...';try{const r=mode==='apply'?await client.rpc('novelight_apply_typo_report',{p_report_id:reportId}):await client.rpc('novelight_reject_typo_report',{p_report_id:reportId});if(r.error)throw r.error;if(mode==='apply'&&r.data?.status==='stale')reportStatus.textContent='報告後に本文が変更されているため、自動適用しませんでした。必要ならエピソード編集画面で確認してください。';else reportStatus.textContent=mode==='apply'?'修正を適用しました。変更前本文は改稿履歴に保存されています。':'提案を却下しました。';await loadSettings();await loadReports()}catch(error){console.error(error);reportStatus.textContent=reviewErrorMessage(error);await loadSettings().catch(()=>{});await loadReports().catch(()=>{})}finally{busy=false;button.disabled=false}}
enabled.addEventListener('change',async()=>{if(busy||!runtimeAvailable)return;busy=true;enabled.disabled=true;settingStatus.textContent='保存しています...';try{const r=await client.rpc('novelight_set_novel_typo_reports_enabled',{p_novel_id:String(novelId),p_enabled:enabled.checked});if(r.error)throw r.error;setSettingState(r.data?.enabled===true);pendingCount.textContent='未処理 '+Number(r.data?.pending_count||0).toLocaleString()+'件';settingStatus.textContent=enabled.checked?'この作品で誤字報告を受け付けます。':'この作品の新しい誤字報告受付を停止しました。既存の未処理提案は引き続き確認できます。'}catch(error){console.error(error);settingStatus.textContent='受付設定を変更できませんでした。';await loadSettings().catch(()=>{})}finally{busy=false;if(runtimeAvailable)enabled.disabled=false}});
filter.addEventListener('change',()=>void loadReports().catch(error=>{console.error(error);reportStatus.textContent='誤字報告を読み込めませんでした。'}));
(async()=>{void NovelightClient.recordVisit(client);if(!novelId){reportStatus.textContent='作品IDがありません。';return}try{const auth=await client.auth.getSession();session=auth.data.session;if(!session){location.href='login.html?redirect='+encodeURIComponent('typo-reports.html?novel_id='+novelId);return}const n=await client.from('novels').select('id,title,user_id').eq('id',novelId).single();if(n.error||!n.data||n.data.user_id!==session.user.id)throw n.error||new Error('not owned');document.getElementById('workTitle').textContent=n.data.title||'無題';document.getElementById('back').href='novel.html?id='+encodeURIComponent(novelId);document.getElementById('interactionSettings').href='interaction-settings.html?novel_id='+encodeURIComponent(novelId);try{await loadSettings();await loadReports()}catch(error){console.error(error);if(missingRuntime(error)){setUnavailable();settingStatus.textContent='データベース反映待ちです。'}else throw error}}catch(error){console.error(error);reportStatus.className='status error';reportStatus.textContent='誤字報告管理を読み込めませんでした。'}})();
</script>
</body>
</html>
